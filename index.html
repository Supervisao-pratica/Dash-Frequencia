        // --- FUNÇÃO AUXILIAR: DETECÇÃO DE COR LARANJA ---
        const isOrangeFont = (hex) => {
            if (!hex || typeof hex !== 'string') return false;
            let cleanHex = hex.replace('#', '').toUpperCase();
            if (cleanHex.length === 8) cleanHex = cleanHex.substring(2); 
            if (cleanHex.length !== 6) return false;

            const knownOranges = ['ED7D31', 'F4B084', 'C65911', '833C0C', 'FFC000', 'FFA500', 'FF9900', 'FF6600', 'E26B0A', 'F8CBAD'];
            if (knownOranges.includes(cleanHex)) return true;

            const r = parseInt(cleanHex.substring(0, 2), 16);
            const g = parseInt(cleanHex.substring(2, 4), 16);
            const b = parseInt(cleanHex.substring(4, 6), 16);

            if (r < 130) return false; 
            if (b > 150 && b > r * 0.8) return false; 
            const greenRatio = g / r;
            if (greenRatio < 0.20) return false; 
            if (greenRatio > 0.85) return false; 
            return true;
        };

        const getCellColorHex = (color) => {
            if (!color) return "";
            if (typeof color === "string") return color;
            return color.rgb || color.argb || color.hex || "";
        };

        const isOrangeColorValue = (color) => {
            let cleanHex = String(color || "").replace(/^#/, "").toUpperCase();
            if (cleanHex.length === 8) cleanHex = cleanHex.substring(2);
            if (cleanHex.length !== 6) return false;
            const red = parseInt(cleanHex.substring(0, 2), 16) / 255;
            const green = parseInt(cleanHex.substring(2, 4), 16) / 255;
            const blue = parseInt(cleanHex.substring(4, 6), 16) / 255;
            const max = Math.max(red, green, blue);
            const min = Math.min(red, green, blue);
            const delta = max - min;
            const normalizedHex = cleanHex;
            const knownOrangeFills = ["ED7D31", "F4B084", "C65911", "833C0C", "FFC000", "FFA500", "FF9900", "FF6600", "E26B0A", "F8CBAD"];
            if (knownOrangeFills.includes(normalizedHex)) return true;
            if (delta === 0 || max < 0.35 || delta / max < 0.35) return false;
            let hue = 0;
            if (max === red) hue = 60 * (((green - blue) / delta) % 6);
            else if (max === green) hue = 60 * ((blue - red) / delta + 2);
            else hue = 60 * ((red - green) / delta + 4);
            if (hue < 0) hue += 360;
            return hue >= 15 && hue <= 55;
        };

        const isOrangeFillCell = (cell) => {
            const colors = [
                cell && cell.s && cell.s.fgColor,
                cell && cell.s && cell.s.bgColor
            ].filter(Boolean);
            return colors.map(getCellColorHex).some(isOrangeColorValue);
        };

        const isOrangeFontCell = (cell) => {
            const color = cell && cell.s && cell.s.font ? getCellColorHex(cell.s.font.color) : "";
            return isOrangeFont(color) || isOrangeColorValue(color);
        };

        const isOrangeRowFill = (sheet, rowIndex, nameColIdx) => {
            if (!sheet || !sheet['!ref']) return false;
            try {
                const range = XLSX.utils.decode_range(sheet['!ref']);
                const maxCols = Math.min(range.e.c + 1, 180);
                // A cor laranja nas colunas de atividades indica uma situacao
                // daquela atividade, nao a situacao cadastral do aluno.
                const keyColumns = [...new Set([0, 1, 2, 3, 4, nameColIdx].filter(col => col >= 0 && col < maxCols))];
                const keyOrangeCount = keyColumns.filter(col => isOrangeFillCell(sheet[XLSX.utils.encode_cell({ r: rowIndex, c: col })])).length;
                if (nameColIdx >= 0 && isOrangeFillCell(sheet[XLSX.utils.encode_cell({ r: rowIndex, c: nameColIdx })])) return true;
                return keyOrangeCount >= 2;
            } catch (error) {
                return false;
            }
        };

        // A situacao cadastral depende somente da celula do nome (e, na aba
        // pedagogica, de uma linha inteira claramente marcada). Cores nas
        // colunas de atividades nao devem alterar a situacao do aluno.
        const applyOrangeStudentSituation = ({ student, cell, row, sheetName, isPedagogicalSheet, sheet, rowIndex, nameColIdx }) => {
            if (!student) return;
            const nameHasOrangeFont = isOrangeFontCell(cell);
            const nameHasOrangeFill = isOrangeFillCell(cell);
            const pedagogicalKeyword = Boolean(isPedagogicalSheet && hasDropoutKeywordInRow(row));
            const pedagogicalRowFill = Boolean(isPedagogicalSheet && isOrangeRowFill(sheet, rowIndex, nameColIdx));

            if (nameHasOrangeFill || pedagogicalKeyword || pedagogicalRowFill) {
                student.is_dropout = true;
                student.is_process_dropout = false;
                student.status = "Evadido/Desligado";
                student.dropout_reason = pedagogicalKeyword
                    ? "Situacao evadido, desistente ou desligado na aba pedagogica"
                    : nameHasOrangeFill
                        ? `Celula do nome preenchida em laranja na aba ${sheetName}`
                        : `Linha pedagogica identificada em laranja na aba ${sheetName}`;
                return;
            }

            if (nameHasOrangeFont && !student.is_dropout) {
                student.is_process_dropout = true;
                student.status = "Em Processo de Desligamento";
                student.dropout_reason = `Nome com fonte laranja na aba ${sheetName}`;
            }
        };

                    <div className="bg-gray-200 rounded-full h-2.5">
                        <div className={`h-2.5 rounded-full ${colorClass} transition-all duration-500 ease-out`} style={{ width: `${value}%` }}></div>
                    </div>
                </div>
            );
        };

        const DonutChart = ({ data, size = 120 }) => {
            const total = data.reduce((acc, curr) => acc + curr.value, 0);
            let cumulativeAngle = 0;
            if (total === 0) return <div className="text-xs text-gray-400">Sem dados</div>;
            return (
                <div className="relative flex items-center justify-center" style={{ width: size, height: size }}>
                    <svg viewBox="0 0 100 100" className="transform -rotate-90 w-full h-full">
                        {data.map((slice, i) => {
                            if (slice.value === 0) return null;
                            const percentage = slice.value / total;
                            const angle = percentage * 360;
                            const x1 = 50 + 40 * Math.cos(Math.PI * cumulativeAngle / 180);
                            const y1 = 50 + 40 * Math.sin(Math.PI * cumulativeAngle / 180);
                            const x2 = 50 + 40 * Math.cos(Math.PI * (cumulativeAngle + angle) / 180);
                            const y2 = 50 + 40 * Math.sin(Math.PI * (cumulativeAngle + angle) / 180);
                            const d = total === slice.value 
                                ? "M 50 10 a 40 40 0 1 0 0.0001 0" 
                                : `M 50 50 L ${x1} ${y1} A 40 40 0 ${angle > 180 ? 1 : 0} 1 ${x2} ${y2} Z`;
                            const path = <path key={i} d={d} fill={slice.color} stroke="white" strokeWidth="2" />;
                            cumulativeAngle += angle;
                            return path;
                        })}
                        <circle cx="50" cy="50" r="25" fill="white" />
                    </svg>
                    <div className="absolute inset-0 flex flex-col items-center justify-center">
                        <span className="text-xs font-bold text-gray-400">Total</span>
                        <span className="text-lg font-bold text-gray-700">{total}</span>
                    </div>
                </div>
            );
        };

        const DashboardCharts = ({ stats, context }) => {
            if (!stats) return null;
            const chartData = [
                { label: 'Desenvolveu', value: stats.developed, color: '#16a34a' }, 
                { label: 'Recuperação', value: stats.failed, color: '#dc2626' },    
                { label: 'Conselho', value: stats.warning, color: '#ca8a04' },      
                { label: 'Evasão', value: stats.dropout, color: '#f97316' },
                { label: 'Em Processo', value: stats.process, color: '#9333ea' }         
            ];
            return (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8 flex flex-col md:flex-row items-center justify-between gap-8 animate-fade-in">
                    <div className="flex-1">
                        <h3 className="text-lg font-bold text-gray-800 mb-2 flex items-center gap-2">
                            <IconBarChart2 className="w-5 h-5 text-senac-blue" /> 
                            {context === 'all' ? "Panorama da Turma (Global)" : `Panorama da Turma (${context})`}
                        </h3>
                        <p className="text-sm text-gray-500">Visão geral {context === 'all' ? "de todas as UCs." : `específica da ${context}.`}</p>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mt-4">
                            {chartData.map((item, i) => (
                                <div key={i} className="flex items-center gap-2">
                                    <div className="w-3 h-3 rounded-full" style={{ backgroundColor: item.color }}></div>
                                    <span className="text-sm text-gray-600 font-medium">{item.label}: <span className="text-gray-900 font-bold">{item.value}</span></span>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="flex-shrink-0"><DonutChart data={chartData} size={160} /></div>
                </div>
            );
        };

        // --- COMPONENTES AUXILIARES ---
        const SignatureCanvas = ({ onSave, onCancel }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#000000';
                
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * 2;
                canvas.height = rect.height * 2;
                ctx.scale(2, 2);
            }, []);

            const getPos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const startDrawing = (e) => {
                setIsDrawing(true);
                const pos = getPos(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDrawing = () => setIsDrawing(false);

            const handleClear = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath();
            };

            const handleSave = () => onSave(canvasRef.current.toDataURL());

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-white rounded-xl shadow-2xl overflow-hidden w-full max-w-lg flex flex-col">
                        <div className="bg-gray-800 p-3 text-white flex justify-between items-center">
                            <h4 className="font-bold text-sm flex items-center gap-2"><IconPenTool className="w-4 h-4"/> Assinar na Tela</h4>
                            <button onClick={onCancel}><IconXCircle className="w-5 h-5 hover:text-red-400"/></button>
                        </div>
                        <div className="p-4 bg-gray-100 flex-1 flex justify-center">
                            <div className="border-2 border-dashed border-gray-400 bg-white shadow-inner cursor-crosshair rounded">
                                <canvas ref={canvasRef} style={{ width: '100%', height: '200px', touchAction: 'none' }} className="w-full h-[200px]"
                                    onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing}
                                    onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing}></canvas>
                            </div>
                        </div>
                        <div className="p-3 bg-white border-t flex justify-between gap-3">
                            <button onClick={handleClear} className="text-red-500 text-xs font-bold hover:underline flex items-center gap-1"><IconTrash2 className="w-3 h-3"/> Limpar</button>
                            <div className="flex gap-2">
                                <button onClick={onCancel} className="px-3 py-1.5 text-xs font-bold text-gray-500 hover:bg-gray-100 rounded">Cancelar</button>
                                <button onClick={handleSave} className="px-4 py-1.5 text-xs font-bold text-white bg-senac-blue hover:bg-blue-700 rounded shadow">Salvar Assinatura</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SignatureUploader = ({ label, name, cpf, matricula, rubricaSrc, onChangeName, onChangeCPF, onChangeMatricula, onSetRubrica }) => {
            const [showCanvas, setShowCanvas] = useState(false);
            const [isProcessing, setIsProcessing] = useState(false);

            const processImage = (fileOrDataUrl) => {
                setIsProcessing(true);
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    const imageData = ctx.getImageData(0, 0, width, height);
                    const data = imageData.data;
                    let minX = width, minY = height, maxX = 0, maxY = 0;
                    let found = false;
                    for (let y = 0; y < height; y++) {
                        for (let x = 0; x < width; x++) {
                            const i = (y * width + x) * 4;
                            const r = data[i], g = data[i+1], b = data[i+2];
                            if (r < 240 || g < 240 || b < 240) {
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                                if (y < minY) minY = y;
                                if (y > maxY) maxY = y;
                                found = true;
                            }
                        }
                    }
                    if (found) {
                        const padding = 10;
                        minX = Math.max(0, minX - padding);
                        minY = Math.max(0, minY - padding);
                        maxX = Math.min(width, maxX + padding);
                        maxY = Math.min(height, maxY + padding);
                        const cropWidth = maxX - minX;
                        const cropHeight = maxY - minY;
                        const cutCanvas = document.createElement('canvas');
                        cutCanvas.width = cropWidth;
                        cutCanvas.height = cropHeight;
                        const cutCtx = cutCanvas.getContext('2d');
                        cutCtx.drawImage(canvas, minX, minY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
                        const cutImageData = cutCtx.getImageData(0, 0, cropWidth, cropHeight);
                        const cutData = cutImageData.data;
                        for (let i = 0; i < cutData.length; i += 4) {
                            const r = cutData[i], g = cutData[i + 1], b = cutData[i + 2];
                            if (r > 200 && g > 200 && b > 200) { cutData[i + 3] = 0; }
                        }
                        cutCtx.putImageData(cutImageData, 0, 0);
                        onSetRubrica(cutCanvas.toDataURL());
                    } else {
                        onSetRubrica(canvas.toDataURL());
                    }
                    setIsProcessing(false);
                };
                if (typeof fileOrDataUrl === 'string') { img.src = fileOrDataUrl; } else { const reader = new FileReader(); reader.onload = (e) => { img.src = e.target.result; }; reader.readAsDataURL(fileOrDataUrl); }
            };

            const handleFile = (e) => { if(e.target.files[0]) processImage(e.target.files[0]); };

            return (
                <div className="bg-white p-3 rounded-lg border border-gray-200 shadow-sm relative">
                    {showCanvas && (<SignatureCanvas onSave={(dataUrl) => { onSetRubrica(dataUrl); setShowCanvas(false); }} onCancel={() => setShowCanvas(false)} />)}
                    
                    <div className="flex justify-between items-center mb-2">
                        <label className="text-xs font-bold text-senac-blue">{label}</label>
                        <div className="flex gap-2">
                            <button onClick={() => setShowCanvas(true)} className="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded hover:bg-blue-100 flex items-center gap-1 border border-blue-200" title="Assinar com Mouse/Dedo"><IconEdit3 className="w-3 h-3"/> Assinar na Tela</button>
                            <label className="cursor-pointer text-[10px] bg-gray-50 text-gray-600 px-2 py-0.5 rounded hover:bg-gray-100 flex items-center gap-1 border border-gray-200" title="Upload Foto"><IconUploadCloud className="w-3 h-3"/> Foto<input type="file" className="hidden" accept="image/*" onChange={handleFile} /></label>
                        </div>
                    </div>
                    <input type="text" value={name} onChange={(e) => onChangeName(e.target.value)} placeholder="Nome Completo (Editável)" className="w-full px-2 py-1.5 rounded border mb-2 text-xs bg-gray-50 focus:bg-white transition-colors" />
                    <div className="flex gap-2 mb-2">
                        <input type="text" value={cpf} onChange={(e) => onChangeCPF(e.target.value)} placeholder="CPF" className="w-1/2 px-2 py-1.5 rounded border text-xs font-mono" maxLength="14" />
                        <input type="text" value={matricula} onChange={(e) => onChangeMatricula(e.target.value)} placeholder="Matrícula" className="w-1/2 px-2 py-1.5 rounded border text-xs font-mono" />
                    </div>
                    {isProcessing && <div className="text-[10px] text-orange-500 italic animate-pulse">Processando imagem...</div>}
                    {rubricaSrc && !isProcessing && (
                        <div className="mt-2 p-2 border border-dashed border-gray-300 rounded bg-gray-50 flex items-center justify-between">
                            <div className="flex items-center gap-2"><img src={rubricaSrc} alt="Preview" className="h-8 max-w-[100px] object-contain" /><span className="text-[10px] text-green-600 font-bold flex items-center gap-1"><IconCheckCircle className="w-3 h-3"/> OK</span></div>
                            <button onClick={() => onSetRubrica(null)} className="text-red-400 hover:text-red-600 p-1"><IconTrash2 className="w-3 h-3"/></button>
                        </div>
                    )}
                </div>
            );
        };

        const NOTEBOOK_SITUATION_OPTIONS = [
            { group: "Acompanhamento Pedagógico", options: [
                { value: "Desempenho Insuficiente", label: "Desempenho Insuficiente" },
                { value: "Faltas Excessivas", label: "Faltas Excessivas" },
                { value: "Feedback", label: "Feedback / Orientação" },
                { value: "Elogios", label: "Elogios / Destaque" }
            ]},
            { group: "Justificativas e Documentos", options: [
                { value: "Atestado", label: "Atestado Médico" },
                { value: "Declaracao", label: "Declaração de Trabalho" },
                { value: "Afastamento", label: "Afastamento INSS/Licença" },
                { value: "Militar", label: "Serviço Militar" },
                { value: "Gestacao", label: "Gestação/Maternidade" }
            ]},
            { group: "Outros", options: [{ value: "Outros", label: "Outros" }] }
        ];

        const NOTEBOOK_STORAGE_PREFIX = "instructor_notes_v3_";
        const NOTEBOOK_ANALYST_OPTIONS = ["Bianca", "Bruna", "Mariana", "Michel"];
        const NOTEBOOK_TREATMENT_STATUS_OPTIONS = [
            { value: "em_tratativa", label: "Em tratativa", className: "bg-blue-100 text-blue-800 border-blue-200", closed: false },
            { value: "concluida", label: "Tratativa concluída", className: "bg-green-100 text-green-800 border-green-200", closed: true },
            { value: "aguardando_retorno", label: "Aguardando retorno", className: "bg-yellow-100 text-yellow-800 border-yellow-200", closed: false },
            { value: "sem_retorno", label: "Sem retorno", className: "bg-orange-100 text-orange-800 border-orange-200", closed: false },
            { value: "nao_se_aplica", label: "Não se aplica", className: "bg-gray-100 text-gray-700 border-gray-200", closed: true },
            { value: "cancelada", label: "Cancelada", className: "bg-red-100 text-red-800 border-red-200", closed: true }
        ];

        const cleanNotebookKey = (value, fallback) => {
            const cleaned = String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]/g, "");
            return cleaned || fallback;
        };

        const getCurrentAuthenticatedEmail = () => {
            try {
                const configuredUser = window.SENAC_CURRENT_USER;
                const firebaseUser = window.firebase && firebase.auth ? firebase.auth().currentUser : null;
                return String((configuredUser && configuredUser.email) || (firebaseUser && firebaseUser.email) || "").trim().toLowerCase();
            } catch (error) {
                return "";
            }
        };

        const normalizeInstructorIdentity = (value) => normalizeName(String(value || "").replace(/[._-]+/g, " "));

        const instructorNameMatchesAccount = (instructorName, email) => {
            const accountEmail = String(email || "").trim().toLowerCase();
            if (!instructorName || !accountEmail || !accountEmail.includes("@")) return false;
            const localPart = normalizeInstructorIdentity(accountEmail.split("@")[0]);
            const displayName = normalizeInstructorIdentity(window.SENAC_CURRENT_USER && window.SENAC_CURRENT_USER.displayName);
            const candidate = normalizeInstructorIdentity(instructorName);
            if (!candidate || candidate === "NAO IDENTIFICADO") return false;
            if (displayName && (displayName === candidate || displayName.includes(candidate) || candidate.includes(displayName))) return true;
            if (localPart === candidate || localPart.replace(/\s+/g, "") === candidate.replace(/\s+/g, "")) return true;
            const tokens = candidate.split(/\s+/).filter(token => token.length > 1);
            if (tokens.length === 1 && tokens[0].length >= 4 && localPart.includes(tokens[0])) return true;
            if (tokens.length > 1 && tokens.every(token => localPart.includes(token))) return true;
            if (tokens.length > 1 && localPart.includes(tokens[0]) && localPart.includes(tokens[tokens.length - 1].slice(0, 3))) return true;
            return false;
        };

        const filterInstructorNamesForCurrentUser = (instructorNames) => {
            const email = getCurrentAuthenticatedEmail();
            const names = [...new Set((instructorNames || []).map(name => String(name || "").trim()).filter(Boolean))];
            // Em modo local, sem Firebase/Auth, preserva o comportamento administrativo anterior.
            if (!email) return names;
            return names.filter(name => instructorNameMatchesAccount(name, email));
        };

        const makeNotebookStorageKey = (turma, instructorName) => `${NOTEBOOK_STORAGE_PREFIX}${cleanNotebookKey(turma, "TURMA_DESCONHECIDA")}_${cleanNotebookKey(instructorName, "INSTRUTOR")}`;

        const notebookDateInput = (value) => {
            if (!value) return "";
            const raw = String(value).trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
            const parsed = new Date(raw);
            if (Number.isNaN(parsed.getTime())) return "";
            const year = parsed.getFullYear();
            const month = String(parsed.getMonth() + 1).padStart(2, "0");
            const day = String(parsed.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        };

        const formatNotebookDate = (value) => {
            const input = notebookDateInput(value);
            if (!input) return "Não informado";
            return new Date(`${input}T12:00:00`).toLocaleDateString("pt-BR");
        };

        const addNotebookDays = (startDate, days) => {
            const input = notebookDateInput(startDate);
            const totalDays = Number(days);
            if (!input || !Number.isInteger(totalDays) || totalDays < 1) return "";
            const date = new Date(`${input}T12:00:00`);
            date.setDate(date.getDate() + totalDays);
            return notebookDateInput(date);
        };

        const getNotebookTreatmentStart = (note) => notebookDateInput(note && (note.treatmentStartDate || note.situationDate || note.date));

        const getNotebookTreatmentDue = (note) => {
            if (!note) return "";
            const storedDue = notebookDateInput(note.treatmentDueDate);
            if (storedDue) return storedDue;
            return addNotebookDays(getNotebookTreatmentStart(note), note.treatmentDays);
        };

        const getNotebookTreatmentState = (note) => {
            const statusMeta = NOTEBOOK_TREATMENT_STATUS_OPTIONS.find(option => option.value === String(note && note.treatmentStatus || "em_tratativa"));
            if (statusMeta && statusMeta.closed) return "closed";
            const due = getNotebookTreatmentDue(note);
            if (!due) return "none";
            const today = notebookDateInput(new Date());
            if (due < today) return "overdue";
            if (due === today) return "today";
            return "open";
        };

        const getNotebookTreatmentLabel = (note) => {
            const statusMeta = NOTEBOOK_TREATMENT_STATUS_OPTIONS.find(option => option.value === String(note && note.treatmentStatus || "em_tratativa"));
            if (statusMeta && statusMeta.closed) return statusMeta.label;
            const due = getNotebookTreatmentDue(note);
            if (!due) return "Sem prazo de tratativa";
            const state = getNotebookTreatmentState(note);
            if (state === "overdue") return `Tratativa vencida em ${formatNotebookDate(due)}`;
            if (state === "today") return "Tratar hoje";
            return `Tratar até ${formatNotebookDate(due)}`;
        };

        const getNotebookStatusMeta = (note) => NOTEBOOK_TREATMENT_STATUS_OPTIONS.find(option => option.value === String(note && note.treatmentStatus || "em_tratativa")) || NOTEBOOK_TREATMENT_STATUS_OPTIONS[0];

        const openNotebookTreatmentInOutlook = (note, turma, instructorName) => {
            const due = getNotebookTreatmentDue(note);
            if (!due) {
                alert("Esta anotação não possui prazo de tratativa.");
                return;
            }
            const target = note && note.scope === "class" ? "Turma toda" : (note && note.studentName) || "Aluno não identificado";
            const subject = `Tratativa: ${getNotebookSituationLabel(note)} - ${target}`;
            const body = [
                `Turma: ${turma}`,
                `Responsável: ${note && note.responsibleAnalyst || "Não informado"}`,
                `Instrutor: ${instructorName || note && note.instructorName || "Não informado"}`,
                `Alvo: ${target}`,
                `Prazo: ${formatNotebookDate(due)}`,
                "",
                String(note && note.notes || "Sem detalhes adicionais.")
            ].join("\n");
            const start = `${due}T09:00:00`;
            const end = `${due}T09:30:00`;
            const url = `https://outlook.office.com/calendar/0/deeplink/compose?subject=${encodeURIComponent(subject)}&startdt=${encodeURIComponent(start)}&enddt=${encodeURIComponent(end)}&body=${encodeURIComponent(body)}&allday=false`;
            const popup = window.open(url, "_blank", "noopener,noreferrer");
            if (!popup) window.location.href = url;
        };

        const normalizeNotebookNote = (note) => {
            if (!note || typeof note !== "object") return null;
            const situations = Array.isArray(note.situationTypes)
                ? note.situationTypes.filter(Boolean)
                : (note.situationType ? [note.situationType] : []);
            const isClassNote = note.scope === "class" || note.studentId === null || note.studentId === undefined && !note.studentName;
            return {
                ...note,
                id: String(note.id || `note_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`),
                scope: isClassNote ? "class" : "student",
                studentId: isClassNote ? null : (note.studentId === null || note.studentId === undefined ? null : Number(note.studentId)),
                studentIds: Array.isArray(note.studentIds) ? note.studentIds.map(Number).filter(Number.isFinite) : [],
                studentName: isClassNote ? "Turma toda" : (note.studentName || "Aluno não identificado"),
                situationTypes: situations,
                situationType: situations.join(", "),
                treatmentStatus: NOTEBOOK_TREATMENT_STATUS_OPTIONS.some(option => option.value === note.treatmentStatus) ? note.treatmentStatus : "em_tratativa",
                responsibleAnalyst: String(note.responsibleAnalyst || ""),
                treatmentStartDate: notebookDateInput(note.treatmentStartDate || note.situationDate),
                treatmentDays: Number.isInteger(Number(note.treatmentDays)) && Number(note.treatmentDays) > 0 ? Number(note.treatmentDays) : null,
                treatmentDueDate: notebookDateInput(note.treatmentDueDate) || addNotebookDays(note.treatmentStartDate || note.situationDate || note.date, note.treatmentDays),
                attachments: Array.isArray(note.attachments) ? note.attachments : [],
                notes: String(note.notes || "")
            };
        };

        const readNotebookNotesLocal = (storageKey) => {
            try {
                const saved = localStorage.getItem(storageKey);
                if (!saved) return [];
                const parsed = JSON.parse(saved);
                const oldFormat = parsed && !Array.isArray(parsed) && parsed.notes ? [{
                    ...parsed,
                    id: `legacy_${storageKey}`,
                    date: new Date().toISOString(),
                    scope: "class",
                    studentId: null,
                    studentName: "Turma toda"
                }] : parsed;
                return Array.isArray(oldFormat) ? oldFormat.map(normalizeNotebookNote).filter(Boolean) : [];
            } catch (error) {
                console.error("Erro ao carregar notas locais", error);
                return [];
            }
        };

        const writeNotebookNotesLocal = (storageKey, notes) => {
            try { localStorage.setItem(storageKey, JSON.stringify(notes)); } catch (error) { console.error("Erro ao salvar notas locais", error); }
        };

        const getNotebookFirestore = async () => {
            try {
                const config = window.SENAC_FIREBASE_CONFIG;
                if (!config || !config.projectId || !window.firebase || !firebase.firestore) return null;
                if (!firebase.apps.length) firebase.initializeApp(config);
                const currentUser = firebase.auth ? firebase.auth().currentUser : null;
                const allowedDomains = Array.isArray(config.allowedEmailDomains) ? config.allowedEmailDomains : [config.allowedEmailDomain || "@pr.senac.br"];
                const email = String(currentUser && currentUser.email || "").toLowerCase();
                if (!currentUser || !allowedDomains.some(domain => email.endsWith(String(domain).toLowerCase()))) return null;
                return firebase.firestore();
            } catch (error) {
                console.error("Firebase indisponível; usando armazenamento local", error);
                return null;
            }
        };

        const STUDENT_CONTACT_STORAGE_PREFIX = "student_contacts_v1_";

        const makeStudentContactStorageKey = (turma) => `${STUDENT_CONTACT_STORAGE_PREFIX}${cleanNotebookKey(turma, "TURMA_DESCONHECIDA")}`;
        const makeStudentContactDocId = (turma, studentKey) => `contact_${cleanNotebookKey(turma, "TURMA_DESCONHECIDA")}_${cleanNotebookKey(studentKey, "ALUNO")}`;

        const normalizeStudentContactRecord = (contact, turma, studentKey, fallbackName = "") => ({
            turmaKey: cleanNotebookKey(turma, "TURMA_DESCONHECIDA"),
            studentKey: String(studentKey || normalizeName(fallbackName) || "").trim(),
            ...normalizeStudentContact(contact, fallbackName),
            updatedAt: String(contact && contact.updatedAt || new Date().toISOString()),
            updatedBy: String(contact && contact.updatedBy || "")
        });

        const readStudentContactsLocal = (turma) => {
            try {
                const value = localStorage.getItem(makeStudentContactStorageKey(turma));
                const parsed = value ? JSON.parse(value) : {};
                return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
            } catch (error) {
                console.error("Erro ao carregar contatos locais", error);
                return {};
            }
        };

        const writeStudentContactsLocal = (turma, contacts) => {
            try { localStorage.setItem(makeStudentContactStorageKey(turma), JSON.stringify(contacts)); }
            catch (error) { console.error("Erro ao salvar contatos locais", error); }
        };

        const loadStudentContacts = async (turma) => {
            const localContacts = readStudentContactsLocal(turma);
            const db = await getNotebookFirestore();
            if (!db) return { contacts: localContacts, source: "local" };
            try {
                const turmaKey = cleanNotebookKey(turma, "TURMA_DESCONHECIDA");
                const snapshot = await db.collection("student_contacts").where("turmaKey", "==", turmaKey).get();
                const contacts = { ...localContacts };
                snapshot.docs.forEach(doc => {
                    const record = normalizeStudentContactRecord({ id: doc.id, ...doc.data() }, turma, doc.data().studentKey);
                    if (record.studentKey) contacts[record.studentKey] = record;
                });
                writeStudentContactsLocal(turma, contacts);
                return { contacts, source: "cloud" };
            } catch (error) {
                console.error("Erro ao carregar contatos do Firebase; usando dados locais", error);
                return { contacts: localContacts, source: "local" };
            }
        };

        const persistStudentContact = async (turma, contact) => {
            const studentKey = String(contact && contact.studentKey || normalizeName(contact && contact.studentContactName));
            if (!studentKey) return { source: "local" };
            const record = normalizeStudentContactRecord(contact, turma, studentKey, contact && contact.studentContactName);
            const contacts = readStudentContactsLocal(turma);
            contacts[studentKey] = record;
            writeStudentContactsLocal(turma, contacts);
            const db = await getNotebookFirestore();
            if (!db) return { source: "local" };
            try {
                const payload = { ...record };
                delete payload.id;
                await db.collection("student_contacts").doc(makeStudentContactDocId(turma, studentKey)).set(payload, { merge: true });
                return { source: "cloud" };
            } catch (error) {
                console.error("Erro ao salvar contato no Firebase; dados mantidos localmente", error);
                return { source: "local" };
            }
        };

        const seedImportedStudentContacts = async (turma, students) => {
            const loaded = await loadStudentContacts(turma);
            const imported = (students || []).map(student => ({
                ...normalizeStudentContact(student, student.name),
                studentKey: normalizeName(student.name)
            })).filter(contact => contact.studentKey && [contact.studentPhone, contact.studentEmail, contact.supervisorName, contact.supervisorPhone, contact.supervisorEmail].some(Boolean));
            const missing = imported.filter(contact => !loaded.contacts[contact.studentKey]);
            let source = loaded.source;
            for (const contact of missing) source = (await persistStudentContact(turma, contact)).source;
            return source;
        };

        const loadNotebookNotes = async (turma, instructorName) => {
            const storageKey = makeNotebookStorageKey(turma, instructorName);
            const legacyKey = `instructor_notes_v2_${cleanNotebookKey(turma, "TURMA_DESCONHECIDA")}_${cleanNotebookKey(instructorName, "INSTRUTOR")}`;
            const localMap = new Map();
            [...readNotebookNotesLocal(legacyKey), ...readNotebookNotesLocal(storageKey)].forEach(note => localMap.set(String(note.id), note));
            const localNotes = Array.from(localMap.values()).sort((a, b) => new Date(b.date) - new Date(a.date));
            if (localNotes.length > 0) {
                writeNotebookNotesLocal(storageKey, localNotes);
                try { localStorage.removeItem(legacyKey); } catch (error) { /* migração local não impede o uso */ }
            }
            const db = await getNotebookFirestore();
            if (!db) return { notes: localNotes, source: "local" };

            try {
                const turmaKey = cleanNotebookKey(turma, "TURMA_DESCONHECIDA");
                const instructorKey = cleanNotebookKey(instructorName, "INSTRUTOR");
                const snapshot = await db.collection("instructor_notes")
                    .where("turmaKey", "==", turmaKey)
                    .where("instructorKey", "==", instructorKey)
                    .get();
                const cloudNotes = snapshot.docs.map(doc => normalizeNotebookNote({ id: doc.id, ...doc.data() })).filter(Boolean);
                const merged = new Map(localNotes.map(note => [String(note.id), note]));
                cloudNotes.forEach(note => merged.set(String(note.id), note));
                const notes = Array.from(merged.values()).sort((a, b) => new Date(b.date) - new Date(a.date));
                writeNotebookNotesLocal(storageKey, notes);
                return { notes, source: "cloud" };
            } catch (error) {
                console.error("Erro ao carregar notas do Firebase; usando notas locais", error);
                return { notes: localNotes, source: "local" };
            }
        };

        const persistNotebookNote = async (turma, instructorName, note) => {
            const storageKey = makeNotebookStorageKey(turma, instructorName);
            const notes = [normalizeNotebookNote(note), ...readNotebookNotesLocal(storageKey)].filter(Boolean);
            writeNotebookNotesLocal(storageKey, notes);
            const db = await getNotebookFirestore();
            if (!db) return { source: "local" };
            try {
                await db.collection("instructor_notes").doc(String(note.id)).set({
                    ...normalizeNotebookNote(note),
                    turmaKey: cleanNotebookKey(turma, "TURMA_DESCONHECIDA"),
                    instructorKey: cleanNotebookKey(instructorName, "INSTRUTOR"),
                    ownerEmail: getCurrentAuthenticatedEmail()
                });
                return { source: "cloud" };
            } catch (error) {
                console.error("Erro ao salvar nota no Firebase; nota mantida localmente", error);
                return { source: "local" };
            }
        };

        const updateNotebookNote = async (turma, instructorName, note) => {
            const storageKey = makeNotebookStorageKey(turma, instructorName);
            const normalized = normalizeNotebookNote(note);
            const notes = readNotebookNotesLocal(storageKey).map(item => String(item.id) === String(normalized.id) ? normalized : item);
            writeNotebookNotesLocal(storageKey, notes);
            const db = await getNotebookFirestore();
            if (!db) return { source: "local" };
            try {
                const payload = { ...normalized, turmaKey: cleanNotebookKey(turma, "TURMA_DESCONHECIDA"), instructorKey: cleanNotebookKey(instructorName, "INSTRUTOR"), ownerEmail: getCurrentAuthenticatedEmail() };
                delete payload.id;
                delete payload.instructorSource;
                await db.collection("instructor_notes").doc(String(normalized.id)).set(payload, { merge: true });
                return { source: "cloud" };
            } catch (error) {
                console.error("Erro ao atualizar status da anotação no Firebase", error);
                return { source: "local" };
            }
        };

        const removeNotebookNote = async (turma, instructorName, noteId) => {
            const storageKey = makeNotebookStorageKey(turma, instructorName);
            const notes = readNotebookNotesLocal(storageKey).filter(note => String(note.id) !== String(noteId));
            writeNotebookNotesLocal(storageKey, notes);
            const db = await getNotebookFirestore();
            if (!db) return { source: "local" };
            try {
                await db.collection("instructor_notes").doc(String(noteId)).delete();
                return { source: "cloud" };
            } catch (error) {
                console.error("Erro ao excluir nota do Firebase", error);
                return { source: "local" };
            }
        };

        const getNotebookSituationLabel = (note) => {
            const types = Array.isArray(note.situationTypes) && note.situationTypes.length > 0 ? note.situationTypes : (note.situationType ? [note.situationType] : []);
            return types.length > 0 ? types.join(", ") : "Anotação Geral";
        };

        // --- COMPONENTE CADERNO DO INSTRUTOR (V77 - TURMA E MÚLTIPLAS SITUAÇÕES) ---
        const InstructorNotebook = ({ instructorName, turma, students, onClose, onNotesChanged }) => {
            const [targetScope, setTargetScope] = useState("student");
            const [selectedStudentId, setSelectedStudentId] = useState("");
            const [notes, setNotes] = useState("");
            const [urgency, setUrgency] = useState("normal"); 
            const [selectedSituationTypes, setSelectedSituationTypes] = useState([]);
            const [situationDate, setSituationDate] = useState("");
            const [treatmentDays, setTreatmentDays] = useState("");
            const [treatmentStatus, setTreatmentStatus] = useState("em_tratativa");
            const [responsibleAnalyst, setResponsibleAnalyst] = useState("");
            const [attachments, setAttachments] = useState([]);
            const [allNotes, setAllNotes] = useState([]); // Histórico de notas
            const [isSaving, setIsSaving] = useState(false);
            const [storageSource, setStorageSource] = useState("local");
            const [saveNotice, setSaveNotice] = useState("");

            const storageKey = useMemo(() => makeNotebookStorageKey(turma, instructorName), [turma, instructorName]);

            useEffect(() => {
                let isCurrent = true;
                (async () => {
                    const loaded = await loadNotebookNotes(turma, instructorName);
                    if (isCurrent) {
                        setAllNotes(loaded.notes);
                        setStorageSource(loaded.source);
                    }
                })();
                return () => { isCurrent = false; };
            }, [storageKey, turma, instructorName]);

            const toggleSituation = (value) => {
                setSelectedSituationTypes(current => current.includes(value) ? current.filter(item => item !== value) : [...current, value]);
            };

            const handleSave = async () => {
                if (targetScope === "student" && !selectedStudentId) {
                    alert("Selecione um aluno ou altere o alcance para Turma toda.");
                    return;
                }
                if (!notes.trim() && selectedSituationTypes.length === 0) {
                    alert("Informe uma anotação ou selecione pelo menos uma Situação Específica.");
                    return;
                }
                setIsSaving(true);
                const selectedStudent = students.find(s => s.id === parseInt(selectedStudentId));
                const createdAt = new Date().toISOString();
                const treatmentStartDate = notebookDateInput(situationDate || createdAt);
                const parsedTreatmentDays = Number.parseInt(treatmentDays, 10);
                const newNote = {
                    id: `note_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
                    date: createdAt,
                    scope: targetScope,
                    studentId: targetScope === "student" ? parseInt(selectedStudentId) : null,
                    studentIds: targetScope === "class" ? students.map(s => s.id) : [parseInt(selectedStudentId)],
                    studentName: targetScope === "class" ? "Turma toda" : (selectedStudent?.name || "Aluno não identificado"),
                    notes,
                    urgency,
                    treatmentStatus,
                    responsibleAnalyst,
                    situationTypes: selectedSituationTypes,
                    situationType: selectedSituationTypes.join(", "),
                    situationDate,
                    treatmentStartDate: treatmentDays && Number.isInteger(parsedTreatmentDays) && parsedTreatmentDays > 0 ? treatmentStartDate : "",
                    treatmentDays: treatmentDays && Number.isInteger(parsedTreatmentDays) && parsedTreatmentDays > 0 ? parsedTreatmentDays : null,
                    treatmentDueDate: treatmentDays && Number.isInteger(parsedTreatmentDays) && parsedTreatmentDays > 0 ? addNotebookDays(treatmentStartDate, parsedTreatmentDays) : "",
                    attachments,
                    turma,
                    instructorName,
                    ownerEmail: getCurrentAuthenticatedEmail()
                };

                const updatedNotes = [normalizeNotebookNote(newNote), ...allNotes].filter(Boolean);
                setAllNotes(updatedNotes);
                const saved = await persistNotebookNote(turma, instructorName, newNote);
                setStorageSource(saved.source);
                if (typeof onNotesChanged === "function") onNotesChanged();

                // Reset fields
                setNotes("");
                setSelectedSituationTypes([]);
                setSituationDate("");
                setTreatmentDays("");
                setTreatmentStatus("em_tratativa");
                setResponsibleAnalyst("");
                setAttachments([]);
                setSaveNotice(newNote.treatmentDueDate
                    ? `Anotação salva. ${getNotebookTreatmentLabel(newNote)}. Use "Abrir no Outlook" para criar o lembrete na agenda.`
                    : "Anotação salva e vinculada ao quadro correspondente.");

                setTimeout(() => setIsSaving(false), 800);
            };

            const handleSendEmail = () => {
                if (!notes && selectedSituationTypes.length === 0) {
                    alert("Preencha pelo menos o tipo de ocorrência ou uma anotação para enviar.");
                    return;
                }
                const studentName = targetScope === "class" ? "Turma toda" : students.find(s => s.id === parseInt(selectedStudentId))?.name || "Nenhum aluno selecionado";
                const situationLabel = selectedSituationTypes.join(", ") || "Anotação";
                const subject = `Ocorrência: ${situationLabel} - Turma ${turma}`;
                
                let body = `Olá,\n\nSegue registro de ocorrência:\n\n`;
                body += `Turma: ${turma}\n`;
                body += `Instrutor: ${instructorName}\n`;
                body += `Aluno: ${studentName}\n`;
                body += `Data Ocorrência: ${situationDate || "N/A"}\n`;
                body += `Urgência: ${urgency.toUpperCase()}\n`;
                body += `Tipo(s): ${situationLabel}\n\n`;
                body += `Detalhes:\n${notes}\n\n`;
                
                // NOTA SOBRE ANEXOS (V75 - AJUSTE DE SEGURANÇA)
                if (attachments.length > 0) {
                    body += `\n[NOTA DO SISTEMA: Esta ocorrência possui ${attachments.length} anexo(s) registrado(s) no sistema. Lembre-se de anexá-los manualmente a este e-mail.]\n\n`;
                }

                body += `Enviado via Dashboard de Frequência.`;

                const mailtoLink = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                window.location.href = mailtoLink;

                if (attachments.length > 0) {
                    alert("⚠️ AVISO DE SEGURANÇA:\n\nDevido a restrições técnicas dos navegadores web, arquivos NÃO podem ser anexados automaticamente ao programa de e-mail.\n\nO texto do e-mail foi gerado, mas você deve ARRASTAR OS ARQUIVOS MANUALMENTE para o e-mail.");
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 500000) { alert("Limite de 500KB por arquivo."); return; }
                const reader = new FileReader();
                reader.onload = () => {
                    setAttachments(prev => [...prev, { name: file.name, data: reader.result, type: file.type }]);
                };
                reader.readAsDataURL(file);
            };

            const removeAttachment = (idx) => {
                setAttachments(prev => prev.filter((_, i) => i !== idx));
            };

            const handleNoteStatusChange = async (note, nextStatus) => {
                const updatedNote = normalizeNotebookNote({ ...note, treatmentStatus: nextStatus });
                setAllNotes(current => current.map(item => item.id === updatedNote.id ? updatedNote : item));
                const saved = await updateNotebookNote(turma, instructorName, updatedNote);
                setStorageSource(saved.source);
                if (typeof onNotesChanged === "function") onNotesChanged();
            };

            const deleteNote = (id) => {
                if(confirm("Excluir esta anotação do histórico?")) {
                    const updated = allNotes.filter(n => n.id !== id);
                    setAllNotes(updated);
                    removeNotebookNote(turma, instructorName, id).then(result => {
                        setStorageSource(result.source);
                        if (typeof onNotesChanged === "function") onNotesChanged();
                    });
                }
            }

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 animate-fade-in" onClick={(e) => {if(e.target===e.currentTarget) onClose()}}>
                    <div className="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="bg-senac-blue p-4 text-white flex justify-between items-center shrink-0">
                            <h2 className="text-xl font-bold flex items-center gap-2"><IconBookOpen className="w-6 h-6"/> Caderno do Instrutor</h2>
                            <button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full"><IconXCircle className="w-6 h-6"/></button>
                        </div>
                        
                        <div className="p-6 overflow-y-auto bg-gray-50 custom-scrollbar">
                            <div className="mb-4">
                                <h3 className="text-lg font-bold text-gray-800">{instructorName}</h3>
                                <p className="text-sm text-gray-500">Nova anotação para a turma {turma}</p>
                                <p className={`text-xs mt-1 font-medium ${storageSource === 'cloud' ? 'text-green-700' : 'text-gray-500'}`}>
                                    {storageSource === 'cloud' ? 'Salvo no Firebase e neste dispositivo' : 'Salvo neste dispositivo'}
                                </p>
                                {saveNotice && <div className="mt-3 rounded-lg border border-green-200 bg-green-50 px-3 py-2 text-xs text-green-800 flex items-start gap-2"><IconCheckCircle className="w-4 h-4 shrink-0 mt-0.5" /> <span>{saveNotice}</span></div>}
                            </div>

                            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-4">
                                <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Alcance da anotação</label>
                                <div className="grid grid-cols-2 gap-2 mb-3" role="radiogroup" aria-label="Alcance da anotação">
                                    <button type="button" onClick={() => setTargetScope('student')} className={`py-2 px-3 rounded-lg text-sm font-bold border transition-colors ${targetScope === 'student' ? 'bg-blue-50 text-senac-blue border-senac-blue ring-2 ring-blue-100' : 'bg-gray-50 text-gray-500 border-gray-200 hover:bg-gray-100'}`}>
                                        <IconUser className="w-4 h-4 inline-block mr-1" /> Aluno específico
                                    </button>
                                    <button type="button" onClick={() => setTargetScope('class')} className={`py-2 px-3 rounded-lg text-sm font-bold border transition-colors ${targetScope === 'class' ? 'bg-orange-50 text-senac-orange border-senac-orange ring-2 ring-orange-100' : 'bg-gray-50 text-gray-500 border-gray-200 hover:bg-gray-100'}`}>
                                        <IconUsers className="w-4 h-4 inline-block mr-1" /> Turma toda
                                    </button>
                                </div>
                                {targetScope === 'student' ? (
                                    <select
                                        value={selectedStudentId}
                                        onChange={(e) => setSelectedStudentId(e.target.value)}
                                        className="w-full p-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-senac-blue outline-none"
                                    >
                                        <option value="">-- Selecione um aluno --</option>
                                        {students.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                    </select>
                                ) : (
                                    <div className="rounded-lg bg-orange-50 border border-orange-200 px-3 py-2 text-sm text-orange-800 flex items-center gap-2">
                                        <IconUsers className="w-4 h-4 shrink-0" /> Esta anotação será vinculada a todos os alunos da turma.
                                    </div>
                                )}
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Nível de Urgência</label>
                                    <div className="flex gap-2">
                                        <button onClick={() => setUrgency('normal')} className={`flex-1 py-2 rounded-lg text-xs font-bold border ${urgency === 'normal' ? 'bg-green-100 text-green-700 border-green-300 ring-2 ring-green-200' : 'bg-gray-50 text-gray-400 border-gray-200 hover:bg-gray-100'}`}>Normal</button>
                                        <button onClick={() => setUrgency('warning')} className={`flex-1 py-2 rounded-lg text-xs font-bold border ${urgency === 'warning' ? 'bg-yellow-100 text-yellow-700 border-yellow-300 ring-2 ring-yellow-200' : 'bg-gray-50 text-gray-400 border-gray-200 hover:bg-gray-100'}`}>Atenção</button>
                                        <button onClick={() => setUrgency('critical')} className={`flex-1 py-2 rounded-lg text-xs font-bold border ${urgency === 'critical' ? 'bg-red-100 text-red-700 border-red-300 ring-2 ring-red-200' : 'bg-gray-50 text-gray-400 border-gray-200 hover:bg-gray-100'}`}>Crítico</button>
                                    </div>
                                </div>

                                <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Analista responsável</label>
                                    <select value={responsibleAnalyst} onChange={(e) => setResponsibleAnalyst(e.target.value)} className="w-full p-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-senac-blue outline-none">
                                        <option value="">-- Selecione o analista --</option>
                                        {NOTEBOOK_ANALYST_OPTIONS.map(analyst => <option key={analyst} value={analyst}>{analyst}</option>)}
                                    </select>
                                    <p className="text-[11px] text-gray-400 mt-2">Identifica quem acompanhará a tratativa.</p>
                                </div>

                                <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Status da tratativa</label>
                                    <select value={treatmentStatus} onChange={(e) => setTreatmentStatus(e.target.value)} className="w-full p-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-senac-blue outline-none">
                                        {NOTEBOOK_TREATMENT_STATUS_OPTIONS.map(option => <option key={option.value} value={option.value}>{option.label}</option>)}
                                    </select>
                                    <p className="text-[11px] text-gray-400 mt-2">O status poderá ser alterado depois no quadro do aluno.</p>
                                </div>

                                <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Situação Específica</label>
                                    <div className="max-h-40 overflow-y-auto border border-gray-200 rounded-lg p-2 space-y-2 bg-gray-50">
                                        {NOTEBOOK_SITUATION_OPTIONS.map(group => (
                                            <div key={group.group}>
                                                <div className="text-[10px] font-bold text-gray-400 uppercase px-1 mb-1">{group.group}</div>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-1">
                                                    {group.options.map(option => (
                                                        <label key={option.value} className={`flex items-center gap-2 px-2 py-1.5 rounded cursor-pointer text-xs ${selectedSituationTypes.includes(option.value) ? 'bg-blue-100 text-blue-800 font-semibold' : 'hover:bg-white text-gray-600'}`}>
                                                            <input type="checkbox" checked={selectedSituationTypes.includes(option.value)} onChange={() => toggleSituation(option.value)} className="rounded text-senac-blue focus:ring-senac-blue" />
                                                            <span>{option.label}</span>
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="mt-2 text-xs text-gray-500 min-h-4">
                                        {selectedSituationTypes.length > 0 ? `${selectedSituationTypes.length} assunto(s) selecionado(s): ${selectedSituationTypes.join(', ')}` : 'Selecione um ou mais assuntos.'}
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-4">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    <label className="text-xs font-bold text-gray-600">Data da ocorrência/início<input type="date" value={situationDate} onChange={(e) => setSituationDate(e.target.value)} className="mt-1 w-full p-2 border border-gray-300 rounded text-sm font-normal" /></label>
                                    <label className="text-xs font-bold text-gray-600">Período de tratativa (dias)<input type="number" min="1" step="1" value={treatmentDays} onChange={(e) => setTreatmentDays(e.target.value)} className="mt-1 w-full p-2 border border-gray-300 rounded text-sm font-normal" placeholder="Ex.: 7" /></label>
                                </div>
                                {treatmentDays && Number.parseInt(treatmentDays, 10) > 0 && <div className="mt-3 rounded-lg border border-orange-200 bg-orange-50 px-3 py-2 text-xs text-orange-800 flex items-center gap-2"><IconClock className="w-4 h-4 shrink-0" /> Prazo previsto: <strong>{formatNotebookDate(addNotebookDays(situationDate || new Date(), Number.parseInt(treatmentDays, 10)))}</strong>. O lembrete pode ser criado no Outlook após salvar.</div>}
                            </div>

                            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-4">
                                <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Anotações Gerais</label>
                                <textarea 
                                    value={notes} 
                                    onChange={(e) => setNotes(e.target.value)} 
                                    className="w-full h-32 p-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-senac-blue outline-none resize-none"
                                    placeholder="Digite aqui observações sobre o andamento, justificativas, detalhes do feedback..."
                                ></textarea>
                            </div>

                            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-6">
                                <div className="flex justify-between items-center mb-2">
                                    <label className="text-xs font-bold text-gray-500 uppercase flex items-center gap-2"><IconPaperclip className="w-4 h-4"/> Documentos Anexados</label>
                                    <label className="cursor-pointer bg-blue-50 text-blue-600 px-3 py-1 rounded text-xs font-bold hover:bg-blue-100 border border-blue-200 transition-colors">
                                        + Anexar
                                        <input type="file" className="hidden" accept="image/*,.pdf" onChange={handleFileUpload} />
                                    </label>
                                </div>
                                {attachments.length > 0 && (
                                    <div className="space-y-2">
                                        {attachments.map((att, idx) => (
                                            <div key={idx} className="flex items-center justify-between bg-gray-50 p-2 rounded border border-gray-200">
                                                <span className="text-xs text-blue-600 truncate">{att.name}</span>
                                                <button onClick={() => removeAttachment(idx)} className="text-red-400 hover:text-red-600"><IconTrash2 className="w-4 h-4"/></button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="flex justify-between items-center mb-6">
                                <button onClick={handleSendEmail} className="bg-white border border-senac-orange text-senac-orange hover:bg-orange-50 px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 shadow-sm">
                                    <IconMail className="w-4 h-4"/> Enviar por E-mail (Outlook)
                                </button>
                                <button onClick={handleSave} className="px-6 py-2 bg-senac-blue text-white hover:bg-blue-700 rounded-lg font-bold text-sm shadow flex items-center gap-2">
                                    {isSaving ? <IconRefreshCw className="w-4 h-4 animate-spin"/> : <IconSave className="w-4 h-4"/>}
                                    Salvar Nota
                                </button>
                            </div>

                            {/* HISTÓRICO DE NOTAS */}
                            {allNotes.length > 0 && (
                                <div className="border-t pt-4">
                                    <h4 className="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2"><IconClock className="w-4 h-4"/> Histórico Recente</h4>
                                    <div className="space-y-3">
                                        {allNotes.map(note => (
                                            <div key={note.id} className="bg-white p-3 rounded-lg border border-gray-200 shadow-sm text-sm relative group">
                                                <button onClick={() => deleteNote(note.id)} className="absolute top-2 right-2 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><IconTrash2 className="w-4 h-4"/></button>
                                                <div className="flex justify-between items-start mb-1">
                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${note.urgency === 'critical' ? 'bg-red-100 text-red-700' : note.urgency === 'warning' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'}`}>{note.urgency}</span>
                                                    <span className="text-xs text-gray-400">{new Date(note.date).toLocaleDateString()}</span>
                                                </div>
                                                <div className="mb-1 font-bold text-gray-800">{getNotebookSituationLabel(note)} {note.situationDate && <span className="font-normal text-gray-500">({new Date(note.situationDate).toLocaleDateString()})</span>}</div>
                                                {note.studentName && <div className="text-xs text-senac-blue mb-1 font-semibold flex items-center gap-1"><IconUser className="w-3 h-3"/> {note.studentName}</div>}
                                                <div className="flex flex-wrap items-center gap-2 mb-2 text-[11px]">
                                                    <select value={note.treatmentStatus || "em_tratativa"} onChange={(e) => handleNoteStatusChange(note, e.target.value)} className={`rounded border px-2 py-1 text-[11px] font-semibold outline-none ${getNotebookStatusMeta(note).className}`} title="Alterar status da tratativa">
                                                        {NOTEBOOK_TREATMENT_STATUS_OPTIONS.map(option => <option key={option.value} value={option.value}>{option.label}</option>)}
                                                    </select>
                                                    {note.responsibleAnalyst && <span className="rounded bg-blue-50 px-2 py-1 font-semibold text-blue-700">Analista: {note.responsibleAnalyst}</span>}
                                                    {getNotebookTreatmentDue(note) && <span className={`rounded px-2 py-1 font-semibold ${getNotebookTreatmentState(note) === 'overdue' ? 'bg-red-100 text-red-700' : getNotebookTreatmentState(note) === 'today' ? 'bg-yellow-100 text-yellow-800' : 'bg-orange-100 text-orange-700'}`}>{getNotebookTreatmentLabel(note)}</span>}
                                                    {getNotebookTreatmentDue(note) && <button type="button" onClick={() => openNotebookTreatmentInOutlook(note, turma, instructorName)} className="rounded border border-blue-200 px-2 py-1 font-semibold text-blue-700 hover:bg-blue-50">Abrir no Outlook</button>}
                                                </div>
                                                <p className="text-gray-600 mb-2 whitespace-pre-wrap">{note.notes}</p>
                                                {note.attachments && note.attachments.length > 0 && <div className="text-xs text-gray-400 flex items-center gap-1"><IconPaperclip className="w-3 h-3"/> {note.attachments.length} anexo(s)</div>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="bg-white p-4 border-t border-gray-200 flex justify-end shrink-0">
                            <button onClick={onClose} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-bold text-sm">Fechar</button>
                        </div>
                    </div>
                </div>
            );
        };

        const NotebookNotesReport = ({ turma, instructors, onClose }) => {
            const [notes, setNotes] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [filter, setFilter] = useState("all");
            const [statusFilter, setStatusFilter] = useState("all");
            const [analystFilter, setAnalystFilter] = useState("all");
            const [search, setSearch] = useState("");
            const reportRef = useRef(null);

            useEffect(() => {
                let isCurrent = true;
                setIsLoading(true);
                Promise.all((instructors || []).map(async instructorName => {
                    const loaded = await loadNotebookNotes(turma, instructorName);
                    return loaded.notes.map(note => ({ ...note, instructorSource: note.instructorName || instructorName }));
                })).then(groups => {
                    if (!isCurrent) return;
                    const unique = new Map();
                    groups.flat().forEach(note => unique.set(`${note.instructorSource}_${note.id}`, note));
                    setNotes(Array.from(unique.values()).sort((a, b) => new Date(b.date) - new Date(a.date)));
                    setIsLoading(false);
                }).catch(error => {
                    console.error("Erro ao gerar relatório do caderno", error);
                    if (isCurrent) setIsLoading(false);
                });
                return () => { isCurrent = false; };
            }, [turma, instructors]);

            const filteredNotes = notes.filter(note => {
                const state = getNotebookTreatmentState(note);
                if (filter === "open" && !["open", "today"].includes(state)) return false;
                if (filter === "overdue" && state !== "overdue") return false;
                if (filter === "class" && note.scope !== "class") return false;
                if (filter === "student" && note.scope === "class") return false;
                if (statusFilter !== "all" && (note.treatmentStatus || "em_tratativa") !== statusFilter) return false;
                if (analystFilter !== "all" && (note.responsibleAnalyst || "Não informado") !== analystFilter) return false;
                if (search.trim()) {
                    const haystack = normalizeText([note.studentName, note.notes, getNotebookSituationLabel(note), note.responsibleAnalyst, note.instructorSource].join(" "));
                    if (!haystack.includes(normalizeText(search))) return false;
                }
                return true;
            });

            const copyReport = async () => {
                const content = reportRef.current;
                if (!content) return;
                const html = content.innerHTML;
                const text = content.innerText;
                const done = () => alert("Relatório de anotações copiado. Cole no Outlook ou em outro documento.");
                try {
                    if (navigator.clipboard && window.ClipboardItem) {
                        await navigator.clipboard.write([new ClipboardItem({
                            "text/html": new Blob([html], { type: "text/html" }),
                            "text/plain": new Blob([text], { type: "text/plain" })
                        })]);
                        done();
                        return;
                    }
                } catch (error) { /* usa o fallback abaixo */ }
                const range = document.createRange();
                range.selectNodeContents(content);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                try { document.execCommand("copy"); done(); } finally { selection.removeAllRanges(); }
            };

            const printReport = () => {
                const content = reportRef.current;
                if (!content) return;
                const printWindow = window.open("", "_blank");
                if (!printWindow) return;
                printWindow.document.write(`<html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório de Anotações - ${turma}</title><style>body{font-family:Arial,sans-serif;color:#243447;padding:24px}h1{color:#004587;font-size:20px}h2{font-size:14px;color:#666;border-bottom:2px solid #f5821f;padding-bottom:8px}.note{border:1px solid #d9e2ec;border-left:4px solid #004587;border-radius:6px;padding:12px;margin:10px 0;break-inside:avoid}.meta{font-size:11px;color:#5f6b76;margin-bottom:6px}.tag{display:inline-block;background:#eef5fb;color:#004587;border-radius:4px;padding:3px 6px;margin-right:4px;font-size:10px;font-weight:bold}.due{color:#b45309}.overdue{color:#b91c1c}</style></head><body><h1>Relatório de Anotações do Caderno</h1><h2>Turma ${turma} | Emitido em ${formatNotebookDate(new Date())}</h2>${content.innerHTML}</body></html>`);
                printWindow.document.close();
                printWindow.focus();
                setTimeout(() => printWindow.print(), 250);
            };

            const totalOpen = notes.filter(note => ["open", "today"].includes(getNotebookTreatmentState(note))).length;
            const totalOverdue = notes.filter(note => getNotebookTreatmentState(note) === "overdue").length;

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="bg-white w-full max-w-5xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
                        <div className="bg-senac-blue p-4 text-white flex justify-between items-center shrink-0">
                            <div><h2 className="text-xl font-bold flex items-center gap-2"><IconFileText className="w-6 h-6" /> Relatório de Anotações</h2><p className="text-xs text-blue-100 mt-1">Chamados, pontos de atenção e registros da turma {turma}</p></div>
                            <button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full"><IconXCircle className="w-6 h-6" /></button>
                        </div>
                        <div className="p-4 bg-gray-50 border-b border-gray-200 grid grid-cols-1 md:grid-cols-5 gap-2">
