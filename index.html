                });
            }, [auth]);

            if (!auth) return <App />;
            if (!ready) return <div className="min-h-screen flex items-center justify-center bg-slate-100 text-slate-600">Carregando acesso...</div>;
            const submit = async (event) => {
                event.preventDefault();
                setError(""); setMessage(""); setBusy(true);
                try {
                    if (!isAllowedSenacEmail(email)) throw new Error("EMAIL_DOMAIN_INVALID");
                    await auth.signInWithEmailAndPassword(email.trim(), password);
                } catch (err) {
                    if (err.message === "EMAIL_DOMAIN_INVALID") setError("Use um e-mail terminado em @pr.senac.br ou @docente.pr.senac.br.");
                    else setError(getAuthMessage(err));
                } finally { setBusy(false); }
            };

            const logout = async () => { await auth.signOut(); setUser(null); window.SENAC_CURRENT_USER = null; };

            if (user && isAllowedSenacEmail(user.email)) {
                const analystProfile = getAnalystProfileForUser(user);
                const instructorViewRequested = new URLSearchParams(window.location.search).get("perfil") === "instrutor";
                if (analystProfile && !instructorViewRequested) {
                    window.location.replace("./analista.html");
                    return <div className="min-h-screen flex items-center justify-center bg-slate-100 text-slate-600">Abrindo Central do Analista...</div>;
                }
                return <App />;
            }

            if (user && !isAllowedSenacEmail(user.email)) return <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4"><div className="bg-white rounded-xl shadow p-8 max-w-md text-center"><h1 className="text-xl font-bold text-red-700">E-mail não autorizado</h1><p className="text-sm text-slate-600 mt-3">Use um e-mail institucional terminado em @pr.senac.br ou @docente.pr.senac.br.</p><button onClick={logout} className="mt-5 text-sm text-senac-blue hover:underline">Sair</button></div></div>;

            return <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                <div className="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                    <div className="bg-senac-blue px-8 py-7 text-white">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Senac_logo.svg/500px-Senac_logo.svg.png" alt="Senac Paraná" className="h-10 w-auto object-contain object-left mb-4 brightness-0 invert" />
                        <div className="text-xs uppercase tracking-widest font-bold text-blue-200">Senac Paraná</div>
                        <h1 className="text-2xl font-bold mt-2">Gestão de Frequência</h1>
                        <p className="text-sm text-blue-100 mt-1">Acesso do instrutor</p>
                    </div>
                    <form onSubmit={submit} className="p-8 space-y-4">
                        <div><label className="block text-xs font-bold text-slate-600 mb-1">E-mail institucional</label><input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5" placeholder="nome@pr.senac.br ou nome@docente.pr.senac.br" required /></div>
                        <div><label className="block text-xs font-bold text-slate-600 mb-1">Senha</label><input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5" minLength="6" required /></div>
                        {error && <div className="bg-red-50 text-red-700 border border-red-200 rounded-lg p-3 text-sm">{error}</div>}
                        {message && <div className="bg-green-50 text-green-700 border border-green-200 rounded-lg p-3 text-sm">{message}</div>}
                        <button disabled={busy} className="w-full bg-senac-orange hover:bg-orange-600 disabled:opacity-60 text-white font-bold rounded-lg py-3">{busy ? "Entrando..." : "Entrar"}</button>
                    </form>
                </div>
            </div>;
        };

        function App() {
            // --- ESTADOS DO SISTEMA ---
            const [data, setData] = useState(null);
            const [activityTracking, setActivityTracking] = useState(null);
            const [dragActive, setDragActive] = useState(false);
            const activityUploadSequence = useRef(0);
            const [naJustifications, setNaJustifications] = useState({});
            const [naJustificationDrafts, setNaJustificationDrafts] = useState({});
            const [savedClasses, setSavedClasses] = useState([]);
            const [savedClassesLoading, setSavedClassesLoading] = useState(true);
            const [savedClassesSource, setSavedClassesSource] = useState("local");
            const [savedClassesLastSync, setSavedClassesLastSync] = useState("");
            const [deletingClassKey, setDeletingClassKey] = useState("");
            const [updatingFrequency, setUpdatingFrequency] = useState(false);
            const [webFrequencyHandle, setWebFrequencyHandle] = useState(null);
            const [frequencySourceRevision, setFrequencySourceRevision] = useState(0);
            const [classSyncMessage, setClassSyncMessage] = useState("");
            const [activeClassUpdatedAt, setActiveClassUpdatedAt] = useState("");
            const [networkScan, setNetworkScan] = useState({ running: false, scanned: 0, total: 0, found: 0, synchronized: 0, skipped: 0, failed: 0, message: "" });
            const networkScanStarted = useRef(false);
            
            // --- MODAIS ---
            const [showAtaModal, setShowAtaModal] = useState(false);
            const [selectedStudentForModal, setSelectedStudentForModal] = useState(null);
            const [instructorNotesForStudent, setInstructorNotesForStudent] = useState([]); // Notas do instrutor para o aluno selecionado
            const [contactDraft, setContactDraft] = useState(normalizeStudentContact());
            const [contactSaving, setContactSaving] = useState(false);
            const [contactStorageSource, setContactStorageSource] = useState("local");
            const [contactMessage, setContactMessage] = useState("");
            const [dropoutDocuments, setDropoutDocuments] = useState({});
            const [dropoutDocumentSource, setDropoutDocumentSource] = useState("local");
            const [dropoutDocumentScanning, setDropoutDocumentScanning] = useState(false);
            const [dropoutDocumentNotice, setDropoutDocumentNotice] = useState("");

            // Novo Estado V72 - Instrutor Selecionado para Notas
            const [selectedInstructorForNotes, setSelectedInstructorForNotes] = useState(null);
            const [showAnalystNotebook, setShowAnalystNotebook] = useState(false);
            const [visibleAnalystNotes, setVisibleAnalystNotes] = useState([]);
            const [analystTrackingAlerts, setAnalystTrackingAlerts] = useState([]);
            const [showNotebookReport, setShowNotebookReport] = useState(false);
            const [showUCIntervalReport, setShowUCIntervalReport] = useState(false);
            const [showStudentReportModal, setShowStudentReportModal] = useState(false);
            const [studentReportMode, setStudentReportMode] = useState("complete");
            const [classNotebookNotes, setClassNotebookNotes] = useState([]);
            const [dashboardHistory, setDashboardHistory] = useState([]);
            const [classRecoveries, setClassRecoveries] = useState([]);
            const [recoveryStorageSource, setRecoveryStorageSource] = useState("local");
            const [historyStorageSource, setHistoryStorageSource] = useState("local");
            const [showDashboardHistory, setShowDashboardHistory] = useState(false);
            const [showOrionStatus, setShowOrionStatus] = useState(false);
            const [orionStatus, setOrionStatus] = useState({});

            // --- FILTROS E SELEÇÃO ---
            const [filter, setFilter] = useState('all'); 
            const [selectedUC, setSelectedUC] = useState('all'); 
            const [searchTerm, setSearchTerm] = useState('');
            const [reportSelection, setReportSelection] = useState([]); 

            // --- DADOS DA ATA / ASSINATURAS ---
            const [customLogo, setCustomLogo] = useState(null);
            const [analistaName, setAnalistaName] = useState('');
            const [analistaCPF, setAnalistaCPF] = useState("");
            const [analistaMatricula, setAnalistaMatricula] = useState("");
            const [analistaRubrica, setAnalistaRubrica] = useState(null);
            const [tutor1Name, setTutor1Name] = useState("");
            const [tutor1CPF, setTutor1CPF] = useState("");
            const [tutor1Matricula, setTutor1Matricula] = useState("");
            const [tutor1Rubrica, setTutor1Rubrica] = useState(null);
            const [tutor2Name, setTutor2Name] = useState("");
            const [tutor2CPF, setTutor2CPF] = useState("");
            const [tutor2Matricula, setTutor2Matricula] = useState("");
            const [tutor2Rubrica, setTutor2Rubrica] = useState(null);

            const ataContentRef = useRef(null);

            const currentAnalystName = useMemo(() => getCurrentAnalystName(), []);
            const detectedInstructorNames = useMemo(() => {
                const source = data && Array.isArray(data.instructors)
                    ? data.instructors
                    : [tutor1Name, tutor2Name];
                return [...new Set(source
                    .map(canonicalizeInstructorName)
                    .filter(name => isValidInstructorName(name) && normalizeName(name) !== normalizeName("Não Identificado")))];
            }, [data, tutor1Name, tutor2Name]);
            const activeInstructorNames = useMemo(() => currentAnalystName ? [] : filterInstructorNamesForCurrentUser(detectedInstructorNames), [detectedInstructorNames, currentAnalystName]);
            const notebookInstructorNames = useMemo(() => currentAnalystName ? detectedInstructorNames : activeInstructorNames, [currentAnalystName, detectedInstructorNames, activeInstructorNames]);

            const refreshSavedClasses = async ({ announce = false } = {}) => {
                setSavedClassesLoading(true);
                try {
                    const loaded = await loadSavedClasses();
                    const synchronizedAt = new Date();
                    setSavedClasses(loaded.classes || []);
                    setSavedClassesSource(loaded.source || "local");
                    setSavedClassesLastSync(synchronizedAt.toISOString());
                    if (announce) setClassSyncMessage(loaded.source === "cloud"
                        ? `Lista sincronizada com o Firebase às ${synchronizedAt.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}. A planilha de chamada não foi relida.`
                        : "Sem acesso ao Firebase. A lista local deste dispositivo foi exibida; a planilha de chamada não foi relida.");
                } catch (error) {
                    console.error("Erro ao sincronizar a lista de turmas", error);
                    if (announce) setClassSyncMessage("Não foi possível sincronizar a lista de turmas. Tente novamente.");
                } finally {
                    setSavedClassesLoading(false);
                }
            };

            useEffect(() => { refreshSavedClasses().catch(error => { console.error(error); setSavedClassesLoading(false); }); }, []);

            useEffect(() => {
                let stopped = false;
                let unsubscribe = null;
                getNotebookFirestore().then(db => {
                    if (!db || stopped) return;
                    unsubscribe = db.collection("saved_classes").onSnapshot(async snapshot => {
                        if (stopped) return;
                        const accessedKeys = await loadUserClassAccess();
                        if (stopped) return;
                        setSavedClasses(synchronizeSavedClassSummaries(snapshot.docs, accessedKeys));
                        setSavedClassesSource("cloud");
                        setSavedClassesLastSync(new Date().toISOString());
                        setSavedClassesLoading(false);
                    }, error => console.error("Erro na sincronização automática da lista de turmas", error));
                });
                return () => { stopped = true; if (unsubscribe) unsubscribe(); };
            }, []);

            useEffect(() => {
                if (!data || !data.turma || isElectronDesktop() || typeof window.showOpenFilePicker !== "function") {
                    setWebFrequencyHandle(null);
                    return undefined;
                }
                let active = true;
                readWebFrequencyHandle(data.turma)
                    .then(handle => { if (active) setWebFrequencyHandle(handle); })
                    .catch(error => console.warn("Não foi possível recuperar o vínculo da chamada neste navegador", error));
                return () => { active = false; };
            }, [data ? data.turma : ""]);

            const openSavedClass = async (summary) => {
                setClassSyncMessage("Abrindo turma salva...");
                try {
                    await markSavedClassAccess(summary.turmaKey);
                    const loaded = await loadSavedClassData(summary);
                    setData(loaded.data);
                    setActivityTracking(null);
                    setReportSelection([]);
                    setSelectedUC("all");
                    setActiveClassUpdatedAt(loaded.updatedAt || summary.updatedAt || "");
                    setClassSyncMessage(loaded.source === "cloud" ? "Turma carregada do Firebase." : "Turma carregada deste dispositivo.");
                    if (isElectronDesktop() && typeof window.senacDesktop.locateFrequencyFile === "function") {
                        try {
                            setClassSyncMessage(`Turma carregada. Verificando a chamada ${summary.turma} na rede...`);
                            const located = await window.senacDesktop.locateFrequencyFile(summary.turma);
                            rememberElectronClassSourcePath(summary.turma, located.path, located.mtimeMs);
                            setFrequencySourceRevision(value => value + 1);
                            if (Number(located.mtimeMs || 0) > Number(loaded.sourceLastModified || summary.sourceLastModified || 0) + 500) {
                                const fileBuffer = await window.senacDesktop.readFile(located.path);
                                const arrayBuffer = fileBuffer.buffer.slice(fileBuffer.byteOffset, fileBuffer.byteOffset + fileBuffer.byteLength);
                                const processed = processExcelFile(arrayBuffer);
                                if (getSavedClassKey(processed.turma) !== getSavedClassKey(summary.turma)) throw new Error("A planilha localizada pertence a outra turma.");
                                await applyProcessedFrequency(processed, { name: located.name, lastModified: located.mtimeMs }, null, "atualização automática");
                                setClassSyncMessage(`Turma ${summary.turma} aberta e atualizada automaticamente pela rede.`);
                            } else {
                                setClassSyncMessage(`Turma ${summary.turma} sincronizada. A chamada da rede já está atualizada e será monitorada.`);
                            }
                        } catch (error) {
                            console.error("Erro ao verificar a chamada ao abrir a turma", error);
                            setClassSyncMessage(`Turma ${summary.turma} aberta com os dados salvos. Não foi possível verificar a chamada na rede.`);
                        }
                    }
                } catch (error) {
                    setClassSyncMessage("");
                    alert(error.message);
                }
            };

            const deleteSavedClass = async (summary) => {
                if (!summary || !summary.turmaKey || deletingClassKey) return;
                const confirmed = window.confirm(
                    `Excluir a turma ${summary.turma} de "Minhas turmas"?\n\n` +
                    "Ela será removida apenas da sua lista. Os dados compartilhados, cadernos, contatos, justificativas e históricos serão preservados para os demais usuários."
                );
                if (!confirmed) return;
                setDeletingClassKey(summary.turmaKey);
                setClassSyncMessage(`Excluindo a turma ${summary.turma}...`);
                try {
                    const removed = await removeSavedClass(summary);
                    setSavedClasses(current => current.filter(item => item.turmaKey !== summary.turmaKey));
                    setClassSyncMessage(removed.source === "cloud"
                        ? `Turma ${summary.turma} excluída de Minhas turmas.`
                        : `Turma ${summary.turma} excluída somente deste computador.`);
                } catch (error) {
                    console.error("Erro ao excluir turma salva", error);
                    setClassSyncMessage("");
                    alert("Não foi possível excluir a turma. Verifique a conexão e tente novamente.");
                } finally {
                    setDeletingClassKey("");
                }
            };

            const captureDashboardHistory = async (dataSnapshot, activitySnapshot, justificationsSnapshot, trigger, notesSnapshot = classNotebookNotes) => {
                const snapshot = buildDashboardHistorySnapshot({ data: dataSnapshot, activityTracking: activitySnapshot, naJustifications: justificationsSnapshot || {}, notebookNotes: notesSnapshot || [], trigger });
                if (!snapshot) return;
                setDashboardHistory(current => [snapshot, ...current.filter(item => String(item.id) !== String(snapshot.id))].slice(0, DASHBOARD_HISTORY_LIMIT));
                const saved = await persistDashboardHistory(snapshot);
                setHistoryStorageSource(saved.source);
            };

            useEffect(() => {
                if(data) {
                    if(data.tutor1) setTutor1Name(data.tutor1);
                    if(data.tutor2) setTutor2Name(data.tutor2);
                }
            }, [data]);

            useEffect(() => {
                if (!data || !data.turma) {
                    setDashboardHistory([]);
                    setHistoryStorageSource("local");
                    return undefined;
                }
                let isCurrent = true;
                loadDashboardHistory(data.turma).then(loaded => {
                    if (!isCurrent) return;
                    setDashboardHistory(loaded.history || []);
                    setHistoryStorageSource(loaded.source || "local");
                }).catch(error => console.error("Erro ao carregar histórico da turma", error));
                return () => { isCurrent = false; };
            }, [data ? data.turma : ""]);

            useEffect(() => {
                if (!data || !getValidTurmaNumber(data.turma)) {
                    setClassRecoveries([]);
                    setRecoveryStorageSource("local");
                    return undefined;
                }
                let isCurrent = true;
                loadClassRecoveries(data.turma).then(async loaded => {
                    const reconciled = await reconcileRecoveriesWithFrequency(loaded.records, data);
                    if (!isCurrent) return;
                    setClassRecoveries(reconciled);
                    setRecoveryStorageSource(loaded.source);
                }).catch(error => console.error("Erro ao carregar o histórico de recuperações", error));
                return () => { isCurrent = false; };
            }, [data ? data.turma : "", frequencySourceRevision]);

            useEffect(() => {
                if (!data || !data.turma) { setOrionStatus({}); return; }
                loadClassOrionStatus(data.turma, data.ucs).then(setOrionStatus);
            }, [data ? data.turma : "", (data?.ucs || []).join("|")]);

            const updateOrionStatus = async (uc, value) => {
                const next = { ...orionStatus, [uc]: { ...value, updatedAt: new Date().toISOString(), updatedBy: getCurrentAuthenticatedEmail() } };
                setOrionStatus(next);
                try { await persistClassOrionStatus(data, next); }
                catch (error) { alert(error.message); }
            };

            const handleRecoverySaved = (record, source) => {
                setClassRecoveries(current => [record, ...current.filter(item => item.id !== record.id)].sort((a, b) => a.studentName.localeCompare(b.studentName, "pt-BR") || Number(a.number) - Number(b.number)));
                setRecoveryStorageSource(source || "local");
            };

            const refreshVisibleAnalystNotes = async () => {
                if (!data || !data.turma || activeInstructorNames.length === 0) { setVisibleAnalystNotes([]); return; }
                setVisibleAnalystNotes(await loadVisibleAnalystNotes(data.turma, activeInstructorNames));
            };

            const refreshAnalystTrackingAlerts = async () => {
                if (!data || !data.turma || !currentAnalystName) { setAnalystTrackingAlerts([]); return; }
                const loaded = await loadAnalystNotes(data.turma, currentAnalystName);
                setAnalystTrackingAlerts((loaded.notes || []).filter(note => note.trackingEnabled && ["overdue", "today", "open"].includes(getAnalystTrackingState(note))));
            };

            useEffect(() => {
                refreshVisibleAnalystNotes().catch(error => console.error("Erro ao carregar acompanhamentos visíveis", error));
            }, [data ? data.turma : "", activeInstructorNames.join("|")]);

            useEffect(() => {
                refreshAnalystTrackingAlerts().catch(error => console.error("Erro ao carregar alertas do analista", error));
            }, [data ? data.turma : "", currentAnalystName]);

            useEffect(() => {
                if (!data || !data.turma) {
                    setNaJustifications({});
                    setNaJustificationDrafts({});
                    return;
                }
                let isCurrent = true;
                const applyLoaded = (parsed) => {
                    if (!isCurrent) return;
                    const drafts = {};
                    Object.entries(parsed).forEach(([key, value]) => {
                        if (value && typeof value.reason === "string") drafts[key] = value.reason;
                    });
                    setNaJustifications(parsed);
                    setNaJustificationDrafts(drafts);
                };
                applyLoaded(readNAJustificationsLocal(data.turma));
                loadNAJustifications(data.turma).then(loaded => {
                    if (loaded && loaded.justifications) applyLoaded(loaded.justifications);
                }).catch(error => console.error("Erro ao carregar justificativas da turma", error));
                return () => { isCurrent = false; };
            }, [data ? data.turma : ""]);

            useEffect(() => {
                if (!data || !data.turma) return undefined;
                let isCurrent = true;
                loadStudentContacts(data.turma).then(loaded => {
                    if (!isCurrent) return;
                    setContactStorageSource(loaded.source);
                    if (Object.keys(loaded.contacts).length === 0) return;
                    setData(previous => {
                        if (!previous || previous.turma !== data.turma) return previous;
                        const students = previous.students.map(student => {
                            const saved = loaded.contacts[normalizeName(student.name)];
                            return saved ? { ...student, ...normalizeStudentContact(saved, student.name) } : student;
                        });
                        return { ...previous, students };
                    });
                }).catch(error => console.error("Erro ao carregar contatos da turma", error));
                return () => { isCurrent = false; };
            }, [data ? data.turma : ""]);

            useEffect(() => {
                if (!data || !data.turma) {
                    setDropoutDocuments({});
                    setDropoutDocumentSource("local");
                    return undefined;
                }
                let isCurrent = true;
                loadDropoutDocuments(data.turma).then(loaded => {
                    if (!isCurrent) return;
                    const records = loaded.records || {};
                    setDropoutDocuments(records);
                    setDropoutDocumentSource(loaded.source || "local");
                    setData(previous => {
                        if (!previous || previous.turma !== data.turma) return previous;
                        let changed = false;
                        const students = previous.students.map(student => {
                            const record = records[normalizeName(student.name)];
                            if (!record || record.status !== "com_documentacao" || student.is_dropout) return student;
                            changed = true;
                            return { ...student, is_dropout: true, is_process_dropout: false, status: "Evadido/Desligado", dropout_reason: "Documentação de desligamento confirmada" };
                        });
                        return changed ? { ...previous, students } : previous;
                    });
                }).catch(error => console.error("Erro ao carregar o acompanhamento documental", error));
                return () => { isCurrent = false; };
            }, [data ? data.turma : ""]);

            useEffect(() => {
                if (!selectedStudentForModal || !data) {
                    setContactDraft(normalizeStudentContact());
                    setContactMessage("");
                    return;
                }
                const current = data.students.find(student => student.id === selectedStudentForModal.id) || selectedStudentForModal;
                setContactDraft(normalizeStudentContact(current, current.name));
                setContactMessage("");
            }, [selectedStudentForModal ? selectedStudentForModal.id : null, data]);

            // Carrega notas locais ou do Firestore e inclui também registros feitos para a turma inteira.
            useEffect(() => {
                if (selectedStudentForModal && data) {
                    const instructors = notebookInstructorNames;
                    let isCurrent = true;
                    Promise.all(instructors.map(async instName => {
                        const loaded = await loadNotebookNotes(data.turma, instName);
                        return loaded.notes
                            .filter(note => note.scope === "class" || Number(note.studentId) === Number(selectedStudentForModal.id) || (note.studentIds || []).includes(Number(selectedStudentForModal.id)))
                            .map(note => ({ ...note, instructorSource: instName }));
                    })).then(groups => {
                        if (!isCurrent) return;
                        const allFoundNotes = groups.flat().sort((a, b) => new Date(b.date) - new Date(a.date));
                        setInstructorNotesForStudent(allFoundNotes);
                    });
                    return () => { isCurrent = false; };
                } else {
                    setInstructorNotesForStudent([]);
                }
            }, [selectedStudentForModal, data, notebookInstructorNames]);

            const refreshClassNotebookNotes = () => {
                if (!data || notebookInstructorNames.length === 0) {
                    setClassNotebookNotes([]);
                    return;
                }
                Promise.all(notebookInstructorNames.map(async instructorName => {
                    const loaded = await loadNotebookNotes(data.turma, instructorName);
                    return loaded.notes.map(note => ({ ...note, instructorSource: note.instructorName || instructorName }));
                })).then(groups => {
                    const notes = groups.flat().sort((a, b) => new Date(b.date) - new Date(a.date));
                    setClassNotebookNotes(notes);
                    captureDashboardHistory(data, activityTracking, naJustifications, "tratativas", notes).catch(error => console.error("Erro ao registrar histórico das tratativas", error));
                })
                    .catch(error => console.error("Erro ao atualizar sinalizações do caderno", error));
            };

            const handleStudentNoteStatusChange = async (note, nextStatus) => {
                const instructorName = note.instructorSource || note.instructorName || "Instrutor";
                const updatedNote = normalizeNotebookNote({ ...note, treatmentStatus: nextStatus });
                setInstructorNotesForStudent(current => current.map(item => item.id === updatedNote.id && (item.instructorSource || item.instructorName) === instructorName ? { ...updatedNote, instructorSource: instructorName } : item));
                setClassNotebookNotes(current => current.map(item => item.id === updatedNote.id && (item.instructorSource || item.instructorName) === instructorName ? { ...updatedNote, instructorSource: instructorName } : item));
                const saved = await updateNotebookNote(data.turma, instructorName, updatedNote);
                if (saved.source === "local") console.warn("Status atualizado localmente; verifique a autenticação para sincronizar com o Firebase.");
                refreshClassNotebookNotes();
            };

            useEffect(() => {
                refreshClassNotebookNotes();
            }, [data ? data.turma : "", notebookInstructorNames.join("|")]);


            useEffect(() => {
                if (showAtaModal && data && ataContentRef.current) {
                    const html = generateAtaHTMLContent(
                        analistaName, analistaCPF, analistaMatricula, analistaRubrica,
                        data.students, data.course, data.turma, 
                        tutor1Name, tutor1CPF, tutor1Matricula, tutor1Rubrica, 
                        tutor2Name, tutor2CPF, tutor2Matricula, tutor2Rubrica, 
                        customLogo
                    );
                    const bodyContent = html.match(/<body>([\s\S]*)<\/body>/)[1];
                    ataContentRef.current.innerHTML = bodyContent;
                    ataContentRef.current.id = "ata-preview-content";
                }

                    ...student,
                    is_dropout: true,
                    is_process_dropout: false,
                    status: "Evadido/Desligado",
                    dropout_reason: detection.source === "rede"
                        ? "Documentação localizada na rede"
                        : "Documentação de desligamento confirmada"
                };
                const updatedData = { ...data, students: data.students.map(item => item.id === student.id ? updatedStudent : item) };
                setData(updatedData);
                if (selectedStudentForModal && selectedStudentForModal.id === student.id) setSelectedStudentForModal(updatedStudent);
                saveManualProcessList(data.turma, getManualProcessList(data.turma).filter(name => name !== studentKey));
                setDropoutDocumentNotice(`Documentação confirmada para ${student.name}. O aluno foi movido para Evasão/Desligado. Pinte a célula do nome de laranja na chamada e dê baixa no sistema Senac.`);
                try {
                    const persisted = await persistSavedClass(updatedData, { name: detection.source === "rede" ? "Documentação localizada na rede" : "Documentação confirmada" });
                    setActiveClassUpdatedAt(persisted.summary && persisted.summary.updatedAt || "");

                    console.error("Erro ao salvar a baixa documental na turma", error);

                const studentKey = normalizeName(student.name);
                const saved = await persistDropoutDocument(data.turma, {
                    studentKey,
                    studentName: student.name,
                    status: "sem_documentacao",
                    source: "reversao_manual",
                    fileCount: 0,
                    folderName: "",
                    detectedAt: ""
                });
                const restoredStudent = {
                    ...student,
                    is_dropout: Boolean(student.frequency_is_dropout),
                    is_process_dropout: Boolean(student.frequency_is_process_dropout),
                    dropout_reason: String(student.frequency_dropout_reason || "")
                };
                if (restoredStudent.is_dropout) restoredStudent.status = "Evadido/Desligado";
                else if (restoredStudent.is_process_dropout) restoredStudent.status = "Em Processo de Desligamento";
                else if (restoredStudent.needs_recuperacao) restoredStudent.status = "Não Desenvolveu";
                else if (restoredStudent.needs_conselho) restoredStudent.status = "Conselho de Classe";
                else restoredStudent.status = "Desenvolveu";
                const updatedData = { ...data, students: data.students.map(item => item.id === student.id ? restoredStudent : item) };
                setDropoutDocuments(current => ({ ...current, [studentKey]: saved.record }));
                setDropoutDocumentSource(saved.source || "local");
                setData(updatedData);
                setSelectedStudentForModal(restoredStudent);
                setDropoutDocumentNotice(restoredStudent.is_dropout
                    ? `${student.name} continua em Evasão porque a própria planilha de frequência ainda indica desligamento. Corrija a chamada para concluir a reversão.`
                    : `${student.name} foi revertido para a situação da última planilha de frequência.`);
                const persisted = await persistSavedClass(updatedData, { name: "Reversão da baixa documental" });
                setActiveClassUpdatedAt(persisted.summary && persisted.summary.updatedAt || "");
                refreshSavedClasses();
            };

            const scanDropoutDocumentsForClass = async ({ silent = false } = {}) => {
                if (!data || !isElectronDesktop() || !window.senacDesktop || typeof window.senacDesktop.scanDropoutDocuments !== "function") {
                    if (!silent) setDropoutDocumentNotice("A busca automática nas pastas da rede está disponível no aplicativo instalado.");
                    return;
                }
                const candidates = data.students.filter(student => student.is_process_dropout && !student.is_dropout);
                if (candidates.length === 0) {
                    if (!silent) setDropoutDocumentNotice("Não há alunos em processo de desligamento para verificar.");
                    return;
                }
                setDropoutDocumentScanning(true);
                try {
                    const result = await window.senacDesktop.scanDropoutDocuments(data.turma, candidates.map(student => student.name));
                    const detected = (result.students || []).filter(item => item.hasDocuments);

                            return { ...student, is_dropout: true, is_process_dropout: false, status: "Evadido/Desligado", dropout_reason: "Documentação localizada na rede" };

                    refreshSavedClasses();
                } catch (error) {
                    console.error("Erro ao verificar documentos de desligamento", error);
                    if (!silent) setDropoutDocumentNotice(`Não foi possível verificar a documentação na rede: ${error.message}`);
                } finally {

                }

                                {currentAnalystName && <button type="button" onClick={scanAllNetworkClasses} disabled={networkScan.running} className="bg-white border border-purple-500 text-purple-700 hover:bg-purple-50 disabled:cursor-wait disabled:opacity-60 px-4 py-2 rounded-lg flex items-center gap-2 shadow text-sm font-medium min-h-[54px] min-w-[116px] max-w-[160px] justify-center text-center leading-tight"><IconRefreshCw className={`h-4 w-4 ${networkScan.running ? "animate-spin" : ""}`} /> {networkScan.running ? `${networkScan.scanned}/${networkScan.total || "..."}` : "Varrer turmas"}</button>}
                                <label className="cursor-pointer bg-white border border-senac-blue text-senac-blue hover:bg-blue-50 px-4 py-2 rounded-lg flex items-center gap-2 shadow transition-all active:scale-95 text-sm font-medium min-h-[54px] min-w-[116px] max-w-[160px] justify-center whitespace-normal text-center leading-tight" title="Ler a aba DADOS GERAIS"><IconUploadCloud className="w-4 h-4" /> Dados Gerais <input type="file" className="hidden" accept=".xlsx,.xlsm,.xls" onChange={(e) => { handleGeneralDataFile(e.target.files[0]); e.target.value = ''; }} /></label>
                                <label className="cursor-pointer bg-white border border-senac-orange text-senac-orange hover:bg-orange-50 px-4 py-2 rounded-lg flex items-center gap-2 shadow transition-all active:scale-95 text-sm font-medium min-h-[54px] min-w-[116px] max-w-[160px] justify-center whitespace-normal text-center leading-tight" title="Ler uma ou várias planilhas de atividades por UC"><IconUploadCloud className="w-4 h-4" /> Ler atividades{activityTracking && activityTracking.uploads ? ` (${activityTracking.uploads.length})` : ""} <input type="file" multiple className="hidden" accept=".xlsx,.xlsm,.xls" onChange={(e) => { handleActivityFiles(e.target.files); e.target.value = ''; }} /></label>
                                </div></section>
                                <section className="min-w-0 rounded-lg border border-orange-100 bg-orange-50/50 p-2"><div className="mb-1 px-1 text-[10px] font-bold uppercase text-orange-700">Relatórios e documentos</div><div className="flex flex-wrap gap-2">
                                    <details className="group relative"><summary className="flex min-h-[54px] min-w-[150px] cursor-pointer list-none items-center justify-center gap-2 rounded-lg border border-senac-blue bg-white px-4 py-2 text-center text-sm font-medium text-senac-blue shadow hover:bg-blue-50"><IconFileText className="h-4 w-4" /> Relatórios</summary><div className="absolute right-0 top-[60px] z-50 grid w-64 gap-1 rounded-lg border border-gray-200 bg-white p-2 shadow-xl"><button onClick={() => setShowNotebookReport(true)} className="flex items-center gap-2 rounded px-3 py-2 text-left text-xs font-bold text-orange-700 hover:bg-orange-50"><IconBookOpen className="h-4 w-4" /> Relatório de anotações</button><button onClick={() => setShowUCIntervalReport(true)} className="flex items-center gap-2 rounded px-3 py-2 text-left text-xs font-bold text-senac-blue hover:bg-blue-50"><IconFileText className="h-4 w-4" /> Relatório por UCs</button><button onClick={() => generateReport(reportSelection, data.students, data.turma, data.course, tutor1Name, tutor2Name, activityTracking, data, naJustifications)} disabled={reportSelection.length === 0} className="flex items-center gap-2 rounded px-3 py-2 text-left text-xs font-bold text-senac-blue hover:bg-blue-50 disabled:cursor-not-allowed disabled:opacity-40"><IconPrinter className="h-4 w-4" /> Selecionados {reportSelection.length > 0 && `(${reportSelection.length})`}</button></div></details>
                                    <button onClick={() => setShowDashboardHistory(true)} className="flex min-h-[54px] min-w-[120px] items-center justify-center gap-2 rounded-lg border border-senac-blue bg-white px-4 py-2 text-sm font-medium text-senac-blue shadow hover:bg-blue-50" title={`Histórico ${historyStorageSource === "cloud" ? "compartilhado" : "local"}`}><IconBarChart2 className="h-4 w-4" /> Histórico</button>
                                    <button onClick={() => setShowOrionStatus(true)} className="flex min-h-[54px] min-w-[120px] items-center justify-center gap-2 rounded-lg border border-green-700 bg-white px-4 py-2 text-sm font-medium text-green-800 shadow hover:bg-green-50"><IconCheckCircle className="h-4 w-4" /> Status Órion</button>
                                    <button onClick={() => setShowAtaModal(!showAtaModal)} className="flex min-h-[54px] min-w-[120px] items-center justify-center gap-2 rounded-lg bg-senac-blue px-4 py-2 text-sm font-medium text-white shadow hover:bg-blue-800"><IconFileText className="h-4 w-4" /> Gerar ATA</button>
                                </div></section>
                            </div>
                        </div>
                        <div className="bg-white border-t border-gray-100">
                            <div className="mx-auto flex max-w-[1600px] flex-wrap items-center gap-x-5 gap-y-1 px-4 py-2 text-xs text-gray-600">

                                {currentAnalystName ? <>
                                    <span className="flex items-center gap-2 font-bold whitespace-nowrap text-senac-orange"><IconUser className="w-3.5 h-3.5" /> Analista (clique para acompanhar):</span>
                                    <button onClick={() => setShowAnalystNotebook(true)} className="flex items-center gap-1 rounded px-2 py-0.5 font-medium text-blue-700 transition-colors hover:bg-blue-50" title="Abrir Caderno do Analista">{currentAnalystName} <IconEdit3 className="h-3 w-3 opacity-50" /></button>
                                </> : <>
                                    <span className="flex items-center gap-2 font-bold whitespace-nowrap text-senac-orange"><IconUser className="w-3.5 h-3.5" /> Instrutores (clique para anotar):</span>
                                    {activeInstructorNames.map((instructorName, index) => <React.Fragment key={`${instructorName}-${index}`}>
                                        {index > 0 && <span className="text-gray-300">|</span>}
                                        <button onClick={() => setSelectedInstructorForNotes(instructorName)} className="whitespace-nowrap font-medium hover:bg-blue-50 px-2 py-0.5 rounded transition-colors text-blue-700 flex items-center gap-1" title="Abrir Caderno do Instrutor">{instructorName} <IconEdit3 className="w-3 h-3 opacity-50"/></button>
                                    </React.Fragment>)}
                                    {activeInstructorNames.length === 0 && <span className="text-gray-500 italic">Nenhum caderno associado ao e-mail autenticado.</span>}
                                </>}
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
                        <DashboardCharts stats={stats} context={selectedUC} />
                        {currentAnalystName && analystTrackingAlerts.length > 0 && (
                            <div className="mb-6 rounded-lg border border-orange-200 border-l-4 border-l-orange-500 bg-orange-50 p-4 text-sm text-orange-900 shadow-sm">
                                <div className="flex flex-wrap items-center justify-between gap-3"><div><div className="flex items-center gap-2 font-bold"><IconClock className="h-4 w-4" /> Acompanhamentos do analista</div><div className="mt-1 text-xs">{analystTrackingAlerts.length} situação(ões) exigem acompanhamento nesta turma.</div></div><button type="button" onClick={() => setShowAnalystNotebook(true)} className="rounded-md border border-orange-300 bg-white px-3 py-2 text-xs font-bold text-orange-800 hover:bg-orange-100">Abrir caderno</button></div>
                                <div className="mt-3 text-xs">{analystTrackingAlerts.slice(0, 8).map(note => `${note.instructorName}: ${note.subject || note.followupType}${note.reminderDate ? ` (${formatNotebookDate(note.reminderDate)})` : ""}`).join("; ")}{analystTrackingAlerts.length > 8 ? `; e mais ${analystTrackingAlerts.length - 8}` : ""}</div>
                            </div>
                        )}
                        {!currentAnalystName && visibleAnalystNotes.length > 0 && (
                            <div className="mb-6 rounded-lg border border-blue-200 border-l-4 border-l-senac-blue bg-blue-50 p-4 text-sm text-blue-900 shadow-sm">

                                <div className="mt-3 text-xs">{visibleAnalystNotes.slice(0, 8).map(note => `${note.subject || note.followupType} (${note.analystName || "Análise"})`).join("; ")}{visibleAnalystNotes.length > 8 ? `; e mais ${visibleAnalystNotes.length - 8}` : ""}</div>
                            </div>
                        )}
                        {dropoutDocumentNotice && (
                            <div className="mb-4 flex flex-wrap items-center justify-between gap-3 rounded-lg border border-orange-300 bg-orange-50 px-4 py-3 text-sm text-orange-900 shadow-sm">
                                <span className="font-medium">{dropoutDocumentNotice}</span>
                                <button type="button" onClick={() => setDropoutDocumentNotice("")} className="text-xs font-bold text-orange-800 hover:underline">Dispensar</button>
                            </div>
                        )}
                        {dropoutDivergences.length > 0 && (
                            <div className="mb-4 rounded-lg border border-yellow-300 border-l-4 border-l-yellow-600 bg-yellow-50 px-4 py-3 text-sm text-yellow-900 shadow-sm">
                                <div className="flex items-center gap-2 font-bold"><IconAlertTriangle className="h-4 w-4" /> Divergência entre frequência e documentação</div>
                                <div className="mt-2 text-xs">{dropoutDivergences.slice(0, 10).map(item => `${item.student.name}: ${item.message}`).join("; ")}{dropoutDivergences.length > 10 ? `; e mais ${dropoutDivergences.length - 10}` : ""}</div>
                            </div>
                        )}
                        {processStudentsWithoutDocuments.length > 0 && (
                            <div className={`mb-6 rounded-lg border border-l-4 p-4 text-sm shadow-sm ${new Date().getDay() === 1 ? "border-red-300 border-l-red-600 bg-red-50 text-red-900" : "border-purple-200 border-l-purple-600 bg-purple-50 text-purple-900"}`}>
                                <div className="flex flex-wrap items-start justify-between gap-3">
                                    <div><div className="flex items-center gap-2 font-bold"><IconAlertTriangle className="h-4 w-4" /> Documentação de desligamento pendente</div><div className="mt-1 text-xs">{processStudentsWithoutDocuments.length} aluno(s) em processo ainda estão sem documentação.{new Date().getDay() === 1 ? " Este é o alerta semanal de segunda-feira." : " Acompanhe no quadro de cada aluno."}</div></div>
                                    <div className="flex flex-wrap gap-2">
                                        <button type="button" onClick={() => downloadWeeklyDropoutReminder(data.turma, processStudentsWithoutDocuments)} className="rounded-md border border-blue-300 bg-white px-3 py-2 text-xs font-bold text-senac-blue hover:bg-blue-50"><IconCalendar className="mr-1 inline h-3.5 w-3.5" /> Criar alerta semanal no Outlook</button>
                                        {isElectronDesktop() && <button type="button" onClick={() => scanDropoutDocumentsForClass()} disabled={dropoutDocumentScanning} className="rounded-md border border-purple-300 bg-white px-3 py-2 text-xs font-bold text-purple-800 hover:bg-purple-100 disabled:opacity-60"><IconRefreshCw className={`mr-1 inline h-3.5 w-3.5 ${dropoutDocumentScanning ? "animate-spin" : ""}`} /> {dropoutDocumentScanning ? "Verificando..." : "Verificar documentos na rede"}</button>}
                                    </div>
                                </div>
                                <div className="mt-3 text-xs"><strong>Alunos:</strong> {processStudentsWithoutDocuments.slice(0, 16).map(student => student.name).join("; ")}{processStudentsWithoutDocuments.length > 16 ? `; e mais ${processStudentsWithoutDocuments.length - 16}` : ""}</div>
                            </div>
                        )}
                        {data.attendanceWarnings && data.attendanceWarnings.length > 0 && (
                            <div className="mb-6 bg-yellow-50 border border-yellow-200 border-l-4 border-l-yellow-500 rounded-lg p-4 text-sm text-yellow-900 shadow-sm">
                                <div className="font-bold flex items-center gap-2 mb-2"><IconAlertTriangle className="w-4 h-4"/> Pendências de preenchimento da chamada</div>
                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2">
                                    {Object.entries(data.attendanceWarnings.reduce((acc, item) => {
                                        if (!acc[item.sheet]) acc[item.sheet] = [];
                                        acc[item.sheet].push(item);
                                        return acc;
                                    }, {})).map(([sheet, items]) => (
                                        <div key={sheet} className="bg-white/70 border border-yellow-100 rounded-md px-3 py-2">
                                            <div className="font-bold text-xs text-yellow-800 mb-1">{sheet}</div>
                                            <div className="text-xs">{items.slice(0, 6).map(formatAttendanceWarning).join("; ")}{items.length > 6 ? ` e mais ${items.length - 6}` : ""}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        {naAttentionStudents.length > 0 && (
                            <div className="mb-6 bg-red-50 border border-red-200 border-l-4 border-l-red-600 rounded-lg p-4 text-sm text-red-900 shadow-sm">

                                    <div className="bg-white/80 border border-red-100 rounded-md px-3 py-2"><div className="font-bold text-xs text-red-800">Alunos</div><div className="text-lg font-bold">{naAttentionStudents.length}</div></div>

                                </div>
                                <div className="text-xs"><strong>Alunos:</strong> {naAttentionStudents.slice(0, 16).map(student => `${student.name} (${student.count} NA)`).join("; ")}{naAttentionStudents.length > 16 ? `; e mais ${naAttentionStudents.length - 16}` : ""}</div>

                            </div>

                        {activityTracking && activityAttentionStudents.length > 0 && (

                                <div className="font-bold flex items-center gap-2 mb-2"><IconAlertTriangle className="w-4 h-4"/> Pendências de atividades</div>
                                <div className="grid grid-cols-1 sm:grid-cols-5 gap-2 mb-3">
                                    <div className="bg-white/80 border border-red-100 rounded-md px-3 py-2"><div className="font-bold text-xs text-red-800">Não concluiu</div><div className="text-lg font-bold">{activityTracking.totals.not_completed}</div></div>
                                    <div className="bg-white/80 border border-red-100 rounded-md px-3 py-2"><div className="font-bold text-xs text-red-800">Em branco</div><div className="text-lg font-bold">{activityTracking.totals.blank}</div></div>
                                    <div className="bg-white/80 border border-red-100 rounded-md px-3 py-2"><div className="font-bold text-xs text-red-800">Requer avaliação</div><div className="text-lg font-bold">{activityTracking.totals.requires_evaluation}</div></div>
                                    <div className="bg-white/80 border border-blue-100 rounded-md px-3 py-2"><div className="font-bold text-xs text-blue-800">Indicadores PA/NA</div><div className="text-lg font-bold">{(activityTracking.totals.indicator_partial || 0) + (activityTracking.totals.indicator_not_attended || 0)}</div></div>
                                    <div className="bg-white/80 border border-purple-100 rounded-md px-3 py-2"><div className="font-bold text-xs text-purple-800">Competências ND/NA</div><div className="text-lg font-bold">{(activityTracking.totals.competence_not_developed || 0) + (activityTracking.totals.competence_not_attended || 0)}</div></div>
                                </div>
                                <div className="text-xs"><strong>Alunos com pontos de atenção:</strong> {activityAttentionStudents.slice(0, 12).map(student => `${student.name} (${getActivityAttentionCount(student)})`).join("; ")}{activityAttentionStudents.length > 12 ? `; e mais ${activityAttentionStudents.length - 12}` : ""}</div>
                            </div>
                        )}
                        {classNotebookNotes.length > 0 && (
                            <div className="mb-6 bg-blue-50 border border-blue-200 border-l-4 border-l-senac-blue rounded-lg p-4 text-sm text-blue-900 shadow-sm">
                                <div className="flex flex-wrap items-center justify-between gap-2 mb-2"><div className="font-bold flex items-center gap-2"><IconBookOpen className="w-4 h-4" /> Anotações dos cadernos do instrutor</div><button onClick={() => setShowNotebookReport(true)} className="text-xs font-bold text-senac-blue hover:underline">Abrir relatório completo</button></div>
                                <div className="flex flex-wrap gap-2 mb-2"><span className="bg-white/80 border border-blue-100 rounded-md px-3 py-1 text-xs font-bold">Registros: {classNotebookNotes.length}</span><span className="bg-white/80 border border-orange-100 rounded-md px-3 py-1 text-xs font-bold text-orange-700">Tratativas em aberto: {classNotebookNotes.filter(note => ["open", "today"].includes(getNotebookTreatmentState(note))).length}</span><span className="bg-white/80 border border-red-100 rounded-md px-3 py-1 text-xs font-bold text-red-700">Vencidas: {classNotebookNotes.filter(note => getNotebookTreatmentState(note) === "overdue").length}</span></div>
                                <div className="text-xs"><strong>Últimos registros:</strong> {classNotebookNotes.slice(0, 8).map(note => `${note.scope === "class" ? "Turma toda" : note.studentName} (${getNotebookSituationLabel(note)})`).join("; ")}{classNotebookNotes.length > 8 ? `; e mais ${classNotebookNotes.length - 8}` : ""}</div>
                            </div>
                        )}
                        <div className="bg-white p-2 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-28 z-10">
                            <div className="flex gap-1 overflow-x-auto w-full md:w-auto px-1 items-center">
                                <button onClick={toggleSelectAll} className="mr-2 text-gray-400 hover:text-senac-blue">{reportSelection.length > 0 && reportSelection.length === filteredStudents.length ? <IconCheckSquare className="w-5 h-5" /> : <IconSquare className="w-5 h-5" />}</button>
                                
                                <div className="relative mr-2">
                                    <IconFilter className="w-3 h-3 absolute left-2 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none"/>
                                    <select 
                                        value={selectedUC} 
                                        onChange={(e) => setSelectedUC(e.target.value)}
                                        className="pl-7 pr-4 py-2 rounded-lg text-xs font-bold border border-gray-200 bg-gray-50 text-gray-700 hover:bg-white focus:ring-2 focus:ring-senac-blue cursor-pointer transition-all appearance-none"
                                        style={{backgroundImage: 'none'}}
                                    >
                                        <option value="all">Todas as UCs (Global)</option>
                                        {data.ucs.map(uc => <option key={uc} value={uc}>{uc}</option>)}
                                    </select>
                                </div>

                                <button onClick={() => setFilter('all')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${filter === 'all' ? 'bg-senac-blue text-white shadow-md' : 'text-gray-500 hover:bg-gray-50'}`}>Todos ({stats.total})</button>
                                <button onClick={() => setFilter('developed')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${filter === 'developed' ? 'bg-green-600 text-white shadow-md' : 'text-green-600 hover:bg-green-50'}`}>Desenvolveu ({stats.developed})</button>
                                <button onClick={() => setFilter('failed')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${filter === 'failed' ? 'bg-red-600 text-white shadow-md' : 'text-red-600 hover:bg-red-50'}`}>Recuperação ({stats.failed})</button>
                                <button onClick={() => setFilter('lowFreq')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${filter === 'lowFreq' ? 'bg-yellow-500 text-white shadow-md' : 'text-yellow-600 hover:bg-yellow-50'}`}>Conselho ({stats.warning})</button>
                                <button onClick={() => setFilter('process')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${filter === 'process' ? 'bg-purple-600 text-white shadow-md' : 'text-purple-600 hover:bg-purple-50'}`}>Em Processo ({stats.process})</button>
                                <button onClick={() => setFilter('dropout')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${filter === 'dropout' ? 'bg-orange-500 text-white shadow-md' : 'text-orange-500 hover:bg-orange-50'}`}>Evasão ({stats.dropout})</button>
                            </div>
                            <div className="relative w-full md:w-72 mr-2"><IconSearch className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4" /><input type="text" placeholder="Buscar aluno ou código Órion..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 rounded-lg bg-gray-50 border-none focus:ring-2 focus:ring-senac-blue text-sm transition-all" /></div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                            {filteredStudents.length === 0 ? (<div className="col-span-full py-16 text-center"><div className="inline-block p-4 rounded-full bg-gray-100 mb-4"><IconSearch className="w-8 h-8 text-gray-400"/></div><p className="text-gray-500 font-medium">Nenhum aluno encontrado.</p></div>) : (filteredStudents.map((student) => {
                                const isDropout = student.is_dropout;
                                const isProcess = student.is_process_dropout;
                                const dropoutDocumentRecord = dropoutDocuments[normalizeName(student.name)];
                                const dropoutDocumentMeta = getDropoutDocumentMeta(dropoutDocumentRecord);
                                const activitySummary = getActivityStudentSummary(activityTracking, student.name);
                                const naSummary = getNAStudentSummary(data, student.name, naJustifications);
                                const studentNotebookNotes = classNotebookNotes.filter(note => note.scope === "class" || Number(note.studentId) === Number(student.id) || (note.studentIds || []).includes(Number(student.id)));
                                
                                let displayFreq = student.averageFreq;
                                let ucStatus = null;
                                let ucData = null;
                                let isSpecificUCView = selectedUC !== 'all';

                                if (isSpecificUCView) {
                                    ucData = student.uc_scores[selectedUC];
                                    if (ucData) { displayFreq = (ucData.score * 100).toFixed(1); ucStatus = ucData.status; } else { displayFreq = "N/A"; }
                                }

                                const hasPerfIssues = student.needs_recuperacao && !isDropout && !isProcess;
                                const hasFreqIssues = student.needs_conselho && !isDropout && !isProcess && !hasPerfIssues;
                                
                                let borderColor = "border-gray-100";
                                let statusBadge = null;

                                if (isDropout) { borderColor = "border-l-4 border-l-orange-500"; statusBadge = <span className="px-2 py-1 bg-orange-100 text-orange-700 text-[10px] font-bold rounded uppercase flex items-center gap-1"><IconLogOut className="w-3 h-3"/> {student.dropout_reason || "Evasão"}</span>; } 
                                else if (isProcess) { borderColor = "border-l-4 border-l-purple-500"; statusBadge = <span className="px-2 py-1 bg-purple-100 text-purple-700 text-[10px] font-bold rounded uppercase flex items-center gap-1"><IconClock className="w-3 h-3"/> Em Processo</span>; } 
                                else if (isSpecificUCView) {
                                    if (!ucData) { borderColor = "border-l-4 border-l-slate-300"; statusBadge = <span className="px-2 py-1 bg-slate-100 text-slate-500 text-[10px] font-bold rounded uppercase">Sem dados na {selectedUC}</span>; }
                                    else if (isNotDevelopedStatus(ucStatus)) { borderColor = "border-l-4 border-l-red-500"; statusBadge = <span className="px-2 py-1 bg-red-100 text-red-700 text-[10px] font-bold rounded uppercase">Reprovado na {selectedUC}</span>; }
                                    else if (parseFloat(displayFreq) < 75) { borderColor = "border-l-4 border-l-yellow-400"; statusBadge = <span className="px-2 py-1 bg-yellow-100 text-yellow-700 text-[10px] font-bold rounded uppercase">Baixa Freq na {selectedUC}</span>; }
                                    else { borderColor = "border-l-4 border-l-green-500"; statusBadge = <span className="px-2 py-1 bg-green-100 text-green-700 text-[10px] font-bold rounded uppercase">OK na {selectedUC}</span>; }
                                }
                                else if (hasPerfIssues) { borderColor = "border-l-4 border-l-red-500"; statusBadge = <span className="px-2 py-1 bg-red-100 text-red-700 text-[10px] font-bold rounded uppercase">Reprovado</span>; } 
                                else if (hasFreqIssues) { borderColor = "border-l-4 border-l-yellow-400"; statusBadge = <span className="px-2 py-1 bg-yellow-100 text-yellow-700 text-[10px] font-bold rounded uppercase">Conselho</span>; } 
                                else { borderColor = "border-l-4 border-l-green-500"; statusBadge = <span className="px-2 py-1 bg-green-100 text-green-700 text-[10px] font-bold rounded uppercase">Desenvolveu</span>; }
                                
                                const isSelected = reportSelection.includes(student.id);
                                
                                return (
                                    <div key={student.id} className={`bg-white rounded-xl shadow-sm border ${borderColor} hover:shadow-md relative group ${isDropout ? 'bg-orange-50/30' : isProcess ? 'bg-purple-50/30' : ''}`}>
                                        <div className="absolute top-4 left-3 z-10" onClick={(e) => e.stopPropagation()}><input type="checkbox" checked={isSelected} onChange={() => toggleStudentSelection(student.id)} className="w-5 h-5 rounded border-gray-300 text-senac-blue focus:ring-senac-blue cursor-pointer" /></div>
                                        <div className="p-5 pl-10 cursor-pointer" onClick={() => setSelectedStudentForModal(student)}>
                                            <div className="flex justify-between items-start mb-3 gap-2"><div><h3 className="font-bold text-gray-800 text-sm leading-snug">{student.name}</h3>{student.orionCode && <div className="mt-1 text-[10px] font-bold text-senac-blue">Órion: {student.orionCode}</div>}</div><div className="flex items-center gap-2">{studentNotebookNotes.length > 0 && (<div className="text-senac-orange" title={`Há ${studentNotebookNotes.length} anotação(ões) no caderno`}><IconBookOpen className="w-4 h-4" /></div>)}<div className="flex-shrink-0">{statusBadge}</div></div></div>
                                            <div className="flex justify-between items-end mb-1"><span className="text-xs text-gray-400 font-medium uppercase tracking-wider">{selectedUC === 'all' ? 'Frequência Global' : `Frequência ${selectedUC}`}</span><span className={`text-lg font-bold ${displayFreq !== "N/A" && parseFloat(displayFreq) < 75 ? 'text-yellow-600' : 'text-gray-700'}`}>{displayFreq}%</span></div>
                                            <ProgressBar value={displayFreq === "N/A" ? 0 : displayFreq} />
                                            {activitySummary && activitySummary.total > 0 && (
                                                <div className={`mt-3 pt-2 border-t flex flex-wrap gap-1.5 text-[10px] font-bold ${getActivityAttentionCount(activitySummary) > 0 ? 'border-red-100' : 'border-green-100'}`}>
                                                    <span className="bg-green-100 text-green-700 px-2 py-1 rounded">Atividades C {activitySummary.completed}</span>
                                                    {activitySummary.not_completed > 0 && <span className="bg-red-100 text-red-700 px-2 py-1 rounded">NC {activitySummary.not_completed}</span>}
                                                    {activitySummary.blank > 0 && <span className="bg-gray-100 text-gray-700 px-2 py-1 rounded">Em branco {activitySummary.blank}</span>}
                                                    {activitySummary.requires_evaluation > 0 && <span className="bg-yellow-100 text-yellow-700 px-2 py-1 rounded">Avaliar {activitySummary.requires_evaluation}</span>}
                                                    {activitySummary.activity_not_attended > 0 && <span className="bg-red-100 text-red-700 px-2 py-1 rounded">NA {activitySummary.activity_not_attended}</span>}
                                                    {(activitySummary.indicator_attended || activitySummary.indicator_partial || activitySummary.indicator_not_attended) > 0 && <span className="bg-blue-100 text-blue-700 px-2 py-1 rounded">Indicadores A {activitySummary.indicator_attended || 0} / PA {activitySummary.indicator_partial || 0} / NA {activitySummary.indicator_not_attended || 0}</span>}
                                                    {(activitySummary.competence_developed || activitySummary.competence_not_developed || activitySummary.competence_attended || activitySummary.competence_not_attended) > 0 && <span className="bg-purple-100 text-purple-700 px-2 py-1 rounded">Competência D {activitySummary.competence_developed || 0} / ND {activitySummary.competence_not_developed || 0}</span>}
                                                    {getActivityAttentionCount(activitySummary) === 0 && <span className="bg-green-50 text-green-700 px-2 py-1 rounded">Tudo avaliado</span>}
                                                </div>
                                            )}
                                            {naSummary && naSummary.count >= 2 && (
                                                <div className="mt-2 pt-2 border-t border-red-100 flex items-center justify-between gap-2 text-[10px] font-bold">
                                                    <span className="bg-red-100 text-red-700 px-2 py-1 rounded">NA em atenção: {naSummary.count}</span>
                                                    <span className="text-red-600">Abrir para justificar</span>
                                                </div>
                                            )}
                                            {studentNotebookNotes.length > 0 && <div className="mt-2 pt-2 border-t border-orange-100 flex items-center justify-between gap-2 text-[10px] font-bold"><span className="bg-orange-100 text-orange-700 px-2 py-1 rounded">Caderno: {studentNotebookNotes.length} registro(s)</span><span className="text-orange-700">Abrir quadro</span></div>}
                                            {(isProcess || dropoutDocumentRecord) && <div className="mt-2 flex items-center justify-between gap-2 border-t border-purple-100 pt-2 text-[10px] font-bold"><span className={`rounded border px-2 py-1 ${dropoutDocumentMeta.className}`}>{dropoutDocumentMeta.label}</span><span className="text-purple-700">Acompanhar documentos</span></div>}
                                            <div className="flex items-center gap-2 text-[11px] text-gray-500 mt-3 pt-2 border-t border-gray-50"><IconCalendar className="w-3 h-3 text-gray-400" /><span>Contra Turno: <span className={`font-semibold ${student.contra_turno_desc !== "Sem Contra Turno" ? 'text-senac-blue' : 'text-gray-400'}`}>{student.contra_turno_desc}</span></span></div>
                                            {(student.studentEmail || student.studentPhone || student.supervisorEmail || student.supervisorPhone) && <div className="mt-2 pt-2 border-t border-blue-50 text-[10px] text-gray-500 space-y-1"><div className="flex items-center gap-1"><IconMail className="w-3 h-3 text-senac-blue"/><span className="min-w-0 flex-1 truncate">Aluno: {student.studentEmail || student.studentPhone || 'Contato não informado'}</span>{getWhatsAppUrl(student.studentPhone) && <a href={getWhatsAppUrl(student.studentPhone)} target="_blank" rel="noopener noreferrer" onClick={event => event.stopPropagation()} title="WhatsApp do aluno" className="rounded bg-green-600 p-1 text-white"><IconPhone className="h-3 w-3" /></a>}</div><div className="flex items-center gap-1"><IconUser className="w-3 h-3 text-senac-orange"/><span className="min-w-0 flex-1 truncate">Supervisor: {student.supervisorName || student.supervisorEmail || student.supervisorPhone || 'Contato não informado'}</span>{getWhatsAppUrl(student.supervisorPhone) && <a href={getWhatsAppUrl(student.supervisorPhone)} target="_blank" rel="noopener noreferrer" onClick={event => event.stopPropagation()} title="WhatsApp do supervisor" className="rounded bg-green-600 p-1 text-white"><IconPhone className="h-3 w-3" /></a>}</div></div>}
                                        </div>
                                    </div>
                                );
                            }))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<><DashboardErrorBoundary><AuthGate /></DashboardErrorBoundary><DesktopAppOffer /></>);
    </script>
    <script src="./senac-inho.js?v=1.6.5"></script>
</body>
</html>
