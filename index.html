        // --- FUNÇÃO AUXILIAR: DETECÇÃO DE COR LARANJA ---
        const isOrangeFont = (hex) => {
            if (!hex || typeof hex !== 'string') return false;
            let cleanHex = hex.replace('#', '').toUpperCase();
            if (cleanHex.length === 8) cleanHex = cleanHex.substring(2); 
            if (cleanHex.length !== 6) return false;

            const knownOranges = ['ED7D31', 'F4B084', 'C65911', '833C0C', 'FFC000', 'FFA500', 'FF9900', 'FF6600', 'E26B0A', 'F8CBAD'];
            if (knownOranges.includes(cleanHex)) return true;

            const r = parseInt(cleanHex.substring(0, 2), 16);
            const g = parseInt(cleanHex.substring(2, 4), 16);
            const b = parseInt(cleanHex.substring(4, 6), 16);

            if (r < 130) return false; 
            if (b > 150 && b > r * 0.8) return false; 
            const greenRatio = g / r;
            if (greenRatio < 0.20) return false; 
            if (greenRatio > 0.85) return false; 
            return true;
        };

        const getCellColorHex = (color) => {
            if (!color) return "";
            if (typeof color === "string") return color;
            return color.rgb || color.argb || color.hex || "";
        };

        const isOrangeColorValue = (color) => {
            let cleanHex = String(color || "").replace(/^#/, "").toUpperCase();
            if (cleanHex.length === 8) cleanHex = cleanHex.substring(2);
            if (cleanHex.length !== 6) return false;
            const red = parseInt(cleanHex.substring(0, 2), 16) / 255;
            const green = parseInt(cleanHex.substring(2, 4), 16) / 255;
            const blue = parseInt(cleanHex.substring(4, 6), 16) / 255;
            const max = Math.max(red, green, blue);
            const min = Math.min(red, green, blue);
            const delta = max - min;
            const normalizedHex = cleanHex;
            const knownOrangeFills = ["ED7D31", "F4B084", "C65911", "833C0C", "FFC000", "FFA500", "FF9900", "FF6600", "E26B0A", "F8CBAD"];
            if (knownOrangeFills.includes(normalizedHex)) return true;
            if (delta === 0 || max < 0.35 || delta / max < 0.35) return false;
            let hue = 0;
            if (max === red) hue = 60 * (((green - blue) / delta) % 6);
            else if (max === green) hue = 60 * ((blue - red) / delta + 2);
            else hue = 60 * ((red - green) / delta + 4);
            if (hue < 0) hue += 360;
            return hue >= 15 && hue <= 55;
        };

        const isOrangeFillCell = (cell) => {
            const colors = [
                cell && cell.s && cell.s.fgColor,
                cell && cell.s && cell.s.bgColor
            ].filter(Boolean);
            return colors.map(getCellColorHex).some(isOrangeColorValue);
        };

        const isOrangeFontCell = (cell) => {
            const color = cell && cell.s && cell.s.font ? getCellColorHex(cell.s.font.color) : "";
            return isOrangeFont(color) || isOrangeColorValue(color);
        };

        const isOrangeRowFill = (sheet, rowIndex, nameColIdx) => {
            if (!sheet || !sheet['!ref']) return false;
            try {
                const range = XLSX.utils.decode_range(sheet['!ref']);
                const maxCols = Math.min(range.e.c + 1, 180);
                // A cor laranja nas colunas de atividades indica uma situação
                // daquela atividade, não a situação cadastral do aluno.
                const keyColumns = [...new Set([0, 1, 2, 3, 4, nameColIdx].filter(col => col >= 0 && col < maxCols))];
                const keyOrangeCount = keyColumns.filter(col => isOrangeFillCell(sheet[XLSX.utils.encode_cell({ r: rowIndex, c: col })])).length;
                if (nameColIdx >= 0 && isOrangeFillCell(sheet[XLSX.utils.encode_cell({ r: rowIndex, c: nameColIdx })])) return true;
                return keyOrangeCount >= 2;
            } catch (error) {
                return false;
            }
        };

        // A situação cadastral depende somente da célula do nome (e, na aba
        // pedagógica, de uma linha inteira claramente marcada). Cores nas
        // colunas de atividades não devem alterar a situação do aluno.
        const applyOrangeStudentSituation = ({ student, cell, row, sheetName, isPedagogicalSheet, sheet, rowIndex, nameColIdx }) => {
            if (!student) return;
            const nameHasOrangeFont = isOrangeFontCell(cell);
            const nameHasOrangeFill = isOrangeFillCell(cell);
            const dropoutKeyword = Boolean(hasDropoutKeywordInRow(row));
            const pedagogicalRowFill = Boolean(isPedagogicalSheet && isOrangeRowFill(sheet, rowIndex, nameColIdx));

            if (nameHasOrangeFill || dropoutKeyword || pedagogicalRowFill) {
                student.is_dropout = true;
                student.is_process_dropout = false;
                student.status = "Evadido/Desligado";
                student.dropout_reason = dropoutKeyword
                    ? `Situação evadido, desistente ou desligado identificada na aba ${sheetName}`
                    : nameHasOrangeFill
                        ? `Celula do nome preenchida em laranja na aba ${sheetName}`
                        : `Linha pedagógica identificada em laranja na aba ${sheetName}`;
                return;
            }

            if (nameHasOrangeFont && !student.is_dropout) {
                student.is_process_dropout = true;
                student.status = "Em Processo de Desligamento";
                student.dropout_reason = `Nome com fonte laranja na aba ${sheetName}`;
            }
        };

        const DonutChart = ({ data, size = 120 }) => {
            const total = data.reduce((acc, curr) => acc + curr.value, 0);
            let cumulativeAngle = 0;
            if (total === 0) return <div className="text-xs text-gray-400">Sem dados</div>;
            return (
                <div className="relative flex items-center justify-center" style={{ width: size, height: size }}>
                    <svg viewBox="0 0 100 100" className="transform -rotate-90 w-full h-full">
                        {data.map((slice, i) => {
                            if (slice.value === 0) return null;
                            const percentage = slice.value / total;
                            const angle = percentage * 360;
                            const x1 = 50 + 40 * Math.cos(Math.PI * cumulativeAngle / 180);
                            const y1 = 50 + 40 * Math.sin(Math.PI * cumulativeAngle / 180);
                            const x2 = 50 + 40 * Math.cos(Math.PI * (cumulativeAngle + angle) / 180);
                            const y2 = 50 + 40 * Math.sin(Math.PI * (cumulativeAngle + angle) / 180);
                            const d = total === slice.value 
                                ? "M 50 10 a 40 40 0 1 0 0.0001 0" 
                                : `M 50 50 L ${x1} ${y1} A 40 40 0 ${angle > 180 ? 1 : 0} 1 ${x2} ${y2} Z`;
                            const path = <path key={i} d={d} fill={slice.color} stroke="white" strokeWidth="2" />;
                            cumulativeAngle += angle;
                            return path;
                        })}

        // --- COMPONENTES AUXILIARES ---
        const SignatureCanvas = ({ onSave, onCancel }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#000000';
                
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * 2;
                canvas.height = rect.height * 2;
                ctx.scale(2, 2);
            }, []);

            const getPos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const startDrawing = (e) => {
                setIsDrawing(true);
                const pos = getPos(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDrawing = () => setIsDrawing(false);

            const handleClear = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath();
            };

        const SignatureUploader = ({ label, name, cpf, matricula, rubricaSrc, onChangeName, onChangeCPF, onChangeMatricula, onSetRubrica }) => {
            const [showCanvas, setShowCanvas] = useState(false);
            const [isProcessing, setIsProcessing] = useState(false);

            const processImage = (fileOrDataUrl) => {
                setIsProcessing(true);
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    const imageData = ctx.getImageData(0, 0, width, height);
                    const data = imageData.data;
                    let minX = width, minY = height, maxX = 0, maxY = 0;
                    let found = false;
                    for (let y = 0; y < height; y++) {
                        for (let x = 0; x < width; x++) {
                            const i = (y * width + x) * 4;
                            const r = data[i], g = data[i+1], b = data[i+2];
                            if (r < 240 || g < 240 || b < 240) {
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                                if (y < minY) minY = y;
                                if (y > maxY) maxY = y;
                                found = true;
                            }
                        }
                    }
                    if (found) {
                        const padding = 10;
                        minX = Math.max(0, minX - padding);
                        minY = Math.max(0, minY - padding);
                        maxX = Math.min(width, maxX + padding);
                        maxY = Math.min(height, maxY + padding);
                        const cropWidth = maxX - minX;
                        const cropHeight = maxY - minY;
                        const cutCanvas = document.createElement('canvas');
                        cutCanvas.width = cropWidth;
                        cutCanvas.height = cropHeight;
                        const cutCtx = cutCanvas.getContext('2d');
                        cutCtx.drawImage(canvas, minX, minY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
                        const cutImageData = cutCtx.getImageData(0, 0, cropWidth, cropHeight);
                        const cutData = cutImageData.data;
                        for (let i = 0; i < cutData.length; i += 4) {
                            const r = cutData[i], g = cutData[i + 1], b = cutData[i + 2];
                            if (r > 200 && g > 200 && b > 200) { cutData[i + 3] = 0; }
                        }
                        cutCtx.putImageData(cutImageData, 0, 0);
                        onSetRubrica(cutCanvas.toDataURL());
                    } else {
                        onSetRubrica(canvas.toDataURL());
                    }
                    setIsProcessing(false);
                };
                if (typeof fileOrDataUrl === 'string') { img.src = fileOrDataUrl; } else { const reader = new FileReader(); reader.onload = (e) => { img.src = e.target.result; }; reader.readAsDataURL(fileOrDataUrl); }
            };

            const handleFile = (e) => { if(e.target.files[0]) processImage(e.target.files[0]); };

                            <label className="cursor-pointer text-[10px] bg-gray-50 text-gray-600 px-2 py-0.5 rounded hover:bg-gray-100 flex items-center gap-1 border border-gray-200" title="Upload Foto"><IconUploadCloud className="w-3 h-3"/> Foto<input type="file" className="hidden" accept="image/*" onChange={handleFile} /></label>
                        </div>
                    </div>
                    <input type="text" value={name} onChange={(e) => onChangeName(e.target.value)} placeholder="Nome Completo (Editável)" className="w-full px-2 py-1.5 rounded border mb-2 text-xs bg-gray-50 focus:bg-white transition-colors" />

                            <button onClick={() => onSetRubrica(null)} className="text-red-400 hover:text-red-600 p-1"><IconTrash2 className="w-3 h-3"/></button>

        const inferAnalystPDI = (followupType, subject, notes) => {
            const normalizedType = normalizeText(followupType);
            const normalizedSubject = normalizeText(subject);
            const normalizedNotes = normalizeText(notes);
            const rankedCompetencies = PDI_COMPETENCY_KEYWORDS.map(rule => ({
                ...rule,
                weight: rule.keywords.reduce((total, keyword) => total
                    + (normalizedSubject.includes(keyword) ? 4 : 0)
                    + (normalizedNotes.includes(keyword) ? 2 : 0)
                    + (normalizedType.includes(keyword) ? 1 : 0), 0)
            })).sort((a, b) => b.weight - a.weight);
            const competencyRule = rankedCompetencies[0] && rankedCompetencies[0].weight > 0 ? rankedCompetencies[0] : null;
            const text = `${normalizedType} ${normalizedSubject} ${normalizedNotes}`;
            let score = null;
            if (/NAO ATENDE|CRITICO|GRAVE/.test(text)) score = 25;
            else if (/PARCIAL|DIFICULDADE|PONTO DE ATENCAO|PLANO DE ACAO/.test(text)) score = 50;
            else if (/EXCELENCIA|EXCELENTE|DESTAQUE|ELOGIO/.test(text)) score = 100;
            else if (normalizeText(followupType) === "AVALIACAO" || /ATENDE|ADEQUADO/.test(text)) score = 75;
            const defaultCompetency = ANALYST_TYPE_COMPETENCY_DEFAULTS[normalizedType] || "";
            return { competency: competencyRule ? competencyRule.id : defaultCompetency, score };

        ];

        const cleanNotebookKey = (value, fallback) => {
            const cleaned = String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]/g, "");
            return cleaned || fallback;
        };

        const getCurrentAuthenticatedEmail = () => {

                return String((configuredUser && configuredUser.email) || (firebaseUser && firebaseUser.email) || "").trim().toLowerCase();
            } catch (error) {
                return "";
            }
        };

        const normalizeInstructorIdentity = (value) => normalizeName(String(value || "")
            .replace(/\([^)]*\)/g, " ")
            .replace(/\bUC\s*\d+\b/gi, " ")
            .replace(/\b(?:TUTOR(?:A)?|INSTRUTOR(?:A)?|DOCENTE)\b/gi, " ")
            .replace(/[._-]+/g, " "));

        const canonicalizeInstructorName = (value) => {
            const raw = String(value || "").trim();
            if (normalizeInstructorIdentity(raw) === "BRUNA") return "Bruna Lorena";
            return raw;
        };

        const expandInstructorNames = value => {
            const raw = String(value || "").trim();
            if (!raw) return [];
            return [...new Set(raw
                .replace(/\([^)]*(?:FERIAS|FÉRIAS)[^)]*\)/gi, " ")
                .split(/\s*(?:\/|;|\||\s+E\s+)\s*/i)
                .map(name => canonicalizeInstructorName(name.trim()))
                .filter(isValidInstructorName))];
        };

        const isValidInstructorName = (value) => {
            const raw = String(value || "").trim();
            const normalized = normalizeName(raw.replace(/:$/, ""));
            if (!normalized || normalized.length < 3 || /^\d+$/.test(normalized)) return false;
            const invalidLabels = ["PERIODO", "SELECIONE", "DATA", "TIPO", "ASSUNTO", "COMPETENCIA", "AVALIACAO", "HORARIO", "CURSO", "TURMA", "INSTRUTOR", "INSTRUTORA", "TUTOR", "TUTORA", "DOCENTE", "APRENDIZES", "ALUNOS"];
            return !invalidLabels.some(label => normalized === label || normalized.startsWith(`${label} `));
        };

        const getAnalystProfileForUser = user => {
            const identity = normalizeName(`${String(user && user.email || "").split("@")[0]} ${user && user.displayName || ""}`);
            if (!identity) return "";
            return ANALYST_PROFILES.find(item => item.tokens.every(token => identity.includes(token))) || null;
        };

        const getAnalystDisplayName = (user, profile = getAnalystProfileForUser(user)) => {
            if (!profile) return "";
            const displayName = String(user && user.displayName || "").trim();
            if (displayName.split(/\s+/).length >= 2) return displayName;
            const localName = String(user && user.email || "").split("@")[0].split(/[._-]+/).filter(Boolean).map(part => part.charAt(0).toUpperCase() + part.slice(1).toLowerCase()).join(" ");

        const getLegacyInstructorNames = (value) => normalizeInstructorIdentity(canonicalizeInstructorName(value)) === "BRUNA LORENA"

            if (normalized === "BRUNA" || normalized === "BRUNA CUNHA") return "Bruna Cunha";
            if (normalized === "MICHEL" || normalized === "MICHEL FARIAS") return "Michel";
            if (normalized.startsWith("MARIANA")) return "Mariana";
            if (normalized.startsWith("BIANCA")) return "Bianca";
            return raw;
        };

        const getInstructorIdentityTokens = (value) => normalizeInstructorIdentity(value)
            .split(/\s+/)
            .filter(token => token.length > 1 && !["DA", "DE", "DO", "DAS", "DOS", "E"].includes(token));

        const getInstructorDisplayNameFromEmail = (email) => {
            const localPart = String(email || "").trim().toLowerCase().split("@")[0];
            const tokens = localPart
                .replace(/[._-]+/g, " ")
                .split(/\s+/)
                .map(token => token.trim())
                .filter(token => token.length > 1 && !/^\d+$/.test(token));
            if (tokens.length === 0) return "";
            return tokens.map(token => token.charAt(0).toUpperCase() + token.slice(1)).join(" ");
        };

        const instructorNameMatchesAccount = (instructorName, email) => {
            const accountEmail = String(email || "").trim().toLowerCase();
            if (!instructorName || !accountEmail || !accountEmail.includes("@")) return false;
            const localTokens = getInstructorIdentityTokens(accountEmail.split("@")[0]);
            const displayTokens = getInstructorIdentityTokens(window.SENAC_CURRENT_USER && window.SENAC_CURRENT_USER.displayName);
            const candidateTokens = getInstructorIdentityTokens(canonicalizeInstructorName(instructorName));
            if (candidateTokens.length === 0 || candidateTokens.join(" ") === "NAO IDENTIFICADO") return false;

            const containsAll = (small, large) => small.length > 0 && small.every(token => large.includes(token));
            if (displayTokens.length > 0 && (containsAll(candidateTokens, displayTokens) || containsAll(displayTokens, candidateTokens))) return true;
            if (containsAll(candidateTokens, localTokens) || containsAll(localTokens, candidateTokens)) return true;
            if (candidateTokens.length === 1 && candidateTokens[0].length >= 4 && localTokens.some(token => token.includes(candidateTokens[0]) || candidateTokens[0].includes(token))) return true;
            if (localTokens.length === 1 && localTokens[0].length >= 4 && candidateTokens.some(token => token.includes(localTokens[0]) || localTokens[0].includes(token))) return true;
            return false;

            const day = String(parsed.getDate()).padStart(2, "0");

        const STUDENT_CONTACT_STORAGE_PREFIX = "student_contacts_v1_";

        });

        const readStudentContactsLocal = (turma) => {

        const writeStudentContactsLocal = (turma, contacts) => {

        const DROPOUT_DOCUMENT_STORAGE_PREFIX = "dropout_documents_v1_";

        const makeDropoutDocumentDocId = (turma, studentKey) => `dropout_${cleanNotebookKey(turma, "TURMA_DESCONHECIDA")}_${cleanNotebookKey(studentKey, "ALUNO")}`;
