                const cellPosition = XLSX.utils.decode_cell(cellAddress);
                return conditionalRanges.some(range => {
                    const decodedRange = XLSX.utils.decode_range(range.replace(/\$/g, ""));
                    return cellPosition.r >= decodedRange.s.r && cellPosition.r <= decodedRange.e.r && cellPosition.c >= decodedRange.s.c && cellPosition.c <= decodedRange.e.c;
                });
            } catch (error) {
                return false;
            }
        };

        const isNonDataAttendanceHeader = (value) => {
            const text = normalizeText(value).replace(/[º°]/g, "").trim();
            return text === "N" || text === "NO" || text === "NUMERO" || text.includes("ORION") || text.includes("COLUNA PARA ORDENAR") || text.includes("HORARIO CURSO");
        };

        const findAttendanceHeader = (rows) => {
            for (let r = 0; r < Math.min(rows.length, 25); r++) {
                const row = rows[r] || [];
                let nameCol = -1;
                const dateCols = [];
                const ignoredCols = new Set();

                row.forEach((cell, c) => {
                    const label = stripAccents(cell).toUpperCase();
                    if (isNonDataAttendanceHeader(cell)) ignoredCols.add(c);
                    if (nameCol === -1 && (label.includes("APREND") || label.includes("ALUNO") || label.includes("NOME"))) nameCol = c;
                    const date = parseAttendanceDate(cell);
                    if (date && !ignoredCols.has(c)) dateCols.push({ idx: c, date });
                });

                if (nameCol !== -1 && dateCols.length > 0) return { rowIdx: r, nameCol, dateCols, ignoredCols };
            }
            return null;
        };

        const toDashboardDate = (value) => {
            if (value instanceof Date) return Number.isNaN(value.getTime()) ? null : value;
            if (value && typeof value.toDate === "function") {
                const converted = value.toDate();
                return converted instanceof Date && !Number.isNaN(converted.getTime()) ? converted : null;
            }
            if (typeof value !== "string" && typeof value !== "number") return null;
            const converted = new Date(value);
            return Number.isNaN(converted.getTime()) ? null : converted;
        };

        const formatShortDate = (value) => {
            const date = toDashboardDate(value);
            if (!date) return String(value || "--/--");
            return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', timeZone: 'America/Sao_Paulo' });
        };

        const formatAttendanceWarning = (item) => {
            const status = item.type === "nao_realizada" ? "chamada não realizada" : "chamada incompleta";
            const saturdayLabel = item.scope === "contraturno" ? " (sábado/contraturno)" : "";
            const audience = item.scope === "contraturno" ? (item.total === 1 ? "aluno com contraturno" : "alunos com contraturno") : "alunos";
            const completion = item.total === 1 ? "preenchido" : "preenchidos";
            const pendingNames = item.scope === "contraturno" && Array.isArray(item.pendingStudents) && item.pendingStudents.length > 0
                ? `; ${item.pendingStudents.length === 1 ? "pendente" : "pendentes"}: ${item.pendingStudents.join(", ")}`
                : "";
            return `${formatShortDate(item.date)}${saturdayLabel}: ${status} — ${item.filled} de ${item.total} ${audience} ${completion}${pendingNames}`;
        };

        const summarizeAttendanceWarnings = (warnings, maxItems = 18) => {
            if (!warnings || warnings.length === 0) return "";
            const grouped = warnings.reduce((acc, item) => {
                if (!acc[item.sheet]) acc[item.sheet] = [];
                acc[item.sheet].push(item);
                return acc;
            }, {});

            const lines = Object.entries(grouped).map(([sheet, items]) => {
                const dates = items.slice(0, 6).map(formatAttendanceWarning).join("; ");
                const extra = items.length > 6 ? ` e mais ${items.length - 6}` : "";
                return `${sheet}: ${dates}${extra}`;
            });

            const visible = lines.slice(0, maxItems);
            const hidden = lines.length - visible.length;
            return `Foram encontradas possíveis pendências de chamada:\n\n${visible.join("\n")}${hidden > 0 ? `\n... e mais ${hidden} aba(s).` : ""}`;
        };

        const getActivityColumnKind = (label) => {
            const text = normalizeText(label);
            if (!text) return null;
            if (/\bIND\s*\d+\b/.test(text) || text.includes("INDICADOR DE COMPETENCIA")) return "indicator";
            if (text.includes("MENCAO POR UNIDADE CURRICULAR") || text.includes("DESENVOLVIMENTO DA COMPETENCIA") || (/^UC\s*\d+\b/.test(text) && text.includes("COMPETENCIA"))) return "competence";
            if (/\[\s*S\d+(?:D\d+)?(?:\s+(?:PORTFOLIO|POSTAGEM))?\s*\]/.test(text)) return "activity";
            if (/\b\d{1,2}[\/.-]\d{1,2}(?:[\/.-]\d{2,4})?\b/.test(text)) return "activity";
            if (["DATA", "DIA", "SEMANA", "ATIV", "TAREFA", "ENCONTRO", "AULA", "POSTAGEM", "PORTFOLIO", "UC"].some(keyword => text.includes(keyword))) return "activity";
            return null;
        };

        const inferActivityUC = (value) => {
            const match = normalizeText(value).match(/\bUC\s*(\d{1,2})\b/);

        };

        const getActivityCellStatus = (value, kind = "activity") => {
            const text = normalizeText(value);

            if (kind === "indicator") {
                if (text === "NA" || text === "N/A") return "indicator_not_attended";
                if (text === "PA") return "indicator_partial";
                if (text === "A") return "indicator_attended";
            }
            if (kind === "competence") {
                if (text === "ND") return "competence_not_developed";
                if (text === "D") return "competence_developed";
                if (text === "NA" || text === "N/A") return "competence_not_attended";
                if (text === "A") return "competence_attended";
            }
            if (text === "NA" || text === "N/A") return "activity_not_attended";
            if (text === "C" || text === "CONCLUIU" || text.startsWith("C -") || text.startsWith("C (") || text.includes("CONCLUIU A ATIVIDADE")) return "completed";
            if (text === "NC" || text.includes("NAO CONCLUIU")) return "not_completed";
            if (text.includes("REQUER") && text.includes("AVALI")) return "requires_evaluation";
            return null;
        };

        const formatActivityHeaderValue = (value) => {
            if (value instanceof Date && !isNaN(value.getTime())) return value.toLocaleDateString("pt-BR");
            if (typeof value === "number" && value > 20000 && value < 60000 && window.XLSX && XLSX.SSF && XLSX.SSF.parse_date_code) {
                const parsed = XLSX.SSF.parse_date_code(value);
                if (parsed && parsed.d && parsed.m && parsed.y) return `${String(parsed.d).padStart(2, "0")}/${String(parsed.m).padStart(2, "0")}/${parsed.y}`;
            }
            return String(value || "").trim();

        const formatActivityScheduleLabel = (value) => String(value || "")
            .replace(/\bS\s*(\d+)\s*D\s*(\d+)\b/gi, "Semana $1, Dia $2");

        const simplifyActivityHeaderLabel = (label) => formatActivityScheduleLabel(String(label || "")
            .replace(/\s*\|\s*\d+\s*$/, "")
            .replace(/\s*\[\s*TOTAL DE PONTOS:[^\]]*\]/gi, "")
            .replace(/\s+/g, " ")
            .trim());

        const findActivityHeader = (rows) => {
            for (let rowIdx = 0; rowIdx < Math.min(rows.length, 80); rowIdx++) {
                const row = rows[rowIdx] || [];
                const nameCols = [];
                let surnameCol = -1;
                row.forEach((cell, colIdx) => {
                    const text = normalizeText(cell);
                    if (text === "SOBRENOME" || text === "ULTIMO SOBRENOME") surnameCol = colIdx;
                    if (text === "NOME" || text === "ALUNO" || text === "APRENDIZ" || text.includes("NOME COMPLETO") || text.includes("NOME DO ALUNO") || text.includes("NOME DO APRENDIZ")) nameCols.push(colIdx);
                });
                if (nameCols.length > 0) {

                    return { rowIdx, nameCol: nameCols[0], nameCols: allNameCols, surnameCol };

        };

        const buildActivityHeaderLabel = (rows, header, colIdx) => {

            const start = Math.max(0, header.rowIdx - 4);
            for (let rowIdx = start; rowIdx <= header.rowIdx; rowIdx++) {
                const value = formatActivityHeaderValue((rows[rowIdx] || [])[colIdx]);

            return values.join(" | ") || `Atividade ${colIdx + 1}`;

        const isActivityHeaderLabel = (label) => getActivityColumnKind(label) !== null;

        const formatActivityColumnLabel = (label, kind) => {
            const cleanLabel = simplifyActivityHeaderLabel(label);
            const indicator = cleanLabel.match(/^UC\s*(\d+)\s*-\s*IND\s*(\d+)/i);
            if (kind === "indicator" && indicator) return `UC${Number(indicator[1])} - Indicador ${Number(indicator[2])}`;
            const competence = cleanLabel.match(/^UC\s*(\d+)/i);

        const processActivityWorkbook = (arrayBuffer, students, sourceName = "") => {
            const XLSX = window.XLSX;

            const workbook = XLSX.read(arrayBuffer, { type: "array", cellDates: true, sheetStubs: true, raw: true });
            const knownStudents = new Map((students || []).map(student => [normalizeName(student.name), student.name]));
            const activityStudents = {};
            const sheets = [];
            const totals = { completed: 0, not_completed: 0, blank: 0, requires_evaluation: 0, activity_not_attended: 0, indicator_not_attended: 0, indicator_partial: 0, indicator_attended: 0, competence_not_developed: 0, competence_developed: 0, competence_not_attended: 0, competence_attended: 0, activities: 0 };

            const workbookUCs = [];

                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "", raw: true });

            });
            const workbookDefaultUC = workbookUCs.length === 1 ? workbookUCs[0] : "";

            const getStudentSummary = (normalizedName, displayName) => {
                if (!activityStudents[normalizedName]) activityStudents[normalizedName] = {
                    name: displayName,

                    competence_developed: 0,

                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "", raw: true });

                    const kind = getActivityColumnKind(sourceLabel);
                    const label = formatActivityColumnLabel(sourceLabel, kind);

                const sheetUC = inferActivityUC(sheetName) || explicitUCs.find(uc => activityColumns.some(column => column.kind === "competence" && inferActivityUC(column.sourceLabel) === uc)) || explicitUCs[0] || workbookDefaultUC;

                const sheetStudents = new Set();
                for (let rowIdx = header.rowIdx + 1; rowIdx < rows.length; rowIdx++) {
                    const row = rows[rowIdx] || [];
                    const rawName = (header.nameCols || [header.nameCol]).map(colIdx => String(row[colIdx] || "").trim()).filter(Boolean).join(" ");
                    const normalizedName = normalizeName(rawName);

        const getActivityStudentSummary = (tracking, studentName) => tracking && tracking.students ? tracking.students[normalizeName(studentName)] || null : null;

        const ACTIVITY_STATUS_LABELS = {

        const getActivityAttentionCount = (summary) => summary ? Array.from(ACTIVITY_ATTENTION_STATUSES).reduce((total, status) => total + Number(summary[status] || 0), 0) : 0;
        const isActivityAttentionStatus = (status) => ACTIVITY_ATTENTION_STATUSES.has(status);
        const formatActivityStatusLabel = (status) => ACTIVITY_STATUS_LABELS[status] || status;
        const formatActivitySummaryText = (summary) => {
            if (!summary) return "";
            const parts = [`Atividades: ${summary.completed || 0} C`, `${summary.not_completed || 0} NC`, `${summary.blank || 0} sem preenchimento`, `${summary.requires_evaluation || 0} requer avaliação`];
            const indicatorTotal = Number(summary.indicator_attended || 0) + Number(summary.indicator_partial || 0) + Number(summary.indicator_not_attended || 0);
            const competenceTotal = Number(summary.competence_developed || 0) + Number(summary.competence_not_developed || 0) + Number(summary.competence_attended || 0) + Number(summary.competence_not_attended || 0);
            if (indicatorTotal > 0) parts.push(`Indicadores: ${summary.indicator_attended || 0} A, ${summary.indicator_partial || 0} PA, ${summary.indicator_not_attended || 0} NA`);

            return parts.join("; ");

        const buildActivityStatusRows = (entries, limit = 120) => (entries || []).slice(0, limit).map(entry => `<tr class="${getActivityStatusReportClass(entry.status)}"><td>${escapeReportHTML(entry.uc || entry.sheet || "")}</td><td>${escapeReportHTML(entry.kindLabel || "Atividade avaliada")}</td><td>${escapeReportHTML(entry.label || "Atividade")}</td><td><strong>${escapeReportHTML(formatActivityStatusLabel(entry.status))}</strong></td></tr>`).join("");

        const summarizeActivitiesByUC = (summary) => (summary && summary.entries || []).reduce((result, entry) => {

            if (entry.status === "requires_evaluation") item.requiresEvaluation++;

        }, {});

        const analyzeAttendanceWarnings = (workbook, students) => {
            const XLSX = window.XLSX;

            const activeStudents = (students || []).filter(s => !s.is_dropout && !s.is_process_dropout);
            const namesForValidation = activeStudents.length > 0 ? activeStudents : (students || []);
            const knownStudents = new Map(namesForValidation.map(student => [normalizeName(student.name), student]));
            const warnings = [];

            workbook.SheetNames.forEach(sheetName => {
                if (!isAttendanceSheetName(sheetName)) return;

                const sheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: true });
                const header = findAttendanceHeader(rows);
                if (!header) return;

                const studentRows = [];
                for (let r = header.rowIdx + 1; r < rows.length; r++) {
                    const row = rows[r] || [];
                    const studentName = String(row[header.nameCol] || "").trim();
                    const normalized = normalizeName(studentName);
                    if (!normalized || normalized.includes("TOTAL") || normalized.includes("MEDIA") || normalized.includes("APRENDIZES")) continue;
                    const student = knownStudents.get(normalized);
                    if (knownStudents.size === 0 || student) studentRows.push({ row, student, name: student && student.name || studentName });
                }

                header.dateCols.forEach(({ idx, date }) => {
                    if (date > today) return;

                    const dayOfWeek = date.getDay();
                    if (dayOfWeek === 0) return;

                    const isSaturday = dayOfWeek === 6;

        const getNAStudentSummary = (data, studentName, justifications = {}) => {

        const getNAJustificationStorageKey = (turma) => `na_justifications_v1_${String(turma || "TURMA").replace(/[^a-zA-Z0-9]/g, "")}`;

        const makeNAJustificationDocId = (turma, entryKey) => `na_${generateHash(String(turma || "TURMA"))}_${generateHash(String(entryKey || "REGISTRO"))}`;

        const readNAJustificationsLocal = (turma) => {

        const loadNAJustifications = async (turma) => {

        const DASHBOARD_HISTORY_STORAGE_PREFIX = "dashboard_history_v1_";

        const DASHBOARD_HISTORY_LIMIT = 60;

        const normalizeDashboardHistorySnapshot = (snapshot) => {
            if (!snapshot || typeof snapshot !== "object") return null;
            return {
                ...snapshot,
                id: String(snapshot.id || `history_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`),

        const readDashboardHistoryLocal = (turma) => {

                    ? parsed.map(normalizeDashboardHistorySnapshot).filter(Boolean).sort((a, b) => new Date(b.capturedAt) - new Date(a.capturedAt)).slice(0, DASHBOARD_HISTORY_LIMIT)
                    : [];

                console.error("Erro ao carregar histórico local", error);

            }
        };

        const writeDashboardHistoryLocal = (turma, history) => {

                localStorage.setItem(getDashboardHistoryStorageKey(turma), JSON.stringify((history || []).slice(0, DASHBOARD_HISTORY_LIMIT)));
            } catch (error) {
                console.error("Erro ao salvar histórico local", error);

        const buildDashboardHistorySnapshot = ({ data, activityTracking, naJustifications = {}, notebookNotes = [], trigger = "leitura" }) => {
            if (!data || !data.turma) return null;
            const studentMetrics = {};
            let naPending = 0;
            let activityPending = 0;
            let activityTotal = 0;
            let activityCompleted = 0;
            let treatmentOpen = 0;
            let treatmentClosed = 0;

            (data.students || []).forEach(student => {
                const activity = getActivityStudentSummary(activityTracking, student.name);
                const na = getNAStudentSummary(data, student.name, naJustifications) || { count: 0 };
                const notes = (notebookNotes || []).filter(note => note.scope === "class" || Number(note.studentId) === Number(student.id) || (note.studentIds || []).includes(Number(student.id)));
                const closedNotes = notes.filter(note => getNotebookStatusMeta(note).closed).length;
                const openNotes = notes.length - closedNotes;
                const metric = {
                    name: student.name,
                    orionCode: String(student.orionCode || ""),
                    status: student.status || "Não informado",
                    averageFreq: Number.isFinite(Number(student.averageFreq)) ? Number(student.averageFreq) : null,
                    naPending: Number(na.count || 0),
                    activityTotal: Number(activity && activity.total || 0),
                    activityCompleted: Number(activity && activity.completed || 0),
                    activityPending: Number(getActivityAttentionCount(activity) || 0),
                    activityNotCompleted: Number(activity && activity.not_completed || 0),
                    activityBlank: Number(activity && activity.blank || 0),
                    activityRequiresEvaluation: Number(activity && activity.requires_evaluation || 0),
                    activityByUC: summarizeActivitiesByUC(activity),
                    treatmentOpen: openNotes,
                    treatmentClosed: closedNotes
                };
                studentMetrics[normalizeName(student.name)] = metric;
                naPending += metric.naPending;
                activityPending += metric.activityPending;
                activityTotal += metric.activityTotal;
                activityCompleted += metric.activityCompleted;
                treatmentOpen += openNotes;
                treatmentClosed += closedNotes;
            });

            return normalizeDashboardHistorySnapshot({
                id: `history_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
                turmaKey: cleanNotebookKey(data.turma, "TURMA_DESCONHECIDA"),
                turma: data.turma,
                capturedAt: new Date().toISOString(),
                trigger,
                sourceName: activityTracking && activityTracking.sourceName ? activityTracking.sourceName : "Planilha de frequência",
                class: {
                    students: (data.students || []).length,
                    activeStudents: (data.students || []).filter(student => !student.is_dropout && !student.is_process_dropout).length,
                    naPending,
                    activityTotal,
                    activityCompleted,
                    activityPending,
                    activityByUC: Object.values(studentMetrics).reduce((result, metric) => {
                        Object.entries(metric.activityByUC || {}).forEach(([uc, values]) => {
                            if (!result[uc]) result[uc] = { total: 0, completed: 0, pending: 0, notCompleted: 0, blank: 0, requiresEvaluation: 0 };
                            Object.keys(result[uc]).forEach(key => { result[uc][key] += Number(values[key] || 0); });
                        });
                        return result;
                    }, {}),
                    activitySources: activityTracking && Array.isArray(activityTracking.uploads) ? activityTracking.uploads.map(upload => upload.sourceName) : (activityTracking && activityTracking.sourceName ? [activityTracking.sourceName] : []),
                    treatmentOpen,
                    treatmentClosed
                },
                students: studentMetrics
            });
        };

        const loadDashboardHistory = async (turma) => {
            const localHistory = readDashboardHistoryLocal(turma);

            if (!db) return { history: localHistory, source: "local" };

                const turmaKey = cleanNotebookKey(turma, "TURMA_DESCONHECIDA");

                const merged = new Map(localHistory.map(item => [String(item.id), item]));
                snapshot.docs.forEach(doc => {
                    const normalized = normalizeDashboardHistorySnapshot({ id: doc.id, ...doc.data() });
                    if (normalized) merged.set(String(normalized.id), normalized);
                });
                const history = Array.from(merged.values()).sort((a, b) => new Date(b.capturedAt) - new Date(a.capturedAt)).slice(0, DASHBOARD_HISTORY_LIMIT);
                writeDashboardHistoryLocal(turma, history);

                console.error("Erro ao carregar histórico do Firebase; usando dados locais", error);
                return { history: localHistory, source: "local" };

        const persistDashboardHistory = async (snapshot) => {

            if (!normalized || !normalized.turma) return { source: "local" };
            const localHistory = readDashboardHistoryLocal(normalized.turma);
            const history = [normalized, ...localHistory.filter(item => String(item.id) !== String(normalized.id))].slice(0, DASHBOARD_HISTORY_LIMIT);
            writeDashboardHistoryLocal(normalized.turma, history);
            const db = await getNotebookFirestore();
            if (!db) return { source: "local" };
            try {
                await db.collection("dashboard_history").doc(normalized.id).set({ ...normalized, recordedBy: getCurrentAuthenticatedEmail() }, { merge: true });

                console.error("Erro ao salvar histórico no Firebase; dados mantidos localmente", error);

            }

        const compactGeneralHeader = (value) => normalizeText(value).replace(/[^A-Z0-9]/g, "");

        const cleanContactValue = (value) => {
            if (value === null || value === undefined) return "";
            return String(value).trim();
        };

        const normalizeStudentContact = (contact = {}, fallbackName = "") => ({
            studentContactName: cleanContactValue(contact.studentContactName || contact.studentName || fallbackName),
            studentPhone: cleanContactValue(contact.studentPhone),
            studentEmail: cleanContactValue(contact.studentEmail),
            supervisorName: cleanContactValue(contact.supervisorName),
            supervisorPhone: cleanContactValue(contact.supervisorPhone),
            supervisorEmail: cleanContactValue(contact.supervisorEmail)
        });

        const getWhatsAppUrl = (phone) => {
            const firstPhone = String(phone || "").split(/[\/;|]/)[0].replace(/\D/g, "");
            if (firstPhone.length < 10) return "";
            const number = firstPhone.startsWith("55") ? firstPhone : `55${firstPhone}`;
            return `https://wa.me/${number}`;
        };

        const SAVED_CLASSES_INDEX_KEY = "saved_classes_v1_index";
        const SAVED_CLASS_DATA_PREFIX = "saved_class_v1_";
        const USER_CLASS_ACCESS_PREFIX = "user_class_access_v1_";
        const getSavedClassKey = (turma) => cleanNotebookKey(turma, "TURMA_DESCONHECIDA");
        const getValidTurmaNumber = value => (String(value || "").match(/(?:^|\D)(\d{9})(?:\D|$)/) || [])[1] || "";
        const isValidSavedClassSummary = summary => Boolean(getValidTurmaNumber(summary && (summary.turma || summary.turmaKey)));
        const getUserClassAccessStorageKey = () => `${USER_CLASS_ACCESS_PREFIX}${cleanNotebookKey(getCurrentAuthenticatedEmail(), "USUARIO_LOCAL")}`;
        const getUserClassAccessDocId = turmaKey => `${cleanNotebookKey(getCurrentAuthenticatedEmail(), "USUARIO_LOCAL")}_${turmaKey}`;
        const cleanForStorage = (value) => JSON.parse(JSON.stringify(value, (key, item) => item === undefined ? null : item));
        const savedArray = (value) => Array.isArray(value) ? value : [];
        const savedRecord = (value) => value && typeof value === "object" && !Array.isArray(value) ? value : {};

        const normalizeSavedStudent = (student, index) => {
            const source = savedRecord(student);
            const ucScores = Object.fromEntries(Object.entries(savedRecord(source.uc_scores)).filter(([, value]) => value && typeof value === "object" && !Array.isArray(value)));
            return {
                ...source,
                id: source.id === null || source.id === undefined || source.id === "" ? index + 1 : source.id,
                name: String(source.name || `Aluno ${index + 1}`),
                status: String(source.status || "Não informado"),
                averageFreq: source.averageFreq === null || source.averageFreq === undefined ? 0 : source.averageFreq,
                contra_turno_desc: String(source.contra_turno_desc || "Sem Contra Turno"),
                comments: savedArray(source.comments),
                all_observations: savedArray(source.all_observations),
                low_freq_ucs: savedArray(source.low_freq_ucs),
                failed_perf_ucs: savedArray(source.failed_perf_ucs),
                uc_scores: ucScores,
                is_dropout: Boolean(source.is_dropout),
                is_process_dropout: Boolean(source.is_process_dropout),
                frequency_is_dropout: Boolean(source.frequency_is_dropout),
                frequency_is_process_dropout: Boolean(source.frequency_is_process_dropout),
                frequency_dropout_reason: String(source.frequency_dropout_reason || ""),
                needs_recuperacao: Boolean(source.needs_recuperacao),
                needs_conselho: Boolean(source.needs_conselho)
            };
        };

        const normalizeSavedClassData = (storedData) => {
            const source = savedRecord(storedData);
            const rawNAStudents = savedRecord(savedRecord(source.naAlerts).students);
            const naStudents = Object.fromEntries(Object.entries(rawNAStudents).map(([key, alert]) => {
                const normalizedAlert = savedRecord(alert);
                return [key, {
                    ...normalizedAlert,
                    name: String(normalizedAlert.name || "Aluno"),
                    entries: savedArray(normalizedAlert.entries)
                }];
            }));
            const attendanceWarnings = savedArray(source.attendanceWarnings).map(item => {
                const warning = savedRecord(item);
                return {
                    ...warning,
                    date: toDashboardDate(warning.date) || warning.date || null,
                    pendingStudents: savedArray(warning.pendingStudents)
                };
            });
            return {
                ...source,
                course: String(source.course || "Curso não identificado"),
                turma: String(source.turma || "Turma não identificada"),
                tutor1: String(source.tutor1 || "Não Identificado"),
                tutor2: String(source.tutor2 || "Não Identificado"),
                instructors: savedArray(source.instructors).map(String),
                sheetInstructors: Object.fromEntries(Object.entries(savedRecord(source.sheetInstructors)).map(([key, value]) => [String(key), Array.isArray(value) ? value.map(String) : expandInstructorNames(value)])),
                ucs: savedArray(source.ucs).map(String),
                courseDates: savedArray(source.courseDates).map(toDashboardDate).filter(Boolean),
                attendanceWarnings,
                naAlerts: { students: naStudents, totalStudents: Object.keys(naStudents).length },
                students: savedArray(source.students).map(normalizeSavedStudent)
            };
        };

        const makeSavedClassSummary = (data, source = {}) => ({
            turmaKey: getSavedClassKey(data.turma),
            turma: String(data.turma || "Turma não identificada"),
            course: String(data.course || "Curso não identificado"),
            tutor1: String(data.tutor1 || "Não Identificado"),
            tutor2: String(data.tutor2 || "Não Identificado"),
            instructors: Array.isArray(data.instructors) ? data.instructors.map(String) : [],
            ucs: Array.isArray(data.ucs) ? data.ucs.map(String) : [],
            studentCount: Array.isArray(data.students) ? data.students.length : 0,
            updatedAt: new Date().toISOString(),
            updatedBy: getCurrentAuthenticatedEmail(),
            sourceFileName: String(source.name || ""),
            sourceLastModified: Number(source.lastModified || 0)
        });

        const readSavedClassesLocal = () => {
            try {
                const parsed = JSON.parse(localStorage.getItem(SAVED_CLASSES_INDEX_KEY) || "[]");
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) { return []; }
        };

        const writeSavedClassesIndexLocal = classes => {
            try { localStorage.setItem(SAVED_CLASSES_INDEX_KEY, JSON.stringify((classes || []).slice(0, 20))); }
            catch (error) { console.warn("Não foi possível atualizar o índice local de turmas", error); }
        };

        const readUserClassAccessLocal = () => {
            try {
                const parsed = JSON.parse(localStorage.getItem(getUserClassAccessStorageKey()) || "[]");
                const explicitKeys = Array.isArray(parsed) ? parsed.map(String) : [];
                const email = getCurrentAuthenticatedEmail();
                const locallyOpenedKeys = explicitKeys.length === 0 ? readSavedClassesLocal()
                    .filter(item => String(item.updatedBy || "").toLowerCase() === email && localStorage.getItem(`${SAVED_CLASS_DATA_PREFIX}${item.turmaKey}`))
                    .map(item => item.turmaKey) : [];
                return [...new Set([...explicitKeys, ...locallyOpenedKeys])];
            } catch (error) { return []; }
        };

        const writeUserClassAccessLocal = keys => {
            try { localStorage.setItem(getUserClassAccessStorageKey(), JSON.stringify([...new Set((keys || []).map(String))])); }
            catch (error) { console.warn("Não foi possível salvar a lista pessoal de turmas", error); }
        };

        const markSavedClassAccess = async (turmaOrKey) => {
            const turmaKey = getSavedClassKey(turmaOrKey);
            if (!turmaKey) return { source: "local" };
            writeUserClassAccessLocal([turmaKey, ...readUserClassAccessLocal()]);
            const db = await getNotebookFirestore();
            const email = getCurrentAuthenticatedEmail();
            if (!db || !email) return { source: "local" };
            try {
                await db.collection("user_class_access").doc(getUserClassAccessDocId(turmaKey)).set({
                    userEmail: email,
                    turmaKey,
                    lastAccessedAt: new Date().toISOString()
                }, { merge: true });
                return { source: "cloud" };
            } catch (error) {
                console.error("Erro ao registrar acesso à turma", error);
                return { source: "local" };
            }
        };

        const loadUserClassAccess = async () => {
            const localKeys = readUserClassAccessLocal();
            const db = await getNotebookFirestore();
            const email = getCurrentAuthenticatedEmail();
            if (!db || !email) return new Set(localKeys);
            try {
                const snapshot = await db.collection("user_class_access").where("userEmail", "==", email).get();
                const keys = [...new Set([...localKeys, ...snapshot.docs.map(doc => String(doc.data().turmaKey || "")).filter(Boolean)])];
                writeUserClassAccessLocal(keys);
                return new Set(keys);
            } catch (error) {
                console.error("Erro ao carregar a lista pessoal de turmas", error);
                return new Set(localKeys);
            }
        };

        const synchronizeSavedClassSummaries = (documents, accessedKeys = new Set(readUserClassAccessLocal())) => {
            const cloudClasses = (documents || []).map(document => ({ turmaKey: document.id, ...document.data(), cloudSynced: true })).filter(item => accessedKeys.has(item.turmaKey) && isValidSavedClassSummary(item));
            const pendingLocal = readSavedClassesLocal().filter(item => item.cloudSynced === false && accessedKeys.has(item.turmaKey) && isValidSavedClassSummary(item));
            const merged = new Map(cloudClasses.map(item => [item.turmaKey, item]));
            pendingLocal.forEach(item => { if (!merged.has(item.turmaKey)) merged.set(item.turmaKey, item); });
            const classes = Array.from(merged.values()).sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
            writeSavedClassesIndexLocal(classes);
            return classes;
        };

        const writeSavedClassLocal = (summary, data) => {
            try {
                const index = [summary, ...readSavedClassesLocal().filter(item => item.turmaKey !== summary.turmaKey)]
                    .sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt))).slice(0, 20);
                localStorage.setItem(SAVED_CLASSES_INDEX_KEY, JSON.stringify(index));
                localStorage.setItem(`${SAVED_CLASS_DATA_PREFIX}${summary.turmaKey}`, JSON.stringify(cleanForStorage(data)));
            } catch (error) {
                console.warn("Não foi possível manter a cópia completa da turma neste dispositivo", error);
            }
        };

        const removeSavedClassLocal = (turmaKey) => {
            const nextIndex = readSavedClassesLocal().filter(item => item.turmaKey !== turmaKey);
            localStorage.setItem(SAVED_CLASSES_INDEX_KEY, JSON.stringify(nextIndex));
            localStorage.removeItem(`${SAVED_CLASS_DATA_PREFIX}${turmaKey}`);
            localStorage.removeItem(`class_source_v1_${turmaKey}`);
        };

        const removeSavedClass = async (summary) => {
            const turmaKey = summary && summary.turmaKey;
            if (!turmaKey) throw new Error("Turma inválida.");
            const db = await getNotebookFirestore();
            if (db && getCurrentAuthenticatedEmail()) await db.collection("user_class_access").doc(getUserClassAccessDocId(turmaKey)).delete().catch(() => null);
            writeUserClassAccessLocal(readUserClassAccessLocal().filter(key => key !== turmaKey));
            removeSavedClassLocal(turmaKey);
            return { source: db ? "cloud" : "local" };
        };

        const canAccessSavedClass = (summary) => {
            const email = getCurrentAuthenticatedEmail();
            if (!email || getCurrentAnalystName()) return true;
            if (String(summary.updatedBy || "").toLowerCase() === email) return true;
            return (summary.instructors || []).some(name => instructorNameMatchesAccount(name, email));
        };

        const loadSavedClasses = async () => {
            const accessedKeys = await loadUserClassAccess();
            const local = readSavedClassesLocal().filter(item => accessedKeys.has(item.turmaKey) && isValidSavedClassSummary(item));
            const db = await getNotebookFirestore();
            if (!db) return { classes: local, source: "local" };
            try {
                const snapshot = await db.collection("saved_classes").get();
                return { classes: synchronizeSavedClassSummaries(snapshot.docs, accessedKeys), source: "cloud" };
            } catch (error) {
                console.error("Erro ao carregar turmas salvas", error);
                return { classes: local, source: "local", error };
            }
        };

        const persistSavedClass = async (data, source = {}) => {
            if (!data || !getValidTurmaNumber(data.turma) || !Array.isArray(data.students)) return { source: "local", summary: null };
            const summary = { ...makeSavedClassSummary(data, source), cloudSynced: false };
            if (!source.skipUserAccess) await markSavedClassAccess(summary.turmaKey);
            writeSavedClassLocal(summary, data);
            const db = await getNotebookFirestore();
            if (!db) return { source: "local", summary };
            try {
                const syncedSummary = { ...summary, cloudSynced: true };
                const existing = await db.collection("saved_class_students").where("turmaKey", "==", summary.turmaKey).get();
                const nextIds = new Set(data.students.map(student => `${summary.turmaKey}_${cleanNotebookKey(student.name, String(student.id || "ALUNO"))}`));
                const operations = [];
                operations.push({ type: "set", ref: db.collection("saved_classes").doc(summary.turmaKey), data: cleanForStorage({
                    ...syncedSummary,
                    sheetInstructors: data.sheetInstructors || {},
                    courseDates: (data.courseDates || []).map(value => value instanceof Date ? value.toISOString() : String(value || "")),
                    attendanceWarnings: data.attendanceWarnings || []
                }) });
                existing.docs.forEach(doc => { if (!nextIds.has(doc.id)) operations.push({ type: "delete", ref: doc.ref }); });
                data.students.forEach(student => {
                    const id = `${summary.turmaKey}_${cleanNotebookKey(student.name, String(student.id || "ALUNO"))}`;
                    const naAlert = data.naAlerts && data.naAlerts.students ? data.naAlerts.students[normalizeName(student.name)] || null : null;
                    operations.push({ type: "set", ref: db.collection("saved_class_students").doc(id), data: cleanForStorage({ turmaKey: summary.turmaKey, studentKey: normalizeName(student.name), updatedBy: summary.updatedBy, data: student, naAlert }) });
                });
                for (let start = 0; start < operations.length; start += 450) {
                    const batch = db.batch();
                    operations.slice(start, start + 450).forEach(operation => operation.type === "delete" ? batch.delete(operation.ref) : batch.set(operation.ref, operation.data, { merge: true }));
                    await batch.commit();
                }
                writeSavedClassLocal(syncedSummary, data);
                return { source: "cloud", summary: syncedSummary };
            } catch (error) {
                console.error("Erro ao salvar a turma no Firebase", error);
                return { source: "local", summary };
            }

        const loadSavedClassData = async (summary) => {
            const turmaKey = summary && summary.turmaKey;
            if (!turmaKey) throw new Error("Turma inválida.");
            const db = await getNotebookFirestore();
            if (db) {
                try {
                    const [classDoc, studentSnapshot] = await Promise.all([
                        db.collection("saved_classes").doc(turmaKey).get(),
                        db.collection("saved_class_students").where("turmaKey", "==", turmaKey).get()
                    ]);
                    if (classDoc.exists && !studentSnapshot.empty) {
                        const meta = classDoc.data();
                        const students = studentSnapshot.docs.map(doc => doc.data()).filter(item => item && item.data).map(item => item.data)
                            .sort((a, b) => Number(a.id || 0) - Number(b.id || 0) || String(a.name || "").localeCompare(String(b.name || ""), "pt-BR"));
                        const naStudents = {};
                        studentSnapshot.docs.map(doc => doc.data()).filter(item => item && item.naAlert).forEach(item => { naStudents[item.studentKey] = item.naAlert; });
                        const data = normalizeSavedClassData({
                            course: meta.course,
                            turma: meta.turma,
                            tutor1: meta.tutor1,
                            tutor2: meta.tutor2,
                            instructors: meta.instructors || [],
                            sheetInstructors: meta.sheetInstructors || {},

        const RECOVERY_STORAGE_PREFIX = "student_recoveries_v1_";
        const RECOVERY_OPEN_STATUSES = ["triage", "open", "contacted", "waiting", "evaluation"];
        const normalizeRecoveryRecord = (record = {}) => ({

        });
        const recoveryStorageKey = turma => `${RECOVERY_STORAGE_PREFIX}${getSavedClassKey(turma)}`;
        const writeRecoveriesLocal = (turma, records) => { try { localStorage.setItem(recoveryStorageKey(turma), JSON.stringify(records || [])); } catch (error) {} };
        const readRecoveriesLocal = turma => { try { const parsed = JSON.parse(localStorage.getItem(recoveryStorageKey(turma)) || "[]"); return Array.isArray(parsed) ? parsed.map(normalizeRecoveryRecord) : []; } catch (error) { return []; } };
        const loadClassRecoveries = async turma => {

                const records = snapshot.docs.map(doc => normalizeRecoveryRecord({ id: doc.id, ...doc.data() })).sort((a, b) => a.studentName.localeCompare(b.studentName, "pt-BR") || a.number - b.number);
                writeRecoveriesLocal(classId, records);

        };
        const persistRecoveryRecord = async record => {
            const normalized = normalizeRecoveryRecord({ ...record, updatedBy: getCurrentAuthenticatedEmail(), updatedAt: new Date().toISOString() });
            const local = [normalized, ...readRecoveriesLocal(normalized.classId).filter(item => item.id !== normalized.id)];
            writeRecoveriesLocal(normalized.classId, local);
            const db = await getNotebookFirestore();
            if (!db) return { record: normalized, source: "local" };
            try {
                const payload = { ...normalized };
                delete payload.id;
                await db.collection("analyst_recoveries").doc(normalized.id).set(payload, { merge: true });

        const recoveryBelongsToStudent = (record, student) => record.studentKey === normalizeName(student && student.name) || (record.studentId && String(record.studentId) === String(student && student.id));
        const reconcileRecoveriesWithFrequency = async (records, classData) => {

                updates.push((await persistRecoveryRecord({ ...record, status: "closed", outcome: "developed", closedAt: notebookDateInput(new Date()), autoUpdatedFromFrequency: true, notes: [record.notes, "Encerrada automaticamente após atualização da chamada indicar desenvolvimento."].filter(Boolean).join("\n") })).record);
            }

        const persistClassOrionStatus = async (data, orion) => {

        const OrionStatusModal = ({ data, values, onChange, onClose }) => <div className="fixed inset-0 z-[80] flex items-center justify-center bg-black/70 p-4" onClick={event => { if (event.target === event.currentTarget) onClose(); }}><div className="max-h-[90vh] w-full max-w-2xl overflow-hidden rounded-xl bg-white shadow-2xl"><div className="flex items-center justify-between bg-senac-blue p-4 text-white"><div><h2 className="text-lg font-bold">Lançamento de resultados no Órion</h2><p className="text-xs text-blue-100">Turma {data.turma} · atualização compartilhada com o analista</p></div><button onClick={onClose}><IconXCircle className="h-6 w-6" /></button></div><div className="max-h-[70vh] space-y-2 overflow-y-auto p-4">{(data.ucs || []).map(uc => { const item = values[uc] || { status: "pending", notes: "" }; return <div key={uc} className="grid gap-2 rounded-lg border border-gray-200 p-3 sm:grid-cols-[70px_190px_1fr]"><strong className="self-center text-senac-blue">{uc}</strong><select value={item.status} onChange={event => onChange(uc, { ...item, status: event.target.value })} className="rounded border border-gray-300 p-2 text-sm"><option value="pending">Não lançado</option><option value="partial">Parcialmente lançado</option><option value="launched">Concluído no Órion</option></select><input value={item.notes || ""} onChange={event => onChange(uc, { ...item, notes: event.target.value })} className="rounded border border-gray-300 p-2 text-sm" placeholder="Observação opcional" /></div>; })}</div><div className="flex justify-end border-t p-4"><button onClick={onClose} className="rounded border border-gray-300 px-4 py-2 text-sm font-bold text-gray-600">Fechar</button></div></div></div>;

        const isElectronDesktop = () => Boolean(window.senacDesktop && window.senacDesktop.isDesktop);
        const getElectronSourcePath = (file) => {

        const rememberElectronClassSourcePath = (turma, sourcePath, lastModified) => {

        const WEB_FREQUENCY_HANDLE_DB = "senac_frequency_handles_v1";
        const WEB_FREQUENCY_HANDLE_STORE = "handles";
        const openWebFrequencyHandleDatabase = () => new Promise((resolve, reject) => {
            if (!window.indexedDB) { resolve(null); return; }
            const request = window.indexedDB.open(WEB_FREQUENCY_HANDLE_DB, 1);
            request.onupgradeneeded = () => {
                if (!request.result.objectStoreNames.contains(WEB_FREQUENCY_HANDLE_STORE)) request.result.createObjectStore(WEB_FREQUENCY_HANDLE_STORE);
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
        const readWebFrequencyHandle = async turma => {

            if (!db) return null;
            return new Promise((resolve, reject) => {
                const request = db.transaction(WEB_FREQUENCY_HANDLE_STORE, "readonly").objectStore(WEB_FREQUENCY_HANDLE_STORE).get(getSavedClassKey(turma));
                request.onsuccess = () => { db.close(); resolve(request.result || null); };
                request.onerror = () => { db.close(); reject(request.error); };
            });
        };
        const writeWebFrequencyHandle = async (turma, handle) => {
            const db = await openWebFrequencyHandleDatabase();
            if (!db) return;
            return new Promise((resolve, reject) => {
                const request = db.transaction(WEB_FREQUENCY_HANDLE_STORE, "readwrite").objectStore(WEB_FREQUENCY_HANDLE_STORE).put(handle, getSavedClassKey(turma));
                request.onsuccess = () => { db.close(); resolve(); };

        const removeWebFrequencyHandle = async turma => {

                request.onsuccess = () => { db.close(); resolve(); };
