        };
        const requestWebFrequencyPermission = async handle => {
            if (!handle || typeof handle.getFile !== "function") return false;
            if (typeof handle.queryPermission !== "function") return true;
            let permission = await handle.queryPermission({ mode: "read" });
            if (permission === "prompt" && typeof handle.requestPermission === "function") permission = await handle.requestPermission({ mode: "read" });
            return permission === "granted";
        };

        const parseGeneralDataContacts = (workbook) => {
            const sheetName = (workbook.SheetNames || []).find(name => compactGeneralHeader(name) === "DADOSGERAIS");
            if (!sheetName) return {};
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "", raw: true });
            const headerRowIdx = rows.findIndex(row => {
                const headers = (row || []).map(compactGeneralHeader);
                return headers.some(header => header === "NOMEDOAPRENDIZ" || header === "NOMEDOALUNO") && headers.some(header => header.includes("SUPERVISOR"));
            });
            if (headerRowIdx === -1) return {};

            const headers = (rows[headerRowIdx] || []).map(compactGeneralHeader);
            const findColumn = (predicates, startAt = 0) => headers.findIndex((header, index) => index >= startAt && predicates.some(predicate => predicate(header)));
            const studentNameCol = findColumn([header => header === "NOMEDOAPRENDIZ", header => header === "NOMEDOALUNO", header => header === "APRENDIZ"]);
            const supervisorNameCol = findColumn([header => header === "SUPERVISOR", header => header === "NOMEDOSUPERVISOR"]);
            const studentPhoneCol = findColumn([header => header.includes("CONTATODOAPRENDIZ"), header => header.includes("TELEFONEDOAPRENDIZ"), header => header.includes("CELULARDOAPRENDIZ"), header => header === "CONTATO"]);
            const studentEmailCol = findColumn([header => header.includes("EMAILDOAPRENDIZ"), header => header.includes("EMAILDOALUNO")]);
            const supervisorEmailCol = findColumn([header => header.includes("EMAILDOSUPERVISOR")]);
            const supervisorPhoneCols = headers.reduce((columns, header, index) => {
                const isPhone = header === "TELEFONE" || header === "CELULAR" || header.includes("TELEFONEDOSUPERVISOR") || header.includes("CELULARDOSUPERVISOR");
                if (isPhone && (studentPhoneCol === -1 || index < studentPhoneCol)) columns.push(index);
                return columns;
            }, []);
            if (studentNameCol === -1) return {};

            const contacts = {};
            rows.slice(headerRowIdx + 1).forEach(row => {
                const studentName = cleanContactValue(row[studentNameCol]);
                const studentKey = normalizeName(studentName);
                if (!studentKey || studentKey.includes("TOTAL") || studentKey.includes("APRENDIZES")) return;
                const supervisorPhones = supervisorPhoneCols.map(index => cleanContactValue(row[index])).filter(Boolean);
                contacts[studentKey] = normalizeStudentContact({
                    studentContactName: studentName,
                    studentPhone: studentPhoneCol === -1 ? "" : row[studentPhoneCol],
                    studentEmail: studentEmailCol === -1 ? "" : row[studentEmailCol],
                    supervisorName: supervisorNameCol === -1 ? "" : row[supervisorNameCol],
                    supervisorPhone: [...new Set(supervisorPhones)].join(" / "),
                    supervisorEmail: supervisorEmailCol === -1 ? "" : row[supervisorEmailCol]
                }, studentName);
            });
            return contacts;
        };

        const processExcelFile = (arrayBuffer) => {
            try {
                const XLSX = window.XLSX;
                if (!XLSX) throw new Error("A biblioteca de Excel ainda não carregou.");
                
                const workbook = XLSX.read(arrayBuffer, { type: 'array', cellComments: true, sheetStubs: true, cellDates: true, cellNF: true, cellText: true, cellStyles: true, bookFiles: true });
                
                let tutor1 = "Não Identificado"; let tutor2 = "Não Identificado"; let course = "Curso não identificado"; let turma = "Turma não identificada";
                const sheetNames = workbook.SheetNames;
                const generalDataContacts = parseGeneralDataContacts(workbook);

                // Cada UC pode estar sob responsabilidade de um instrutor diferente.
                // A ordem das UCs mantém a ordem de apresentação dos cadernos.
                const ucMetadata = sheetNames
                    .map((sheetName, sheetIndex) => {
                        const match = String(sheetName).match(/UC\s*(\d+)/i);
                        return match ? { sheetName, sheetIndex, number: Number(match[1]) } : null;
                    })
                    .filter(Boolean)
                    .sort((a, b) => a.number - b.number || a.sheetIndex - b.sheetIndex)
                    .map(item => ({ ...item, metadata: findMetadata(workbook.Sheets[item.sheetName]) }));
                const sheetInstructors = {};
                sheetNames.forEach(sheetName => {
                    const metadata = findMetadata(workbook.Sheets[sheetName]);
                    const responsibleInstructors = expandInstructorNames(metadata && metadata.tutor)
                        .filter(instructor => normalizeName(instructor) !== normalizeName("Não Identificado"));
                    if (responsibleInstructors.length === 0) return;
                    sheetInstructors[sheetName] = responsibleInstructors;
                    const ucMatch = String(sheetName).match(/UC\s*(\d+)/i);
                    if (ucMatch) sheetInstructors[`UC${ucMatch[1]}`] = responsibleInstructors;
                });

                const instructors = [];
                ucMetadata.forEach(({ metadata }) => {
                    expandInstructorNames(metadata && metadata.tutor).forEach(tutor => {
                        if (normalizeName(tutor) === normalizeName("Não Identificado")) return;
                        if (!instructors.some(existing => normalizeName(existing) === normalizeName(tutor))) instructors.push(tutor);
                    });
                    if (turma === "Turma não identificada" && metadata.turma) turma = metadata.turma;
                    if ((!course || course.includes("não")) && metadata.curso) course = metadata.curso;
                });

                // Fallback para planilhas antigas que não nomeiam a aba como UC.
                if (instructors.length === 0) {
                    sheetNames.forEach(sheetName => {
                        const metadata = findMetadata(workbook.Sheets[sheetName]);
                        expandInstructorNames(metadata && metadata.tutor).forEach(tutor => {
                            if (normalizeName(tutor) !== normalizeName("Não Identificado") && !instructors.some(existing => normalizeName(existing) === normalizeName(tutor))) instructors.push(tutor);
                        });
                        if (turma === "Turma não identificada" && metadata.turma) turma = metadata.turma;
                        if ((!course || course.includes("não")) && metadata.curso) course = metadata.curso;
                    });
                }

                tutor1 = instructors[0] || "Não Identificado";
                tutor2 = instructors[1] || "Não Identificado";
                if (turma && String(turma).toUpperCase().includes("TURMA")) turma = String(turma).replace(/TURMA[:\s]*/i, '').trim();

                const manualProcessOverrides = getManualProcessList(turma);

                let pedSheetName = sheetNames.find(n => n.toUpperCase().includes("PEDAG") || n.toUpperCase().includes("GERAL") || n.toUpperCase().includes("FREQ") || n.toUpperCase().includes("CONTROLE"));
                
                let pedSheet = null;
                let headerRowIdx = -1;

                if (pedSheetName) {
                    pedSheet = workbook.Sheets[pedSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(pedSheet, { header: 1 });
                    headerRowIdx = findHeaderRow(jsonData);
                }

                if (headerRowIdx === -1) {
                    for (let name of sheetNames) {
                        const s = workbook.Sheets[name];
                        const d = XLSX.utils.sheet_to_json(s, { header: 1 });
                        const idx = findHeaderRow(d);
                        if (idx !== -1) {
                            pedSheetName = name;
                            pedSheet = s;
                            headerRowIdx = idx;
                            break;
                        }
                    }
                }

                if (!pedSheet || headerRowIdx === -1) {
                    throw new Error("Cabeçalho da lista de alunos não encontrado.");
                }

                const jsonData = XLSX.utils.sheet_to_json(pedSheet, { header: 1 });
                const headerRow = jsonData[headerRowIdx];
                const nextRow1 = jsonData[headerRowIdx + 1] || [];
                const nextRow2 = jsonData[headerRowIdx + 2] || [];
                
                const rawDates = [];
                const headerRangeCheck = [headerRow, nextRow1, nextRow2];
                
                headerRangeCheck.forEach(rowArr => {
                    if(!rowArr) return;
                    rowArr.forEach(cell => {
                        let parsedDate = null;
                        if(typeof cell === 'number' && cell > 40000 && cell < 60000) {
                            parsedDate = excelDateToJSDate(cell);
                        } else if(cell instanceof Date) {
                            parsedDate = cell;
                        } else if(typeof cell === 'string' && cell.match(/^\d{1,2}\/\d{1,2}/)) {
                            const parts = cell.split('/');
                            if(parts.length >= 2) {
                                const d = parseInt(parts[0]);
                                const m = parseInt(parts[1]) - 1;
                                const y = new Date().getFullYear(); 
                                parsedDate = new Date(y, m, d);
                            }
                        }

                        if(parsedDate && !isNaN(parsedDate)) {
                            parsedDate.setHours(0,0,0,0);
                            if(!rawDates.some(d => d.getTime() === parsedDate.getTime())) {
                                rawDates.push(parsedDate);
                            }
                        }
                    });
                });
                rawDates.sort((a,b) => a - b);
                
                let conselhoColIdx = -1; 
                let ensinoMedioColIdx = -1;
                let nameColIdx = -1;
                let situationColIdx = -1;
                let orionColIdx = -1;
                
                for(let idx = 0; idx < Math.max(headerRow.length, nextRow1.length); idx++) {
                    const l1 = normalizeText(headerRow[idx]);
                    const l2 = normalizeText(nextRow1[idx]);
                    const l3 = normalizeText(nextRow2[idx]);
                    const fullHeader = l1 + " " + l2 + " " + l3;
                    
                    if (fullHeader.includes("CONSELHO") && (fullHeader.includes("TEXTO") || fullHeader.includes("OBS"))) conselhoColIdx = idx;
                    if ((fullHeader.includes("ENSINO") && fullHeader.includes("MEDIO")) || fullHeader.includes("CONTRATURNO") || fullHeader.includes("CONTRA TURNO")) ensinoMedioColIdx = idx;
                    if (fullHeader.includes("NOME") && nameColIdx === -1) nameColIdx = idx;
                    if ((fullHeader.includes("SITUACAO") || fullHeader.includes("STATUS") || fullHeader.includes("RESULTADO")) && situationColIdx === -1) situationColIdx = idx;
                    if (fullHeader.includes("ORION") && orionColIdx === -1) orionColIdx = idx;
                }

                if (nameColIdx === -1) nameColIdx = 2; 

                const students = [];
                const allFoundUCs = new Set();
                
                let startRow = headerRowIdx + 1;
                if(jsonData[startRow] && String(jsonData[startRow][1] || "").toUpperCase().includes("DATA")) startRow++;

                for (let i = startRow; i < jsonData.length; i++) {
                    const row = jsonData[i];
                    if (!row) continue;

                    let name = row[nameColIdx];
                    if (typeof name === 'number') { 
                         if (row[nameColIdx+1] && isNaN(row[nameColIdx+1])) name = row[nameColIdx+1];
                         else if (row[nameColIdx-1] && isNaN(row[nameColIdx-1])) name = row[nameColIdx-1];
                    }
                    if (typeof name === 'number' || !name) {
                        const candidate = row.slice(0, 5).find(c => typeof c === 'string' && c.length > 3 && !c.match(/^\d+$/));
                        if(candidate) name = candidate;
                    }
                    
                    if(!name || String(name).length < 3) continue;
                    name = String(name).trim();
                    const normalizedCandidateName = normalizeText(name);
                    if (normalizedCandidateName.includes("TOTAL") || normalizedCandidateName.includes("APRENDIZES") || normalizedCandidateName.includes("MEDIA") || normalizedCandidateName.includes("DATA")) continue;

                    let contraTurnoVal = "";
                    if (ensinoMedioColIdx !== -1 && row[ensinoMedioColIdx]) contraTurnoVal = String(row[ensinoMedioColIdx]).trim();

                    const studentRec = {
                        id: i, 
                        name: name, 
                        orionCode: orionColIdx !== -1 ? String(row[orionColIdx] || "").trim() : "",
                        averageFreq: 0.0, 
                        status: "Desenvolveu", 
                        low_freq_ucs: [], failed_perf_ucs: [], 
                        needs_recuperacao: false, needs_conselho: false,
                        is_dropout: false, is_process_dropout: false, dropout_reason: "", 
                        conselho_text: conselhoColIdx !== -1 ? String(row[conselhoColIdx] || "").trim() : "",
                        contra_turno_desc: normalizeContraTurno(contraTurnoVal), 
                        ...normalizeStudentContact(generalDataContacts[normalizeName(name)], name),
                        all_observations: [], comments: [],
                        uc_scores: {} 
                    };

                    if (manualProcessOverrides.includes(normalizeName(name))) {
                        studentRec.is_process_dropout = true;
                        studentRec.status = "Em Processo de Desligamento";
                    }

                    const situation = classifyStudentSituation(row, situationColIdx);
                    if (situation.type === "dropout") {
                         studentRec.is_dropout = true;
                         studentRec.status = "Evadido/Desligado";
                         studentRec.dropout_reason = situation.reason;
                    } else if (situation.type === "process" && !studentRec.is_process_dropout) {
                         studentRec.is_process_dropout = true;
                         studentRec.status = "Em Processo de Desligamento";
                         studentRec.dropout_reason = situation.reason;
                    }

                    if (!studentRec.is_dropout) {
                        try {
                            const cellAddress = XLSX.utils.encode_cell({r: i, c: nameColIdx});
                            applyOrangeStudentSituation({
                                student: studentRec,
                                cell: pedSheet[cellAddress],
                                row,
                                sheetName: pedSheetName,
                                isPedagogicalSheet: true,
                                sheet: pedSheet,
                                rowIndex: i,
                                nameColIdx
                            });
                        } catch (e) {}
                    }

                    const freqScores = []; 
                    const detectedFrequencyPairs = [];
                    const frequencyHeaderWidth = Math.max(headerRow.length, nextRow1.length, nextRow2.length);
                    for (let col = 0; col < frequencyHeaderWidth; col++) {
                        const frequencyHeader = normalizeText([headerRow[col], nextRow1[col], nextRow2[col]].filter(Boolean).join(" "));
                        if (!frequencyHeader.includes("APROVEITAMENTO") || !frequencyHeader.includes("FREQUENCIA")) continue;
                        const ucMatch = frequencyHeader.match(/\bUC\s*(\d+)\b/);
                        detectedFrequencyPairs.push({
                            scoreCol: col,
                            statusCol: col + 1,
                            ucName: ucMatch ? `UC${ucMatch[1]}` : frequencyHeader.includes("PRATICA") ? "Prática Profissional" : `UC${detectedFrequencyPairs.length + 1}`
                        });
                    }

                    const frequencyPairs = detectedFrequencyPairs.length > 0 ? detectedFrequencyPairs : (() => {
                        const legacyPairs = [];
                        let legacyUC = 1;
                        for (let col = 4; col < 60; col += 2) {
                            if (col > 24 && (!row[col] && !row[col + 1]) && !row[col + 2]) break;
                            legacyPairs.push({ scoreCol: col, statusCol: col + 1, ucName: col === 26 ? "Prática Profissional" : `UC${legacyUC}` });
                            legacyUC++;
                            if (legacyUC > 20) break;
                        }
                        return legacyPairs;
                    })();

                    frequencyPairs.forEach(({ scoreCol, statusCol, ucName }) => {
                        let scoreVal = row[scoreCol];
                        if (typeof scoreVal === 'string' && scoreVal.includes('%')) {
                            scoreVal = parseFloat(scoreVal.replace('%','').replace(',','.')) / 100;
                        } else {
                            scoreVal = parseFloat(scoreVal);
                        }
                        if (!isNaN(scoreVal) && scoreVal > 1 && scoreVal <= 100) scoreVal = scoreVal / 100;

                        const statusVal = String(row[statusCol] || "");
                        
                        if (!isNaN(scoreVal)) {
                            freqScores.push(scoreVal);
                            studentRec.uc_scores[ucName] = { score: scoreVal, status: statusVal };
                            allFoundUCs.add(ucName);

                            if (scoreVal < 0.75) { 
                                studentRec.low_freq_ucs.push(ucName); 
                                if(!studentRec.is_dropout && !studentRec.is_process_dropout) studentRec.needs_conselho = true; 
                            }
                        }
                        
                        if (isNotDevelopedStatus(statusVal)) { 
                            studentRec.failed_perf_ucs.push(ucName); 
                            if(!studentRec.is_dropout && !studentRec.is_process_dropout) { 
                                studentRec.needs_recuperacao = true; 
                                studentRec.status = "Não Desenvolveu"; 
                            } 
                        }
                    });
                    if (freqScores.length > 0) studentRec.averageFreq = (freqScores.reduce((a, b) => a + b, 0) / freqScores.length * 100).toFixed(1);
                    
                    if (studentRec.is_dropout) studentRec.status = "Evadido/Desligado";
                    else if (studentRec.is_process_dropout) studentRec.status = "Em Processo de Desligamento";
                    else if (studentRec.needs_recuperacao) studentRec.status = "Não Desenvolveu";
                    else if (studentRec.needs_conselho) studentRec.status = "Conselho de Classe"; 

                    students.push(studentRec);
                }

                sheetNames.forEach(sheetName => {
                    const sheet = workbook.Sheets[sheetName];
                    const rawData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                    let sheetHeaderRow = findHeaderRow(rawData);
                    let nameColIdx = -1;
                    
                    if (sheetHeaderRow !== -1) {
                         const hRow = rawData[sheetHeaderRow];
                         hRow.forEach((c, idx) => { const cellStr = String(c || "").toUpperCase(); if(cellStr.includes("NOME") || cellStr.includes("ALUNO") || cellStr.includes("APRENDIZ")) nameColIdx = idx; });
                    }
                    if (nameColIdx === -1 && sheetHeaderRow !== -1) nameColIdx = 1; 
                    
                    if (sheetHeaderRow === -1) {
                        for(let r=0; r<10; r++) {
                            if(!rawData[r]) continue;
                            for(let c=0; c<5; c++) {
                                const val = String(rawData[r][c] || "").toUpperCase();
                                if(val.includes("NOME") || val.includes("ALUNO")) { nameColIdx = c; sheetHeaderRow = r; break; }
                            }
                            if(nameColIdx !== -1) break;
                        }
                    }
                    
                    if (sheetHeaderRow === -1) sheetHeaderRow = 0; 

                    const headerRow = rawData[sheetHeaderRow];
                    const nextRow1 = rawData[sheetHeaderRow + 1] || [];
                    const criticalCols = [];
                    const ignoredSheetColumns = new Set();
                    const isUCSheet = sheetName.toUpperCase().includes("UC") || sheetName.toUpperCase().includes("MOD") || sheetName.toUpperCase().includes("MÓD");
                    const isPedagogicalSheet = sheetName === pedSheetName; 

                    if(headerRow) {
                        const maxCols = Math.max(headerRow.length, nextRow1.length, 150);
                        for(let idx = 0; idx < maxCols; idx++) {
                            const fullHeader = (String(headerRow[idx] || "") + " " + String(nextRow1[idx] || "")).toUpperCase(); 
                            if (isNonDataAttendanceHeader(fullHeader)) ignoredSheetColumns.add(idx);

                            if (isPedagogicalSheet && ((fullHeader.includes("TEXTO") || fullHeader.includes("PARECER")) && (fullHeader.includes("CONSELHO") || fullHeader.includes("CLASSE")))) { criticalCols.push({ idx, name: "Conselho de Classe", type: 'force_conselho' }); }
                            else if (fullHeader.includes("MOTIVO") || fullHeader.includes("DESLIGAMENTO") || fullHeader.includes("RECUPERA") || fullHeader.includes("ORION") || fullHeader.includes("ÓRION")) {
                                 let customName = "Obs (" + sheetName + ")";
                                 if(fullHeader.includes("MOTIVO") || fullHeader.includes("DESLIGAMENTO")) customName = "Desligamento/Obs (" + sheetName + ")";
                                 else if(fullHeader.includes("RECUPERA")) customName = "Recuperação (" + sheetName + ")";
                                 else if(fullHeader.includes("ORION") || fullHeader.includes("ÓRION")) customName = "Órion (" + sheetName + ")";
                                 criticalCols.push({ idx, name: customName, type: 'force_obs' });
                            }
                            else if (isUCSheet && (fullHeader.startsWith("OBSERVA") || fullHeader.includes("OBSERVAÇÕES") || fullHeader.includes("OBSERVACOES") || fullHeader.includes("ANOTAÇ"))) { criticalCols.push({ idx, name: "Obs (" + sheetName + ")", type: 'force_obs' }); }
                            else if(fullHeader.includes("TEXTOS ÓRION") || fullHeader.includes("RECUPERAÇÕES") || fullHeader.includes("OCORRÊNCIA") || (isUCSheet && fullHeader.includes("SITUAÇÃO FINAL")) ) { criticalCols.push({ idx, name: fullHeader.substring(0, 30), type: 'auto' }); }
                        }
                    }

                    for (let r = sheetHeaderRow + 1; r < rawData.length; r++) {
                        const row = rawData[r];
                        if (!row) continue;
                        const nameInSheet = String(row[nameColIdx] || "").trim();
                        if (nameInSheet.length < 3) continue;
                        const normalized = normalizeName(nameInSheet);
                        const student = students.find(s => normalizeName(s.name) === normalized);
                        if(student) {
                            if (!student.is_dropout) {
                                try {
                                    const cellAddress = XLSX.utils.encode_cell({r: r, c: nameColIdx});
                                    applyOrangeStudentSituation({
                                        student,
                                        cell: sheet[cellAddress],
                                        row,
                                        sheetName,
                                        isPedagogicalSheet,
                                        sheet,
                                        rowIndex: r,
                                        nameColIdx
                                    });
                                } catch(e) {}
                            }
                            
                            row.forEach((cellVal, idx) => {
                                if (ignoredSheetColumns.has(idx)) return;
                                const valStr = String(cellVal || "").trim();
                                if(valStr.length < 2 || valStr === "0" || valStr === "-") return;
                                if (/^[\d.,\s%-]+$/.test(valStr)) return;
                                const observationContext = getObservationContext(rawData, sheetHeaderRow, idx, sheetName);
                                const isCritical = criticalCols.find(cc => cc.idx === idx);
                                if (isCritical) {
                                    if (isCritical.type === 'force_conselho') { student.conselho_text = valStr; addStudentObservation(student, valStr, { ...observationContext, source: "[Conselho]", kind: "pedagogical" }); }
                                    else if (isCritical.type === 'force_obs') { addStudentObservation(student, valStr, { ...observationContext, source: `[${isCritical.name}]`, kind: "observation" }); }
                                    else { let sourceLabel = sheetName; if(isCritical.name.includes("ORION") || isCritical.name.includes("ÓRION")) sourceLabel = "Órion/Recuperação"; addStudentObservation(student, valStr, { ...observationContext, source: sourceLabel, kind: "observation" }); }
                                } else { if(isInterestingText(valStr, student.name)) addStudentObservation(student, valStr, { ...observationContext, kind: "observation" }); }
                            });
                            if (sheet['!ref']) {
                                row.forEach((_, colIdx) => {
                                    const cellAddress = XLSX.utils.encode_cell({r: r, c: colIdx});
                                    const cell = sheet[cellAddress];
                                    if(cell) {
                                        const comment = extractCellComments(cell);
                                        if(comment) {
                                            const cleanComment = comment.replace(student.name, '').trim();
                                            if(cleanComment.length > 2 && !cleanComment.toUpperCase().includes("TOTAL")) {
                                                const commentContext = getObservationContext(rawData, sheetHeaderRow, colIdx, sheetName);
                                                addStudentObservation(student, `[Comentário da chamada] ${cleanComment}`, { ...commentContext, kind: "attendance_comment" });
                                            }
                                        }
                                    }
                                });
                            }
                        }
                    }
                });

                students.forEach(student => {
                    student.frequency_is_dropout = Boolean(student.is_dropout);
                    student.frequency_is_process_dropout = Boolean(student.is_process_dropout);
                    student.frequency_dropout_reason = String(student.dropout_reason || "");
                });
                const attendanceWarnings = analyzeAttendanceWarnings(workbook, students);
                const naAlerts = analyzeNAWarnings(workbook, students);
                return { course, turma, tutor1, tutor2, instructors, sheetInstructors, students, ucs: Array.from(allFoundUCs).sort(), courseDates: rawDates, attendanceWarnings, naAlerts };
            } catch (error) {
                console.error(error);
                alert("Erro ao ler o arquivo: " + error.message);
                return null;
            }
        };

        const generateHash = (str) => {
            let hash = 0; if (str.length === 0) return "0000";
            for (let i = 0; i < str.length; i++) { const char = str.charCodeAt(i); hash = ((hash << 5) - hash) + char; hash = hash & hash; }
            return Math.abs(hash).toString(16).toUpperCase().substring(0, 8);
        };

        const syncFrequencyObservationsToNotebooks = async data => {
            if (!data || !data.turma || !Array.isArray(data.students)) return { created: 0, skipped: 0 };
            const grouped = new Map();
            data.students.forEach(student => {
                (student.all_observations || []).forEach(observation => {
                    const responsibleValue = data.sheetInstructors && (data.sheetInstructors[observation.sheet] || data.sheetInstructors[observation.uc]);
                    const responsibleInstructors = Array.isArray(responsibleValue)
                        ? responsibleValue.map(canonicalizeInstructorName).filter(isValidInstructorName)
                        : expandInstructorNames(responsibleValue);
                    if (responsibleInstructors.length === 0) return;
                    const sourceKey = [data.turma, student.name, observation.sheet, observation.uc, observation.column, observation.date, observation.header, observation.text].join("|");
                    responsibleInstructors.forEach(instructorName => {
                        const instructorSourceKey = `${sourceKey}|${instructorName}`;
                        const note = normalizeNotebookNote({
                            id: `freqobs_${generateHash(instructorSourceKey)}_${generateHash(instructorSourceKey.split("").reverse().join(""))}`,
                            date: new Date().toISOString(), scope: "student", studentId: student.id, studentIds: [student.id], studentName: student.name,
                            notes: [observation.text, "", `Origem: ${observation.sheet || observation.uc || "Planilha de frequência"}`, observation.header ? `Campo: ${observation.header}` : "", observation.date ? `Data identificada: ${observation.date}` : ""].filter(Boolean).join("\n"),
                            urgency: "normal", treatmentStatus: "em_tratativa", responsibleAnalyst: "", situationTypes: ["Observação da frequência"],
                            situationDate: "", treatmentStartDate: "", treatmentDays: null, treatmentDueDate: "", attachments: [],
                            turma: data.turma, instructorName, sourceType: "frequency_observation", sourceKey: instructorSourceKey,
                            sourceSheet: observation.sheet || observation.uc || "", dismissed: false, ownerEmail: getCurrentAuthenticatedEmail()
                        });
                        if (!grouped.has(instructorName)) grouped.set(instructorName, []);
                        grouped.get(instructorName).push(note);
                    });
                });
            });

            let created = 0;
            let skipped = 0;
            for (const [instructorName, notes] of grouped.entries()) {
                await loadNotebookNotes(data.turma, instructorName);
                const existing = new Map(readNotebookNotesLocal(makeNotebookStorageKey(data.turma, instructorName)).map(note => [String(note.id), note]));
                for (const note of notes) {
                    if (existing.has(String(note.id))) { skipped++; continue; }
                    await persistNotebookNote(data.turma, instructorName, note);
                    existing.set(String(note.id), note);
                    created++;
                }
            }
            return { created, skipped };
        };

        const maskCPF = (cpf) => {
            const clean = cpf.replace(/\D/g, ''); if(clean.length < 3) return cpf;
            if(clean.length >= 9) return `***.${clean.substr(3,3)}.${clean.substr(6,3)}-**`; return cpf;
        };

        const generateSignatureBlock = (role, name, cpf, matricula, rubricaSrc) => {
            if (rubricaSrc) {
                return `
                    <div class="sig-block" style="text-align: center; margin: 20px auto 30px auto; width: 100%;">
                        <img src="${rubricaSrc}" alt="Assinatura" style="height: 60px; max-width: 200px; margin-bottom: 5px; object-fit: contain; display: block; margin-left: auto; margin-right: auto;" />
                        <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse: collapse; width: 300px; margin: 5px auto 0 auto;"><tr><td style="border-top: 1px solid #000000; height: 1px; line-height: 1px; font-size: 1px;">&nbsp;</td></tr></table>
                        <div><strong>${name}</strong></div>
                        <div>${role}</div>
                    </div>
                `;
            }
            if(cpf && cpf.length > 5 && matricula && matricula.length > 2) {
                const now = new Date();
                const timestamp = now.toLocaleDateString() + " " + now.toLocaleTimeString();
                const hash = generateHash(name + cpf + matricula + timestamp);
                const masked = maskCPF(cpf);
                return `
                    <div class="sig-digital-block" style="border: 1px solid #ccc; padding: 10px; margin: 10px auto; width: 90%; max-width: 400px; text-align: left; font-size: 10pt; background-color: #f9f9f9;">
                        <div style="font-weight: bold; border-bottom: 1px solid #ddd; margin-bottom: 5px; padding-bottom: 2px;">Assinado Eletronicamente</div>

                        <div><strong>CPF:</strong> ${masked} | <strong>Matrícula:</strong> ${matricula}</div>
                        <div style="margin-top:5px; font-size: 8pt; color: #555;">Hash de Validação: <span style="font-family: monospace;">${hash}</span></div>
                        <div style="font-size: 8pt; color: #777;">Data: ${timestamp}</div>
                        <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse: collapse; width: 300px; margin: 14px auto 0 auto;"><tr><td style="border-top: 1px solid #000000; height: 1px; line-height: 1px; font-size: 1px;">&nbsp;</td></tr></table>
                    </div>
                `;
            }
            return `
                <div class="sig-block" style="text-align: center; margin: 20px auto 30px auto; width: 100%;">
                    <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse: collapse; width: 300px; margin: 0 auto 5px auto;"><tr><td style="border-top: 1px solid #000000; height: 1px; line-height: 1px; font-size: 1px;">&nbsp;</td></tr></table>
                    <div><strong>${name}</strong></div>
                    <div>${role}</div>
                </div>`;
        };

        const UC_NUMBER_WORDS = {
            1: "um", 2: "dois", 3: "três", 4: "quatro", 5: "cinco", 6: "seis", 7: "sete", 8: "oito", 9: "nove", 10: "dez",
            11: "onze", 12: "doze", 13: "treze", 14: "quatorze", 15: "quinze", 16: "dezesseis", 17: "dezessete", 18: "dezoito", 19: "dezenove", 20: "vinte",
            21: "vinte e um", 22: "vinte e dois", 23: "vinte e três", 24: "vinte e quatro", 25: "vinte e cinco", 26: "vinte e seis", 27: "vinte e sete", 28: "vinte e oito", 29: "vinte e nove", 30: "trinta"
        };

        const formatUCInAta = (value) => {
            const raw = String(value || "").trim();
            const match = raw.match(/UC\s*(\d+)/i);
            if (!match) return raw;
            const number = Number(match[1]);
            return `UC ${number} (${UC_NUMBER_WORDS[number] || number})`;
        };

        const formatUCSInAta = (values) => (values || []).map(formatUCInAta).join(", ");

        const generateAtaHTMLContent = (analistaName, analistaCPF, analistaMatricula, analistaRubrica, students, course, turma, tutor1, tutor1CPF, tutor1Matricula, tutor1Rubrica, tutor2, tutor2CPF, tutor2Matricula, tutor2Rubrica, logoSrc) => {
            const date = new Date();
            const dateStr = date.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });
            const finalLogo = logoSrc || "https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Senac_logo.svg/500px-Senac_logo.svg.png";
            const studentsWithIssues = students.filter(s => (s.needs_recuperacao || s.needs_conselho) && !s.is_dropout && !s.is_process_dropout);
            const studentsOk = students.filter(s => !s.needs_recuperacao && !s.needs_conselho && !s.is_dropout && !s.is_process_dropout);
            const studentsDropouts = students.filter(s => s.is_dropout);
            const studentsProcess = students.filter(s => s.is_process_dropout);

            const rangeTutor1 = `${formatUCInAta("UC1")} à ${formatUCInAta("UC6")}`;
            const rangeTutor2 = isVendas ? `${formatUCInAta("UC7")} à ${formatUCInAta("UC13")}` : `${formatUCInAta("UC7")} à ${formatUCInAta("UC11")}`;
            let textIssues = "";

                if (s.needs_recuperacao) { const ucs = ucsPerf || "Geral"; desc = `o(a) aluno(a) <strong>${s.name}</strong> não atendeu os indicadores de avaliação na(s) Unidade(s) Curricular(es) ${ucs}, não desenvolvendo o curso`; } 
                else if (s.needs_conselho) { desc = `o(a) aluno(a) <strong>${s.name}</strong> finalizou a(s) Unidade(s) Curricular(es) ${ucsFreq} com baixa frequência, porém atendeu os indicadores finais de avaliação, desenvolvendo o curso`; }
                return desc;
            });
            if (issueDescriptions.length > 0) textIssues = issueDescriptions.join("; ") + ".";
            let textOk = studentsOk.length > 0 ? "Os demais alunos que compõem a turma desenvolveram o curso sem ressalvas." : "";
            let textDropouts = "";
            if (studentsDropouts.length > 0) { const names = studentsDropouts.map(s => s.name).join(", "); textDropouts = `<p>Constatou-se ainda que os alunos <strong>${names}</strong>, solicitaram desligamento do Programa de Aprendizagem.</p>`; }
            let textProcess = "";
            if (studentsProcess.length > 0) { const names = studentsProcess.map(s => s.name).join(", "); textProcess = `<p>Os alunos <strong>${names}</strong> encontram-se em processo administrativo de desligamento.</p>`; }
            const dropoutNames = studentsDropouts.map(s => s.name).join(", ");
            const textDropoutsWithoutDocument = `<p><strong>Desligados sem documento:</strong> O Conselho registrou a informação de que ${dropoutNames ? `<strong>${dropoutNames}</strong>` : "o(a) aluno(a) citado(a)"} solicitaram o desligamento; entretanto, até a presente data, não foram recebidos os documentos comprobatórios.</p>`;
            const sigAnalista = generateSignatureBlock("Analista Responsável", analistaName || "Analista", analistaCPF, analistaMatricula, analistaRubrica);
            const sigTutor1 = generateSignatureBlock("Instrutor(a)", tutor1, tutor1CPF, tutor1Matricula, tutor1Rubrica);
            const sigTutor2 = generateSignatureBlock("Instrutor(a)", tutor2, tutor2CPF, tutor2Matricula, tutor2Rubrica);
            return `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>

                <style>
                    body { font-family: 'Aptos', Arial, sans-serif; font-size: 12pt; line-height: 1.5; text-align: justify; margin: 20px; color: #000; background: white; }

                </head>
                <body>
                    <div id="print-area">
                        <div class="logo-container"><img src="${finalLogo}" width="120" style="max-width: 150px; height: auto;"></div>
                        <div class="header">UNIDADE DE EDUCAÇÃO PROFISSIONAL E TECNOLÓGICA DO SENAC, EM CURITIBA</div>
                        <div class="ata-number">ATA Nº: _________________</div>
                        <p>Ata do Conselho de Classe, do curso de <strong>${course}</strong>, Formação Inicial e Continuada, turma <strong>${turma}</strong>, para deliberar sobre a situação dos alunos citados abaixo. No dia ${dateStr}, foram convocados pela Analista <strong>${analistaName || "[ANALISTA]"}</strong>, os(as) instrutores(as) <strong>${tutor1} (${rangeTutor1})</strong> e <strong>${tutor2} (${rangeTutor2})</strong>.</p>

                    </div>

            `;
        };

        const downloadAtaDocument = (contentRef, turma) => {
            if (!contentRef.current) return;
            const editedHtml = contentRef.current.innerHTML;
            const fullHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Ata</title><style>@page { size: A4; margin: 3cm 2cm 2cm 3cm; } body { font-family: 'Aptos', Arial, sans-serif; text-align: justify; font-size: 12pt; line-height: 1.5; } .document-date { text-align: right !important; text-indent: 0 !important; }</style></head><body>${editedHtml}</body></html>`;

        const printAtaDocument = () => {
             const style = document.createElement('style');
             style.innerHTML = `@media print { @page { size: A4 portrait; margin: 2cm; } body { font-family: 'Aptos', Arial, sans-serif !important; text-align: justify; -webkit-print-color-adjust: exact; } .document-date { text-align: right !important; text-indent: 0 !important; } }`;

             document.head.removeChild(style);

        const getUCNumber = (value) => {

ontent)return;const done=()=>{if(typeof afterCopy==='function')afterCopy();else alert('Relatório copiado. Cole no Outlook com Ctrl+V para manter o layout.');};if(navigator.clipboard&&window.ClipboardItem){const item=new ClipboardItem({'text/html':new Blob([content.outerHTML],{type:'text/html'}),'text/plain':new Blob([content.innerText],{type:'text/plain'})});navigator.clipboard.write([item]).then(done).catch(()=>fallback(done));}else fallback(done);}function fallback(done){const range=document.createRange();range.selectNodeContents(document.getElementById('report-content'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);try{document.execCommand('copy');done();}finally{selection.removeAllRanges();}}function sendEmail(){const type=document.getElementById('recipient').value;const list=type==='supervisor'?supervisorRecipients:studentRecipients;const emails=[...new Set(list.map(item=>String(item.email||'').trim()).filter(Boolean))];if(emails.length===0){alert(type==='supervisor'?'Nenhum e-mail de supervisor foi informado.':'Nenhum e-mail de aluno foi informado.');return;}copyReport(()=>{alert('Relatório copiado. Cole no corpo do Outlook com Ctrl+V para manter o layout.');window.location.href='mailto:'+emails.join(';')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(document.getElementById('report-content').innerText);});}${String.fromCharCode(60)}/script></body></html>`;

:1px solid #d9e2ec;border-left:3px solid #004587;padding:8px;margin:6px 0;font-size:11px}.status-pill{display:inline-block;border-radius:4px;background:#eef5fb;color:#004587;padding:2px 5px;font-size:10px}.meta{color:#64748b;font-size:10px;margin-top:4px}@media(max-width:760px){.report-menu{align-items:flex-start;flex-direction:column;gap:8px}.info-grid{grid-template-columns:1fr}}@media print{.report-menu{display:none!important}}</style></head><body><div class="report-menu"><div class="menu-title">Relatório completo por UCs</div><div class="menu-actions"><select id="report-recipient" class="recipient-select"><option value="student">Enviar para estudante(s)</option><option value="supervisor">Enviar para supervisor(es)</option></select><button class="btn" onclick="sendReportEmail()">Enviar por Outlook</button><button class="btn" onclick="copyReport()">Copiar para e-mail</button><button class="btn" onclick="window.print()">Imprimir / PDF</button></div></div><div id="report-content"><div class="report-header"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Senac_logo.svg/500px-Senac_logo.svg.png" alt="Senac"/><h1>Relatório completo da turma/aluno</h1><h2>${escapeReportHTML(course)}</h2><div><strong>Turma:</strong> ${escapeReportHTML(turma)} | <strong>Intervalo:</strong> ${escapeReportHTML(rangeLabel)} | <strong>Emitido em:</strong> ${dateStr}<br><strong>Instrutores:</strong> ${escapeReportHTML(tutor1)} / ${escapeReportHTML(tutor2)}</div></div>${studentHTML}</div><script>const studentRecipients=${JSON.stringify(studentRecipients)};const supervisorRecipients=${JSON.stringify(supervisorRecipients)};const subject=${JSON.stringify(reportSubject)};function copyReport(afterCopy){const content=document.getElementById('report-content');if(!content)return;const done=()=>{if(typeof afterCopy==='function')afterCopy();else alert('Relatório copiado. Cole no Outlook ou em outro documento.');};if(navigator.clipboard&&window.ClipboardItem){const item=new ClipboardItem({'text/html':new Blob([content.outerHTML],{type:'text/html'}),'text/plain':new Blob([content.innerText],{type:'text/plain'})});navigator.clipboard.write([item]).then(done).catch(()=>fallbackCopy(done));}else fallbackCopy(done);}function fallbackCopy(done){const range=document.createRange();range.selectNodeContents(document.getElementById('report-content'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);try{document.execCommand('copy');done();}finally{selection.removeAllRanges();}}function sendReportEmail(){const type=document.getElementById('report-recipient').value;const list=type==='supervisor'?supervisorRecipients:studentRecipients;const emails=[...new Set(list.map(item=>String(item.email||'').trim()).filter(Boolean))];if(emails.length===0){alert(type==='supervisor'?'Nenhum e-mail de supervisor foi informado.':'Nenhum e-mail de estudante foi informado.');return;}copyReport(()=>{alert('Relatório copiado. Cole no corpo do Outlook com Ctrl+V para manter o layout.');window.location.href='mailto:'+emails.join(';')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(document.getElementById('report-content').innerText);});}<\/script></body></html>`;
            const rangeOutlookPattern = "copyReport(()=>{alert('Relatório copiado. Cole no corpo do Outlook com Ctrl+V para manter o layout.');window.location.href='mailto:'+emails.join(';')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(document.getElementById('report-content').innerText);});";
            const rangeOutlookReplacement = "const outlookWindow=window.open('about:blank','_blank');copyReport(()=>{const body=document.getElementById('report-content').innerText;const outlookUrl='https://outlook.office.com/mail/deeplink/compose?to='+encodeURIComponent(emails.join(';'))+'&subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);if(outlookWindow)outlookWindow.location.href=outlookUrl;else window.location.href=outlookUrl;});";
            const completeHTML = htmlContent.replace(rangeOutlookPattern, rangeOutlookReplacement).replace(`${escapeReportHTML(tutor1)} / ${escapeReportHTML(tutor2)}`, escapeReportHTML(instructorLabel));
            printWindow.document.write(completeHTML);

        };

        const generateReport = (selectedStudentIds, students, turma, course, tutor1, tutor2, activityTracking, reportData, naJustifications) => {

                </style></head><body>
                    <div class="report-menu"><div class="menu-title">Relatório</div><div class="menu-actions"><select id="report-recipient" class="recipient-select"><option value="student">Enviar para estudante${recipientLabel}</option><option value="supervisor">Enviar para supervisor${recipientLabel}</option></select><button onclick="sendReportEmail()" class="btn" title="Copia o layout formatado e abre o Outlook">Enviar por Outlook</button><button onclick="copyReportVisual()" id="copy-report" class="btn">Copiar para e-mail</button><button onclick="window.print()" class="btn">Imprimir</button></div></div>
                    <div id="report-content">

                    <h1 style="text-align:center; font-size:18px;">Relatório de Desempenho</h1>

                        <strong>Turma:</strong> ${turma} | <strong>Data:</strong> ${dateStr}<br>

                    </div>
                    ${selected.map((s, studentIndex) => {

                        if(s.is_dropout) statusColor = "color:#f97316"; else if(s.is_process_dropout) statusColor = "color:#9333ea"; else if(s.needs_recuperacao) statusColor = "color:#dc2626"; else if(s.needs_conselho) statusColor = "color:#ca8a04";
                        const primaryObservation = getPrimaryPedagogicalObservation(s);

                        const activitySummary = getActivityStudentSummary(activityTracking, s.name);
                        const activityAttention = activitySummary ? activitySummary.entries.filter(entry => isActivityAttentionStatus(entry.status)) : [];
                        const activityItemsHtml = activityAttention.slice(0, 18).map(entry => '<span class="source-tag">' + formatActivityStatusLabel(entry.status) + ':</span>' + entry.label).join("<br>");
                        const activityMoreHtml = activityAttention.length > 18

                            : '';
                        const activityHtml = activitySummary && activitySummary.total > 0

                            '<div class="info-grid">' + (s.orionCode ? '<div><strong>Código Órion:</strong> ' + s.orionCode + '</div>' : '') + '<div><strong>Frequência Global:</strong> ' + s.averageFreq + '%</div><div><strong>Contra Turno:</strong> ' + s.contra_turno_desc + '</div></div>' +
                            (s.low_freq_ucs.length > 0 ? '<div style="font-size:12px; color:#ca8a04;">⚠️ Baixa Frequência: ' + s.low_freq_ucs.join(", ") + '</div>' : '') +
                            (s.failed_perf_ucs.length > 0 ? '<div style="font-size:12px; color:#dc2626;">❌ Desempenho: ' + s.failed_perf_ucs.join(", ") + '</div>' : '') +
                            mainObsHtml + naHtml + activityHtml + '</div>';
                    }).join('')}
                    </div>
                    <script>

                            copyReportVisual(() => {
                                const body = document.getElementById('report-content')?.innerText || 'Relatório de Desempenho';
                                const outlookUrl = 'https://outlook.office.com/mail/deeplink/compose?to=' + encodeURIComponent(emails.join(';')) + '&subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
                                if (outlookWindow) outlookWindow.location.href = outlookUrl;

                        function copyReportVisual(afterCopy) {

        const AuthGate = () => {

            const [user, setUser] = useState(null);
