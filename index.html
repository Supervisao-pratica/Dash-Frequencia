                setContactDraft(normalizeStudentContact(current, current.name));
                setContactMessage("");
            }, [selectedStudentForModal ? selectedStudentForModal.id : null, data]);

            // Carrega notas locais ou do Firestore e inclui também registros feitos para a turma inteira.
            useEffect(() => {
                if (selectedStudentForModal && data) {
                    const instructors = activeInstructorNames;
                    let isCurrent = true;
                    Promise.all(instructors.map(async instName => {
                        const loaded = await loadNotebookNotes(data.turma, instName);
                        return loaded.notes
                            .filter(note => note.scope === "class" || Number(note.studentId) === Number(selectedStudentForModal.id) || (note.studentIds || []).includes(Number(selectedStudentForModal.id)))
                            .map(note => ({ ...note, instructorSource: instName }));
                    })).then(groups => {
                        if (!isCurrent) return;
                        const allFoundNotes = groups.flat().sort((a, b) => new Date(b.date) - new Date(a.date));
                        setInstructorNotesForStudent(allFoundNotes);
                    });
                    return () => { isCurrent = false; };
                } else {
                    setInstructorNotesForStudent([]);
                }
            }, [selectedStudentForModal, data, activeInstructorNames]);

            const refreshClassNotebookNotes = () => {
                if (!data || activeInstructorNames.length === 0) {
                    setClassNotebookNotes([]);
                    return;
                }
                Promise.all(activeInstructorNames.map(async instructorName => {
                    const loaded = await loadNotebookNotes(data.turma, instructorName);
                    return loaded.notes.map(note => ({ ...note, instructorSource: note.instructorName || instructorName }));
                })).then(groups => setClassNotebookNotes(groups.flat().sort((a, b) => new Date(b.date) - new Date(a.date))))
                    .catch(error => console.error("Erro ao atualizar sinalizações do caderno", error));
            };

            const handleStudentNoteStatusChange = async (note, nextStatus) => {
                const instructorName = note.instructorSource || note.instructorName || "Instrutor";
                const updatedNote = normalizeNotebookNote({ ...note, treatmentStatus: nextStatus });
                setInstructorNotesForStudent(current => current.map(item => item.id === updatedNote.id && (item.instructorSource || item.instructorName) === instructorName ? { ...updatedNote, instructorSource: instructorName } : item));
                setClassNotebookNotes(current => current.map(item => item.id === updatedNote.id && (item.instructorSource || item.instructorName) === instructorName ? { ...updatedNote, instructorSource: instructorName } : item));
                const saved = await updateNotebookNote(data.turma, instructorName, updatedNote);
                if (saved.source === "local") console.warn("Status atualizado localmente; verifique a autenticação para sincronizar com o Firebase.");
                refreshClassNotebookNotes();
            };

            useEffect(() => {
                refreshClassNotebookNotes();
            }, [data ? data.turma : "", activeInstructorNames.join("|")]);


            useEffect(() => {
                if (showAtaModal && data && ataContentRef.current) {
                    const html = generateAtaHTMLContent(
                        analistaName, analistaCPF, analistaMatricula, analistaRubrica,
                        data.students, data.course, data.turma, 
                        tutor1Name, tutor1CPF, tutor1Matricula, tutor1Rubrica, 
                        tutor2Name, tutor2CPF, tutor2Matricula, tutor2Rubrica, 
                        customLogo
                    );
                    const bodyContent = html.match(/<body>([\s\S]*)<\/body>/)[1];
                    ataContentRef.current.innerHTML = bodyContent;
                    ataContentRef.current.id = "ata-preview-content";
                }
            }, [showAtaModal, analistaName, analistaCPF, analistaMatricula, analistaRubrica, tutor1Name, tutor1CPF, tutor1Matricula, tutor1Rubrica, tutor2Name, tutor2CPF, tutor2Matricula, tutor2Rubrica, customLogo, data]);

            const handleFile = async (file) => {
                if (!file) return;
                try {
                    const buffer = await file.arrayBuffer();
                    const workbook = window.XLSX.read(buffer, { type: 'array', bookSheets: true });
                    if ((workbook.SheetNames || []).some(name => compactGeneralHeader(name) === "DADOSGERAIS")) {
                        if (!data) throw new Error("Este é um arquivo de Informações Gerais. Carregue primeiro a planilha de frequência da turma.");
                        await handleGeneralDataFile(file, buffer);
                        return;
                    }
                    const processed = processExcelFile(buffer);
                    if (processed) { 
                        setData(processed); 
                        setActivityTracking(null);
                        setReportSelection([]); 
                        setSelectedUC('all');
                        seedImportedStudentContacts(processed.turma, processed.students).catch(error => console.error("Erro ao sincronizar contatos importados", error));
                        if (processed.attendanceWarnings && processed.attendanceWarnings.length > 0) {
                            setTimeout(() => alert(summarizeAttendanceWarnings(processed.attendanceWarnings)), 100);
                        }
                    }
                } catch (e) { alert("Erro: " + e.message); }
            };

            const handleGeneralDataFile = async (file, providedBuffer = null) => {
                if (!file || !data) return;
                try {
                    const buffer = providedBuffer || await file.arrayBuffer();
                    const workbook = window.XLSX.read(buffer, { type: 'array', cellDates: true, cellStyles: true });
                    const importedContacts = parseGeneralDataContacts(workbook);
                    const importedKeys = Object.keys(importedContacts);
                    if (importedKeys.length === 0) throw new Error("A aba DADOS GERAIS não foi encontrada ou não possui alunos reconhecíveis.");
                    const loaded = await loadStudentContacts(data.turma);
                    let matched = 0;
                    const students = data.students.map(student => {
                        const key = normalizeName(student.name);
                        const imported = importedContacts[key];
                        if (!imported) return student;
                        matched += 1;
                        const saved = loaded.contacts[key];
                        return { ...student, ...normalizeStudentContact(saved || imported, student.name) };
                    });
                    setData(previous => previous ? { ...previous, students } : previous);
                    for (const key of importedKeys) {
                        if (!loaded.contacts[key]) await persistStudentContact(data.turma, { ...importedContacts[key], studentKey: key });
                    }
                    setContactStorageSource((await getNotebookFirestore()) ? "cloud" : "local");
                    alert(`Dados Gerais carregados: ${matched} aluno(s) associado(s) à turma.`);
                } catch (error) {
                    alert("Erro ao ler os Dados Gerais: " + error.message);
                }
            };

            const saveStudentContact = async () => {
                if (!data || !selectedStudentForModal) return;
                const index = data.students.findIndex(student => student.id === selectedStudentForModal.id);
                if (index === -1) return;
                setContactSaving(true);
                setContactMessage("");
                const student = data.students[index];
                const normalized = normalizeStudentContact(contactDraft, student.name);
                const updatedStudent = { ...student, ...normalized };
                setData(previous => previous ? { ...previous, students: previous.students.map((item, itemIndex) => itemIndex === index ? updatedStudent : item) } : previous);
                setSelectedStudentForModal(updatedStudent);
                try {
                    const saved = await persistStudentContact(data.turma, { ...normalized, studentKey: normalizeName(student.name) });
                    setContactStorageSource(saved.source);
                    setContactMessage(saved.source === "cloud" ? "Dados salvos no Firebase e compartilhados com a equipe." : "Dados salvos neste dispositivo.");
                } catch (error) {
                    setContactMessage("Não foi possível sincronizar com o Firebase; os dados ficaram salvos localmente.");
                } finally {
                    setContactSaving(false);
                }
            };
            const handleActivityFile = async (file) => {
                if (!file || !data) return;
                const uploadSequence = ++activityUploadSequence.current;
                setActivityTracking(null);
                try {
                    const buffer = await file.arrayBuffer();
                    const tracking = processActivityWorkbook(buffer, data.students, file.name);
                    if (uploadSequence !== activityUploadSequence.current) return;
                    const hasMatchedStudents = tracking && Object.keys(tracking.students || {}).length > 0;
                    if (!tracking || tracking.sheets.length === 0 || !hasMatchedStudents) {
                        setActivityTracking(null);
                        alert("Não foi encontrada uma estrutura de atividades com nomes de alunos e colunas de acompanhamento.");
                        return;
                    }
                    setActivityTracking(tracking);
                } catch (e) { alert("Erro ao ler o acompanhamento de atividades: " + e.message); }
            };
            const toggleNAJustification = async (entry) => {
                if (!data || !data.turma || !entry || !entry.key) return;
                const currentValue = naJustifications[entry.key];
                if (currentValue) {
                    setNaJustifications(previous => {
                        const next = { ...previous };
                        delete next[entry.key];
                        writeNAJustificationsLocal(data.turma, next);
                        return next;
                    });
                    await removeNAJustification(data.turma, entry.key);
                    return;
                }
                const value = {
                        justifiedAt: new Date().toISOString(),
                        sheet: entry.sheet,
                        date: entry.date,
                        reason: String(naJustificationDrafts[entry.key] || "").trim()
                };
                setNaJustifications(previous => {
                    const next = { ...previous, [entry.key]: value };
                    writeNAJustificationsLocal(data.turma, next);
                    return next;
                });
                await persistNAJustification(data.turma, entry.key, value);
            };
            const saveNAJustificationReason = async (entry) => {
                if (!data || !data.turma || !entry || !entry.key || !naJustifications[entry.key]) return;
                const value = {
                    ...naJustifications[entry.key],
                    reason: String(naJustificationDrafts[entry.key] || "").trim(),
                    updatedAt: new Date().toISOString()
                };
                setNaJustifications(previous => {
                    if (!previous[entry.key]) return previous;
                    const next = {
                        ...previous,
                        [entry.key]: value
                    };
                    writeNAJustificationsLocal(data.turma, next);
                    return next;
                });
                await persistNAJustification(data.turma, entry.key, value);
            };
            const handleLogoUpload = (e) => { const file = e.target.files[0]; if(file) { const r = new FileReader(); r.onloadend=()=>{setCustomLogo(r.result)}; r.readAsDataURL(file); } };
            const handleDrop = (e) => { e.preventDefault(); setDragActive(false); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };

            const getStudentScopeStatus = (student, uc) => {
                if (student.is_dropout) return "dropout";
                if (student.is_process_dropout) return "process";
                if (uc !== "all") {
                    const ucData = student.uc_scores && student.uc_scores[uc];
                    if (!ucData || isNaN(Number(ucData.score))) return "pending";
                    const scorePercent = Number(ucData.score) <= 1 ? Number(ucData.score) * 100 : Number(ucData.score);
                    if (isNotDevelopedStatus(ucData.status)) return "failed";
                    if (scorePercent < 75) return "lowFreq";
                    return "developed";
                }
                if (student.needs_recuperacao) return "failed";
                if (student.needs_conselho) return "lowFreq";
                return "developed";
            };

            const stats = useMemo(() => {
                if (!data) return null;
                const total = data.students.length;
                let dropout = 0, process = 0, failed = 0, warning = 0, developed = 0, totalScore = 0, validScoreCount = 0;

                data.students.forEach(s => {
                    const scopeStatus = getStudentScopeStatus(s, selectedUC);
                    if (scopeStatus === "dropout") dropout++;
                    else if (scopeStatus === "process") process++;
                    else if (scopeStatus === "failed") failed++;
                    else if (scopeStatus === "lowFreq") warning++;
                    else if (scopeStatus === "developed") developed++;

                    let score = parseFloat(s.averageFreq);
                    if (selectedUC !== 'all' && s.uc_scores && s.uc_scores[selectedUC]) {
                        const ucScore = Number(s.uc_scores[selectedUC].score);
                        score = (ucScore <= 1 ? ucScore * 100 : ucScore);
                    }
                    if (!isNaN(score)) { totalScore += score; validScoreCount++; }
                });
                return { total, failed, developed, warning, dropout, process, avgClass: validScoreCount > 0 ? (totalScore / validScoreCount).toFixed(1) : "0.0" };
            }, [data, selectedUC]);

            const toggleProcessDropout = (studentId) => {
                const newData = { ...data };
                const sIndex = newData.students.findIndex(s => s.id === studentId);
                if (sIndex > -1) {
                    const student = newData.students[sIndex];
                    const current = student.is_process_dropout;
                    const newValue = !current;
                    student.is_process_dropout = newValue;
                    if(newValue) { student.status = "Em Processo de Desligamento"; } else { if (student.needs_recuperacao) student.status = "Não Desenvolveu"; else if (student.needs_conselho) student.status = "Conselho de Classe"; else student.status = "Desenvolveu"; }
                    setData(newData);
                    const currentManualList = getManualProcessList(data.turma);
                    const normalizedName = normalizeName(student.name);
                    let newList;
                    if (newValue) { if(!currentManualList.includes(normalizedName)) newList = [...currentManualList, normalizedName]; else newList = currentManualList; } else { newList = currentManualList.filter(n => n !== normalizedName); }
                    saveManualProcessList(data.turma, newList);
                    if(selectedStudentForModal && selectedStudentForModal.id === studentId) setSelectedStudentForModal(student);
                }
            };

            const filteredStudents = useMemo(() => {
                if (!data) return [];
                return data.students.filter(s => {
                    const matchesSearch = s.name.toLowerCase().includes(searchTerm.toLowerCase());
                    if (!matchesSearch) return false;
                    const scopeStatus = getStudentScopeStatus(s, selectedUC);
                    if (filter === 'developed') return scopeStatus === 'developed';
                    if (filter === 'failed') return scopeStatus === 'failed';
                    if (filter === 'lowFreq') return scopeStatus === 'lowFreq';
                    if (filter === 'dropout') return scopeStatus === 'dropout';
                    if (filter === 'process') return scopeStatus === 'process';
                    return true;
                });
            }, [data, filter, searchTerm, selectedUC]);

            const toggleStudentSelection = (id) => setReportSelection(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
            const toggleSelectAll = () => setReportSelection(reportSelection.length === filteredStudents.length ? [] : filteredStudents.map(s => s.id));
            const activityAttentionStudents = activityTracking ? Object.values(activityTracking.students).filter(student => student.not_completed + student.blank + student.requires_evaluation > 0).sort((a, b) => (b.not_completed + b.blank + b.requires_evaluation) - (a.not_completed + a.blank + a.requires_evaluation)) : [];
            const selectedActivitySummary = selectedStudentForModal ? getActivityStudentSummary(activityTracking, selectedStudentForModal.name) : null;
            const naAttentionStudents = data && data.naAlerts ? Object.values(data.naAlerts.students).map(student => getNAStudentSummary(data, student.name, naJustifications)).filter(student => student && student.count >= 2).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, "pt-BR")) : [];
            const selectedNAStudentSummary = selectedStudentForModal ? getNAStudentSummary(data, selectedStudentForModal.name, naJustifications) : null;
            const selectedNAStudentRaw = selectedStudentForModal && data && data.naAlerts && data.naAlerts.students ? data.naAlerts.students[normalizeName(selectedStudentForModal.name)] : null;
            const naAttentionTotal = naAttentionStudents.reduce((total, student) => total + student.count, 0);
            const selectedObservationGroups = useMemo(() => {
                if (!selectedStudentForModal) return [];
                const groups = new Map();
                [...(selectedStudentForModal.all_observations || [])]
                    .sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")) || String(a.sheet || a.source || "").localeCompare(String(b.sheet || b.source || ""), "pt-BR"))
                    .forEach(observation => {
                        const label = getObservationGroupLabel(observation);
                        if (!groups.has(label)) groups.set(label, []);
                        groups.get(label).push(observation);
                    });
                return Array.from(groups.entries());
            }, [selectedStudentForModal]);

            if (!data) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4">
                        <div className="absolute top-4 right-4 text-xs text-gray-400">Acesso Livre (Admin Mode)</div>
                        <div className="w-full max-w-2xl bg-white rounded-2xl shadow-2xl overflow-hidden animate-slide-up">
                            <div className="bg-senac-blue p-8 text-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
                                <div className="relative z-10"><h1 className="text-2xl font-bold text-white mb-2">Gestão de Frequência</h1><p className="text-blue-100">Relatório e ATA</p></div>
                            </div>
                            <div className="p-10 text-center">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Senac_logo.svg/500px-Senac_logo.svg.png" className="h-16 mx-auto mb-6" />
                                <p className="text-gray-500 mb-8 max-w-md mx-auto">Arraste sua planilha <strong>(.xlsm)</strong> para gerar o dashboard.</p>
                                <div className={`border-2 border-dashed rounded-xl p-12 transition-all cursor-pointer ${dragActive ? 'border-senac-orange bg-orange-50 scale-105' : 'border-gray-300 hover:border-senac-blue hover:bg-blue-50'}`} onDragEnter={(e) => { e.preventDefault(); setDragActive(true); }} onDragLeave={(e) => { e.preventDefault(); setDragActive(false); }} onDragOver={(e) => e.preventDefault()} onDrop={handleDrop} onClick={() => document.getElementById('fileUpload').click()}>
                                    <IconUploadCloud className={`w-16 h-16 mx-auto mb-4 ${dragActive ? 'text-senac-orange' : 'text-gray-400'}`} /><p className="text-gray-700 font-semibold text-lg">Clique ou arraste o arquivo aqui</p>
                                    <input id="fileUpload" type="file" className="hidden" accept=".xlsx, .xls, .xlsm" onChange={(e) => { handleFile(e.target.files[0]); e.target.value = ''; }} />
                                </div >
                                <p className="text-xs text-gray-500 mt-4">Depois de abrir a turma, você poderá carregar o arquivo separado de Informações Gerais.</p>
                                <div className="mt-8 pt-6 border-t border-gray-100"><button onClick={() => { setData(DEMO_DATA); setActivityTracking(null); setSelectedUC('all'); }} className="text-sm text-gray-400 hover:text-senac-orange">Testar com versão Demo</button></div>
                            </div>
                        </div>
                        <div className="absolute bottom-2 right-4 text-xs text-gray-400 font-mono">v7.6 - Caderno Atualizado</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#f0f2f5] pb-20 animate-fade-in relative">
                    <div className="absolute bottom-2 right-4 text-xs text-gray-400 font-mono">v7.6 - Caderno Atualizado</div>
                    
                    {/* MODAIS */}
                    {selectedInstructorForNotes && (
                        <InstructorNotebook 
                            instructorName={selectedInstructorForNotes} 
                            turma={data.turma} 
                            students={data.students}
                            onNotesChanged={refreshClassNotebookNotes}
                            onClose={() => setSelectedInstructorForNotes(null)} 
                        />
                    )}

                    {showNotebookReport && <NotebookNotesReport turma={data.turma} instructors={activeInstructorNames} onClose={() => setShowNotebookReport(false)} />}
                    {showUCIntervalReport && <UCIntervalReportModal data={data} activityTracking={activityTracking} naJustifications={naJustifications} notebookNotes={classNotebookNotes} onClose={() => setShowUCIntervalReport(false)} />}
                    {showStudentReportModal && selectedStudentForModal && <StudentReportOptionsModal data={data} student={selectedStudentForModal} mode={studentReportMode} activityTracking={activityTracking} naJustifications={naJustifications} notebookNotes={instructorNotesForStudent} onClose={() => setShowStudentReportModal(false)} />}

                    {showAtaModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 animate-fade-in" onClick={(e) => {if(e.target===e.currentTarget) setShowAtaModal(false)}}>
                            <div className="bg-white w-full max-w-[95%] h-[90vh] rounded-2xl shadow-2xl overflow-hidden flex flex-col">
                                <div className="bg-senac-blue p-4 text-white flex justify-between items-center shrink-0">
                                    <h2 className="text-xl font-bold flex items-center gap-2"><IconFileText className="w-6 h-6"/> Gerador de ATA Digital</h2>
                                    <button onClick={() => setShowAtaModal(false)} className="hover:bg-white/20 p-1 rounded-full"><IconXCircle className="w-6 h-6"/></button>
                                </div>
                                <div className="flex-1 overflow-hidden flex flex-col lg:flex-row">
                                    <div className="w-full lg:w-[400px] bg-gray-50 p-5 overflow-y-auto border-r border-gray-200 shrink-0 custom-scrollbar">
                                        <h3 className="text-sm font-bold text-gray-700 mb-6 uppercase tracking-wider border-b pb-2 flex items-center gap-2"><IconEdit3 className="w-4 h-4"/> Configuração da ATA</h3>
                                        <div className="space-y-6">

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6"><div className="bg-slate-50 p-4 rounded-xl border border-slate-100"><h3 className="text-sm font-bold text-gray-700 mb-2">Pendências Acadêmicas</h3><ul className="space-y-2 text-sm">{selectedStudentForModal.low_freq_ucs.length > 0 && (<li className="flex items-start gap-2 text-yellow-700"><IconAlertTriangle className="w-4 h-4 mt-0.5 shrink-0"/> <span>Baixa Frequência: <strong>{selectedStudentForModal.low_freq_ucs.join(", ")}</strong></span></li>)}{selectedStudentForModal.failed_perf_ucs.length > 0 && (<li className="flex items-start gap-2 text-red-700"><IconXCircle className="w-4 h-4 mt-0.5 shrink-0"/> <span>Dificuldade Desempenho: <strong>{selectedStudentForModal.failed_perf_ucs.join(", ")}</strong></span></li>)}{selectedStudentForModal.low_freq_ucs.length === 0 && selectedStudentForModal.failed_perf_ucs.length === 0 && (<li className="text-gray-400 italic">Nenhuma pendência registrada.</li>)}</ul></div><div className="bg-blue-50 p-4 rounded-xl border border-blue-100"><h3 className="text-sm font-bold text-blue-800 mb-2 flex items-center gap-2"><IconMessageSquare className="w-4 h-4"/> Observação Pedagógica (Principal)</h3><p className="text-sm text-blue-900 italic">{selectedStudentForModal.conselho_text || "Sem observações do conselho."}</p></div></div>
                                </div>
                                <div className="bg-gray-50 p-4 border-t border-gray-100 text-right"><button onClick={() => setSelectedStudentForModal(null)} className="px-6 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg font-medium transition-colors">Fechar</button></div>
                            </div>
                        </div>
                    )}
                    
                    <header className="bg-white border-b-4 border-senac-orange shadow-sm sticky top-0 z-20">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col xl:flex-row xl:items-start justify-between gap-5">
                            <div className="flex min-w-0 items-start gap-3 xl:w-[390px] xl:shrink-0"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Senac_logo.svg/500px-Senac_logo.svg.png" className="h-12 w-auto shrink-0 object-contain" /><div className="min-w-0 flex-1"><h1 className="text-lg md:text-xl font-bold text-senac-blue leading-tight">Gestão de Frequência - Relatório e ATA</h1><div className="mt-1 max-w-full break-words text-xs font-bold text-senac-orange uppercase leading-tight">{data.course}</div><div className="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs"><span className="font-medium text-gray-500">Turma: {data.turma}</span><button onClick={() => { setData(null); setActivityTracking(null); }} className="inline-flex shrink-0 items-center gap-1 rounded-full bg-blue-50 px-2 py-1 text-senac-blue transition-colors hover:underline"><IconRefreshCw className="w-3 h-3" /> Trocar</button><span className="text-gray-300">|</span><span className="max-w-full break-all text-gray-500">Usuário: {getCurrentAuthenticatedEmail() || "Acesso Livre"}</span><button onClick={() => {if(confirm("Reiniciar sistema?")) window.location.reload()}} className="inline-flex shrink-0 items-center gap-1 rounded-md border border-red-200 bg-red-50 px-2 py-1 font-semibold text-red-600 hover:bg-red-100"><IconLogOut className="w-3 h-3"/> Sair</button></div></div></div>
                            <div className="w-full min-w-0 flex-1 flex flex-wrap items-stretch justify-start gap-2 xl:justify-end">
                                <label className="cursor-pointer bg-white border border-senac-blue text-senac-blue hover:bg-blue-50 px-4 py-2 rounded-lg flex items-center gap-2 shadow transition-all active:scale-95 text-sm font-medium min-h-[54px] min-w-[116px] max-w-[160px] justify-center whitespace-normal text-center leading-tight" title="Ler a aba DADOS GERAIS"><IconUploadCloud className="w-4 h-4" /> Dados Gerais <input type="file" className="hidden" accept=".xlsx,.xlsm,.xls" onChange={(e) => { handleGeneralDataFile(e.target.files[0]); e.target.value = ''; }} /></label>
                                <label className="cursor-pointer bg-white border border-senac-orange text-senac-orange hover:bg-orange-50 px-4 py-2 rounded-lg flex items-center gap-2 shadow transition-all active:scale-95 text-sm font-medium min-h-[54px] min-w-[116px] max-w-[160px] justify-center whitespace-normal text-center leading-tight" title="Ler planilha de atividades"><IconUploadCloud className="w-4 h-4" /> Ler atividades <input type="file" className="hidden" accept=".xlsx,.xlsm,.xls" onChange={(e) => { handleActivityFile(e.target.files[0]); e.target.value = ''; }} /></label>
                                <button onClick={() => setShowNotebookReport(true)} className="bg-white border border-senac-orange text-senac-orange hover:bg-orange-50 px-4 py-2 rounded-lg flex items-center gap-2 shadow transition-all active:scale-95 text-sm font-medium min-h-[54px] min-w-[116px] max-w-[160px] justify-center whitespace-normal text-center leading-tight"><IconBookOpen className="w-4 h-4" /> Relatório de Anotações</button>
                                <button onClick={() => setShowUCIntervalReport(true)} className="bg-white border border-senac-blue text-senac-blue hover:bg-blue-50 px-4 py-2 rounded-lg flex items-center gap-2 shadow transition-all active:scale-95 text-sm font-medium min-h-[54px] min-w-[116px] max-w-[160px] justify-center whitespace-normal text-center leading-tight"><IconFileText className="w-4 h-4" /> Relatório por UCs</button>
                                <button onClick={() => generateReport(reportSelection, data.students, data.turma, data.course, tutor1Name, tutor2Name, activityTracking, data, naJustifications)} className="bg-white border border-senac-blue text-senac-blue hover:bg-blue-50 px-4 py-2 rounded-lg flex items-center gap-2 shadow transition-all active:scale-95 text-sm font-medium min-h-[54px] min-w-[116px] max-w-[160px] justify-center whitespace-normal text-center leading-tight disabled:opacity-50 disabled:cursor-not-allowed" disabled={reportSelection.length === 0}><IconPrinter className="w-4 h-4" /> Gerar Relatório {reportSelection.length > 0 && `(${reportSelection.length})`}</button>
                                <button onClick={() => setShowAtaModal(!showAtaModal)} className="bg-senac-blue hover:bg-blue-800 text-white px-4 py-2 rounded-lg flex items-center gap-2 shadow transition-all active:scale-95 text-sm font-medium min-h-[54px] min-w-[116px] max-w-[160px] justify-center whitespace-normal text-center leading-tight"><IconFileText className="w-4 h-4" /> Gerar ATA</button>
                            </div>
                        </div>
                        <div className="bg-white border-t border-gray-100">
                            <div className="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center gap-x-5 gap-y-1 text-xs text-gray-600">
                                <span className="flex items-center gap-2 font-bold whitespace-nowrap text-senac-orange"><IconUser className="w-3.5 h-3.5" /> Instrutores (Clique para anotar):</span>
                                {activeInstructorNames.map((instructorName, index) => <React.Fragment key={`${instructorName}-${index}`}>
                                    {index > 0 && <span className="text-gray-300">|</span>}
                                    <button
                                        onClick={() => setSelectedInstructorForNotes(instructorName)}
                                        className="whitespace-nowrap font-medium hover:bg-blue-50 px-2 py-0.5 rounded transition-colors text-blue-700 flex items-center gap-1"
                                        title="Abrir Caderno do Instrutor"
                                    >
                                        {instructorName} <IconEdit3 className="w-3 h-3 opacity-50"/>
                                    </button>
                                </React.Fragment>)}
                                {activeInstructorNames.length === 0 && <span className="text-gray-500 italic">Nenhum caderno associado ao e-mail autenticado.</span>}
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
                        <DashboardCharts stats={stats} context={selectedUC} />
                        {data.attendanceWarnings && data.attendanceWarnings.length > 0 && (
                            <div className="mb-6 bg-yellow-50 border border-yellow-200 border-l-4 border-l-yellow-500 rounded-lg p-4 text-sm text-yellow-900 shadow-sm">
                                <div className="font-bold flex items-center gap-2 mb-2"><IconAlertTriangle className="w-4 h-4"/> Pendências de preenchimento da chamada</div>
                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2">
                                    {Object.entries(data.attendanceWarnings.reduce((acc, item) => {
                                        if (!acc[item.sheet]) acc[item.sheet] = [];
                                        acc[item.sheet].push(item);
                                        return acc;
                                    }, {})).map(([sheet, items]) => (
                                        <div key={sheet} className="bg-white/70 border border-yellow-100 rounded-md px-3 py-2">
                                            <div className="font-bold text-xs text-yellow-800 mb-1">{sheet}</div>
                                            <div className="text-xs">{items.slice(0, 6).map(formatAttendanceWarning).join("; ")}{items.length > 6 ? ` e mais ${items.length - 6}` : ""}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        {naAttentionStudents.length > 0 && (
                            <div className="mb-6 bg-red-50 border border-red-200 border-l-4 border-l-red-600 rounded-lg p-4 text-sm text-red-900 shadow-sm">
                                <div className="font-bold flex items-center gap-2 mb-2"><IconAlertTriangle className="w-4 h-4"/> Atenção: alunos com 2 ou mais registros NA</div>
                                <div className="flex flex-wrap gap-2 mb-3">
                                    <div className="bg-white/80 border border-red-100 rounded-md px-3 py-2"><div className="font-bold text-xs text-red-800">Alunos</div><div className="text-lg font-bold">{naAttentionStudents.length}</div></div>
                                    <div className="bg-white/80 border border-red-100 rounded-md px-3 py-2"><div className="font-bold text-xs text-red-800">NA pendentes</div><div className="text-lg font-bold">{naAttentionTotal}</div></div>
                                </div>
                                <div className="text-xs"><strong>Alunos:</strong> {naAttentionStudents.slice(0, 16).map(student => `${student.name} (${student.count} NA)`).join("; ")}{naAttentionStudents.length > 16 ? `; e mais ${naAttentionStudents.length - 16}` : ""}</div>
                                <div className="text-[11px] text-red-700 mt-2">O instrutor pode justificar cada registro no quadro individual do aluno.</div>
                            </div>
                        )}
                        {activityTracking && activityAttentionStudents.length > 0 && (
                            <div className="mb-6 bg-red-50 border border-red-200 border-l-4 border-l-red-500 rounded-lg p-4 text-sm text-red-900 shadow-sm">
                                <div className="font-bold flex items-center gap-2 mb-2"><IconAlertTriangle className="w-4 h-4"/> Pendências de atividades</div>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-3">
                                    <div className="bg-white/80 border border-red-100 rounded-md px-3 py-2"><div className="font-bold text-xs text-red-800">Não concluiu</div><div className="text-lg font-bold">{activityTracking.totals.not_completed}</div></div>
                                    <div className="bg-white/80 border border-red-100 rounded-md px-3 py-2"><div className="font-bold text-xs text-red-800">Em branco</div><div className="text-lg font-bold">{activityTracking.totals.blank}</div></div>
                                    <div className="bg-white/80 border border-red-100 rounded-md px-3 py-2"><div className="font-bold text-xs text-red-800">Requer avaliação</div><div className="text-lg font-bold">{activityTracking.totals.requires_evaluation}</div></div>
                                </div>
                                <div className="text-xs"><strong>Alunos com pontos de atenção:</strong> {activityAttentionStudents.slice(0, 12).map(student => `${student.name} (${student.not_completed + student.blank + student.requires_evaluation})`).join("; ")}{activityAttentionStudents.length > 12 ? `; e mais ${activityAttentionStudents.length - 12}` : ""}</div>
                            </div>
                        )}
                        {classNotebookNotes.length > 0 && (
                            <div className="mb-6 bg-blue-50 border border-blue-200 border-l-4 border-l-senac-blue rounded-lg p-4 text-sm text-blue-900 shadow-sm">
                                <div className="flex flex-wrap items-center justify-between gap-2 mb-2"><div className="font-bold flex items-center gap-2"><IconBookOpen className="w-4 h-4" /> Anotações dos cadernos do instrutor</div><button onClick={() => setShowNotebookReport(true)} className="text-xs font-bold text-senac-blue hover:underline">Abrir relatório completo</button></div>
                                <div className="flex flex-wrap gap-2 mb-2"><span className="bg-white/80 border border-blue-100 rounded-md px-3 py-1 text-xs font-bold">Registros: {classNotebookNotes.length}</span><span className="bg-white/80 border border-orange-100 rounded-md px-3 py-1 text-xs font-bold text-orange-700">Tratativas em aberto: {classNotebookNotes.filter(note => ["open", "today"].includes(getNotebookTreatmentState(note))).length}</span><span className="bg-white/80 border border-red-100 rounded-md px-3 py-1 text-xs font-bold text-red-700">Vencidas: {classNotebookNotes.filter(note => getNotebookTreatmentState(note) === "overdue").length}</span></div>
                                <div className="text-xs"><strong>Últimos registros:</strong> {classNotebookNotes.slice(0, 8).map(note => `${note.scope === "class" ? "Turma toda" : note.studentName} (${getNotebookSituationLabel(note)})`).join("; ")}{classNotebookNotes.length > 8 ? `; e mais ${classNotebookNotes.length - 8}` : ""}</div>
                            </div>
                        )}
                        <div className="bg-white p-2 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-28 z-10">
                            <div className="flex gap-1 overflow-x-auto w-full md:w-auto px-1 items-center">
                                <button onClick={toggleSelectAll} className="mr-2 text-gray-400 hover:text-senac-blue">{reportSelection.length > 0 && reportSelection.length === filteredStudents.length ? <IconCheckSquare className="w-5 h-5" /> : <IconSquare className="w-5 h-5" />}</button>
                                
                                <div className="relative mr-2">
                                    <IconFilter className="w-3 h-3 absolute left-2 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none"/>
                                    <select 
                                        value={selectedUC} 
                                        onChange={(e) => setSelectedUC(e.target.value)}
                                        className="pl-7 pr-4 py-2 rounded-lg text-xs font-bold border border-gray-200 bg-gray-50 text-gray-700 hover:bg-white focus:ring-2 focus:ring-senac-blue cursor-pointer transition-all appearance-none"
                                        style={{backgroundImage: 'none'}}
                                    >
                                        <option value="all">Todas as UCs (Global)</option>
                                        {data.ucs.map(uc => <option key={uc} value={uc}>{uc}</option>)}
                                    </select>
                                </div>

                                <button onClick={() => setFilter('all')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${filter === 'all' ? 'bg-senac-blue text-white shadow-md' : 'text-gray-500 hover:bg-gray-50'}`}>Todos ({stats.total})</button>
                                <button onClick={() => setFilter('developed')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${filter === 'developed' ? 'bg-green-600 text-white shadow-md' : 'text-green-600 hover:bg-green-50'}`}>Desenvolveu ({stats.developed})</button>
                                <button onClick={() => setFilter('failed')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${filter === 'failed' ? 'bg-red-600 text-white shadow-md' : 'text-red-600 hover:bg-red-50'}`}>Recuperação ({stats.failed})</button>
                                <button onClick={() => setFilter('lowFreq')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${filter === 'lowFreq' ? 'bg-yellow-500 text-white shadow-md' : 'text-yellow-600 hover:bg-yellow-50'}`}>Conselho ({stats.warning})</button>
                                <button onClick={() => setFilter('process')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${filter === 'process' ? 'bg-purple-600 text-white shadow-md' : 'text-purple-600 hover:bg-purple-50'}`}>Em Processo ({stats.process})</button>
                                <button onClick={() => setFilter('dropout')} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${filter === 'dropout' ? 'bg-orange-500 text-white shadow-md' : 'text-orange-500 hover:bg-orange-50'}`}>Evasão ({stats.dropout})</button>
                            </div>
                            <div className="relative w-full md:w-64 mr-2"><IconSearch className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4" /><input type="text" placeholder="Buscar aluno..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 rounded-lg bg-gray-50 border-none focus:ring-2 focus:ring-senac-blue text-sm transition-all" /></div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                            {filteredStudents.length === 0 ? (<div className="col-span-full py-16 text-center"><div className="inline-block p-4 rounded-full bg-gray-100 mb-4"><IconSearch className="w-8 h-8 text-gray-400"/></div><p className="text-gray-500 font-medium">Nenhum aluno encontrado.</p></div>) : (filteredStudents.map((student) => {
                                const isDropout = student.is_dropout;
                                const isProcess = student.is_process_dropout;
                                const activitySummary = getActivityStudentSummary(activityTracking, student.name);
                                const naSummary = getNAStudentSummary(data, student.name, naJustifications);
                                const studentNotebookNotes = classNotebookNotes.filter(note => note.scope === "class" || Number(note.studentId) === Number(student.id) || (note.studentIds || []).includes(Number(student.id)));
                                
                                let displayFreq = student.averageFreq;
                                let ucStatus = null;
                                let ucData = null;
                                let isSpecificUCView = selectedUC !== 'all';

                                if (isSpecificUCView) {
                                    ucData = student.uc_scores[selectedUC];
                                    if (ucData) { displayFreq = (ucData.score * 100).toFixed(1); ucStatus = ucData.status; } else { displayFreq = "N/A"; }
                                }

                                const hasPerfIssues = student.needs_recuperacao && !isDropout && !isProcess;
                                const hasFreqIssues = student.needs_conselho && !isDropout && !isProcess && !hasPerfIssues;
                                
                                let borderColor = "border-gray-100";
                                let statusBadge = null;

                                if (isDropout) { borderColor = "border-l-4 border-l-orange-500"; statusBadge = <span className="px-2 py-1 bg-orange-100 text-orange-700 text-[10px] font-bold rounded uppercase flex items-center gap-1"><IconLogOut className="w-3 h-3"/> {student.dropout_reason || "Evasão"}</span>; } 
                                else if (isProcess) { borderColor = "border-l-4 border-l-purple-500"; statusBadge = <span className="px-2 py-1 bg-purple-100 text-purple-700 text-[10px] font-bold rounded uppercase flex items-center gap-1"><IconClock className="w-3 h-3"/> Em Processo</span>; } 
                                else if (isSpecificUCView) {
                                    if (!ucData) { borderColor = "border-l-4 border-l-slate-300"; statusBadge = <span className="px-2 py-1 bg-slate-100 text-slate-500 text-[10px] font-bold rounded uppercase">Sem dados na {selectedUC}</span>; }
                                    else if (isNotDevelopedStatus(ucStatus)) { borderColor = "border-l-4 border-l-red-500"; statusBadge = <span className="px-2 py-1 bg-red-100 text-red-700 text-[10px] font-bold rounded uppercase">Reprovado na {selectedUC}</span>; }
                                    else if (parseFloat(displayFreq) < 75) { borderColor = "border-l-4 border-l-yellow-400"; statusBadge = <span className="px-2 py-1 bg-yellow-100 text-yellow-700 text-[10px] font-bold rounded uppercase">Baixa Freq na {selectedUC}</span>; }
                                    else { borderColor = "border-l-4 border-l-green-500"; statusBadge = <span className="px-2 py-1 bg-green-100 text-green-700 text-[10px] font-bold rounded uppercase">OK na {selectedUC}</span>; }
                                }
                                else if (hasPerfIssues) { borderColor = "border-l-4 border-l-red-500"; statusBadge = <span className="px-2 py-1 bg-red-100 text-red-700 text-[10px] font-bold rounded uppercase">Reprovado</span>; } 
                                else if (hasFreqIssues) { borderColor = "border-l-4 border-l-yellow-400"; statusBadge = <span className="px-2 py-1 bg-yellow-100 text-yellow-700 text-[10px] font-bold rounded uppercase">Conselho</span>; } 
                                else { borderColor = "border-l-4 border-l-green-500"; statusBadge = <span className="px-2 py-1 bg-green-100 text-green-700 text-[10px] font-bold rounded uppercase">Desenvolveu</span>; }
                                
                                const isSelected = reportSelection.includes(student.id);
                                
                                return (
                                    <div key={student.id} className={`bg-white rounded-xl shadow-sm border ${borderColor} hover:shadow-md relative group ${isDropout ? 'bg-orange-50/30' : isProcess ? 'bg-purple-50/30' : ''}`}>
                                        <div className="absolute top-4 left-3 z-10" onClick={(e) => e.stopPropagation()}><input type="checkbox" checked={isSelected} onChange={() => toggleStudentSelection(student.id)} className="w-5 h-5 rounded border-gray-300 text-senac-blue focus:ring-senac-blue cursor-pointer" /></div>
                                        <div className="p-5 pl-10 cursor-pointer" onClick={() => setSelectedStudentForModal(student)}>
                                            <div className="flex justify-between items-start mb-3 gap-2"><h3 className="font-bold text-gray-800 text-sm leading-snug">{student.name}</h3><div className="flex items-center gap-2">{studentNotebookNotes.length > 0 && (<div className="text-senac-orange" title={`Há ${studentNotebookNotes.length} anotação(ões) no caderno`}><IconBookOpen className="w-4 h-4" /></div>)}{(student.conselho_text || (student.comments || []).length > 0 || (student.all_observations || []).length > 0) && (<div className="text-senac-blue" title="Obs"><IconMessageSquare className="w-4 h-4" /></div>)}<div className="flex-shrink-0">{statusBadge}</div></div></div>
                                            <div className="flex justify-between items-end mb-1"><span className="text-xs text-gray-400 font-medium uppercase tracking-wider">{selectedUC === 'all' ? 'Frequência Global' : `Frequência ${selectedUC}`}</span><span className={`text-lg font-bold ${displayFreq !== "N/A" && parseFloat(displayFreq) < 75 ? 'text-yellow-600' : 'text-gray-700'}`}>{displayFreq}%</span></div>
                                            <ProgressBar value={displayFreq === "N/A" ? 0 : displayFreq} />
                                            {activitySummary && activitySummary.total > 0 && (
                                                <div className={`mt-3 pt-2 border-t flex flex-wrap gap-1.5 text-[10px] font-bold ${activitySummary.not_completed + activitySummary.blank + activitySummary.requires_evaluation > 0 ? 'border-red-100' : 'border-green-100'}`}>
                                                    <span className="bg-green-100 text-green-700 px-2 py-1 rounded">Atividades {activitySummary.completed}/{activitySummary.total}</span>
                                                    {activitySummary.not_completed > 0 && <span className="bg-red-100 text-red-700 px-2 py-1 rounded">NC {activitySummary.not_completed}</span>}
                                                    {activitySummary.blank > 0 && <span className="bg-gray-100 text-gray-700 px-2 py-1 rounded">Em branco {activitySummary.blank}</span>}
                                                    {activitySummary.requires_evaluation > 0 && <span className="bg-yellow-100 text-yellow-700 px-2 py-1 rounded">Avaliar {activitySummary.requires_evaluation}</span>}
                                                    {activitySummary.not_completed + activitySummary.blank + activitySummary.requires_evaluation === 0 && <span className="bg-green-50 text-green-700 px-2 py-1 rounded">Tudo avaliado</span>}
                                                </div>
                                            )}
                                            {naSummary && naSummary.count >= 2 && (
                                                <div className="mt-2 pt-2 border-t border-red-100 flex items-center justify-between gap-2 text-[10px] font-bold">
                                                    <span className="bg-red-100 text-red-700 px-2 py-1 rounded">NA em atenção: {naSummary.count}</span>
                                                    <span className="text-red-600">Abrir para justificar</span>
                                                </div>
                                            )}
                                            {studentNotebookNotes.length > 0 && <div className="mt-2 pt-2 border-t border-orange-100 flex items-center justify-between gap-2 text-[10px] font-bold"><span className="bg-orange-100 text-orange-700 px-2 py-1 rounded">Caderno: {studentNotebookNotes.length} registro(s)</span><span className="text-orange-700">Abrir quadro</span></div>}
                                            <div className="flex items-center gap-2 text-[11px] text-gray-500 mt-3 pt-2 border-t border-gray-50"><IconCalendar className="w-3 h-3 text-gray-400" /><span>Contra Turno: <span className={`font-semibold ${student.contra_turno_desc !== "Sem Contra Turno" ? 'text-senac-blue' : 'text-gray-400'}`}>{student.contra_turno_desc}</span></span></div>
                                            {(student.studentEmail || student.studentPhone || student.supervisorEmail || student.supervisorPhone) && <div className="mt-2 pt-2 border-t border-blue-50 text-[10px] text-gray-500 space-y-0.5"><div className="flex items-center gap-1"><IconMail className="w-3 h-3 text-senac-blue"/><span className="truncate">Aluno: {student.studentEmail || student.studentPhone || 'Contato não informado'}</span></div><div className="flex items-center gap-1"><IconUser className="w-3 h-3 text-senac-orange"/><span className="truncate">Supervisor: {student.supervisorName || student.supervisorEmail || student.supervisorPhone || 'Contato não informado'}</span></div></div>}
                                        </div>
                                    </div>
                                );
                            }))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthGate />);
    </script>
</body>
</html>
