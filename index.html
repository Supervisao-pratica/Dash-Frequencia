                return { notes, source: "cloud" };
            } catch (error) {
                console.error("Erro ao carregar notas do Firebase; usando notas locais", error);
                return { notes: localNotes, source: "local" };
            }
        };

        const persistNotebookNote = async (turma, instructorName, note) => {
            const canonicalInstructorName = canonicalizeInstructorName(instructorName);
            const storageKey = makeNotebookStorageKey(turma, canonicalInstructorName);
            const normalizedNote = normalizeNotebookNote(note);
            const notes = [normalizedNote, ...readNotebookNotesLocal(storageKey).filter(item => String(item.id) !== String(normalizedNote.id))].filter(Boolean);
            writeNotebookNotesLocal(storageKey, notes);
            const db = await getNotebookFirestore();
            if (!db) return { source: "local" };
            try {
                await db.collection("instructor_notes").doc(String(note.id)).set({
                    ...normalizeNotebookNote(note),
                    turmaKey: cleanNotebookKey(turma, "TURMA_DESCONHECIDA"),
                    instructorKey: cleanNotebookKey(canonicalInstructorName, "INSTRUTOR"),
                    ownerEmail: getCurrentAuthenticatedEmail()
                });
                return { source: "cloud" };
            } catch (error) {
                console.error("Erro ao salvar nota no Firebase; nota mantida localmente", error);
                return { source: "local" };
            }
        };

        const updateNotebookNote = async (turma, instructorName, note) => {
            const canonicalInstructorName = canonicalizeInstructorName(instructorName);
            const storageKey = makeNotebookStorageKey(turma, canonicalInstructorName);
            const normalized = normalizeNotebookNote(note);
            const notes = readNotebookNotesLocal(storageKey).map(item => String(item.id) === String(normalized.id) ? normalized : item);
            writeNotebookNotesLocal(storageKey, notes);
            const db = await getNotebookFirestore();
            if (!db) return { source: "local" };
            try {
                const payload = { ...normalized, turmaKey: cleanNotebookKey(turma, "TURMA_DESCONHECIDA"), instructorKey: normalized.instructorKey || cleanNotebookKey(canonicalInstructorName, "INSTRUTOR"), ownerEmail: getCurrentAuthenticatedEmail() };
                delete payload.id;
                delete payload.instructorSource;
                await db.collection("instructor_notes").doc(String(normalized.id)).set(payload, { merge: true });
                return { source: "cloud" };
            } catch (error) {
                console.error("Erro ao atualizar status da anotação no Firebase", error);
                return { source: "local" };
            }
        };

        const removeNotebookNote = async (turma, instructorName, noteOrId) => {
            const noteId = noteOrId && typeof noteOrId === "object" ? noteOrId.id : noteOrId;
            const sourceNote = noteOrId && typeof noteOrId === "object" ? normalizeNotebookNote(noteOrId) : null;
            const storageKey = makeNotebookStorageKey(turma, instructorName);
            const isImportedObservation = sourceNote && sourceNote.sourceType === "frequency_observation";
            const notes = isImportedObservation
                ? readNotebookNotesLocal(storageKey).map(note => String(note.id) === String(noteId) ? normalizeNotebookNote({ ...note, dismissed: true }) : note)
                : readNotebookNotesLocal(storageKey).filter(note => String(note.id) !== String(noteId));
            writeNotebookNotesLocal(storageKey, notes);
            const db = await getNotebookFirestore();
            if (!db) return { source: "local" };
            try {
                if (isImportedObservation) await db.collection("instructor_notes").doc(String(noteId)).set({ dismissed: true }, { merge: true });
                else await db.collection("instructor_notes").doc(String(noteId)).delete();
                return { source: "cloud" };
            } catch (error) {
                console.error("Erro ao excluir nota do Firebase", error);
                return { source: "local" };
            }
        };

        const normalizeAnalystNote = (note) => {
            if (!note || typeof note !== "object") return null;
            const hasScore = note.score !== null && note.score !== undefined && note.score !== "";
            const score = hasScore ? Number(note.score) : null;
            return {
                ...note,
                id: String(note.id || `analyst_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`),
                turmaKey: String(note.turmaKey || ""),
                analystName: canonicalizeAnalystName(note.analystName),
                analystKey: cleanNotebookKey(canonicalizeAnalystName(note.analystName), "ANALISTA"),
                instructorName: canonicalizeInstructorName(note.instructorName),
                instructorKey: cleanNotebookKey(canonicalizeInstructorName(note.instructorName), "INSTRUTOR"),
                date: notebookDateInput(note.date || new Date()),
                followupType: ANALYST_FOLLOWUP_TYPES.includes(note.followupType) ? note.followupType : "Acompanhamento",
                competency: PDI_COMPETENCIES.some(item => item.id === note.competency) ? note.competency : "",
                score: PDI_SCORE_OPTIONS.some(item => item.value === score) ? score : null,
                subject: String(note.subject || "").trim(),
                periodStart: notebookDateInput(note.periodStart),
                periodEnd: notebookDateInput(note.periodEnd),
                trackingEnabled: note.trackingEnabled === true,
                trackingStatus: ANALYST_TRACKING_STATUS_OPTIONS.some(item => item.value === note.trackingStatus) ? note.trackingStatus : "em_acompanhamento",
                reminderDate: notebookDateInput(note.reminderDate || note.periodEnd),
                notes: String(note.notes || "").trim(),
                visibleToInstructor: true,
                createdAt: String(note.createdAt || new Date().toISOString()),
                ownerEmail: String(note.ownerEmail || getCurrentAuthenticatedEmail()).toLowerCase()
            };
        };

        const getAnalystNotesStorageKey = (turma, analystName) => `${ANALYST_NOTE_STORAGE_PREFIX}${cleanNotebookKey(turma, "TURMA_DESCONHECIDA")}_${cleanNotebookKey(canonicalizeAnalystName(analystName), "ANALISTA")}`;

        const readAnalystNotesLocal = (turma, analystName) => {
            try {
                const parsed = JSON.parse(localStorage.getItem(getAnalystNotesStorageKey(turma, analystName)) || "[]");
                return Array.isArray(parsed) ? parsed.map(normalizeAnalystNote).filter(Boolean) : [];
            } catch (error) {
                return [];
            }
        };

        const writeAnalystNotesLocal = (turma, analystName, notes) => {
            try { localStorage.setItem(getAnalystNotesStorageKey(turma, analystName), JSON.stringify((notes || []).slice(0, 300))); }
            catch (error) { console.error("Erro ao salvar o caderno do analista localmente", error); }
        };

        const loadAnalystNotes = async (turma, analystName) => {
            const canonicalAnalyst = canonicalizeAnalystName(analystName);
            const localNotes = readAnalystNotesLocal(turma, canonicalAnalyst);
            const db = await getNotebookFirestore();
            if (!db) return { notes: localNotes, source: "local" };
            try {
                const turmaKey = cleanNotebookKey(turma, "TURMA_DESCONHECIDA");
                const ownerEmail = getCurrentAuthenticatedEmail();
                const [snapshot, evaluationSnapshot] = await Promise.all([
                    db.collection("analyst_notes")
                    .where("turmaKey", "==", turmaKey)
                    .where("ownerEmail", "==", getCurrentAuthenticatedEmail())
                    .get(),
                    db.collection("analyst_evaluations")
                    .where("turmaKey", "==", turmaKey)
                    .where("ownerEmail", "==", ownerEmail)
                    .get()
                ]);
                const evaluations = new Map(evaluationSnapshot.docs.map(doc => [doc.id, doc.data()]));
                const merged = new Map(localNotes.map(note => [note.id, note]));
                const legacyMigrations = [];
                snapshot.docs.forEach(doc => {
                    const publicData = doc.data();
                    const privateEvaluation = evaluations.get(doc.id);
                    const legacyScore = publicData.score !== null && publicData.score !== undefined ? Number(publicData.score) : null;
                    const score = privateEvaluation && privateEvaluation.score !== undefined ? privateEvaluation.score : legacyScore;
                    const note = normalizeAnalystNote({ id: doc.id, ...publicData, score });
                    if (note) merged.set(note.id, note);
                    if (note) {
                        const sharedNote = { ...note, score: null };
                        delete sharedNote.ownerEmail;
                        legacyMigrations.push(db.collection("analyst_shared_notes").doc(doc.id).set({ ...sharedNote, ownerEmail }, { merge: true }));
                    }
                    if (!privateEvaluation && PDI_SCORE_OPTIONS.some(item => item.value === legacyScore)) {
                        legacyMigrations.push(Promise.all([
                            db.collection("analyst_evaluations").doc(doc.id).set({
                                turmaKey,
                                analystKey: publicData.analystKey || cleanNotebookKey(canonicalAnalyst, "ANALISTA"),
                                ownerEmail,
                                score: legacyScore,
                                updatedAt: new Date().toISOString()
                            }, { merge: true }),
                            db.collection("analyst_notes").doc(doc.id).set({ score: null }, { merge: true })
                        ]));
                    }
                });
                if (legacyMigrations.length) await Promise.allSettled(legacyMigrations);
                const notes = Array.from(merged.values()).sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.createdAt).localeCompare(String(a.createdAt)));
                writeAnalystNotesLocal(turma, canonicalAnalyst, notes);
                return { notes: notes.filter(note => !note.dismissed), source: "cloud" };
            } catch (error) {
                console.error("Erro ao carregar o caderno do analista; usando dados locais", error);
                return { notes: localNotes.filter(note => !note.dismissed), source: "local" };
            }
        };

        const persistAnalystNote = async (turma, analystName, note) => {
            const canonicalAnalyst = canonicalizeAnalystName(analystName);
            const normalized = normalizeAnalystNote({ ...note, turmaKey: cleanNotebookKey(turma, "TURMA_DESCONHECIDA"), analystName: canonicalAnalyst, ownerEmail: getCurrentAuthenticatedEmail() });
            const notes = [normalized, ...readAnalystNotesLocal(turma, canonicalAnalyst).filter(item => item.id !== normalized.id)];
            writeAnalystNotesLocal(turma, canonicalAnalyst, notes);
            const db = await getNotebookFirestore();
            if (!db) return { note: normalized, source: "local" };
            try {
                const publicNote = { ...normalized, score: null };
                const evaluation = {
                    turmaKey: normalized.turmaKey,
                    analystKey: normalized.analystKey,
                    ownerEmail: normalized.ownerEmail,
                    score: normalized.score,
                    updatedAt: new Date().toISOString()
                };
                const writes = [db.collection("analyst_notes").doc(normalized.id).set(publicNote, { merge: true })];
                const sharedNote = { ...publicNote, visibleToInstructor: true };
                delete sharedNote.score;
                writes.push(db.collection("analyst_shared_notes").doc(normalized.id).set(sharedNote, { merge: true }));
                if (normalized.score === null) writes.push(db.collection("analyst_evaluations").doc(normalized.id).delete().catch(() => null));
                else writes.push(db.collection("analyst_evaluations").doc(normalized.id).set(evaluation, { merge: true }));
                await Promise.all(writes);
                return { note: normalized, source: "cloud" };
            } catch (error) {
                console.error("Erro ao salvar o caderno do analista; registro mantido localmente", error);
                return { note: normalized, source: "local" };
            }
        };

        const removeAnalystNote = async (turma, analystName, noteId) => {
            const canonicalAnalyst = canonicalizeAnalystName(analystName);
            writeAnalystNotesLocal(turma, canonicalAnalyst, readAnalystNotesLocal(turma, canonicalAnalyst).filter(note => note.id !== noteId));
            const db = await getNotebookFirestore();
            if (!db) return { source: "local" };
            try {
                await Promise.all([
                    db.collection("analyst_notes").doc(String(noteId)).delete(),
                    db.collection("analyst_shared_notes").doc(String(noteId)).delete().catch(() => null),
                    db.collection("analyst_evaluations").doc(String(noteId)).delete().catch(() => null)
                ]);
                return { source: "cloud" };
            } catch (error) {
                console.error("Erro ao excluir anotação do analista", error);
                return { source: "local" };
            }
        };

        const readVisibleAnalystNotesLocal = (turma, instructorNames) => {
            const turmaKey = cleanNotebookKey(turma, "TURMA_DESCONHECIDA");
            const instructorKeys = new Set((instructorNames || []).map(name => cleanNotebookKey(canonicalizeInstructorName(name), "INSTRUTOR")));
            const notes = [];
            try {
                for (let index = 0; index < localStorage.length; index++) {
                    const key = localStorage.key(index);
                    if (!key || !key.startsWith(`${ANALYST_NOTE_STORAGE_PREFIX}${turmaKey}_`)) continue;
                    const parsed = JSON.parse(localStorage.getItem(key) || "[]");
                    if (Array.isArray(parsed)) notes.push(...parsed.map(normalizeAnalystNote).filter(note => note && instructorKeys.has(note.instructorKey)).map(note => ({ ...note, score: null, visibleToInstructor: true })));
                }
            } catch (error) {}
            return Array.from(new Map(notes.map(note => [note.id, note])).values());
        };

        const loadVisibleAnalystNotes = async (turma, instructorNames) => {
            const localNotes = readVisibleAnalystNotesLocal(turma, instructorNames);
            const instructorKeys = new Set((instructorNames || []).map(name => cleanNotebookKey(canonicalizeInstructorName(name), "INSTRUTOR")));
            const db = await getNotebookFirestore();
            if (!db || instructorKeys.size === 0) return localNotes;
            try {
                const snapshot = await db.collection("analyst_shared_notes")
                    .where("turmaKey", "==", cleanNotebookKey(turma, "TURMA_DESCONHECIDA"))
                    .where("visibleToInstructor", "==", true)
                    .get();
                const merged = new Map(localNotes.map(note => [note.id, note]));
                snapshot.docs.map(doc => normalizeAnalystNote({ id: doc.id, ...doc.data(), score: null })).filter(note => note && instructorKeys.has(note.instructorKey)).forEach(note => merged.set(note.id, note));
                return Array.from(merged.values()).sort((a, b) => String(b.date).localeCompare(String(a.date)));
            } catch (error) {
                console.error("Erro ao carregar anotações visíveis do analista", error);
                return localNotes;
            }
        };

        const buildInstructorPDI = (notes) => {
            const latestByCompetency = new Map();
            [...(notes || [])].sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.createdAt).localeCompare(String(a.createdAt))).forEach(note => {
                if (note.competency && note.score !== null && Number.isFinite(Number(note.score)) && !latestByCompetency.has(note.competency)) latestByCompetency.set(note.competency, note);
            });
            const evaluations = PDI_COMPETENCIES.map(competency => ({ ...competency, note: latestByCompetency.get(competency.id) })).filter(item => item.note);
            const average = evaluations.length > 0 ? Math.round(evaluations.reduce((total, item) => total + Number(item.note.score || 0), 0) / evaluations.length) : null;
            return {
                average,
                strengths: evaluations.filter(item => item.note.score >= 75),
                opportunities: evaluations.filter(item => item.note.score < 75)
            };
        };

        const getNotebookSituationLabel = (note) => {
            const types = Array.isArray(note.situationTypes) && note.situationTypes.length > 0 ? note.situationTypes : (note.situationType ? [note.situationType] : []);
            return types.length > 0 ? types.join(", ") : "Anotação Geral";
        };

        // --- COMPONENTE CADERNO DO INSTRUTOR (V77 - TURMA E MÚLTIPLAS SITUAÇÕES) ---
        const InstructorNotebook = ({ instructorName, turma, students, analystNotes = [], onClose, onNotesChanged }) => {
            const [targetScope, setTargetScope] = useState("student");
            const [selectedStudentId, setSelectedStudentId] = useState("");
            const [notes, setNotes] = useState("");
            const [urgency, setUrgency] = useState("normal"); 
            const [selectedSituationTypes, setSelectedSituationTypes] = useState([]);
            const [situationDate, setSituationDate] = useState("");
            const [treatmentDays, setTreatmentDays] = useState("");
            const [treatmentStatus, setTreatmentStatus] = useState("em_tratativa");
            const [responsibleAnalyst, setResponsibleAnalyst] = useState("");
            const [attachments, setAttachments] = useState([]);
            const [allNotes, setAllNotes] = useState([]); // Histórico de notas
            const [isSaving, setIsSaving] = useState(false);
            const [storageSource, setStorageSource] = useState("local");
            const [saveNotice, setSaveNotice] = useState("");
            const [editingNoteId, setEditingNoteId] = useState("");

            const storageKey = useMemo(() => makeNotebookStorageKey(turma, instructorName), [turma, instructorName]);

            useEffect(() => {
                let isCurrent = true;
                (async () => {
                    const loaded = await loadNotebookNotes(turma, instructorName);
                    if (isCurrent) {
                        setAllNotes(loaded.notes);
                        setStorageSource(loaded.source);
                    }
                })();
                return () => { isCurrent = false; };
            }, [storageKey, turma, instructorName]);

            const toggleSituation = (value) => {
                setSelectedSituationTypes(current => current.includes(value) ? current.filter(item => item !== value) : [...current, value]);
            };

            const resetNotebookForm = () => {
                setTargetScope("student");
                setSelectedStudentId("");
                setNotes("");
                setUrgency("normal");
                setSelectedSituationTypes([]);
                setSituationDate("");
                setTreatmentDays("");
                setTreatmentStatus("em_tratativa");
                setResponsibleAnalyst("");
                setAttachments([]);
                setEditingNoteId("");
            };

            const editNote = note => {
                setTargetScope(note.scope === "class" ? "class" : "student");
                setSelectedStudentId(note.scope === "class" ? "" : String(note.studentId || ""));
                setNotes(note.notes || "");
                setUrgency(note.urgency || "normal");
                setSelectedSituationTypes(note.situationTypes || []);
                setSituationDate(note.situationDate || note.treatmentStartDate || "");
                setTreatmentDays(note.treatmentDays ? String(note.treatmentDays) : "");
                setTreatmentStatus(note.treatmentStatus || "em_tratativa");
                setResponsibleAnalyst(note.responsibleAnalyst || "");
                setAttachments(note.attachments || []);
                setEditingNoteId(note.id);
                setSaveNotice("Editando a anotação selecionada.");
            };

            const handleSave = async () => {
                if (targetScope === "student" && !selectedStudentId) {
                    alert("Selecione um aluno ou altere o alcance para Turma toda.");
                    return;
                }
                if (!notes.trim() && selectedSituationTypes.length === 0) {
                    alert("Informe uma anotação ou selecione pelo menos uma Situação Específica.");
                    return;
                }
                setIsSaving(true);
                const selectedStudent = students.find(s => s.id === parseInt(selectedStudentId));
                const createdAt = new Date().toISOString();
                const treatmentStartDate = notebookDateInput(situationDate || createdAt);
                const parsedTreatmentDays = Number.parseInt(treatmentDays, 10);
                const existingNote = editingNoteId ? allNotes.find(note => note.id === editingNoteId) : null;
                const newNote = {
                    ...(existingNote || {}),
                    id: editingNoteId || `note_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
                    date: existingNote && existingNote.date || createdAt,
                    updatedAt: createdAt,
                    scope: targetScope,
                    studentId: targetScope === "student" ? parseInt(selectedStudentId) : null,
                    studentIds: targetScope === "class" ? students.map(s => s.id) : [parseInt(selectedStudentId)],
                    studentName: targetScope === "class" ? "Turma toda" : (selectedStudent?.name || "Aluno não identificado"),
                    notes,
                    urgency,
                    treatmentStatus,
                    responsibleAnalyst,
                    situationTypes: selectedSituationTypes,
                    situationType: selectedSituationTypes.join(", "),
                    situationDate,
                    treatmentStartDate: treatmentDays && Number.isInteger(parsedTreatmentDays) && parsedTreatmentDays > 0 ? treatmentStartDate : "",
                    treatmentDays: treatmentDays && Number.isInteger(parsedTreatmentDays) && parsedTreatmentDays > 0 ? parsedTreatmentDays : null,
                    treatmentDueDate: treatmentDays && Number.isInteger(parsedTreatmentDays) && parsedTreatmentDays > 0 ? addNotebookDays(treatmentStartDate, parsedTreatmentDays) : "",
                    attachments,
                    turma,
                    instructorName,
                    ownerEmail: getCurrentAuthenticatedEmail()
                };

                const updatedNotes = [normalizeNotebookNote(newNote), ...allNotes.filter(note => note.id !== newNote.id)].filter(Boolean);
                setAllNotes(updatedNotes);
                const saved = editingNoteId ? await updateNotebookNote(turma, instructorName, newNote) : await persistNotebookNote(turma, instructorName, newNote);
                setStorageSource(saved.source);
                if (typeof onNotesChanged === "function") onNotesChanged();

                // Reset fields
                const wasEditing = Boolean(editingNoteId);
                resetNotebookForm();
                setSaveNotice(wasEditing ? "Anotação atualizada com sucesso." : newNote.treatmentDueDate
                    ? `Anotação salva. ${getNotebookTreatmentLabel(newNote)}. Use "Abrir no Outlook" para criar o lembrete na agenda.`
                    : "Anotação salva e vinculada ao quadro correspondente.");

                setTimeout(() => setIsSaving(false), 800);
            };

            const handleSendEmail = () => {
                if (!notes && selectedSituationTypes.length === 0) {
                    alert("Preencha pelo menos o tipo de ocorrência ou uma anotação para enviar.");
                    return;
                }
                const studentName = targetScope === "class" ? "Turma toda" : students.find(s => s.id === parseInt(selectedStudentId))?.name || "Nenhum aluno selecionado";
                const situationLabel = selectedSituationTypes.join(", ") || "Anotação";
                const subject = `Ocorrência: ${situationLabel} - Turma ${turma}`;
                
                let body = `Olá,\n\nSegue registro de ocorrência:\n\n`;
                body += `Turma: ${turma}\n`;
                body += `Instrutor: ${instructorName}\n`;
                body += `Aluno: ${studentName}\n`;
                body += `Data Ocorrência: ${situationDate || "N/A"}\n`;
                body += `Urgência: ${urgency.toUpperCase()}\n`;
                body += `Tipo(s): ${situationLabel}\n\n`;
                body += `Detalhes:\n${notes}\n\n`;
                
                // NOTA SOBRE ANEXOS (V75 - AJUSTE DE SEGURANÇA)
                if (attachments.length > 0) {
                    body += `\n[NOTA DO SISTEMA: Esta ocorrência possui ${attachments.length} anexo(s) registrado(s) no sistema. Lembre-se de anexá-los manualmente a este e-mail.]\n\n`;
                }

                body += `Enviado via Dashboard de Frequência.`;

                const outlookUrl = `https://outlook.office.com/mail/deeplink/compose?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                const outlookWindow = window.open(outlookUrl, "_blank");
                if (!outlookWindow) {
                    alert("O navegador bloqueou a janela do Outlook. Permita pop-ups para este site e tente novamente.");
                    return;
                }

                if (attachments.length > 0) {
                    alert("⚠️ AVISO DE SEGURANÇA:\n\nDevido a restrições técnicas dos navegadores web, arquivos NÃO podem ser anexados automaticamente ao programa de e-mail.\n\nO texto do e-mail foi gerado, mas você deve ARRASTAR OS ARQUIVOS MANUALMENTE para o e-mail.");
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 500000) { alert("Limite de 500KB por arquivo."); return; }
                const reader = new FileReader();
                reader.onload = () => {
                    setAttachments(prev => [...prev, { name: file.name, data: reader.result, type: file.type }]);
                };
                reader.readAsDataURL(file);
            };

            const removeAttachment = (idx) => {
                setAttachments(prev => prev.filter((_, i) => i !== idx));
            };

            const handleNoteStatusChange = async (note, nextStatus) => {
                const updatedNote = normalizeNotebookNote({ ...note, treatmentStatus: nextStatus });
                setAllNotes(current => current.map(item => item.id === updatedNote.id ? updatedNote : item));
                const saved = await updateNotebookNote(turma, instructorName, updatedNote);
                setStorageSource(saved.source);
                if (typeof onNotesChanged === "function") onNotesChanged();
            };

            const deleteNote = (note) => {
                if(confirm("Excluir esta anotação do histórico?")) {
                    const updated = allNotes.filter(n => n.id !== note.id);
                    setAllNotes(updated);
                    if (editingNoteId === note.id) resetNotebookForm();
                    removeNotebookNote(turma, instructorName, note).then(result => {
                        setStorageSource(result.source);
                        if (typeof onNotesChanged === "function") onNotesChanged();
                    });
                }
            }

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 animate-fade-in" onClick={(e) => {if(e.target===e.currentTarget) onClose()}}>
                    <div className="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="bg-senac-blue p-4 text-white flex justify-between items-center shrink-0">
                            <h2 className="text-xl font-bold flex items-center gap-2"><IconBookOpen className="w-6 h-6"/> Caderno do Instrutor</h2>
                            <button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full"><IconXCircle className="w-6 h-6"/></button>
                        </div>
                        
                        <div className="p-6 overflow-y-auto bg-gray-50 custom-scrollbar">
                            <div className="mb-4">
                                <h3 className="text-lg font-bold text-gray-800">{instructorName}</h3>
                                <p className="text-sm text-gray-500">Nova anotação para a turma {turma}</p>
                                <p className={`text-xs mt-1 font-medium ${storageSource === 'cloud' ? 'text-green-700' : 'text-gray-500'}`}>
                                    {storageSource === 'cloud' ? 'Salvo no Firebase e neste dispositivo' : 'Salvo neste dispositivo'}
                                </p>
                                {saveNotice && <div className="mt-3 rounded-lg border border-green-200 bg-green-50 px-3 py-2 text-xs text-green-800 flex items-start gap-2"><IconCheckCircle className="w-4 h-4 shrink-0 mt-0.5" /> <span>{saveNotice}</span></div>}
                            </div>

                            {analystNotes.length > 0 && <div className="mb-4 rounded-xl border border-blue-200 bg-blue-50 p-4">
                                <div className="mb-2 flex items-center gap-2 text-sm font-bold text-blue-900"><IconEye className="h-4 w-4" /> Acompanhamentos compartilhados pela análise</div>
                                <div className="space-y-2">{analystNotes.map(note => {
                                    const competency = PDI_COMPETENCIES.find(item => item.id === note.competency);
                                    return <div key={note.id} className="rounded-lg border border-blue-100 bg-white p-3 text-xs">
                                        <div className="flex flex-wrap items-center gap-2"><strong className="text-senac-blue">{note.subject || note.followupType}</strong>{competency && <span className="rounded bg-blue-50 px-2 py-0.5 text-blue-700">{competency.label}</span>}{note.trackingEnabled && <span className="rounded bg-gray-100 px-2 py-0.5 text-gray-700">{(ANALYST_TRACKING_STATUS_OPTIONS.find(item => item.value === note.trackingStatus) || ANALYST_TRACKING_STATUS_OPTIONS[0]).label}</span>}</div>
                                        <div className="mt-1 text-gray-500">{note.followupType} | {formatNotebookDate(note.date)} | {note.analystName}</div>
                                        {(note.periodStart || note.periodEnd) && <div className="mt-1 text-gray-500">Período: {note.periodStart ? formatNotebookDate(note.periodStart) : "Início não informado"} a {note.periodEnd ? formatNotebookDate(note.periodEnd) : "Em aberto"}</div>}
                                        {note.notes && <p className="mt-2 whitespace-pre-wrap text-gray-700">{note.notes}</p>}
                                    </div>;
                                })}</div>
                            </div>}

                            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-4">
                                <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Alcance da anotação</label>
                                <div className="grid grid-cols-2 gap-2 mb-3" role="radiogroup" aria-label="Alcance da anotação">
                                    <button type="button" onClick={() => setTargetScope('student')} className={`py-2 px-3 rounded-lg text-sm font-bold border transition-colors ${targetScope === 'student' ? 'bg-blue-50 text-senac-blue border-senac-blue ring-2 ring-blue-100' : 'bg-gray-50 text-gray-500 border-gray-200 hover:bg-gray-100'}`}>
                                        <IconUser className="w-4 h-4 inline-block mr-1" /> Aluno específico
                                    </button>
                                    <button type="button" onClick={() => setTargetScope('class')} className={`py-2 px-3 rounded-lg text-sm font-bold border transition-colors ${targetScope === 'class' ? 'bg-orange-50 text-senac-orange border-senac-orange ring-2 ring-orange-100' : 'bg-gray-50 text-gray-500 border-gray-200 hover:bg-gray-100'}`}>
                                        <IconUsers className="w-4 h-4 inline-block mr-1" /> Turma toda
                                    </button>
                                </div>
                                {targetScope === 'student' ? (
                                    <select
                                        value={selectedStudentId}
                                        onChange={(e) => setSelectedStudentId(e.target.value)}
                                        className="w-full p-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-senac-blue outline-none"
                                    >
                                        <option value="">-- Selecione um aluno --</option>
                                        {students.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                    </select>
                                ) : (
                                    <div className="rounded-lg bg-orange-50 border border-orange-200 px-3 py-2 text-sm text-orange-800 flex items-center gap-2">
                                        <IconUsers className="w-4 h-4 shrink-0" /> Esta anotação será vinculada a todos os alunos da turma.
                                    </div>
                                )}
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Nível de Urgência</label>
                                    <div className="flex gap-2">
                                        <button onClick={() => setUrgency('normal')} className={`flex-1 py-2 rounded-lg text-xs font-bold border ${urgency === 'normal' ? 'bg-green-100 text-green-700 border-green-300 ring-2 ring-green-200' : 'bg-gray-50 text-gray-400 border-gray-200 hover:bg-gray-100'}`}>Normal</button>
                                        <button onClick={() => setUrgency('warning')} className={`flex-1 py-2 rounded-lg text-xs font-bold border ${urgency === 'warning' ? 'bg-yellow-100 text-yellow-700 border-yellow-300 ring-2 ring-yellow-200' : 'bg-gray-50 text-gray-400 border-gray-200 hover:bg-gray-100'}`}>Atenção</button>
                                        <button onClick={() => setUrgency('critical')} className={`flex-1 py-2 rounded-lg text-xs font-bold border ${urgency === 'critical' ? 'bg-red-100 text-red-700 border-red-300 ring-2 ring-red-200' : 'bg-gray-50 text-gray-400 border-gray-200 hover:bg-gray-100'}`}>Crítico</button>
                                    </div>
                                </div>

                                <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Analista responsável</label>
                                    <select value={responsibleAnalyst} onChange={(e) => setResponsibleAnalyst(e.target.value)} className="w-full p-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-senac-blue outline-none">
                                        <option value="">-- Selecione o analista --</option>
                                        {NOTEBOOK_ANALYST_OPTIONS.map(analyst => <option key={analyst} value={analyst}>{analyst}</option>)}
                                    </select>
                                    <p className="text-[11px] text-gray-400 mt-2">Identifica quem acompanhará a tratativa.</p>
                                </div>

                                <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Status da tratativa</label>
                                    <select value={treatmentStatus} onChange={(e) => setTreatmentStatus(e.target.value)} className="w-full p-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-senac-blue outline-none">
                                        {NOTEBOOK_TREATMENT_STATUS_OPTIONS.map(option => <option key={option.value} value={option.value}>{option.label}</option>)}
                                    </select>
                                    <p className="text-[11px] text-gray-400 mt-2">O status poderá ser alterado depois no quadro do aluno.</p>
                                </div>

                                <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Situação Específica</label>
                                    <div className="max-h-40 overflow-y-auto border border-gray-200 rounded-lg p-2 space-y-2 bg-gray-50">
                                        {NOTEBOOK_SITUATION_OPTIONS.map(group => (
                                            <div key={group.group}>
                                                <div className="text-[10px] font-bold text-gray-400 uppercase px-1 mb-1">{group.group}</div>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-1">
                                                    {group.options.map(option => (
                                                        <label key={option.value} className={`flex items-center gap-2 px-2 py-1.5 rounded cursor-pointer text-xs ${selectedSituationTypes.includes(option.value) ? 'bg-blue-100 text-blue-800 font-semibold' : 'hover:bg-white text-gray-600'}`}>
                                                            <input type="checkbox" checked={selectedSituationTypes.includes(option.value)} onChange={() => toggleSituation(option.value)} className="rounded text-senac-blue focus:ring-senac-blue" />
                                                            <span>{option.label}</span>
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="mt-2 text-xs text-gray-500 min-h-4">
                                        {selectedSituationTypes.length > 0 ? `${selectedSituationTypes.length} assunto(s) selecionado(s): ${selectedSituationTypes.join(', ')}` : 'Selecione um ou mais assuntos.'}
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-4">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    <label className="text-xs font-bold text-gray-600">Data da ocorrência/início<input type="date" value={situationDate} onChange={(e) => setSituationDate(e.target.value)} className="mt-1 w-full p-2 border border-gray-300 rounded text-sm font-normal" /></label>
                                    <label className="text-xs font-bold text-gray-600">Período de tratativa (dias)<input type="number" min="1" step="1" value={treatmentDays} onChange={(e) => setTreatmentDays(e.target.value)} className="mt-1 w-full p-2 border border-gray-300 rounded text-sm font-normal" placeholder="Ex.: 7" /></label>
                                </div>
                                {treatmentDays && Number.parseInt(treatmentDays, 10) > 0 && <div className="mt-3 rounded-lg border border-orange-200 bg-orange-50 px-3 py-2 text-xs text-orange-800 flex items-center gap-2"><IconClock className="w-4 h-4 shrink-0" /> Prazo previsto: <strong>{formatNotebookDate(addNotebookDays(situationDate || new Date(), Number.parseInt(treatmentDays, 10)))}</strong>. O lembrete pode ser criado no Outlook após salvar.</div>}
                            </div>

                            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-4">
                                <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Anotações Gerais</label>
                                <textarea 
                                    value={notes} 
                                    onChange={(e) => setNotes(e.target.value)} 
                                    className="w-full h-32 p-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-senac-blue outline-none resize-none"
                                    placeholder="Digite aqui observações sobre o andamento, justificativas, detalhes do feedback..."
                                ></textarea>
                            </div>

                            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-6">
                                <div className="flex justify-between items-center mb-2">
                                    <label className="text-xs font-bold text-gray-500 uppercase flex items-center gap-2"><IconPaperclip className="w-4 h-4"/> Documentos Anexados</label>
                                    <label className="cursor-pointer bg-blue-50 text-blue-600 px-3 py-1 rounded text-xs font-bold hover:bg-blue-100 border border-blue-200 transition-colors">
                                        + Anexar
                                        <input type="file" className="hidden" accept="image/*,.pdf" onChange={handleFileUpload} />
                                    </label>
                                </div>
                                {attachments.length > 0 && (
                                    <div className="space-y-2">
                                        {attachments.map((att, idx) => (
                                            <div key={idx} className="flex items-center justify-between bg-gray-50 p-2 rounded border border-gray-200">
                                                <span className="text-xs text-blue-600 truncate">{att.name}</span>
                                                <button onClick={() => removeAttachment(idx)} className="text-red-400 hover:text-red-600"><IconTrash2 className="w-4 h-4"/></button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="flex flex-wrap justify-between items-center gap-2 mb-6">
                                <button onClick={handleSendEmail} className="bg-white border border-senac-orange text-senac-orange hover:bg-orange-50 px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 shadow-sm">
                                    <IconMail className="w-4 h-4"/> Enviar por E-mail (Outlook)
                                </button>
                                <div className="flex gap-2">{editingNoteId && <button type="button" onClick={resetNotebookForm} className="px-4 py-2 rounded-lg border border-gray-300 bg-white text-gray-600 font-bold text-sm hover:bg-gray-50">Cancelar edição</button>}<button onClick={handleSave} className="px-6 py-2 bg-senac-blue text-white hover:bg-blue-700 rounded-lg font-bold text-sm shadow flex items-center gap-2">
                                    {isSaving ? <IconRefreshCw className="w-4 h-4 animate-spin"/> : <IconSave className="w-4 h-4"/>}
                                    {editingNoteId ? "Salvar alterações" : "Salvar Nota"}
                                </button></div>
                            </div>

                            {/* HISTÓRICO DE NOTAS */}
                            {allNotes.length > 0 && (
                                <div className="border-t pt-4">
                                    <h4 className="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2"><IconClock className="w-4 h-4"/> Histórico Recente</h4>
                                    <div className="space-y-3">
                                        {allNotes.map(note => (
                                            <div key={note.id} className={`bg-white p-3 rounded-lg border shadow-sm text-sm relative group ${editingNoteId === note.id ? "border-senac-blue ring-2 ring-blue-100" : "border-gray-200"}`}>
                                                <div className="absolute top-2 right-2 flex gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity"><button type="button" onClick={() => editNote(note)} title="Editar anotação" className="text-gray-400 hover:text-senac-blue"><IconEdit3 className="w-4 h-4"/></button><button type="button" onClick={() => deleteNote(note)} title="Excluir anotação" className="text-gray-300 hover:text-red-500"><IconTrash2 className="w-4 h-4"/></button></div>
                                                <div className="flex justify-between items-start mb-1">
                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${note.urgency === 'critical' ? 'bg-red-100 text-red-700' : note.urgency === 'warning' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'}`}>{note.urgency}</span>
                                                    <span className="text-xs text-gray-400">{new Date(note.date).toLocaleDateString()}</span>
                                                </div>
                                                <div className="mb-1 font-bold text-gray-800">{getNotebookSituationLabel(note)} {note.situationDate && <span className="font-normal text-gray-500">({new Date(note.situationDate).toLocaleDateString()})</span>}</div>
                                                {note.studentName && <div className="text-xs text-senac-blue mb-1 font-semibold flex items-center gap-1"><IconUser className="w-3 h-3"/> {note.studentName}</div>}
                                                <div className="flex flex-wrap items-center gap-2 mb-2 text-[11px]">
                                                    <select value={note.treatmentStatus || "em_tratativa"} onChange={(e) => handleNoteStatusChange(note, e.target.value)} className={`rounded border px-2 py-1 text-[11px] font-semibold outline-none ${getNotebookStatusMeta(note).className}`} title="Alterar status da tratativa">
                                                        {NOTEBOOK_TREATMENT_STATUS_OPTIONS.map(option => <option key={option.value} value={option.value}>{option.label}</option>)}
                                                    </select>
                                                    {note.responsibleAnalyst && <span className="rounded bg-blue-50 px-2 py-1 font-semibold text-blue-700">Analista: {note.responsibleAnalyst}</span>}
                                                    {getNotebookTreatmentDue(note) && <span className={`rounded px-2 py-1 font-semibold ${getNotebookTreatmentState(note) === 'overdue' ? 'bg-red-100 text-red-700' : getNotebookTreatmentState(note) === 'today' ? 'bg-yellow-100 text-yellow-800' : 'bg-orange-100 text-orange-700'}`}>{getNotebookTreatmentLabel(note)}</span>}
                                                    {getNotebookTreatmentDue(note) && <button type="button" onClick={() => openNotebookTreatmentInOutlook(note, turma, instructorName)} className="rounded border border-blue-200 px-2 py-1 font-semibold text-blue-700 hover:bg-blue-50">Abrir no Outlook</button>}
                                                </div>
                                                <p className="text-gray-600 mb-2 whitespace-pre-wrap">{note.notes}</p>
                                                {note.attachments && note.attachments.length > 0 && <div className="text-xs text-gray-400 flex items-center gap-1"><IconPaperclip className="w-3 h-3"/> {note.attachments.length} anexo(s)</div>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="bg-white p-4 border-t border-gray-200 flex justify-end shrink-0">
                            <button onClick={onClose} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-bold text-sm">Fechar</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AnalystNotebook = ({ analystName, turma, instructors, onClose, onChanged }) => {
            const instructorOptions = useMemo(() => [...new Set((instructors || []).map(canonicalizeInstructorName).filter(Boolean))], [instructors]);
            const [selectedInstructor, setSelectedInstructor] = useState(() => instructorOptions[0] || "");
            const [date, setDate] = useState(() => notebookDateInput(new Date()));
            const [followupType, setFollowupType] = useState("Acompanhamento");
            const [competency, setCompetency] = useState("planejamento");
            const [score, setScore] = useState(75);
            const [notes, setNotes] = useState("");
            const [visibleToInstructor, setVisibleToInstructor] = useState(false);
            const [allNotes, setAllNotes] = useState([]);
            const [storageSource, setStorageSource] = useState("local");
            const [isSaving, setIsSaving] = useState(false);

            useEffect(() => {
                let current = true;
                loadAnalystNotes(turma, analystName).then(loaded => {
                    if (!current) return;
                    setAllNotes(loaded.notes || []);
                    setStorageSource(loaded.source || "local");
                });
                return () => { current = false; };
            }, [turma, analystName]);

            useEffect(() => {
                if (!selectedInstructor && instructorOptions[0]) setSelectedInstructor(instructorOptions[0]);
            }, [selectedInstructor, instructorOptions]);

            const instructorNotes = useMemo(() => allNotes.filter(note => normalizeName(note.instructorName) === normalizeName(selectedInstructor)).sort((a, b) => String(a.date).localeCompare(String(b.date))), [allNotes, selectedInstructor]);
            const pdi = useMemo(() => buildInstructorPDI(instructorNotes), [instructorNotes]);
            const graphHistory = useMemo(() => instructorNotes.filter(note => Number.isFinite(Number(note.score))).map(note => ({ ...note, capturedAt: `${note.date}T12:00:00` })), [instructorNotes]);

            const save = async () => {
                if (!selectedInstructor || !notes.trim()) { alert("Selecione o instrutor e descreva o acompanhamento."); return; }
                setIsSaving(true);
                const result = await persistAnalystNote(turma, analystName, { instructorName: selectedInstructor, date, followupType, competency, score: Number(score), notes, visibleToInstructor });
                setAllNotes(current => [result.note, ...current.filter(item => item.id !== result.note.id)]);
                setStorageSource(result.source);
                setNotes("");
                setVisibleToInstructor(false);
                setIsSaving(false);
                if (typeof onChanged === "function") onChanged();
            };

            const remove = async (noteId) => {
                if (!confirm("Excluir este acompanhamento do instrutor?")) return;
                setAllNotes(current => current.filter(note => note.id !== noteId));
                const result = await removeAnalystNote(turma, analystName, noteId);
                setStorageSource(result.source);
                if (typeof onChanged === "function") onChanged();
            };

            const printPDI = () => {
                const reportWindow = window.open("", "_blank");
                if (!reportWindow) { alert("Não foi possível abrir o PDI. Verifique o bloqueio de pop-ups."); return; }
                const strengths = pdi.strengths.map(item => `<li><strong>${escapeReportHTML(item.label)}:</strong> ${escapeReportHTML(item.note.notes)}</li>`).join("") || "<li>Nenhum ponto forte avaliado.</li>";
                const opportunities = pdi.opportunities.map(item => `<li><strong>${escapeReportHTML(item.label)}:</strong> ${escapeReportHTML(item.note.notes)}<br><em>Ação sugerida: ${escapeReportHTML(item.action)}</em></li>`).join("") || "<li>Nenhuma oportunidade registrada.</li>";
                reportWindow.document.write(`<html lang="pt-BR"><head><meta charset="UTF-8"><title>PDI - ${escapeReportHTML(selectedInstructor)}</title><style>body{font-family:Arial,sans-serif;color:#243447;margin:32px}h1{color:#004587;border-bottom:3px solid #f5821f;padding-bottom:10px}h2{font-size:15px;color:#004587;margin-top:22px}li{margin:8px 0;line-height:1.45}.score{background:#eef5fb;border-left:4px solid #f5821f;padding:12px;font-weight:bold}@media print{button{display:none}}</style></head><body><button onclick="window.print()">Imprimir / PDF</button><h1>Plano de Desenvolvimento Individual</h1><p><strong>Instrutor:</strong> ${escapeReportHTML(selectedInstructor)}<br><strong>Turma:</strong> ${escapeReportHTML(turma)}<br><strong>Analista:</strong> ${escapeReportHTML(analystName)}</p><div class="score">Indicador atual: ${pdi.average === null ? "Sem avaliação" : `${pdi.average}%`}</div><h2>Pontos fortes</h2><ul>${strengths}</ul><h2>Oportunidades e ações</h2><ul>${opportunities}</ul></body></html>`);
                reportWindow.document.close();
            };

            return <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/70 p-4 backdrop-blur-sm" onClick={event => { if (event.target === event.currentTarget) onClose(); }}><div className="flex max-h-[94vh] w-full max-w-6xl flex-col overflow-hidden rounded-xl bg-white shadow-2xl"><div className="flex shrink-0 items-center justify-between bg-senac-blue p-4 text-white"><div><h2 className="flex items-center gap-2 text-xl font-bold"><IconBarChart2 className="h-6 w-6" /> Caderno do Analista</h2><p className="mt-1 text-xs text-blue-100">Acompanhamento de instrutores e construção do PDI | {analystName}</p></div><button onClick={onClose} className="rounded-full p-1 hover:bg-white/20"><IconXCircle className="h-6 w-6" /></button></div><div className="grid flex-1 grid-cols-1 overflow-y-auto bg-gray-50 lg:grid-cols-[390px_1fr]"><div className="border-r border-gray-200 bg-white p-5"><label className="block text-xs font-bold uppercase text-gray-500">Instrutor acompanhado</label><select value={selectedInstructor} onChange={event => setSelectedInstructor(event.target.value)} className="mt-2 w-full rounded-md border border-gray-300 p-2 text-sm"><option value="">Selecione</option>{instructorOptions.map(name => <option key={name} value={name}>{name}</option>)}</select><div className="mt-4 grid grid-cols-2 gap-3"><label className="text-xs font-bold text-gray-600">Data<input type="date" value={date} onChange={event => setDate(event.target.value)} className="mt-1 w-full rounded-md border border-gray-300 p-2 font-normal" /></label><label className="text-xs font-bold text-gray-600">Tipo<select value={followupType} onChange={event => setFollowupType(event.target.value)} className="mt-1 w-full rounded-md border border-gray-300 p-2 font-normal">{ANALYST_FOLLOWUP_TYPES.map(type => <option key={type}>{type}</option>)}</select></label></div><label className="mt-4 block text-xs font-bold text-gray-600">Competência<select value={competency} onChange={event => setCompetency(event.target.value)} className="mt-1 w-full rounded-md border border-gray-300 p-2 font-normal">{PDI_COMPETENCIES.map(item => <option key={item.id} value={item.id}>{item.label}</option>)}</select></label><label className="mt-4 block text-xs font-bold text-gray-600">Avaliação<select value={score} onChange={event => setScore(Number(event.target.value))} className="mt-1 w-full rounded-md border border-gray-300 p-2 font-normal">{PDI_SCORE_OPTIONS.map(option => <option key={option.value} value={option.value}>{option.label} ({option.value}%)</option>)}</select></label><label className="mt-4 block text-xs font-bold text-gray-600">Registro<textarea value={notes} onChange={event => setNotes(event.target.value)} className="mt-1 h-28 w-full resize-none rounded-md border border-gray-300 p-3 font-normal" placeholder="Descreva fatos, feedbacks, evidências e encaminhamentos." /></label><label className="mt-4 flex cursor-pointer items-start gap-2 rounded-lg border border-blue-200 bg-blue-50 p-3 text-xs text-blue-900"><input type="checkbox" checked={visibleToInstructor} onChange={event => setVisibleToInstructor(event.target.checked)} className="mt-0.5 rounded text-senac-blue" /><span><strong className="block">Permitir visualização pelo instrutor</strong>Desmarcado, o registro fica restrito ao analista responsável.</span></label><button onClick={save} disabled={isSaving || !selectedInstructor || !notes.trim()} className="mt-4 flex w-full items-center justify-center gap-2 rounded-md bg-senac-blue px-4 py-2.5 text-sm font-bold text-white disabled:opacity-50"><IconSave className="h-4 w-4" /> {isSaving ? "Salvando..." : "Salvar acompanhamento"}</button><p className="mt-2 text-center text-[10px] text-gray-400">{storageSource === "cloud" ? "Sincronizado com o Firebase" : "Salvo neste dispositivo"}</p></div><div className="space-y-4 p-5"><div className="grid grid-cols-2 gap-3 md:grid-cols-4"><div className="rounded-lg border border-gray-200 bg-white p-3"><div className="text-[10px] font-bo "><span className="font-bold text-senac-blue">{note.subject || note.followupType}</span>{note.competency && <span className="rounded bg-blue-50 px-2 py-0.5 text-blue-700">{competenceLabel(note.competency)}</span>}{note.score !== null && <span className="rounded bg-gray-100 px-2 py-0.5 font-bold text-gray-600">{note.score}%</span>}{note.visibleToInstructor ? <span className="rounded bg-green-100 px-2 py-0.5 text-green-800">Visível ao instrutor</span> : <span className="rounded bg-gray-100 px-2 py-0.5 text-gray-600">Restrito</span>}</div><div className="mt-1 text-gray-400">{formatNotebookDate(note.date)} | {note.followupType} | {periodLabel(note)}</div>{note.notes && <p className="mt-2 whitespace-pre-wrap text-gray-700">{note.notes}</p>}</div>)}</div></div></div>

        const getAnalystTrackingState = note => {
            if (!note || !note.trackingEnabled || getAnalystTrackingMeta(note).closed) return "closed";
            const due = notebookDateInput(note.reminderDate || note.periodEnd);
            if (!due) return "open";
            const today = notebookDateInput(new Date());
            if (due < today) return "overdue";
            if (due === today) return "today";
            return "open";
        };
        const openAnalystTrackingInOutlook = (note, turma) => {
            const due = notebookDateInput(note && (note.reminderDate || note.periodEnd));
            if (!due) { alert("Informe a data do lembrete para abrir o acompanhamento no Outlook."); return; }
            const subject = `Acompanhamento: ${note.followupType} - ${note.instructorName}`;
            const body = [`Turma: ${turma}`, `Instrutor: ${note.instructorName}`, `Analista: ${note.analystName}`, `Situação: ${note.followupType}`, `Assunto: ${note.subject || "Não informado"}`, `Status: ${getAnalystTrackingMeta(note).label}`, "", note.notes || "Sem descrição adicional."].join("\n");
            const url = `https://outlook.office.com/calendar/0/deeplink/compose?subject=${encodeURIComponent(subject)}&startdt=${encodeURIComponent(`${due}T09:00:00`)}&enddt=${encodeURIComponent(`${due}T09:30:00`)}&body=${encodeURIComponent(body)}&allday=false`;
            const popup = window.open(url, "_blank");
            if (!popup) alert("O navegador bloqueou a janela do Outlook. Permita pop-ups para este site e tente novamente.");
        };
        const createAnalystDraft = followupType => ({
            id: `draft_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            followupType,
            subject: "",
            notes: "",
            manualPDI: false,
            manualCompetency: "",
            manualScore: ""
        });

        const AnalystNotebookMulti = ({ analystName, turma, instructors, onClose, onChanged }) => {
            const instructorOptions = useMemo(() => [...new Set((instructors || []).map(canonicalizeInstructorName).filter(isValidInstructorName))], [instructors]);
            const [selectedInstructor, setSelectedInstructor] = useState(() => instructorOptions[0] || "");
            const [periodStart, setPeriodStart] = useState("");
            const [periodEnd, setPeriodEnd] = useState("");
            const [date, setDate] = useState(() => notebookDateInput(new Date()));
            const [drafts, setDrafts] = useState([]);
            const [showEvaluations, setShowEvaluations] = useState(false);
            const [trackingEnabled, setTrackingEnabled] = useState(false);
            const [trackingStatus, setTrackingStatus] = useState("em_acompanhamento");
            const [reminderDate, setReminderDate] = useState("");
            const [allNotes, setAllNotes] = useState([]);
            const [storageSource, setStorageSource] = useState("local");
            const [isSaving, setIsSaving] = useState(false);
            const [saveNotice, setSaveNotice] = useState("");
            const [editingNoteId, setEditingNoteId] = useState("");

            useEffect(() => {
                let current = true;
                loadAnalystNotes(turma, analystName).then(loaded => {
                    if (!current) return;
                    setAllNotes(loaded.notes || []);
                    setStorageSource(loaded.source || "local");
                });
                return () => { current = false; };
            }, [turma, analystName]);
            useEffect(() => { if (!selectedInstructor && instructorOptions[0]) setSelectedInstructor(instructorOptions[0]); }, [selectedInstructor, instructorOptions]);
            useEffect(() => { if (trackingEnabled && !reminderDate && periodEnd) setReminderDate(periodEnd); }, [trackingEnabled, periodEnd, reminderDate]);

            const toggleType = type => setDrafts(current => current.some(item => item.followupType === type)
                ? current.filter(item => item.followupType !== type)
                : [...current, createAnalystDraft(type)]);
            const updateDraft = (id, changes) => setDrafts(current => current.map(item => item.id === id ? { ...item, ...changes } : item));
            const suggestionFor = draft => inferAnalystPDI(draft.followupType, draft.subject, draft.notes);
            const instructorNotes = useMemo(() => allNotes.filter(note => normalizeName(note.instructorName) === normalizeName(selectedInstructor)).sort((a, b) => String(a.date).localeCompare(String(b.date))), [allNotes, selectedInstructor]);
            const trackedAlerts = useMemo(() => instructorNotes.filter(note => note.trackingEnabled && ["overdue", "today", "open"].includes(getAnalystTrackingState(note))).sort((a, b) => String(a.reminderDate || a.periodEnd || "9999").localeCompare(String(b.reminderDate || b.periodEnd || "9999"))), [instructorNotes]);
            const pdi = useMemo(() => buildInstructorPDI(instructorNotes), [instructorNotes]);
            const graphHistory = useMemo(() => instructorNotes.filter(note => note.score !== null && Number.isFinite(Number(note.score))).map(note => ({ ...note, capturedAt: `${note.date}T12:00:00` })), [instructorNotes]);
            const competenceLabel = value => (PDI_COMPETENCIES.find(item => item.id === value) || {}).label || "Sem competência avaliativa";
            const scoreLabel = value => value === null ? "Sem avaliação" : `${(PDI_SCORE_OPTIONS.find(item => item.value === Number(value)) || {}).label || "Avaliação"} (${value}%)`;
            const periodLabel = note => note.periodStart || note.periodEnd ? `${note.periodStart ? formatNotebookDate(note.periodStart) : "Início não informado"} a ${note.periodEnd ? formatNotebookDate(note.periodEnd) : "Em aberto"}` : "Período não informado";

            const resetForm = () => {
                setDrafts([]);
                setPeriodStart("");
                setPeriodEnd("");
                setDate(notebookDateInput(new Date()));
                setTrackingEnabled(false);
                setTrackingStatus("em_acompanhamento");
                setReminderDate("");
                setEditingNoteId("");
            };

            const startEditing = note => {
                setSelectedInstructor(note.instructorName);
                setPeriodStart(note.periodStart || "");
                setPeriodEnd(note.periodEnd || "");
                setDate(note.date || notebookDateInput(new Date()));
                setTrackingEnabled(note.trackingEnabled === true);
                setTrackingStatus(note.trackingStatus || "em_acompanhamento");
                setReminderDate(note.reminderDate || "");
                setDrafts([{
                    ...createAnalystDraft(note.followupType),
                    subject: note.subject || "",
                    notes: note.notes || "",
                    manualPDI: true,
                    manualCompetency: note.competency || "",
                    manualScore: note.score === null || note.score === undefined ? "" : String(note.score)
                }]);
                setEditingNoteId(note.id);
                setSaveNotice("Editando acompanhamento selecionado.");
            };

            const save = async () => {
                if (!selectedInstructor || drafts.length === 0 || drafts.some(item => !item.subject.trim() && !item.notes.trim())) {
                    alert("Selecione o instrutor, ao menos uma situação e informe assunto ou descrição em cada situação escolhida.");
                    return;
                }
                if (editingNoteId && drafts.length !== 1) {
                    alert("Durante a edição, mantenha somente a situação deste acompanhamento. Para registrar outras situações, conclua ou cancele a edição.");
                    return;
                }
                if (trackingEnabled && !reminderDate && !periodEnd) {
                    alert("Informe a data do lembrete ou o fim do período para acompanhar o status.");
                    return;
                }
                setIsSaving(true);
                try {
                    const results = [];
                    for (const draft of drafts) {
                        const suggestion = suggestionFor(draft);
                        const competency = draft.manualPDI ? draft.manualCompetency : suggestion.competency;
                        const score = draft.manualPDI ? (draft.manualScore === "" ? null : Number(draft.manualScore)) : suggestion.score;
                        results.push(await persistAnalystNote(turma, analystName, {
                            id: editingNoteId || undefined,
                            createdAt: editingNoteId ? (allNotes.find(note => note.id === editingNoteId) || {}).createdAt : undefined,
                            instructorName: selectedInstructor,
                            periodStart,
                            periodEnd,
                            date,
                            followupType: draft.followupType,
                            subject: draft.subject,
                            notes: draft.notes,
                            competency: competency || "",
                            score,
                            visibleToInstructor: true,
                            trackingEnabled,
                            trackingStatus: trackingEnabled ? trackingStatus : "em_acompanhamento",
                            reminderDate: trackingEnabled ? (reminderDate || periodEnd) : ""
                        }));
                    }
                    setAllNotes(current => [...results.map(item => item.note), ...current.filter(note => !results.some(item => item.note.id === note.id))]);
                    setStorageSource(results.every(item => item.source === "cloud") ? "cloud" : "local");
                    resetForm();
                    setSaveNotice(editingNoteId ? "Acompanhamento atualizado com sucesso." : `${results.length} situação(ões) salva(s) com sucesso.`);
                    if (typeof onChanged === "function") onChanged();
                } finally { setIsSaving(false); }
            };
            const remove = async noteId => {
                if (!confirm("Excluir este acompanhamento do instrutor?")) return;
                if (editingNoteId === noteId) resetForm();
                setAllNotes(current => current.filter(note => note.id !== noteId));
                const result = await removeAnalystNote(turma, analystName, noteId);
                setStorageSource(result.source);
                if (typeof onChanged === "function") onChanged();
            };
            const changeTrackingStatus = async (note, value) => {
                const updated = normalizeAnalystNote({ ...note, trackingEnabled: true, trackingStatus: value });
                setAllNotes(current => current.map(item => item.id === note.id ? updated : item));
                const result = await persistAnalystNote(turma, analystName, updated);
                setStorageSource(result.source);
                if (typeof onChanged === "function") onChanged();
            };
            const printPDI = () => {
                const reportWindow = window.open("", "_blank");
                if (!reportWindow) { alert("Não foi possível abrir o PDI. Verifique o bloqueio de pop-ups."); return; }
                const strengths = pdi.strengths.map(item => `<li><strong>${escapeReportHTML(item.label)}:</strong> ${escapeReportHTML(item.note.subject || item.note.notes)}</li>`).join("") || "<li>Nenhum ponto forte avaliado.</li>";
                const opportunities = pdi.opportunities.map(item => `<li><strong>${escapeReportHTML(item.label)}:</strong> ${escapeReportHTML(item.note.subject || item.note.notes)}<br><em>Ação sugerida: ${escapeReportHTML(item.action)}</em></li>`).join("") || "<li>Nenhuma oportunidade registrada.</li>";
                reportWindow.document.write(`<html lang="pt-BR"><head><meta charset="UTF-8"><title>PDI - ${escapeReportHTML(selectedInstructor)}</title><style>body{font-family:Aptos,Arial,sans-serif;color:#243447;margin:32px}h1{color:#004587;border-bottom:3px solid #f5821f;padding-bottom:10px}h2{font-size:15px;color:#004587;margin-top:22px}li{margin:8px 0;line-height:1.45}.score{background:#eef5fb;border-left:4px solid #f5821f;padding:12px;font-weight:bold}@media print{button{display:none}}</style></head><body><button onclick="window.print()">Imprimir / PDF</button><h1>Plano de Desenvolvimento Individual</h1><p><strong>Instrutor:</strong> ${escapeReportHTML(selectedInstructor)}<br><strong>Turma:</strong> ${escapeReportHTML(turma)}<br><strong>Analista:</strong> ${escapeReportHTML(analystName)}</p><div class="score">Indicador atual: ${pdi.average === null ? "Sem avaliação" : `${pdi.average}%`}</div><h2>Pontos fortes</h2><ul>${strengths}</ul><h2>Oportunidades e ações</h2><ul>${opportunities}</ul></body></html>`);
                reportWindow.document.close();
            };

            return <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/70 p-4 backdrop-blur-sm" onClick={event => { if (event.target === event.currentTarget) onClose(); }}><div className="flex max-h-[94vh] w-full max-w-7xl flex-col overflow-hidden rounded-xl bg-white shadow-2xl">
                <div className="flex shrink-0 items-center justify-between bg-senac-blue p-4 text-white"><div><h2 className="flex items-center gap-2 text-xl font-bold"><IconBarChart2 className="h-6 w-6" /> Caderno do Analista</h2><p className="mt-1 text-xs text-blue-100">Acompanhamento de instrutores e construção do PDI | {analystName}</p></div><div className="flex items-center gap-2"><button type="button" onClick={() => setShowEvaluations(value => !value)} className="rounded-md border border-white/40 px-3 py-2 text-xs font-bold hover:bg-white/10"><IconEye className="mr-1 inline h-4 w-4" /> {showEvaluations ? "Ocultar avaliações" : "Mostrar avaliações"}</button><button onClick={onClose} className="rounded-full p-1 hover:bg-white/20"><IconXCircle className="h-6 w-6" /></button></div></div>
                <div className="grid flex-1 grid-cols-1 overflow-y-auto bg-gray-50 lg:grid-cols-[440px_1fr]"><div className="border-r border-gray-200 bg-white p-5">
                    <label className="block text-xs font-bold uppercase text-gray-500">Instrutor acompanhado<select value={selectedInstructor} onChange={event => setSelectedInstructor(event.target.value)} className="mt-2 w-full rounded-md border border-gray-300 p-2 text-sm font-normal"><option value="">Selecione</option>{instructorOptions.map(name => <option key={name} value={name}>{name}</option>)}</select></label>
                    <div className="mt-4"><div className="mb-2 text-xs font-bold uppercase text-gray-500">Período de acompanhamento</div><div className="grid grid-cols-2 gap-3"><label className="text-xs font-bold text-gray-600">Início<input type="date" value={periodStart} onChange={event => setPeriodStart(event.target.value)} className="mt-1 w-full rounded-md border border-gray-300 p-2 font-normal" /></label><label className="text-xs font-bold text-gray-600">Fim<input type="date" min={periodStart || undefined} value={periodEnd} onChange={event => setPeriodEnd(event.target.value)} className="mt-1 w-full rounded-md border border-gray-300 p-2 font-normal" /></label></div></div>
                    <label className="mt-4 block text-xs font-bold text-gray-600">Data do registro<input type="date" value={date} onChange={event => setDate(event.target.value)} className="mt-1 w-full rounded-md border border-gray-300 p-2 font-normal" /></label>
                    <fieldset className="mt-4"><legend className="text-xs font-bold uppercase text-gray-500">Tipos a serem tratados</legend><div className="mt-2 grid grid-cols-2 gap-2">{ANALYST_FOLLOWUP_TYPES.map(type => <label key={type} className={`flex cursor-pointer items-center gap-2 rounded-md border p-2 text-xs font-semibold ${drafts.some(item => item.followupType === type) ? "border-senac-blue bg-blue-50 text-senac-blue" : "border-gray-200 text-gray-600"}`}><input type="checkbox" checked={drafts.some(item => item.followupType === type)} onChange={() => toggleType(type)} className="rounded text-senac-blue" />{type}</label>)}</div></fieldset>
                    <div className="mt-4 space-y-3">{drafts.map(draft => { const suggestion = suggestionFor(draft); return <section key={draft.id} className="rounded-lg border border-gray-200 bg-gray-50 p-3"><div className="mb-2 flex items-center justify-between"><strong className="text-sm text-senac-blue">{draft.followupType}</strong><button type="button" onClick={() => toggleType(draft.followupType)} className="text-gray-400 hover:text-red-600"><IconXCircle className="h-4 w-4" /></button></div><label className="block text-xs font-bold text-gray-600">Assunto<input value={draft.subject} onChange={event => updateDraft(draft.id, { subject: event.target.value })} className="mt-1 w-full rounded border border-gray-300 bg-white p-2 font-normal" placeholder="Assunto específico desta situação" /></label><label className="mt-2 block text-xs font-bold text-gray-600">Descrição<textarea value={draft.notes} onChange={event => updateDraft(draft.id, { notes: event.target.value })} className="mt-1 h-20 w-full resize-none rounded border border-gray-300 bg-white p-2 font-normal" placeholder="Fatos, evidências e encaminhamentos" /></label><div className="mt-2 rounded border border-orange-200 bg-orange-50 p-2 text-xs"><div className="flex justify-between gap-2"><strong className="text-orange-900">Classificação PDI</strong><button type="button" onClick={() => updateDraft(draft.id, draft.manualPDI ? { manualPDI: false } : { manualPDI: true, manualCompetency: suggestion.competency || "", manualScore: suggestion.score === null ? "" : String(suggestion.score) })} className="font-bold text-senac-blue">{draft.manualPDI ? "Usar automática" : "Ajustar"}</button></div>{draft.manualPDI ? <div className="mt-2 space-y-2"><select value={draft.manualCompetency} onChange={event => updateDraft(draft.id, { manualCompetency: event.target.value })} className="w-full rounded border border-gray-300 bg-white p-2"><option value="">Não se aplica</option>{PDI_COMPETENCIES.map(item => <option key={item.id} value={item.id}>{item.label}</option>)}</select>{showEvaluations && <select value={draft.manualScore} onChange={event => updateDraft(draft.id, { manualScore: event.target.value })} className="w-full rounded border border-gray-300 bg-white p-2"><option value="">Sem avaliação</option>{PDI_SCORE_OPTIONS.map(option => <option key={option.value} value={option.value}>{option.label} ({option.value}%)</option>)}</select>}</div> : <div className="mt-2 text-gray-700"><strong>Competência:</strong> {competenceLabel(suggestion.competency)}{showEvaluations && <div className="mt-1"><strong>Avaliação:</strong> {scoreLabel(suggestion.score)}</div>}</div>}</div></section>; })}{drafts.length === 0 && <p className="rounded-lg border border-dashed border-gray-300 p-4 text-center text-xs text-gray-400">Selecione uma ou mais situações para abrir os campos de registro.</p>}</div>
                    <label className="mt-4 flex cursor-pointer items-start gap-2 rounded-lg border border-purple-200 bg-purple-50 p-3 text-xs text-purple-900"><input type="checkbox" checked={trackingEnabled} onChange={event => setTrackingEnabled(event.target.checked)} className="mt-0.5 rounded text-purple-600" /><span><strong className="block">Criar status para acompanhamento</strong>Ativa prazo, alertas e acompanhamento no Outlook.</span></label>
