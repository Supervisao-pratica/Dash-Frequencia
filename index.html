                            scoreVal = parseFloat(scoreVal.replace('%','').replace(',','.')) / 100;
                        } else {
                            scoreVal = parseFloat(scoreVal);
                        }
                        if (!isNaN(scoreVal) && scoreVal > 1 && scoreVal <= 100) scoreVal = scoreVal / 100;

                        const statusVal = String(row[statusCol] || "");
                        
                        if (!isNaN(scoreVal)) {
                            freqScores.push(scoreVal);
                            studentRec.uc_scores[ucName] = { score: scoreVal, status: statusVal };
                            allFoundUCs.add(ucName);

                            if (scoreVal < 0.75) { 
                                studentRec.low_freq_ucs.push(ucName); 
                                if(!studentRec.is_dropout && !studentRec.is_process_dropout) studentRec.needs_conselho = true; 
                            }
                        }
                        
                        if (isNotDevelopedStatus(statusVal)) { 
                            studentRec.failed_perf_ucs.push(ucName); 
                            if(!studentRec.is_dropout && !studentRec.is_process_dropout) { 
                                studentRec.needs_recuperacao = true; 
                                studentRec.status = "Não Desenvolveu"; 
                            } 
                        }
                    });
                    if (freqScores.length > 0) studentRec.averageFreq = (freqScores.reduce((a, b) => a + b, 0) / freqScores.length * 100).toFixed(1);
                    
                    if (studentRec.is_dropout) studentRec.status = "Evadido/Desligado";
                    else if (studentRec.is_process_dropout) studentRec.status = "Em Processo de Desligamento";
                    else if (studentRec.needs_recuperacao) studentRec.status = "Não Desenvolveu";
                    else if (studentRec.needs_conselho) studentRec.status = "Conselho de Classe"; 

                    students.push(studentRec);
                }

                sheetNames.forEach(sheetName => {
                    const sheet = workbook.Sheets[sheetName];
                    const rawData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                    let sheetHeaderRow = findHeaderRow(rawData);
                    let nameColIdx = -1;
                    
                    if (sheetHeaderRow !== -1) {
                         const hRow = rawData[sheetHeaderRow];
                         hRow.forEach((c, idx) => { const cellStr = String(c || "").toUpperCase(); if(cellStr.includes("NOME") || cellStr.includes("ALUNO") || cellStr.includes("APRENDIZ")) nameColIdx = idx; });
                    }
                    if (nameColIdx === -1 && sheetHeaderRow !== -1) nameColIdx = 1; 
                    
                    if (sheetHeaderRow === -1) {
                        for(let r=0; r<10; r++) {
                            if(!rawData[r]) continue;
                            for(let c=0; c<5; c++) {
                                const val = String(rawData[r][c] || "").toUpperCase();
                                if(val.includes("NOME") || val.includes("ALUNO")) { nameColIdx = c; sheetHeaderRow = r; break; }
                            }
                            if(nameColIdx !== -1) break;
                        }
                    }
                    
                    if (sheetHeaderRow === -1) sheetHeaderRow = 0; 

                    const headerRow = rawData[sheetHeaderRow];
                    const nextRow1 = rawData[sheetHeaderRow + 1] || [];
                    const criticalCols = [];
                    const ignoredSheetColumns = new Set();
                    const isUCSheet = sheetName.toUpperCase().includes("UC") || sheetName.toUpperCase().includes("MOD") || sheetName.toUpperCase().includes("MÓD");
                    const isPedagogicalSheet = sheetName === pedSheetName; 

                    if(headerRow) {
                        const maxCols = Math.max(headerRow.length, nextRow1.length, 150);
                        for(let idx = 0; idx < maxCols; idx++) {
                            const fullHeader = (String(headerRow[idx] || "") + " " + String(nextRow1[idx] || "")).toUpperCase(); 
                            if (isNonDataAttendanceHeader(fullHeader)) ignoredSheetColumns.add(idx);

                            if (isPedagogicalSheet && ((fullHeader.includes("TEXTO") || fullHeader.includes("PARECER")) && (fullHeader.includes("CONSELHO") || fullHeader.includes("CLASSE")))) { criticalCols.push({ idx, name: "Conselho de Classe", type: 'force_conselho' }); }
                            else if (fullHeader.includes("MOTIVO") || fullHeader.includes("DESLIGAMENTO") || fullHeader.includes("RECUPERA") || fullHeader.includes("ORION") || fullHeader.includes("ÓRION")) {
                                 let customName = "Obs (" + sheetName + ")";
                                 if(fullHeader.includes("MOTIVO") || fullHeader.includes("DESLIGAMENTO")) customName = "Desligamento/Obs (" + sheetName + ")";
                                 else if(fullHeader.includes("RECUPERA")) customName = "Recuperação (" + sheetName + ")";
                                 else if(fullHeader.includes("ORION") || fullHeader.includes("ÓRION")) customName = "Órion (" + sheetName + ")";
                                 criticalCols.push({ idx, name: customName, type: 'force_obs' });
                            }
                            else if (isUCSheet && (fullHeader.startsWith("OBSERVA") || fullHeader.includes("OBSERVAÇÕES") || fullHeader.includes("OBSERVACOES") || fullHeader.includes("ANOTAÇ"))) { criticalCols.push({ idx, name: "Obs (" + sheetName + ")", type: 'force_obs' }); }
                            else if(fullHeader.includes("TEXTOS ÓRION") || fullHeader.includes("RECUPERAÇÕES") || fullHeader.includes("OCORRÊNCIA") || (isUCSheet && fullHeader.includes("SITUAÇÃO FINAL")) ) { criticalCols.push({ idx, name: fullHeader.substring(0, 30), type: 'auto' }); }
                        }
                    }

                    for (let r = sheetHeaderRow + 1; r < rawData.length; r++) {
                        const row = rawData[r];
                        if (!row) continue;
                        const nameInSheet = String(row[nameColIdx] || "").trim();
                        if (nameInSheet.length < 3) continue;
                        const normalized = normalizeName(nameInSheet);
                        const student = students.find(s => normalizeName(s.name) === normalized);
                        if(student) {
                            if (!student.is_dropout) {
                                try {
                                    const cellAddress = XLSX.utils.encode_cell({r: r, c: nameColIdx});
                                    applyOrangeStudentSituation({
                                        student,
                                        cell: sheet[cellAddress],
                                        row,
                                        sheetName,
                                        isPedagogicalSheet,
                                        sheet,
                                        rowIndex: r,
                                        nameColIdx
                                    });
                                } catch(e) {}
                            }
                            
                            row.forEach((cellVal, idx) => {
                                if (ignoredSheetColumns.has(idx)) return;
                                const valStr = String(cellVal || "").trim();
                                if(valStr.length < 2 || valStr === "0" || valStr === "-") return;
                                if (/^[\d.,\s%-]+$/.test(valStr)) return;
                                const observationContext = getObservationContext(rawData, sheetHeaderRow, idx, sheetName);
                                const isCritical = criticalCols.find(cc => cc.idx === idx);
                                if (isCritical) {
                                    if (isCritical.type === 'force_conselho') { student.conselho_text = valStr; addStudentObservation(student, valStr, { ...observationContext, source: "[Conselho]", kind: "pedagogical" }); }
                                    else if (isCritical.type === 'force_obs') { addStudentObservation(student, valStr, { ...observationContext, source: `[${isCritical.name}]`, kind: "observation" }); }
                                    else { let sourceLabel = sheetName; if(isCritical.name.includes("ORION") || isCritical.name.includes("ÓRION")) sourceLabel = "Órion/Recuperação"; addStudentObservation(student, valStr, { ...observationContext, source: sourceLabel, kind: "observation" }); }
                                } else { if(isInterestingText(valStr, student.name)) addStudentObservation(student, valStr, { ...observationContext, kind: "observation" }); }
                            });
                            if (sheet['!ref']) {
                                row.forEach((_, colIdx) => {
                                    const cellAddress = XLSX.utils.encode_cell({r: r, c: colIdx});
                                    const cell = sheet[cellAddress];
                                    if(cell) {
                                        const comment = extractCellComments(cell);
                                        if(comment) {
                                            const cleanComment = comment.replace(student.name, '').trim();
                                            if(cleanComment.length > 2 && !cleanComment.toUpperCase().includes("TOTAL")) {
                                                const commentContext = getObservationContext(rawData, sheetHeaderRow, colIdx, sheetName);
                                                addStudentObservation(student, `[Comentário da chamada] ${cleanComment}`, { ...commentContext, kind: "attendance_comment" });
                                            }
                                        }
                                    }
                                });
                            }
                        }
                    }
                });

                const attendanceWarnings = analyzeAttendanceWarnings(workbook, students);
                const naAlerts = analyzeNAWarnings(workbook, students);
                return { course, turma, tutor1, tutor2, instructors, students, ucs: Array.from(allFoundUCs).sort(), courseDates: rawDates, attendanceWarnings, naAlerts };
            } catch (error) {
                console.error(error);
                alert("Erro ao ler o arquivo: " + error.message);
                return null;
            }
        };

        const generateHash = (str) => {
            let hash = 0; if (str.length === 0) return "0000";
            for (let i = 0; i < str.length; i++) { const char = str.charCodeAt(i); hash = ((hash << 5) - hash) + char; hash = hash & hash; }
            return Math.abs(hash).toString(16).toUpperCase().substring(0, 8);
        };

        const maskCPF = (cpf) => {
            const clean = cpf.replace(/\D/g, ''); if(clean.length < 3) return cpf;
            if(clean.length >= 9) return `***.${clean.substr(3,3)}.${clean.substr(6,3)}-**`; return cpf;
        };

        const generateSignatureBlock = (role, name, cpf, matricula, rubricaSrc) => {
            if (rubricaSrc) {
                return `
                    <div class="sig-block" style="text-align: center; margin: 20px auto 30px auto; width: 100%;">
                        <img src="${rubricaSrc}" alt="Assinatura" style="height: 60px; max-width: 200px; margin-bottom: 5px; object-fit: contain; display: block; margin-left: auto; margin-right: auto;" />
                        <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse: collapse; width: 300px; margin: 5px auto 0 auto;"><tr><td style="border-top: 1px solid #000000; height: 1px; line-height: 1px; font-size: 1px;">&nbsp;</td></tr></table>
                        <div><strong>${name}</strong></div>
                        <div>${role}</div>
                    </div>
                `;
            }
            if(cpf && cpf.length > 5 && matricula && matricula.length > 2) {
                const now = new Date();
                const timestamp = now.toLocaleDateString() + " " + now.toLocaleTimeString();
                const hash = generateHash(name + cpf + matricula + timestamp);
                const masked = maskCPF(cpf);
                return `
                    <div class="sig-digital-block" style="border: 1px solid #ccc; padding: 10px; margin: 10px auto; width: 90%; max-width: 400px; text-align: left; font-size: 10pt; background-color: #f9f9f9;">
                        <div style="font-weight: bold; border-bottom: 1px solid #ddd; margin-bottom: 5px; padding-bottom: 2px;">Assinado Eletronicamente</div>
                        <div><strong>Nome:</strong> ${name}</div>
                        <div><strong>Função:</strong> ${role}</div>
                        <div><strong>CPF:</strong> ${masked} | <strong>Matrícula:</strong> ${matricula}</div>
                        <div style="margin-top:5px; font-size: 8pt; color: #555;">Hash de Validação: <span style="font-family: monospace;">${hash}</span></div>
                        <div style="font-size: 8pt; color: #777;">Data: ${timestamp}</div>
                        <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse: collapse; width: 300px; margin: 14px auto 0 auto;"><tr><td style="border-top: 1px solid #000000; height: 1px; line-height: 1px; font-size: 1px;">&nbsp;</td></tr></table>
                    </div>
                `;
            }
            return `
                <div class="sig-block" style="text-align: center; margin: 20px auto 30px auto; width: 100%;">
                    <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse: collapse; width: 300px; margin: 0 auto 5px auto;"><tr><td style="border-top: 1px solid #000000; height: 1px; line-height: 1px; font-size: 1px;">&nbsp;</td></tr></table>
                    <div><strong>${name}</strong></div>
                    <div>${role}</div>
                </div>`;
        };

        const UC_NUMBER_WORDS = {
            1: "um", 2: "dois", 3: "três", 4: "quatro", 5: "cinco", 6: "seis", 7: "sete", 8: "oito", 9: "nove", 10: "dez",
            11: "onze", 12: "doze", 13: "treze", 14: "quatorze", 15: "quinze", 16: "dezesseis", 17: "dezessete", 18: "dezoito", 19: "dezenove", 20: "vinte",
            21: "vinte e um", 22: "vinte e dois", 23: "vinte e três", 24: "vinte e quatro", 25: "vinte e cinco", 26: "vinte e seis", 27: "vinte e sete", 28: "vinte e oito", 29: "vinte e nove", 30: "trinta"
        };

        const formatUCInAta = (value) => {
            const raw = String(value || "").trim();
            const match = raw.match(/UC\s*(\d+)/i);
            if (!match) return raw;
            const number = Number(match[1]);
            return `UC ${number} (${UC_NUMBER_WORDS[number] || number})`;
        };

        const formatUCSInAta = (values) => (values || []).map(formatUCInAta).join(", ");

        const generateAtaHTMLContent = (analistaName, analistaCPF, analistaMatricula, analistaRubrica, students, course, turma, tutor1, tutor1CPF, tutor1Matricula, tutor1Rubrica, tutor2, tutor2CPF, tutor2Matricula, tutor2Rubrica, logoSrc) => {
            const date = new Date();
            const dateStr = date.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });
            const finalLogo = logoSrc || "https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Senac_logo.svg/500px-Senac_logo.svg.png";
            const studentsWithIssues = students.filter(s => (s.needs_recuperacao || s.needs_conselho) && !s.is_dropout && !s.is_process_dropout);
            const studentsOk = students.filter(s => !s.needs_recuperacao && !s.needs_conselho && !s.is_dropout && !s.is_process_dropout);
            const studentsDropouts = students.filter(s => s.is_dropout);
            const studentsProcess = students.filter(s => s.is_process_dropout);
            const isVendas = String(course).toLowerCase().includes("vendas");
            const rangeTutor1 = `${formatUCInAta("UC1")} à ${formatUCInAta("UC6")}`;
            const rangeTutor2 = isVendas ? `${formatUCInAta("UC7")} à ${formatUCInAta("UC13")}` : `${formatUCInAta("UC7")} à ${formatUCInAta("UC11")}`;
            let textIssues = "";
            const issueDescriptions = studentsWithIssues.map(s => {
                const ucsFreq = formatUCSInAta(s.low_freq_ucs);
                const ucsPerf = formatUCSInAta(s.failed_perf_ucs);
                let desc = "";
                if (s.needs_recuperacao) { const ucs = ucsPerf || "Geral"; desc = `o(a) aluno(a) <strong>${s.name}</strong> não atendeu os indicadores de avaliação na(s) Unidade(s) Curricular(es) ${ucs}, não desenvolvendo o curso`; } 
                else if (s.needs_conselho) { desc = `o(a) aluno(a) <strong>${s.name}</strong> finalizou a(s) Unidade(s) Curricular(es) ${ucsFreq} com baixa frequência, porém atendeu os indicadores finais de avaliação, desenvolvendo o curso`; }
                return desc;
            });
            if (issueDescriptions.length > 0) textIssues = issueDescriptions.join("; ") + ".";
            let textOk = studentsOk.length > 0 ? "Os demais alunos que compõem a turma desenvolveram o curso sem ressalvas." : "";
            let textDropouts = "";
            if (studentsDropouts.length > 0) { const names = studentsDropouts.map(s => s.name).join(", "); textDropouts = `<p>Constatou-se ainda que os alunos <strong>${names}</strong>, solicitaram desligamento do Programa de Aprendizagem.</p>`; }
            let textProcess = "";
            if (studentsProcess.length > 0) { const names = studentsProcess.map(s => s.name).join(", "); textProcess = `<p>Os alunos <strong>${names}</strong> encontram-se em processo administrativo de desligamento.</p>`; }
            const dropoutNames = studentsDropouts.map(s => s.name).join(", ");
            const textDropoutsWithoutDocument = `<p><strong>Desligados sem documento:</strong> O Conselho registrou a informação de que ${dropoutNames ? `<strong>${dropoutNames}</strong>` : "o(a) aluno(a) citado(a)"} solicitaram o desligamento; entretanto, até a presente data, não foram recebidos os documentos comprobatórios.</p>`;
            const sigAnalista = generateSignatureBlock("Analista Responsável", analistaName || "Analista", analistaCPF, analistaMatricula, analistaRubrica);
            const sigTutor1 = generateSignatureBlock("Instrutor(a)", tutor1, tutor1CPF, tutor1Matricula, tutor1Rubrica);
            const sigTutor2 = generateSignatureBlock("Instrutor(a)", tutor2, tutor2CPF, tutor2Matricula, tutor2Rubrica);
            return `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><title>Ata de Conselho</title>
                <style>
                    body { font-family: 'Aptos', Arial, sans-serif; font-size: 12pt; line-height: 1.5; text-align: justify; margin: 20px; color: #000; background: white; }
                    .header { text-align: center; font-weight: bold; margin-bottom: 20px; }
                    .ata-number { text-align: left; font-weight: bold; margin-bottom: 20px; }
                    p { text-indent: 1.25cm; margin-bottom: 0; margin-top: 0; }
                    .logo-container { text-align: center; margin-bottom: 20px; }
                    .signatures { margin-top: 50px; }
                    .document-date { text-align: right; text-indent: 0; margin-top: 28px; margin-bottom: 0; }
                </style>
                </head>
                <body>
                    <div id="print-area">
                        <div class="logo-container"><img src="${finalLogo}" width="120" style="max-width: 150px; height: auto;"></div>
                        <div class="header">UNIDADE DE EDUCAÇÃO PROFISSIONAL E TECNOLÓGICA DO SENAC, EM CURITIBA</div>
                        <div class="ata-number">ATA Nº: _________________</div>
                        <p>Ata do Conselho de Classe, do curso de <strong>${course}</strong>, Formação Inicial e Continuada, turma <strong>${turma}</strong>, para deliberar sobre a situação dos alunos citados abaixo. No dia ${dateStr}, foram convocados pela Analista <strong>${analistaName || "[ANALISTA]"}</strong>, os(as) instrutores(as) <strong>${tutor1} (${rangeTutor1})</strong> e <strong>${tutor2} (${rangeTutor2})</strong>.</p>
                        <p>A analista <strong>${analistaName || "[ANALISTA]"}</strong> iniciou os trabalhos solicitando que as análises do desempenho dos alunos bem como suas necessidades/dificuldades fossem levadas em consideração. ${textIssues} ${textOk}</p>
                        ${textDropouts}
                        ${textProcess}
                        ${textDropoutsWithoutDocument}
                        <p>Nada mais havendo a tratar, foi lavrada a presente ata que vai assinada por mim, ${analistaName || "[ANALISTA]"} e pelos que estiveram presentes na qualidade de participantes da reunião.</p>
                        <p class="document-date">Curitiba, ${dateStr}.</p>
                        <div class="signatures"><h4 style="text-align:center; font-size:12pt; margin-bottom:10px;">Manifesto de Assinaturas</h4>${sigAnalista} ${sigTutor1} ${sigTutor2}</div>
                    </div>
                </body>
                </html>
            `;
        };

        const downloadAtaDocument = (contentRef, turma) => {
            if (!contentRef.current) return;
            const editedHtml = contentRef.current.innerHTML;
            const fullHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Ata</title><style>@page { size: A4; margin: 3cm 2cm 2cm 3cm; } body { font-family: 'Aptos', Arial, sans-serif; text-align: justify; font-size: 12pt; line-height: 1.5; } .document-date { text-align: right !important; text-indent: 0 !important; }</style></head><body>${editedHtml}</body></html>`;
            const blob = new Blob([fullHtml], { type: 'application/msword' });
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `Ata_Conselho_${turma}.doc`; document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };
        
        const printAtaDocument = () => {
             const style = document.createElement('style');
             style.innerHTML = `@media print { @page { size: A4 portrait; margin: 2cm; } body { font-family: 'Aptos', Arial, sans-serif !important; text-align: justify; -webkit-print-color-adjust: exact; } .document-date { text-align: right !important; text-indent: 0 !important; } }`;
             document.head.appendChild(style);
             const printContent = document.getElementById("ata-preview-content");
             if(printContent) {
                 const printArea = document.createElement('div');
                 printArea.id = 'print-area';
                 printArea.innerHTML = printContent.innerHTML;
                 document.body.appendChild(printArea);
                 window.print();
                 document.body.removeChild(printArea);
             }
             document.head.removeChild(style);
        };

        const getUCNumber = (value) => {
            const match = String(value || "").match(/UC\s*(\d+)/i);
            return match ? Number(match[1]) : null;
        };

        const normalizeUCInterval = (fromUC, toUC) => {
            const from = getUCNumber(fromUC);
            const to = getUCNumber(toUC);
            if (from === null || to === null) return null;
            return { from: Math.min(from, to), to: Math.max(from, to) };
        };

        const isUCInInterval = (value, interval) => {
            const number = getUCNumber(value);
            return Boolean(interval && number !== null && number >= interval.from && number <= interval.to);
        };

        const escapeReportHTML = (value) => String(value === null || value === undefined ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

        const generateStudentSituationReport = ({ student, turma, course, instructors, tutor1, tutor2, activityTracking, reportData, naJustifications, notebookNotes, options }) => {
            if (!student) return;
            const selectedOptions = options || {};
            const enabledSections = Object.values(selectedOptions).filter(Boolean).length;
            if (enabledSections === 0) {
                alert("Selecione pelo menos uma informacao para emitir o relatorio.");
                return;
            }
            const printWindow = window.open("", "_blank");
            if (!printWindow) {
                alert("Nao foi possivel abrir o relatorio. Verifique se o navegador bloqueou a nova janela.");
                return;
            }

            const dateStr = new Date().toLocaleDateString("pt-BR");
            const studentRecipients = [{ name: student.studentContactName || student.name, email: student.studentEmail || "" }];
            const supervisorRecipients = [{ name: student.supervisorName || "Supervisor", email: student.supervisorEmail || "" }];
            const reportSubject = `Relatorio de situacoes - ${student.name} - Turma ${turma}`;
            const instructorLabel = [...new Set([...(instructors || []), tutor1, tutor2].map(value => String(value || "").trim()).filter(value => value && value !== "Nao Identificado"))].join(" / ") || "Nao Identificado";
            const section = (title, body, className = "") => `<section class="report-section ${className}"><h2>${escapeReportHTML(title)}</h2>${body}</section>`;

            const studentContactHTML = `<div class="contact-grid"><div><strong>Aluno</strong><br>${escapeReportHTML(student.studentContactName || student.name)}<br>${escapeReportHTML(student.studentEmail || "E-mail nao informado")}<br>${escapeReportHTML(student.studentPhone || "Telefone nao informado")}</div></div>`;
            const supervisorContactHTML = `<div class="contact-grid"><div><strong>Supervisor</strong><br>${escapeReportHTML(student.supervisorName || "Supervisor nao informado")}<br>${escapeReportHTML(student.supervisorEmail || "E-mail nao informado")}<br>${escapeReportHTML(student.supervisorPhone || "Telefone nao informado")}</div></div>`;

            const academicRows = Object.entries(student.uc_scores || {})
                .sort((a, b) => (getUCNumber(a[0]) || 0) - (getUCNumber(b[0]) || 0))
                .map(([ucName, value]) => {
                    const score = Number(value && value.score);
                    const scoreLabel = Number.isNaN(score) ? "Nao informado" : `${(score <= 1 ? score * 100 : score).toFixed(1)}%`;
                    return `<tr><td>${escapeReportHTML(ucName)}</td><td>${scoreLabel}</td><td>${escapeReportHTML(value && value.status || "Nao informado")}</td></tr>`;
                }).join("");
            const academicHTML = `<div class="status-line"><strong>Status:</strong> ${escapeReportHTML(student.status || "Nao informado")} &nbsp; | &nbsp; <strong>Frequencia media:</strong> ${escapeReportHTML(student.averageFreq)}%</div><table><thead><tr><th>UC</th><th>Frequencia</th><th>Desempenho</th></tr></thead><tbody>${academicRows || `<tr><td colspan="3">Sem dados detalhados por UC.</td></tr>`}</tbody></table><p><strong>Baixa frequencia:</strong> ${escapeReportHTML((student.low_freq_ucs || []).join(", ") || "Nenhuma")}</p><p><strong>Desempenho pendente:</strong> ${escapeReportHTML((student.failed_perf_ucs || []).join(", ") || "Nenhum")}</p>`;

            const naRaw = reportData && reportData.naAlerts && reportData.naAlerts.students ? reportData.naAlerts.students[normalizeName(student.name)] : null;
            const naEntries = naRaw && Array.isArray(naRaw.entries) ? naRaw.entries : [];
            const naHTML = naEntries.length > 0 ? `<table><thead><tr><th>UC</th><th>Data</th><th>Aba</th><th>Situacao</th><th>Motivo</th></tr></thead><tbody>${naEntries.map(entry => {
                const justification = naJustifications && naJustifications[entry.key];
                return `<tr class="${justification ? "ok" : "attention"}"><td>${escapeReportHTML(entry.uc)}</td><td>${escapeReportHTML(entry.date)}</td><td>${escapeReportHTML(entry.sheet)}</td><td>${justification ? "Justificado" : "Pendente"}</td><td>${escapeReportHTML(justification && justification.reason || "Nao informado")}</td></tr>`;
            }).join("")}</tbody></table>` : `<p class="muted">Nenhum registro NA de chamada encontrado.</p>`;

            const observations = student.all_observations || [];
            const observationsHTML = observations.length > 0 ? `<div class="observation-list">${observations.map(observation => `<div class="observation"><strong>${escapeReportHTML(getObservationGroupLabel(observation))}</strong><div>${escapeReportHTML(observation.text)}</div>${observation.date ? `<small>${escapeReportHTML(observation.date)}</small>` : ""}</div>`).join("")}</div>` : `<p class="muted">Nenhuma observacao registrada nas abas.</p>`;

            const studentNotes = (notebookNotes || []).filter(note => note.scope === "class" || Number(note.studentId) === Number(student.id) || (note.studentIds || []).includes(Number(student.id)));
            const notesHTML = studentNotes.length > 0 ? `<div class="observation-list">${studentNotes.map(note => `<div class="observation"><strong>${escapeReportHTML(getNotebookSituationLabel(note))}</strong> <span class="pill">${escapeReportHTML(getNotebookStatusMeta(note).label)}</span><div>${escapeReportHTML(note.notes || "Sem texto")}</div><small>Instrutor: ${escapeReportHTML(note.instructorSource || note.instructorName || "Nao informado")} | Analista: ${escapeReportHTML(note.responsibleAnalyst || "Nao informado")} | Registro: ${escapeReportHTML(formatNotebookDate(note.date))}</small></div>`).join("")}</div>` : `<p class="muted">Nenhuma anotacao do caderno vinculada.</p>`;

            const activitySummary = getActivityStudentSummary(activityTracking, student.name);
            const activityHTML = activitySummary && activitySummary.total > 0 ? `<div class="status-line"><strong>Fonte:</strong> ${escapeReportHTML(activityTracking.sourceName || "Upload atual")} (nao gravado na turma)<br><strong>Total:</strong> ${activitySummary.total} | <strong>Concluiu:</strong> ${activitySummary.completed} | <strong>NC:</strong> ${activitySummary.not_completed} | <strong>Em branco:</strong> ${activitySummary.blank} | <strong>Requer avaliacao:</strong> ${activitySummary.requires_evaluation}</div><ul>${activitySummary.entries.filter(entry => entry.status !== "completed").slice(0, 80).map(entry => `<li><strong>${escapeReportHTML(formatActivityStatusLabel(entry.status))}:</strong> ${escapeReportHTML(entry.label)}</li>`).join("") || `<li class="muted">Nenhuma pendencia de atividade.</li>`}</ul>` : `<p class="muted">Nenhum upload de atividades disponivel para este aluno.</p>`;

            const sections = [];
            if (selectedOptions.studentContact) sections.push(section("Contato do aluno", studentContactHTML));
            if (selectedOptions.supervisorContact) sections.push(section("Contato do supervisor", supervisorContactHTML));
            if (selectedOptions.academic) sections.push(section("Frequencia, desempenho e situacao", academicHTML));
            if (selectedOptions.justifications) sections.push(section("Justificativas e registros NA da chamada", naHTML, "na-section"));
            if (selectedOptions.observations) sections.push(section("Observacoes das planilhas", observationsHTML));
            if (selectedOptions.notebook) sections.push(section("Anotacoes do caderno do instrutor", notesHTML));
            if (selectedOptions.activities) sections.push(section("Atividades do upload atual", activityHTML, "activity-section"));

            const recipientsJSON = value => JSON.stringify(value).replace(/<\/script/gi, "<\\/script");
            const htmlContent = `<html lang="pt-BR"><head><meta charset="UTF-8"><title>${escapeReportHTML(reportSubject)}</title><style>body{font-family:Arial,sans-serif;margin:0;padding:0;color:#243447;background:#fff}.menu{background:#004587;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5}.menu strong{font-size:14px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn,.recipient{border:0;border-radius:4px;padding:8px 10px;font-size:11px;font-weight:bold}.btn{cursor:pointer;background:#F5821F;color:#fff}.recipient{color:#123;background:#fff}.content{max-width:980px;margin:0 auto;padding:24px}.header{text-align:center;border-bottom:3px solid #F5821F;padding-bottom:16px}.header img{width:82px}.header h1{color:#004587;font-size:21px;margin:8px 0}.header p{margin:4px;font-size:12px}.student{margin-top:18px;border:1px solid #d9e2ec;border-left:4px solid #F5821F;border-radius:7px;padding:16px}.student h3{margin:0;color:#004587;font-size:17px}.student-meta{font-size:12px;color:#64748b;margin-top:6px}.report-section{margin-top:16px;border-top:1px solid #e2e8f0;padding-top:10px}.report-section h2{font-size:14px;color:#004587;margin:0 0 8px;border-bottom:1px solid #dce7f0;padding-bottom:5px}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12px}.contact-grid>div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:5px;padding:9px}.status-line{background:#f8fafc;border-left:3px solid #F5821F;padding:9px;font-size:12px;margin-bottom:8px}.report-section p,.report-section li{font-size:12px;line-height:1.45}.report-section table{width:100%;border-collapse:collapse;font-size:11px;margin:7px 0}.report-section th,.report-section td{border:1px solid #d9e2ec;padding:6px;text-align:left}.report-section th{background:#eef5fb;color:#004587}.attention{background:#fff7ed;color:#9a3412}.ok{background:#f0fdf4;color:#166534}.observation{background:#f8fafc;border-left:3px solid #F5821F;padding:8px;margin:6px 0;font-size:12px}.observation small{display:block;color:#64748b;margin-top:4px}.pill{background:#eaf2fa;color:#004587;border-radius:4px;padding:2px 5px;font-size:10px}.muted{color:#64748b;font-style:italic}@media(max-width:700px){.menu{align-items:flex-start;flex-direction:column}.contact-grid{grid-template-columns:1fr}}@media print{.menu{display:none!important}.content{padding:0}}</style></head><body><div class="menu"><strong>Relatorio individual</strong><div class="actions"><select id="recipient" class="recipient"><option value="student">Enviar ao aluno</option><option value="supervisor">Enviar ao supervisor</option></select><button class="btn" onclick="sendEmail()">Enviar por Outlook</button><button class="btn" onclick="copyReport()">Copiar para e-mail</button><button class="btn" onclick="window.print()">Imprimir / PDF</button></div></div><main id="report-content" class="content"><div class="header"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Senac_logo.svg/500px-Senac_logo.svg.png" alt="Senac"><h1>Relatorio de situacoes</h1><p><strong>Curso:</strong> ${escapeReportHTML(course)}</p><p><strong>Turma:</strong> ${escapeReportHTML(turma)} | <strong>Emitido em:</strong> ${dateStr}</p><p><strong>Instrutores:</strong> ${escapeReportHTML(instructorLabel)}</p></div><article class="student"><h3>${escapeReportHTML(student.name)}</h3><div class="student-meta">Contra turno: ${escapeReportHTML(student.contra_turno_desc || "Nao informado")} | Status: ${escapeReportHTML(student.status || "Nao informado")}</div>${sections.join("")}</article></main><script>const studentRecipients=${recipientsJSON(studentRecipients)};const supervisorRecipients=${recipientsJSON(supervisorRecipients)};const subject=${JSON.stringify(reportSubject).replace(/<\/script/gi, "<\\/script")};function copyReport(afterCopy){const content=document.getElementById('report-content');if(!content)return;const done=()=>{if(typeof afterCopy==='function')afterCopy();else alert('Relatorio copiado. Cole no Outlook com Ctrl+V para manter o layout.');};if(navigator.clipboard&&window.ClipboardItem){const item=new ClipboardItem({'text/html':new Blob([content.outerHTML],{type:'text/html'}),'text/plain':new Blob([content.innerText],{type:'text/plain'})});navigator.clipboard.write([item]).then(done).catch(()=>fallback(done));}else fallback(done);}function fallback(done){const range=document.createRange();range.selectNodeContents(document.getElementById('report-content'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);try{document.execCommand('copy');done();}finally{selection.removeAllRanges();}}function sendEmail(){const type=document.getElementById('recipient').value;const list=type==='supervisor'?supervisorRecipients:studentRecipients;const emails=[...new Set(list.map(item=>String(item.email||'').trim()).filter(Boolean))];if(emails.length===0){alert(type==='supervisor'?'Nenhum e-mail de supervisor foi informado.':'Nenhum e-mail de aluno foi informado.');return;}copyReport(()=>{alert('Relatorio copiado. Cole no corpo do Outlook com Ctrl+V para manter o layout.');window.location.href='mailto:'+emails.join(';')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(document.getElementById('report-content').innerText);});}${String.fromCharCode(60)}/script></body></html>`;
            printWindow.document.write(htmlContent);
            printWindow.document.close();
        };

        const generateRangeReport = ({ selectedStudentIds, students, turma, course, instructors, tutor1, tutor2, activityTracking, reportData, naJustifications, notebookNotes, fromUC, toUC }) => {
            const interval = normalizeUCInterval(fromUC, toUC);
            const selected = students.filter(student => selectedStudentIds.includes(student.id));
            if (!interval || selected.length === 0) {
                alert("Selecione a UC inicial, a UC final e pelo menos um aluno ou a turma inteira.");
                return;
            }

            const rangeLabel = interval.from === interval.to ? `UC${interval.from}` : `UC${interval.from} à UC${interval.to}`;
            const printWindow = window.open("", "_blank");
            if (!printWindow) {
                alert("Não foi possível abrir o relatório. Verifique se o navegador bloqueou a nova janela.");
                return;
            }
            const dateStr = new Date().toLocaleDateString("pt-BR");
            const studentRecipients = selected.map(student => ({ name: student.studentContactName || student.name, email: student.studentEmail || "" }));
            const supervisorRecipients = selected.map(student => ({ name: student.supervisorName || "Supervisor", email: student.supervisorEmail || "" }));
            const reportSubject = `Relatório completo - ${rangeLabel} - Turma ${turma}`;
            const instructorLabel = [...new Set([...(instructors || []), tutor1, tutor2].map(value => String(value || "").trim()).filter(value => value && value !== "Não Identificado"))].join(" / ") || "Não Identificado";

            const studentHTML = selected.map((student, studentIndex) => {
                const ucEntries = Object.entries(student.uc_scores || {})
                    .filter(([ucName]) => isUCInInterval(ucName, interval))
                    .sort((a, b) => (getUCNumber(a[0]) || 0) - (getUCNumber(b[0]) || 0));
                const scores = ucEntries.map(([, value]) => Number(value && value.score)).filter(value => !Number.isNaN(value));
                const average = scores.length > 0 ? (scores.reduce((total, value) => total + (value <= 1 ? value * 100 : value), 0) / scores.length).toFixed(1) : "N/A";
                const lowFrequency = ucEntries.filter(([, value]) => Number(value && value.score) < 0.75).map(([ucName]) => ucName);
                const performanceIssues = ucEntries.filter(([, value]) => isNotDevelopedStatus(value && value.status)).map(([ucName]) => ucName);
                const observations = (student.all_observations || []).filter(observation => {
                    const number = getUCNumber(observation.source);
                    return number === null || isUCInInterval(observation.source, interval);
                });
                const activitySummary = getActivityStudentSummary(activityTracking, student.name);
                const activityEntries = activitySummary ? activitySummary.entries.filter(entry => isUCInInterval(entry.uc || entry.sheet, interval)) : [];
                const activityAttention = activityEntries.filter(entry => entry.status !== "completed");
                const activityCounts = activityEntries.reduce((counts, entry) => {
                    counts[entry.status] = (counts[entry.status] || 0) + 1;
                    return counts;
                }, {});
                const naRaw = reportData && reportData.naAlerts && reportData.naAlerts.students ? reportData.naAlerts.students[normalizeName(student.name)] : null;
                const naEntries = naRaw ? naRaw.entries.filter(entry => isUCInInterval(entry.uc || entry.sheet, interval) && !(naJustifications || {})[entry.key]) : [];
                const studentNotes = (notebookNotes || []).filter(note => note.scope === "class" || Number(note.studentId) === Number(student.id) || (note.studentIds || []).includes(Number(student.id)));
                const statusColor = student.is_dropout ? "#f97316" : student.is_process_dropout ? "#9333ea" : student.needs_recuperacao ? "#dc2626" : student.needs_conselho ? "#ca8a04" : "#16a34a";
                const ucRows = ucEntries.length > 0 ? ucEntries.map(([ucName, value]) => {
                    const score = Number(value && value.score);
                    const scoreLabel = Number.isNaN(score) ? "N/A" : `${(score <= 1 ? score * 100 : score).toFixed(1)}%`;
                    const performance = String(value && value.status || "Não informado");
                    const rowClass = Number.isNaN(score) ? "" : score < 0.75 ? "attention" : isNotDevelopedStatus(performance) ? "danger" : "";
                    return `<tr class="${rowClass}"><td>${escapeReportHTML(ucName)}</td><td>${scoreLabel}</td><td>${escapeReportHTML(performance)}</td></tr>`;
                }).join("") : `<tr><td colspan="3" class="muted">Sem dados de frequência/desempenho no intervalo.</td></tr>`;
                const observationHTML = observations.length > 0 ? observations.slice(0, 40).map(observation => `<li><strong>${escapeReportHTML(observation.source || "Geral")}:</strong> ${escapeReportHTML(observation.text)}</li>`).join("") : `<li class="muted">Nenhuma observação registrada.</li>`;
                const activityHTML = activityEntries.length > 0 ? `<div class="summary-box"><strong>${activityEntries.length} atividade(s) identificada(s)</strong><br>Concluiu: ${activityCounts.completed || 0} | Não concluiu: ${activityCounts.not_completed || 0} | Em branco: ${activityCounts.blank || 0} | Requer avaliação: ${activityCounts.requires_evaluation || 0}${activityAttention.length > 0 ? `<ul>${activityAttention.slice(0, 30).map(entry => `<li><strong>${escapeReportHTML(formatActivityStatusLabel(entry.status))}:</strong> ${escapeReportHTML(entry.label)}</li>`).join("")}</ul>` : ""}</div>` : `<div class="summary-box muted">Nenhuma atividade da planilha foi encontrada no intervalo.</div>`;
                const naHTML = naEntries.length > 0 ? `<div class="summary-box danger-box"><strong>${naEntries.length} NA pendente(s) na chamada</strong><br>${naEntries.map(entry => `${escapeReportHTML(entry.uc)} - ${escapeReportHTML(entry.date)}`).join("; ")}</div>` : `<div class="summary-box muted">Nenhum NA pendente no intervalo.</div>`;
                const notesHTML = studentNotes.length > 0 ? studentNotes.map(note => `<div class="notebook-note"><div><strong>${escapeReportHTML(getNotebookSituationLabel(note))}</strong> <span class="status-pill">${escapeReportHTML(getNotebookStatusMeta(note).label)}</span></div><div class="meta">Instrutor: ${escapeReportHTML(note.instructorSource || note.instructorName || "Não informado")} | Analista: ${escapeReportHTML(note.responsibleAnalyst || "Não informado")} | Registro: ${escapeReportHTML(formatNotebookDate(note.date))}</div>${getNotebookTreatmentDue(note) ? `<div class="meta">${escapeReportHTML(getNotebookTreatmentLabel(note))}</div>` : ""}${note.notes ? `<p>${escapeReportHTML(note.notes)}</p>` : ""}</div>`).join("") : `<div class="summary-box muted">Nenhuma anotação de caderno vinculada.</div>`;

                return `<article class="student-card"><div class="header-row"><span class="student-name">${escapeReportHTML(student.name)}</span><span style="color:${statusColor};font-weight:bold">${escapeReportHTML(student.status)}</span></div><div class="info-grid"><div><strong>Frequência média no intervalo:</strong> ${average}%</div><div><strong>Contra Turno:</strong> ${escapeReportHTML(student.contra_turno_desc)}</div><div><strong>UCs com baixa frequência:</strong> ${escapeReportHTML(lowFrequency.join(", ") || "Nenhuma")}</div><div><strong>UCs com desempenho pendente:</strong> ${escapeReportHTML(performanceIssues.join(", ") || "Nenhuma")}</div></div><h3>Frequência e desempenho por UC</h3><table class="uc-table"><thead><tr><th>UC</th><th>Frequência</th><th>Desempenho</th></tr></thead><tbody>${ucRows}</tbody></table><h3>Atividades no intervalo</h3>${activityHTML}<h3>Chamada e NA</h3>${naHTML}<h3>Observações e situações</h3><ul>${observationHTML}</ul><h3>Anotações do caderno</h3>${notesHTML}</article>`;
            }).join("");

            const htmlContent = `<html lang="pt-BR"><head><meta charset="UTF-8"><title>${escapeReportHTML(reportSubject)}</title><style>body{font-family:Arial,sans-serif;padding:20px;color:#243447;background:#fff;margin:0}.report-menu{background:#004587;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 5px rgba(0,0,0,.2)}.menu-title{color:#fff;font-weight:bold;font-size:14px}.menu-actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.recipient-select{border:0;border-radius:4px;padding:8px 10px;font-size:12px;font-weight:bold}.btn{cursor:pointer;color:#fff;background:#F5821F}.recipient-select{color:#123}.report-header{text-align:center;margin:18px 0 22px}.report-header img{width:80px}.report-header h1{font-size:20px;color:#004587;margin:8px 0}.report-header h2{font-size:14px;color:#666;margin:4px}.student-card{border:1px solid #d9e2ec;border-left:4px solid #F5821F;border-radius:8px;padding:16px;margin:0 0 18px;break-inside:avoid}.header-row{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #F5821F;padding-bottom:7px;margin-bottom:10px}.student-name{font-size:17px;font-weight:bold}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-bottom:12px}.student-card h3{font-size:12px;color:#004587;border-bottom:1px solid #e6edf4;padding-bottom:4px;margin:14px 0 7px}.uc-table{width:100%;border-collapse:collapse;font-size:11px}.uc-table th,.uc-table td{border:1px solid #d9e2ec;padding:6px;text-align:left}.uc-table th{background:#eef5fb;color:#004587}.uc-table .attention{background:#fff7ed;color:#9a3412}.uc-table .danger{background:#fef2f2;color:#b91c1c}.summary-box{background:#f8fafc;border-left:3px solid #F5821F;padding:8px;font-size:11px;margin:6px 0}.danger-box{border-left-color:#dc2626;background:#fef2f2;color:#991b1b}.muted{color:#6b7280;font-style:italic}.student-card ul{font-size:11px;margin:5px 0 8px;padding-left:18px}.notebook-note{border:1px solid #d9e2ec;border-left:3px solid #004587;padding:8px;margin:6px 0;font-size:11px}.status-pill{display:inline-block;border-radius:4px;background:#eef5fb;color:#004587;padding:2px 5px;font-size:10px}.meta{color:#64748b;font-size:10px;margin-top:4px}@media(max-width:760px){.report-menu{align-items:flex-start;flex-direction:column;gap:8px}.info-grid{grid-template-columns:1fr}}@media print{.report-menu{display:none!important}}</style></head><body><div class="report-menu"><div class="menu-title">Relatório completo por UCs</div><div class="menu-actions"><select id="report-recipient" class="recipient-select"><option value="student">Enviar para estudante(s)</option><option value="supervisor">Enviar para supervisor(es)</option></select><button class="btn" onclick="sendReportEmail()">Enviar por Outlook</button><button class="btn" onclick="copyReport()">Copiar para e-mail</button><button class="btn" onclick="window.print()">Imprimir / PDF</button></div></div><div id="report-content"><div class="report-header"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Senac_logo.svg/500px-Senac_logo.svg.png" alt="Senac"/><h1>Relatório completo da turma/aluno</h1><h2>${escapeReportHTML(course)}</h2><div><strong>Turma:</strong> ${escapeReportHTML(turma)} | <strong>Intervalo:</strong> ${escapeReportHTML(rangeLabel)} | <strong>Emitido em:</strong> ${dateStr}<br><strong>Instrutores:</strong> ${escapeReportHTML(tutor1)} / ${escapeReportHTML(tutor2)}</div></div>${studentHTML}</div><script>const studentRecipients=${JSON.stringify(studentRecipients)};const supervisorRecipients=${JSON.stringify(supervisorRecipients)};const subject=${JSON.stringify(reportSubject)};function copyReport(afterCopy){const content=document.getElementById('report-content');if(!content)return;const done=()=>{if(typeof afterCopy==='function')afterCopy();else alert('Relatório copiado. Cole no Outlook ou em outro documento.');};if(navigator.clipboard&&window.ClipboardItem){const item=new ClipboardItem({'text/html':new Blob([content.outerHTML],{type:'text/html'}),'text/plain':new Blob([content.innerText],{type:'text/plain'})});navigator.clipboard.write([item]).then(done).catch(()=>fallbackCopy(done));}else fallbackCopy(done);}function fallbackCopy(done){const range=document.createRange();range.selectNodeContents(document.getElementById('report-content'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);try{document.execCommand('copy');done();}finally{selection.removeAllRanges();}}function sendReportEmail(){const type=document.getElementById('report-recipient').value;const list=type==='supervisor'?supervisorRecipients:studentRecipients;const emails=[...new Set(list.map(item=>String(item.email||'').trim()).filter(Boolean))];if(emails.length===0){alert(type==='supervisor'?'Nenhum e-mail de supervisor foi informado.':'Nenhum e-mail de estudante foi informado.');return;}copyReport(()=>{alert('Relatório copiado. Cole no corpo do Outlook com Ctrl+V para manter o layout.');window.location.href='mailto:'+emails.join(';')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(document.getElementById('report-content').innerText);});}<\/script></body></html>`;
            const completeHTML = htmlContent.replace(`${escapeReportHTML(tutor1)} / ${escapeReportHTML(tutor2)}`, escapeReportHTML(instructorLabel));
            printWindow.document.write(completeHTML);
            printWindow.document.close();
        };

        const generateReport = (selectedStudentIds, students, turma, course, tutor1, tutor2, activityTracking, reportData, naJustifications) => {
            const selected = students.filter(s => selectedStudentIds.includes(s.id));
            if (selected.length === 0) { alert("Selecione pelo menos um aluno."); return; }
            const printWindow = window.open('', '_blank');
            const dateStr = new Date().toLocaleDateString('pt-BR');
            const studentRecipients = selected.map(s => ({ name: s.studentContactName || s.name, email: s.studentEmail || "" }));
            const supervisorRecipients = selected.map(s => ({ name: s.supervisorName || "Supervisor", email: s.supervisorEmail || "" }));
            const selectedStudentNames = selected.map(s => s.name).join(", ");
            const reportSubject = `Relatório de Desempenho - ${selectedStudentNames} - Turma ${turma}`;
            const recipientLabel = selected.length === 1 ? "" : "s selecionados";
            const htmlContent = `
                <html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório</title>
                <style>
                    body { font-family: 'Arial', sans-serif; padding: 20px; color: #333; background: #fff; margin: 0; }
                    .report-menu { background-color: #004587; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; left: 0; right: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
                    .menu-actions { display: flex; gap: 8px; }
                    .menu-title { color: white; font-weight: bold; font-size: 14px; }
                    .btn { border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; color: white; background-color: #F5821F; }
                    .recipient-select { border: 0; border-radius: 4px; padding: 8px 10px; font-size: 12px; color: #123; font-weight: bold; }
                    @media (max-width: 760px) { .report-menu { align-items: flex-start; gap: 8px; flex-direction: column; } .menu-actions { flex-wrap: wrap; } }
                    @media print { .report-menu { display: none !important; } }
                    .student-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
                    .header-row { display: flex; justify-content: space-between; border-bottom: 2px solid #F5821F; padding-bottom: 5px; margin-bottom: 10px; }
                    .student-name { font-size: 16px; font-weight: bold; }
                    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 12px; margin-bottom: 10px; }
                    .section-title { font-weight: bold; margin-top: 10px; font-size: 12px; color: #004587; }
                    .comment-box { background-color: #f9fafb; padding: 8px; border-left: 3px solid #F5821F; font-size: 11px; margin-top: 5px; color: #555; }
                    .source-tag { font-weight: bold; color: #F5821F; margin-right: 5px; }
                    .obs-text { white-space: pre-wrap; word-break: break-word; }
                    .expand-pending { border: 1px solid #004587; background: #fff; color: #004587; border-radius: 4px; padding: 5px 9px; margin-top: 7px; cursor: pointer; font-size: 11px; font-weight: bold; }
                    .expand-pending:hover { background: #eef6ff; }
                </style></head><body>
                    <div class="report-menu"><div class="menu-title">Relatório</div><div class="menu-actions"><select id="report-recipient" class="recipient-select"><option value="student">Enviar para estudante${recipientLabel}</option><option value="supervisor">Enviar para supervisor${recipientLabel}</option></select><button onclick="sendReportEmail()" class="btn" title="Copia o layout formatado e abre o Outlook">Enviar por Outlook</button><button onclick="copyReportVisual()" id="copy-report" class="btn">Copiar para e-mail</button><button onclick="window.print()" class="btn">Imprimir</button></div></div>
                    <div id="report-content">
                    <div style="text-align:center; margin-top: 10px;"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Senac_logo.svg/500px-Senac_logo.svg.png" width="80" /></div>
                    <h1 style="text-align:center; font-size:18px;">Relatório de Desempenho</h1>
                    <h2 style="text-align:center; font-size:14px; color:#666;">${course}</h2>
                    <div style="text-align:center; font-size:12px; margin-bottom:20px;">
                        <strong>Turma:</strong> ${turma} | <strong>Data:</strong> ${dateStr}<br>
                        <strong>Instrutores:</strong> ${tutor1} / ${tutor2}
                    </div>
                    ${selected.map((s, studentIndex) => {
                        let statusColor = "color:#16a34a";
                        if(s.is_dropout) statusColor = "color:#f97316"; else if(s.is_process_dropout) statusColor = "color:#9333ea"; else if(s.needs_recuperacao) statusColor = "color:#dc2626"; else if(s.needs_conselho) statusColor = "color:#ca8a04";
                        const mainObsHtml = s.conselho_text ? '<div class="section-title">Obs. Conselho (Principal):</div><div style="font-size:12px;">"' + s.conselho_text + '"</div>' : '';
                        const activitySummary = getActivityStudentSummary(activityTracking, s.name);
                        const activityAttention = activitySummary ? activitySummary.entries.filter(entry => entry.status !== "completed") : [];
                        const activityItemsHtml = activityAttention.slice(0, 18).map(entry => '<span class="source-tag">' + formatActivityStatusLabel(entry.status) + ':</span>' + entry.label).join("<br>");
                        const activityMoreHtml = activityAttention.length > 18
                            ? '<div id="activity-more-' + studentIndex + '" style="display:none; margin-top:7px;">' + activityAttention.slice(18).map(entry => '<span class="source-tag">' + formatActivityStatusLabel(entry.status) + ':</span>' + entry.label).join("<br>") + '</div><button type="button" class="expand-pending" data-more-label="E + ' + (activityAttention.length - 18) + ' pendências" onclick="toggleActivityDetails(\'activity-more-' + studentIndex + '\', this)">E + ' + (activityAttention.length - 18) + ' pendências</button>'
                            : '';
                        const activityHtml = activitySummary && activitySummary.total > 0
                            ? '<div class="section-title">Acompanhamento de atividades:</div><div class="comment-box"><strong>Resumo:</strong> ' + activitySummary.completed + ' concluídas de ' + activitySummary.total + '; ' + activitySummary.not_completed + ' não concluídas; ' + activitySummary.blank + ' em branco; ' + activitySummary.requires_evaluation + ' requerem avaliação.</div>' + (activityAttention.length > 0 ? '<div class="comment-box">' + activityItemsHtml + activityMoreHtml + '</div>' : '')
                            : '';
                        const naSummary = getNAStudentSummary(reportData, s.name, naJustifications || {});
                        const naHtml = naSummary && naSummary.count >= 2
                            ? '<div class="section-title">NA na chamada:</div><div class="comment-box"><strong>' + naSummary.count + ' registro(s) pendente(s).</strong> ' + naSummary.entries.slice(0, 12).map(entry => entry.uc + ' - ' + entry.date).join('; ') + (naSummary.entries.length > 12 ? '; e mais ' + (naSummary.entries.length - 12) : '') + '</div>'
                            : '';
                        return '<div class="student-card">' +
                            '<div class="header-row"><span class="student-name">' + s.name + '</span><span style="' + statusColor + '; font-weight:bold;">' + s.status + '</span></div>' +
                            '<div class="info-grid"><div><strong>Frequência Global:</strong> ' + s.averageFreq + '%</div><div><strong>Contra Turno:</strong> ' + s.contra_turno_desc + '</div></div>' +
                            (s.low_freq_ucs.length > 0 ? '<div style="font-size:12px; color:#ca8a04;">⚠️ Baixa Frequência: ' + s.low_freq_ucs.join(", ") + '</div>' : '') +
                            (s.failed_perf_ucs.length > 0 ? '<div style="font-size:12px; color:#dc2626;">❌ Desempenho: ' + s.failed_perf_ucs.join(", ") + '</div>' : '') +
                            mainObsHtml + naHtml + activityHtml + '</div>';
                    }).join('')}
                    </div>
                    <script>
                        const studentRecipients = ${JSON.stringify(studentRecipients)};
                        const supervisorRecipients = ${JSON.stringify(supervisorRecipients)};
                        function toggleActivityDetails(detailsId, button) {
                            const details = document.getElementById(detailsId);
                            if (!details) return;
                            const isHidden = details.style.display === 'none';
                            details.style.display = isHidden ? 'block' : 'none';
                            if (button) button.textContent = isHidden ? 'Ocultar pendências' : button.dataset.moreLabel;
                        }
                        function showAllActivityDetails() {
                            document.querySelectorAll('[id^="activity-more-"]').forEach(details => { details.style.display = 'block'; });
                            document.querySelectorAll('.expand-pending').forEach(button => { button.style.display = 'none'; });
                        }
                        function sendReportEmail() {
                            const recipientType = document.getElementById('report-recipient')?.value === 'supervisor' ? 'supervisor' : 'student';
                            const recipients = recipientType === 'supervisor' ? supervisorRecipients : studentRecipients;
                            const emails = [...new Set(recipients.map(item => String(item.email || '').trim()).filter(Boolean))];
                            if (emails.length === 0) {
                                alert(recipientType === 'supervisor' ? 'Nenhum e-mail de supervisor foi informado.' : 'Nenhum e-mail de estudante foi informado.');
                                return;
                            }
                            const subject = ${JSON.stringify(reportSubject)};
                            showAllActivityDetails();
                            copyReportVisual(() => {
                                const body = document.getElementById('report-content')?.innerText || 'Relatório de Desempenho';
                                alert('O relatório formatado foi copiado. No Outlook, cole no corpo do e-mail com Ctrl+V para manter o layout.');
                                window.location.href = 'mailto:' + emails.join(';') + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
                            });
                        }
                        function copyReportVisual(afterCopy) {
                            const content = document.getElementById('report-content');
                            const button = document.getElementById('copy-report');
                            if (!content) return;
                            const done = () => {
                                if (button) {
                                    button.textContent = 'Copiado';
                                    setTimeout(() => { button.textContent = 'Copiar para e-mail'; }, 1800);
                                }
                                if (typeof afterCopy === 'function') afterCopy();
                            };
                            const fallback = () => {
                                const range = document.createRange();
                                range.selectNodeContents(content);
                                const selection = window.getSelection();
                                selection.removeAllRanges();
                                selection.addRange(range);
                                try { document.execCommand('copy'); done(); } finally { selection.removeAllRanges(); }
                            };
                            if (navigator.clipboard && window.ClipboardItem) {
                                const copyContent = content.cloneNode(true);
                                copyContent.style.cssText = 'font-family:Arial,sans-serif;color:#333;background:#fff;margin:0;padding:20px;';
                                copyContent.querySelectorAll('.expand-pending').forEach(element => element.remove());
                                const inlineStyles = {
                                    '.student-card': 'border:1px solid #ddd;padding:15px;margin-bottom:15px;border-radius:8px;',
                                    '.header-row': 'display:flex;justify-content:space-between;border-bottom:2px solid #F5821F;padding-bottom:5px;margin-bottom:10px;',
                                    '.student-name': 'font-size:16px;font-weight:bold;',
                                    '.info-grid': 'display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;margin-bottom:10px;',
                                    '.section-title': 'font-weight:bold;margin-top:10px;font-size:12px;color:#004587;',
                                    '.comment-box': 'background-color:#f9fafb;padding:8px;border-left:3px solid #F5821F;font-size:11px;margin-top:5px;color:#555;',
                                    '.source-tag': 'font-weight:bold;color:#F5821F;margin-right:5px;'
                                };
                                Object.entries(inlineStyles).forEach(([selector, style]) => copyContent.querySelectorAll(selector).forEach(element => { element.style.cssText = style; }));
                                const html = copyContent.outerHTML;
                                const item = new ClipboardItem({
                                    'text/html': new Blob([html], { type: 'text/html' }),
                                    'text/plain': new Blob([copyContent.innerText], { type: 'text/plain' })
                                });
                                navigator.clipboard.write([item]).then(done).catch(fallback);
                            } else fallback();
                        }
                    <\/script>
                </body></html>`;
            printWindow.document.write(htmlContent); printWindow.document.close();
        };

        const getFirebaseAuth = () => {
            const config = window.SENAC_FIREBASE_CONFIG;
            if (!config || !config.projectId || !window.firebase || !firebase.auth) return null;
            if (!firebase.apps.length) firebase.initializeApp(config);
            return firebase.auth();
        };

        const getAuthMessage = (error) => {
            const messages = {
                "auth/invalid-credential": "E-mail ou senha incorretos.",
                "auth/email-already-in-use": "Este e-mail já possui cadastro.",
                "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
                "auth/invalid-email": "Informe um e-mail válido.",
                "auth/too-many-requests": "Muitas tentativas. Aguarde alguns minutos.",
                "auth/network-request-failed": "Não foi possível conectar ao Firebase.",
                "auth/operation-not-allowed": "O login por e-mail ainda não foi ativado no Firebase.",
                "auth/quota-exceeded": "O limite de envio de e-mails foi atingido. Aguarde e tente novamente mais tarde.",
                "auth/invalid-sender": "O remetente do e-mail não está configurado no Firebase.",
                "auth/invalid-message-payload": "O modelo do e-mail está inválido no Firebase.",
                "auth/unauthorized-continue-uri": "O endereço do site não está autorizado no Firebase."
            };
            if (error && error.code) console.error("Firebase Auth:", error.code, error.message || error);
            return messages[error && error.code] || `Não foi possível concluir o acesso (${error && error.code ? error.code : "erro desconhecido"}).`;
        };

        const isAllowedSenacEmail = (value) => {
            const config = window.SENAC_FIREBASE_CONFIG || {};
            const domains = Array.isArray(config.allowedEmailDomains) ? config.allowedEmailDomains : [config.allowedEmailDomain || "@pr.senac.br"];
            const email = String(value || "").trim().toLowerCase();
            return domains.some(domain => email.endsWith(String(domain).toLowerCase()));
        };

        const AuthGate = () => {
            const auth = getFirebaseAuth();
            const [user, setUser] = useState(null);
            const [ready, setReady] = useState(!auth);
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [error, setError] = useState("");
            const [message, setMessage] = useState("");
            const [busy, setBusy] = useState(false);

            useEffect(() => {
                if (!auth) return undefined;
                return auth.onAuthStateChanged(currentUser => {
                    setUser(currentUser);
                    window.SENAC_CURRENT_USER = currentUser || null;
                    setReady(true);
                });
            }, [auth]);

            if (!auth) return <App />;
            if (!ready) return <div className="min-h-screen flex items-center justify-center bg-slate-100 text-slate-600">Carregando acesso...</div>;
            const submit = async (event) => {
                event.preventDefault();
                setError(""); setMessage(""); setBusy(true);
                try {
                    if (!isAllowedSenacEmail(email)) throw new Error("EMAIL_DOMAIN_INVALID");
                    await auth.signInWithEmailAndPassword(email.trim(), password);
                } catch (err) {
                    if (err.message === "EMAIL_DOMAIN_INVALID") setError("Use um e-mail terminado em @pr.senac.br ou @docente.pr.senac.br.");
                    else setError(getAuthMessage(err));
                } finally { setBusy(false); }
            };

            const logout = async () => { await auth.signOut(); setUser(null); window.SENAC_CURRENT_USER = null; };

            if (user && isAllowedSenacEmail(user.email)) return <App />;

            if (user && !isAllowedSenacEmail(user.email)) return <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4"><div className="bg-white rounded-xl shadow p-8 max-w-md text-center"><h1 className="text-xl font-bold text-red-700">E-mail não autorizado</h1><p className="text-sm text-slate-600 mt-3">Use um e-mail institucional terminado em @pr.senac.br ou @docente.pr.senac.br.</p><button onClick={logout} className="mt-5 text-sm text-senac-blue hover:underline">Sair</button></div></div>;

            return <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                <div className="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                    <div className="bg-senac-blue px-8 py-7 text-white">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Senac_logo.svg/500px-Senac_logo.svg.png" alt="Senac Paraná" className="h-10 w-auto object-contain object-left mb-4 brightness-0 invert" />
                        <div className="text-xs uppercase tracking-widest font-bold text-blue-200">Senac Paraná</div>
                        <h1 className="text-2xl font-bold mt-2">Gestão de Frequência</h1>
                        <p className="text-sm text-blue-100 mt-1">Acesso do instrutor</p>
                    </div>
                    <form onSubmit={submit} className="p-8 space-y-4">
                        <div><label className="block text-xs font-bold text-slate-600 mb-1">E-mail institucional</label><input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5" placeholder="nome@pr.senac.br ou nome@docente.pr.senac.br" required /></div>
                        <div><label className="block text-xs font-bold text-slate-600 mb-1">Senha</label><input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5" minLength="6" required /></div>
                        {error && <div className="bg-red-50 text-red-700 border border-red-200 rounded-lg p-3 text-sm">{error}</div>}
                        {message && <div className="bg-green-50 text-green-700 border border-green-200 rounded-lg p-3 text-sm">{message}</div>}
                        <button disabled={busy} className="w-full bg-senac-orange hover:bg-orange-600 disabled:opacity-60 text-white font-bold rounded-lg py-3">{busy ? "Entrando..." : "Entrar"}</button>
                    </form>
                </div>
            </div>;
        };

        function App() {
            // --- ESTADOS DO SISTEMA ---
            const [data, setData] = useState(null);
            const [activityTracking, setActivityTracking] = useState(null);
            const [dragActive, setDragActive] = useState(false);
            const activityUploadSequence = useRef(0);
            const [naJustifications, setNaJustifications] = useState({});
            const [naJustificationDrafts, setNaJustificationDrafts] = useState({});
            
            // --- MODAIS ---
            const [showAtaModal, setShowAtaModal] = useState(false);
            const [selectedStudentForModal, setSelectedStudentForModal] = useState(null);
            const [instructorNotesForStudent, setInstructorNotesForStudent] = useState([]); // Notas do instrutor para o aluno selecionado
            const [contactDraft, setContactDraft] = useState(normalizeStudentContact());
            const [contactSaving, setContactSaving] = useState(false);
            const [contactStorageSource, setContactStorageSource] = useState("local");
            const [contactMessage, setContactMessage] = useState("");

            // Novo Estado V72 - Instrutor Selecionado para Notas
            const [selectedInstructorForNotes, setSelectedInstructorForNotes] = useState(null);
            const [showNotebookReport, setShowNotebookReport] = useState(false);
            const [showUCIntervalReport, setShowUCIntervalReport] = useState(false);
            const [showStudentReportModal, setShowStudentReportModal] = useState(false);
            const [studentReportMode, setStudentReportMode] = useState("complete");
            const [classNotebookNotes, setClassNotebookNotes] = useState([]);

            // --- FILTROS E SELEÇÃO ---
            const [filter, setFilter] = useState('all'); 
            const [selectedUC, setSelectedUC] = useState('all'); 
            const [searchTerm, setSearchTerm] = useState('');
            const [reportSelection, setReportSelection] = useState([]); 

            // --- DADOS DA ATA / ASSINATURAS ---
            const [customLogo, setCustomLogo] = useState(null);
            const [analistaName, setAnalistaName] = useState('');
            const [analistaCPF, setAnalistaCPF] = useState("");
            const [analistaMatricula, setAnalistaMatricula] = useState("");
            const [analistaRubrica, setAnalistaRubrica] = useState(null);
            const [tutor1Name, setTutor1Name] = useState("");
            const [tutor1CPF, setTutor1CPF] = useState("");
            const [tutor1Matricula, setTutor1Matricula] = useState("");
            const [tutor1Rubrica, setTutor1Rubrica] = useState(null);
            const [tutor2Name, setTutor2Name] = useState("");
            const [tutor2CPF, setTutor2CPF] = useState("");
            const [tutor2Matricula, setTutor2Matricula] = useState("");
            const [tutor2Rubrica, setTutor2Rubrica] = useState(null);

            const ataContentRef = useRef(null);

            const activeInstructorNames = useMemo(() => {
                const source = data && Array.isArray(data.instructors)
                    ? data.instructors
                    : [tutor1Name, tutor2Name];
                const detectedNames = [...new Set(source
                    .map(name => String(name || "").trim())
                    .filter(name => name && normalizeName(name) !== normalizeName("Não Identificado")))];
                return filterInstructorNamesForCurrentUser(detectedNames);
            }, [data, tutor1Name, tutor2Name]);

            useEffect(() => {
                if(data) {
                    if(data.tutor1) setTutor1Name(data.tutor1);
                    if(data.tutor2) setTutor2Name(data.tutor2);
                }
            }, [data]);

            useEffect(() => {
                if (!data || !data.turma) {
                    setNaJustifications({});
                    setNaJustificationDrafts({});
                    return;
                }
                let isCurrent = true;
                const applyLoaded = (parsed) => {
                    if (!isCurrent) return;
                    const drafts = {};
                    Object.entries(parsed).forEach(([key, value]) => {
                        if (value && typeof value.reason === "string") drafts[key] = value.reason;
                    });
                    setNaJustifications(parsed);
                    setNaJustificationDrafts(drafts);
                };
                applyLoaded(readNAJustificationsLocal(data.turma));
                loadNAJustifications(data.turma).then(loaded => {
                    if (loaded && loaded.justifications) applyLoaded(loaded.justifications);
                }).catch(error => console.error("Erro ao carregar justificativas da turma", error));
                return () => { isCurrent = false; };
            }, [data ? data.turma : ""]);

            useEffect(() => {
                if (!data || !data.turma) return undefined;
                let isCurrent = true;
                loadStudentContacts(data.turma).then(loaded => {
                    if (!isCurrent) return;
                    setContactStorageSource(loaded.source);
                    if (Object.keys(loaded.contacts).length === 0) return;
                    setData(previous => {
                        if (!previous || previous.turma !== data.turma) return previous;
                        const students = previous.students.map(student => {
                            const saved = loaded.contacts[normalizeName(student.name)];
                            return saved ? { ...student, ...normalizeStudentContact(saved, student.name) } : student;
                        });
                        return { ...previous, students };
                    });
                }).catch(error => console.error("Erro ao carregar contatos da turma", error));
                return () => { isCurrent = false; };
            }, [data ? data.turma : ""]);

            useEffect(() => {
                if (!selectedStudentForModal || !data) {
                    setContactDraft(normalizeStudentContact());
                    setContactMessage("");
                    return;
                }
                const current = data.students.find(student => student.id === selectedStudentForModal.id) || selectedStudentForModal;
