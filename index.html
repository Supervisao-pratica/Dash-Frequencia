                            <select value={filter} onChange={(e) => setFilter(e.target.value)} className="p-2 border border-gray-300 rounded text-xs"><option value="all">Todas as anotações</option><option value="open">Tratativas em aberto</option><option value="overdue">Tratativas vencidas</option><option value="class">Somente turma</option><option value="student">Somente alunos</option></select>
                            <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="p-2 border border-gray-300 rounded text-xs"><option value="all">Todos os status</option>{NOTEBOOK_TREATMENT_STATUS_OPTIONS.map(option => <option key={option.value} value={option.value}>{option.label}</option>)}</select>
                            <select value={analystFilter} onChange={(e) => setAnalystFilter(e.target.value)} className="p-2 border border-gray-300 rounded text-xs"><option value="all">Todos os analistas</option>{NOTEBOOK_ANALYST_OPTIONS.map(analyst => <option key={analyst} value={analyst}>{analyst}</option>)}<option value="Não informado">Sem analista</option></select>
                            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Buscar aluno, assunto ou anotação" className="p-2 border border-gray-300 rounded text-xs md:col-span-2" />
                        </div>
                        <div className="px-4 py-3 flex flex-wrap items-center justify-between gap-2 border-b border-gray-100 text-xs"><div className="flex gap-2"><span className="rounded bg-blue-50 text-blue-700 px-2 py-1 font-bold">Total: {notes.length}</span><span className="rounded bg-orange-50 text-orange-700 px-2 py-1 font-bold">Em aberto: {totalOpen}</span><span className="rounded bg-red-50 text-red-700 px-2 py-1 font-bold">Vencidas: {totalOverdue}</span></div><div className="flex gap-2"><button onClick={copyReport} className="px-3 py-2 rounded border border-senac-blue text-senac-blue font-bold hover:bg-blue-50">Copiar relatório</button><button onClick={printReport} className="px-3 py-2 rounded bg-senac-blue text-white font-bold hover:bg-blue-800">Imprimir / PDF</button></div></div>
                        <div ref={reportRef} className="p-5 overflow-y-auto custom-scrollbar bg-white">
                            {isLoading ? <div className="py-12 text-center text-sm text-gray-500">Carregando anotações dos cadernos...</div> : filteredNotes.length === 0 ? <div className="py-12 text-center text-sm text-gray-500">Nenhuma anotação encontrada para os filtros selecionados.</div> : filteredNotes.map(note => {
                                const treatmentState = getNotebookTreatmentState(note);
                                const stateClass = treatmentState === "overdue" ? "overdue" : treatmentState === "today" ? "due" : "";
                                return <div key={`${note.instructorSource}_${note.id}`} className="note border border-gray-200 border-l-4 border-l-senac-blue rounded-lg p-3 mb-3">
                                    <div className="flex flex-wrap justify-between gap-2"><div className="font-bold text-sm text-gray-800">{note.scope === "class" ? "Turma toda" : note.studentName}</div><div className="meta">Registro: {formatNotebookDate(note.date)}</div></div>
                                    <div className="mt-2 flex flex-wrap gap-1"><span className="tag">{getNotebookSituationLabel(note)}</span><span className="tag">Instrutor: {note.instructorSource || "Não informado"}</span><span className="tag">Analista: {note.responsibleAnalyst || "Não informado"}</span>{note.urgency && <span className="tag">Urgência: {note.urgency}</span>}<span className={`inline-block rounded border px-2 py-1 text-[10px] font-bold ${getNotebookStatusMeta(note).className}`}>Status: {getNotebookStatusMeta(note).label}</span></div>
                                    <div className={`meta mt-2 ${stateClass}`}>{getNotebookTreatmentDue(note) ? `${getNotebookTreatmentLabel(note)} | Início: ${formatNotebookDate(getNotebookTreatmentStart(note))}` : "Sem período de tratativa definido"}</div>
                                    {note.notes && <div className="text-sm text-gray-700 whitespace-pre-wrap mt-2">{note.notes}</div>}
                                    {getNotebookTreatmentDue(note) && <button type="button" onClick={() => openNotebookTreatmentInOutlook(note, turma, note.instructorSource)} className="mt-3 text-xs font-bold text-senac-blue hover:underline">Abrir prazo no Outlook</button>}
                                </div>;
                            })}
                        </div>
                        <div className="bg-gray-50 p-4 border-t border-gray-100 flex justify-end"><button onClick={onClose} className="px-5 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg font-bold text-sm">Fechar</button></div>
                    </div>
                </div>
            );
        };

        const StudentReportOptionsModal = ({ data, student, activityTracking, naJustifications, notebookNotes, mode = "complete", onClose }) => {
            const [options, setOptions] = useState(() => mode === "activities" ? ({
                studentContact: false,
                supervisorContact: false,
                justifications: false,
                academic: false,
                observations: false,
                notebook: false,
                activities: true
            }) : ({
                studentContact: false,
                supervisorContact: false,
                justifications: true,
                academic: true,
                observations: true,
                notebook: true,
                activities: false
            }));
            const toggleOption = key => setOptions(current => ({ ...current, [key]: !current[key] }));
            const reportOptions = [
                ["studentContact", "Atualizacao de contato do aluno", "Nome, telefone e e-mail do aluno."],
                ["supervisorContact", "Atualizacao de contato do supervisor", "Nome, telefone e e-mail do supervisor."],
                ["justifications", "Justificativas e faltas NA", "Registros NA, status da justificativa e motivo informado."],
                ["academic", "Frequencia, desempenho e situacao", "Status cadastral, frequencia e detalhamento por UC."],
                ["observations", "Observacoes das planilhas", "Observacoes organizadas das abas e comentarios da chamada."],
                ["notebook", "Anotacoes do caderno do instrutor", "Chamados, pontos de atencao e tratativas."],
                ["activities", "Atividades do upload atual", "NC, em branco e requer avaliacao. Nao fica gravado na turma."]
            ];
            const generate = () => {
                generateStudentSituationReport({
                    student,
                    turma: data.turma,
                    course: data.course,
                    instructors: data.instructors || [],
                    tutor1: data.tutor1,
                    tutor2: data.tutor2,
                    activityTracking,
                    reportData: data,
                    naJustifications,
                    notebookNotes,
                    options
                });
                onClose();
            };
            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" onClick={event => { if (event.target === event.currentTarget) onClose(); }}>
                    <div className="bg-white w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="bg-senac-blue p-5 text-white flex justify-between items-center"><div><h2 className="text-xl font-bold flex items-center gap-2"><IconFileText className="w-6 h-6" /> {mode === "activities" ? "Relatorio de atividades" : "Emitir relatorio do aluno"}</h2><p className="text-xs text-blue-100 mt-1">Escolha as informacoes que deseja enviar.</p></div><button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full"><IconXCircle className="w-6 h-6" /></button></div>
                        <div className="p-5 overflow-y-auto custom-scrollbar bg-gray-50"><div className="bg-white border border-gray-200 rounded-xl p-4 mb-4"><div className="text-sm font-bold text-gray-800">{student.name}</div><div className="text-xs text-gray-500 mt-1">Turma {data.turma}</div></div><div className="space-y-2">{reportOptions.map(([key, title, description]) => <label key={key} className={`flex items-start gap-3 rounded-lg border p-3 cursor-pointer ${options[key] ? "border-blue-300 bg-blue-50" : "border-gray-200 bg-white"}`}><input type="checkbox" checked={Boolean(options[key])} onChange={() => toggleOption(key)} className="mt-0.5 rounded text-senac-blue" /><span><span className="block text-sm font-bold text-gray-700">{title}</span><span className="block text-xs text-gray-500 mt-1">{description}</span></span></label>)}</div><div className="mt-4 rounded-lg border border-orange-200 bg-orange-50 px-3 py-2 text-xs text-orange-900"><strong>Importante:</strong> os contatos, justificativas, anotacoes e alteracoes ficam vinculados a turma. As informacoes de atividades sao somente do upload atual e nao sao gravadas.</div></div>
                        <div className="bg-white p-4 border-t border-gray-200 flex justify-end gap-2"><button onClick={onClose} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-bold text-sm">Cancelar</button><button onClick={generate} disabled={!Object.values(options).some(Boolean)} className="px-5 py-2 bg-senac-blue text-white rounded-lg font-bold text-sm disabled:opacity-50"><IconPrinter className="w-4 h-4 inline-block mr-1" /> Emitir relatorio</button></div>
                    </div>
                </div>
            );
        };

        const UCIntervalReportModal = ({ data, activityTracking, naJustifications, notebookNotes, onClose }) => {
            const ucOptions = useMemo(() => [...(data && data.ucs || [])].filter(uc => getUCNumber(uc) !== null).sort((a, b) => getUCNumber(a) - getUCNumber(b)), [data]);
            const [fromUC, setFromUC] = useState("");
            const [toUC, setToUC] = useState("");
            const [scope, setScope] = useState("class");
            const [selectedIds, setSelectedIds] = useState([]);
            const [search, setSearch] = useState("");

            useEffect(() => {
                if (ucOptions.length > 0) {
                    setFromUC(current => current || ucOptions[0]);
                    setToUC(current => current || ucOptions[ucOptions.length - 1]);
                }
            }, [ucOptions]);

            const visibleStudents = (data && data.students || []).filter(student => normalizeText(student.name).includes(normalizeText(search)));
            const toggleStudent = (id) => setSelectedIds(current => current.includes(id) ? current.filter(item => item !== id) : [...current, id]);
            const selectVisible = () => setSelectedIds(current => {
                const visibleIds = visibleStudents.map(student => student.id);
                const allSelected = visibleIds.length > 0 && visibleIds.every(id => current.includes(id));
                return allSelected ? current.filter(id => !visibleIds.includes(id)) : [...new Set([...current, ...visibleIds])];
            });
            const reportIds = scope === "class" ? (data && data.students || []).map(student => student.id) : selectedIds;

            const generate = () => generateRangeReport({
                selectedStudentIds: reportIds,
                students: data.students,
                turma: data.turma,
                course: data.course,
                instructors: data.instructors || [],
                tutor1: data.tutor1 || "Não Identificado",
                tutor2: data.tutor2 || "Não Identificado",
                activityTracking,
                reportData: data,
                naJustifications,
                notebookNotes,
                fromUC,
                toUC
            });

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="bg-white w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
                        <div className="bg-senac-blue p-4 text-white flex justify-between items-center shrink-0"><div><h2 className="text-xl font-bold flex items-center gap-2"><IconFileText className="w-6 h-6" /> Relatório por intervalo de UCs</h2><p className="text-xs text-blue-100 mt-1">Frequência, desempenho, chamada, atividades, situações e caderno.</p></div><button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full"><IconXCircle className="w-6 h-6" /></button></div>
                        <div className="p-5 overflow-y-auto custom-scrollbar bg-gray-50">
                            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-4">
                                <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Intervalo de Unidades Curriculares</label>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3"><label className="text-xs font-bold text-gray-600">Da UC<select value={fromUC} onChange={(e) => setFromUC(e.target.value)} className="mt-1 w-full p-2 border border-gray-300 rounded text-sm font-normal">{ucOptions.map(uc => <option key={`from-${uc}`} value={uc}>{uc}</option>)}</select></label><label className="text-xs font-bold text-gray-600">Até a UC<select value={toUC} onChange={(e) => setToUC(e.target.value)} className="mt-1 w-full p-2 border border-gray-300 rounded text-sm font-normal">{ucOptions.map(uc => <option key={`to-${uc}`} value={uc}>{uc}</option>)}</select></label></div>
                                <p className="text-[11px] text-gray-500 mt-2">O relatório incluirá todas as UCs entre a inicial e a final, mesmo que sejam escolhidas em ordem inversa.</p>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-4">
                                <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Alcance do relatório</label>
                                <div className="grid grid-cols-2 gap-2" role="radiogroup" aria-label="Alcance do relatório"><button type="button" onClick={() => setScope("class")} className={`py-3 rounded-lg text-sm font-bold border ${scope === "class" ? "bg-orange-50 text-senac-orange border-senac-orange ring-2 ring-orange-100" : "bg-gray-50 text-gray-500 border-gray-200"}`}><IconUsers className="w-4 h-4 inline-block mr-1" /> Turma inteira</button><button type="button" onClick={() => setScope("students")} className={`py-3 rounded-lg text-sm font-bold border ${scope === "students" ? "bg-blue-50 text-senac-blue border-senac-blue ring-2 ring-blue-100" : "bg-gray-50 text-gray-500 border-gray-200"}`}><IconUser className="w-4 h-4 inline-block mr-1" /> Alunos selecionados</button></div>
                                {scope === "class" ? <div className="mt-3 rounded-lg bg-orange-50 border border-orange-200 px-3 py-2 text-xs text-orange-800">Serão incluídos os {data.students.length} alunos da turma.</div> : <div className="mt-3"><div className="flex flex-wrap justify-between items-center gap-2 mb-2"><input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Buscar aluno" className="p-2 border border-gray-300 rounded text-xs flex-1 min-w-[180px]" /><button type="button" onClick={selectVisible} className="px-3 py-2 border border-senac-blue text-senac-blue rounded text-xs font-bold">Selecionar visíveis</button></div><div className="max-h-56 overflow-y-auto border border-gray-200 rounded-lg bg-gray-50 p-2 space-y-1">{visibleStudents.map(student => <label key={student.id} className="flex items-center gap-2 rounded px-2 py-1.5 text-xs hover:bg-white cursor-pointer"><input type="checkbox" checked={selectedIds.includes(student.id)} onChange={() => toggleStudent(student.id)} className="rounded text-senac-blue" /><span>{student.name}</span></label>)}{visibleStudents.length === 0 && <div className="p-4 text-center text-xs text-gray-500">Nenhum aluno encontrado.</div>}</div><div className="text-xs text-gray-500 mt-2">{selectedIds.length} aluno(s) selecionado(s).</div></div>}
                            </div>
                            <div className="rounded-lg border border-blue-200 bg-blue-50 px-3 py-3 text-xs text-blue-900"><strong>O relatório reunirá:</strong> frequência média e detalhada por UC, desempenho, baixa frequência, recuperação, observações, NA pendentes, atividades, situações cadastrais e anotações do caderno.</div>
                        </div>
                        <div className="bg-white p-4 border-t border-gray-200 flex justify-between items-center gap-3"><span className="text-xs text-gray-500">{reportIds.length} aluno(s) no relatório</span><div className="flex gap-2"><button onClick={onClose} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-bold text-sm">Cancelar</button><button onClick={generate} disabled={!fromUC || !toUC || reportIds.length === 0} className="px-5 py-2 bg-senac-blue text-white rounded-lg font-bold text-sm disabled:opacity-50"><IconPrinter className="w-4 h-4 inline-block mr-1" /> Emitir relatório</button></div></div>
                    </div>
                </div>
            );
        };

        const findMetadata = (worksheet) => {
            if (!worksheet || !window.XLSX) return {};
            const data = window.XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            let foundTutor = null, foundTurma = null, foundCurso = null;
            for (let r = 0; r < Math.min(data.length, 25); r++) {
                const row = data[r];
                if (!row) continue;
                for (let c = 0; c < Math.min(row.length, 15); c++) {
                    const cellVal = String(row[c] || "").trim();
                    const lowerVal = cellVal.toLowerCase();
                    if (!foundTutor && (lowerVal.includes("tutor") || lowerVal.includes("instrutor") || lowerVal.includes("docente"))) {
                        if (cellVal.includes(":")) { const split = cellVal.split(":"); if (split[1] && split[1].trim().length > 2) foundTutor = split[1].trim(); }
                        if (!foundTutor) foundTutor = row[c+1] || row[c+2];
                    }
                    if (!foundTurma && lowerVal.includes("turma")) {
                        if (cellVal.includes(":")) { const split = cellVal.split(":"); if (split[1] && split[1].trim().length > 0) foundTurma = split[1].trim(); } 
                        else if (lowerVal.replace("turma", "").trim().length > 0) { foundTurma = cellVal.replace(/turma/i, "").trim(); } 
                        else { foundTurma = row[c+1] || row[c+2]; }
                    }
                    if (!foundCurso) {
                         if (lowerVal.startsWith("aprendizagem profissional") || (lowerVal.includes("curso") && cellVal.length > 15)) { foundCurso = cellVal; }
                    }
                }
            }
            if (!foundCurso && data[0] && data[0][4]) foundCurso = data[0][4]; 
            return { tutor: foundTutor, turma: foundTurma, curso: foundCurso };
        };

        const extractCellComments = (cell) => {
             if (!cell) return null;
             if (cell.c && Array.isArray(cell.c)) {
                 const texts = cell.c.map(comm => {
                     if (comm.t) return comm.t;
                     if (comm.r) { if(typeof comm.r === 'string') return comm.r; if(Array.isArray(comm.r)) return comm.r.map(run => run.t).join(""); }
                     return "";
                 }).filter(t => t && t.trim().length > 0);
                 if (texts.length > 0) return texts.join(" | ");
             }
             if (typeof cell.c === 'string') return cell.c;
             if (cell._comment) return String(cell._comment);
             if (cell.comment) return String(cell.comment);
             return null;
        };

        const normalizeName = (str) => {
            if(!str) return "";
            return str.toString()
                .replace(/\u00A0/g, ' ') 
                .trim()
                .toUpperCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "") 
                .replace(/\s+/g, " "); 
        };

        const isInterestingText = (text, studentName) => {
            if (!text || typeof text !== 'string') return false;
            const t = text.trim();
            if (t.length < 3) return false;
            if (/^[\d.,\s%-]+$/.test(t)) return false;
            const upper = t.toUpperCase();
            if (upper === "RESUMOFALTANTES") return false;
            if (upper === "PENDENTE") return false;
            if (/^UC\d+$/i.test(t)) return false; 
            if (/^\d{1,2}\/[a-zç]{3}\s*-\s*[a-zç]{3}$/i.test(t)) return false; 
            if (upper.includes("REQUER CONSELHO") || upper.includes("PARECER")) return true;
            const blacklist = ["SIM", "NÃO", "NAO", "APTO", "NÃO APTO", "NAO APTO", "DESENVOLVEU", "NÃO DESENVOLVEU", "NAO DESENVOLVEU", "TRANSFERIDO", "EVADIDO", "DESISTENTE", "MATRICULADO", "CURSANDO", "PRESENTE", "FALTA", "JUSTIFICADA", "TOTAL", "RESULTADO", "FINAL", "SITUAÇÃO", "OBS", "NOTA", "MÉDIA", "FREQUÊNCIA", "FREQ", "%"];
            if (blacklist.includes(upper)) return false;
            if (blacklist.some(word => upper === word)) return false; 
            if (normalizeName(t) === normalizeName(studentName)) return false;
            if (/^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/.test(t)) return false; 
            return true;
        };

        const cleanObservationText = (value) => String(value || "")
            .replace(/\r\n?/g, "\n")
            .split("\n")
            .map(line => line.replace(/\s+/g, " ").trim())
            .filter(Boolean)
            .join("\n")
            .trim();

        const getObservationContext = (rawData, headerRowIdx, columnIdx, sheetName) => {
            const ucMatch = String(sheetName || "").match(/UC\s*(\d+)/i);
            const headerValues = [];
            const dateValues = [];
            const start = Math.max(0, Number(headerRowIdx || 0) - 4);
            const end = Math.min(rawData.length, Number(headerRowIdx || 0) + 3);
            const ignoredHeader = /^(N|N[º°]?|NUMERO|NOME|ALUNO|APRENDIZ|APRENDIZES|SOBRENOME|UC\s*\d+)$/i;

            for (let rowIdx = start; rowIdx < end; rowIdx++) {
                const value = rawData[rowIdx] && rawData[rowIdx][columnIdx];
                if (value === null || value === undefined || String(value).trim() === "") continue;
                const formatted = formatActivityHeaderValue(value);
                const parsedDate = parseAttendanceDate(value);
                if (parsedDate) {
                    if (!dateValues.some(existing => existing.getTime() === parsedDate.getTime())) dateValues.push(parsedDate);
                    continue;
                }
                const normalized = normalizeText(formatted);
                if (!normalized || ignoredHeader.test(normalized) || normalized === normalizeText(sheetName)) continue;
                if (!headerValues.includes(formatted)) headerValues.push(formatted);
            }

            return {
                sheet: String(sheetName || ""),
                uc: ucMatch ? `UC${ucMatch[1]}` : "",
                date: dateValues.length > 0 ? formatShortDate(dateValues[0]) : "",
                column: window.XLSX ? XLSX.utils.encode_col(columnIdx) : String(columnIdx + 1),
                header: headerValues.slice(-2).join(" · ").slice(0, 120)
            };
        };

        const addStudentObservation = (student, value, metadata = {}) => {
            const text = cleanObservationText(value);
            if (!student || !text || text.length < 2) return;
            const source = String(metadata.source || metadata.sheet || "Planilha").trim();
            const duplicate = (student.all_observations || []).some(item =>
                cleanObservationText(item.text) === text
                && String(item.source || "").trim() === source
                && String(item.date || "") === String(metadata.date || "")
                && String(item.column || "") === String(metadata.column || "")
            );
            if (duplicate) return;
            student.all_observations.push({
                source,
                text,
                sheet: metadata.sheet || "",
                uc: metadata.uc || "",
                date: metadata.date || "",
                column: metadata.column || "",
                header: metadata.header || "",
                kind: metadata.kind || "observation"
            });
        };

        const getObservationKindMeta = (observation) => {
            if (observation && observation.kind === "attendance_comment") return { label: "Anotação da chamada", className: "bg-orange-100 text-orange-800 border-orange-200", icon: IconCalendar };
            if (observation && observation.kind === "pedagogical") return { label: "Registro pedagógico", className: "bg-blue-100 text-blue-800 border-blue-200", icon: IconBookOpen };
            return { label: "Observação da planilha", className: "bg-gray-100 text-gray-700 border-gray-200", icon: IconMessageSquare };
        };

        const getObservationGroupLabel = (observation) => {
            if (observation && observation.uc) return observation.uc;
            const number = getUCNumber(observation && observation.source);
            if (number !== null) return `UC${number}`;
            return "Geral";
        };

        const ObservationEntry = ({ observation }) => {
            const meta = getObservationKindMeta(observation);
            const KindIcon = meta.icon;
            return <div className="px-3 py-3 bg-white">
                <div className="flex flex-wrap items-center gap-1.5 mb-1.5">
                    <span className={`inline-flex items-center gap-1 rounded border px-2 py-0.5 text-[10px] font-bold ${meta.className}`}><KindIcon className="w-3 h-3" /> {meta.label}</span>
                    {observation.source && <span className="rounded bg-slate-100 px-2 py-0.5 text-[10px] font-semibold text-slate-600">{String(observation.source).replace(/^\[|\]$/g, "")}</span>}
                    {observation.date && <span className="rounded bg-orange-50 px-2 py-0.5 text-[10px] font-semibold text-orange-700">Data: {observation.date}</span>}
                    {observation.column && <span className="rounded bg-gray-50 px-2 py-0.5 text-[10px] font-semibold text-gray-500">Coluna {observation.column}</span>}
                </div>
                {observation.header && <div className="mb-1 text-[10px] font-medium text-gray-500">Campo: {observation.header}</div>}
                <p className="text-sm leading-relaxed text-gray-700 whitespace-pre-wrap">{observation.text}</p>
            </div>;
        };

        const findHeaderRow = (data) => {
            for(let i=0; i<Math.min(100, data.length); i++) {
                const row = data[i]; if(!row) continue;
                const rowStr = row.map(c => String(c || "").toUpperCase()).join("|");
                if(rowStr.includes("TEXTOS ÓRION") || rowStr.includes("TEXTOS ORION") || rowStr.includes("RECUPERAÇÕES") || rowStr.includes("MOTIVO DE DESLIGAMENTO")) return i;
                if (rowStr.includes("NOME") && (rowStr.includes("SITUAÇÃO") || rowStr.includes("SITUACAO") || rowStr.includes("FREQ") || rowStr.includes("UC1") || rowStr.includes("NOTA"))) return i;
                if (rowStr.includes("UC1") && rowStr.includes("UC2") && rowStr.includes("MÉDIA")) return i;
            }
            for(let i=0; i<Math.min(100, data.length); i++) {
                const row = data[i]; if(!row) continue;
                const rowStr = row.map(c => String(c || "").toUpperCase()).join("|");
                if (rowStr.includes("NOME DO ALUNO") || rowStr.includes("NOME COMPLETO") || rowStr.includes("APRENDIZ")) return i;
                const colB = String(row[1] || "").toUpperCase().trim();
                const colC = String(row[2] || "").toUpperCase().trim();
                if ((colB === "NOME" || colB === "ALUNO") || (colC === "NOME" || colC === "ALUNO")) return i;
            }
            return -1;
        };

        const excelDateToJSDate = (serial) => {
            const utc_days  = Math.floor(serial - 25569);
            const utc_value = utc_days * 86400;                                        
            const date_info = new Date(utc_value * 1000);
            return new Date(date_info.getFullYear(), date_info.getMonth(), date_info.getDate());
        };

        const getManualProcessList = (turma) => {
            if(!turma) return [];
            try {
                const key = `process_overrides_${turma.replace(/[^a-zA-Z0-9]/g, '')}`;
                const saved = localStorage.getItem(key);
                return saved ? JSON.parse(saved) : [];
            } catch(e) { return []; }
        };

        const saveManualProcessList = (turma, list) => {
            if(!turma) return;
            try {
                const key = `process_overrides_${turma.replace(/[^a-zA-Z0-9]/g, '')}`;
                localStorage.setItem(key, JSON.stringify(list));
            } catch(e) {}
        };

        const stripAccents = (value) => String(value || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");

        const normalizeText = (value) => stripAccents(value).toUpperCase().replace(/\s+/g, " ").trim();

        const rowToSearchText = (row) => (row || [])
            .map(cell => normalizeText(cell))
            .filter(Boolean)
            .join(" | ");

        const hasAnyKeyword = (text, keywords) => keywords.some(keyword => text.includes(keyword));

        const findMatchingRawCell = (row, keywords) => {
            const found = (row || []).find(cell => hasAnyKeyword(normalizeText(cell), keywords));
            return found !== undefined && found !== null ? String(found).trim() : "";
        };

        const STUDENT_DROPOUT_KEYWORDS = [
            "EVADIDO", "EVASAO", "DESISTENTE", "DESLIGADO", "DESLIGAMENTO",
            "TRANCADO", "TRANSFERIDO", "CANCELADO", "RESCINDIDO", "ENCERRADO",
            "TERMINO DE CONTRATO", "FIM DE CONTRATO"
        ];

        const STUDENT_PROCESS_KEYWORDS = [
            "EM PROCESSO", "PROCESSO DE DESLIGAMENTO", "AGUARDANDO DESLIGAMENTO",
            "PENDENTE DESLIGAMENTO", "DESLIGAMENTO EM ANDAMENTO"
        ];

        const hasDropoutKeywordInRow = (row) => hasAnyKeyword(rowToSearchText(row), STUDENT_DROPOUT_KEYWORDS);

        const NOT_DEVELOPED_KEYWORDS = [
            "NAO DESENVOLVEU", "NAO DESENVOLVIDO", "REPROVADO", "INSUFICIENTE"
        ];

        const RECOVERY_KEYWORDS = ["RECUPERACAO", "RECUPERAÇÃO"];

        const normalizeContraTurno = (value) => {
            const raw = String(value || "").trim();
            const normalized = normalizeText(raw);
            if (!raw || raw === "0" || raw === "-" || normalized === "NAO" || normalized.includes("SEM CONTRA")) return "Sem Contra Turno";

            const days = [];
            const addDay = (label) => { if (!days.includes(label)) days.push(label); };
            if (/\bSEG(UNDA)?\b/.test(normalized)) addDay("Seg");
            if (/\bTER(CA)?\b/.test(normalized)) addDay("Ter");
            if (/\bQUA(RTA)?\b/.test(normalized)) addDay("Qua");
            if (/\bQUI(NTA)?\b/.test(normalized)) addDay("Qui");
            if (/\bSEX(TA)?\b/.test(normalized)) addDay("Sex");

            return days.length > 0 ? days.join("/") : raw;
        };

        const classifyStudentSituation = (row, situationColIdx) => {
            const situationText = situationColIdx !== -1 ? normalizeText(row[situationColIdx]) : "";
            const fullText = rowToSearchText(row);
            const searchText = `${situationText} | ${fullText}`;
            const rawSituation = situationColIdx !== -1 && row[situationColIdx] ? String(row[situationColIdx]).trim() : "";

            if (hasAnyKeyword(searchText, STUDENT_PROCESS_KEYWORDS)) {
                return { type: "process", reason: rawSituation || findMatchingRawCell(row, STUDENT_PROCESS_KEYWORDS) || "Em Processo de Desligamento" };
            }
            if (hasAnyKeyword(searchText, STUDENT_DROPOUT_KEYWORDS)) {
                return { type: "dropout", reason: rawSituation || findMatchingRawCell(row, STUDENT_DROPOUT_KEYWORDS) || "Evadido/Desligado" };
            }
            return { type: "active", reason: "" };
        };

        const isNotDevelopedStatus = (value) => {
            const text = normalizeText(value);
            if (!text) return false;
            if (text === "ND") return true;
            if (text === "D" || text === "DESENVOLVEU" || text.includes("DESENVOLVEU") && !text.includes("NAO")) return false;
            return hasAnyKeyword(text, NOT_DEVELOPED_KEYWORDS) || hasAnyKeyword(text, RECOVERY_KEYWORDS);
        };

        const isAttendanceSheetName = (sheetName) => {
            const clean = stripAccents(sheetName).toUpperCase().replace(/\s+/g, "");
            return /^UC\d+/.test(clean) || clean.includes("PRATICA");
        };

        const parseAttendanceDate = (value) => {
            let parsedDate = null;
            if (value instanceof Date) {
                parsedDate = value;
            } else if (typeof value === 'number' && value > 40000 && value < 60000) {
                parsedDate = excelDateToJSDate(value);
            } else if (typeof value === 'string') {
                const trimmed = value.trim();
                if (/^\d{4}-\d{2}-\d{2}/.test(trimmed)) {
                    const parts = trimmed.substring(0, 10).split('-').map(Number);
                    parsedDate = new Date(parts[0], parts[1] - 1, parts[2]);
                } else if (/^\d{1,2}\/[a-zA-Z]{3}/.test(stripAccents(trimmed))) {
                    const monthMap = { JAN: 0, FEV: 1, MAR: 2, ABR: 3, MAI: 4, JUN: 5, JUL: 6, AGO: 7, SET: 8, OUT: 9, NOV: 10, DEZ: 11 };
                    const match = stripAccents(trimmed).toUpperCase().match(/^(\d{1,2})\/([A-Z]{3})/);
                    if (match && monthMap[match[2]] !== undefined) parsedDate = new Date(new Date().getFullYear(), monthMap[match[2]], Number(match[1]));
                } else if (/^\d{1,2}\/\d{1,2}(\/\d{2,4})?/.test(trimmed)) {
                    const parts = trimmed.split(/[\/\s]/).filter(Boolean);
                    const year = parts[2] ? Number(parts[2].length === 2 ? `20${parts[2]}` : parts[2]) : new Date().getFullYear();
                    parsedDate = new Date(year, Number(parts[1]) - 1, Number(parts[0]));
                }
            }

            if (!parsedDate || isNaN(parsedDate)) return null;
            return new Date(parsedDate.getFullYear(), parsedDate.getMonth(), parsedDate.getDate());
        };

        const isAttendanceValueFilled = (value) => {
            if (value === null || value === undefined) return false;
            const normalized = String(value).trim();
            return normalized.length > 0 && normalized !== "-" && normalized !== "0";
        };

        const isRedColorValue = (color) => {
            let clean = String(color || "").replace(/^#/, "").toUpperCase();
            if (clean.length === 8) clean = clean.substring(2);
            if (clean.length !== 6) return false;
            const red = parseInt(clean.substring(0, 2), 16) / 255;
            const green = parseInt(clean.substring(2, 4), 16) / 255;
            const blue = parseInt(clean.substring(4, 6), 16) / 255;
            const max = Math.max(red, green, blue);
            const min = Math.min(red, green, blue);
            const delta = max - min;
            if (delta === 0 || max < 0.35 || delta / max < 0.35) return false;
            let hue = 0;
            if (max === red) hue = 60 * (((green - blue) / delta) % 6);
            else if (max === green) hue = 60 * ((blue - red) / delta + 2);
            else hue = 60 * ((red - green) / delta + 4);
            if (hue < 0) hue += 360;
            return hue <= 15 || hue >= 345;
        };

        const isRedAttendanceCell = (cell, conditionalRanges = [], cellAddress = "") => {
            const colors = [
                cell && cell.s && cell.s.fgColor && cell.s.fgColor.rgb,
                cell && cell.s && cell.s.bgColor && cell.s.bgColor.rgb,
                cell && cell.s && cell.s.font && cell.s.font.color && cell.s.font.color.rgb
            ].filter(Boolean);
            if (colors.some(isRedColorValue)) return true;
            if (!cellAddress || !conditionalRanges || conditionalRanges.length === 0 || !window.XLSX) return false;
            try {
                const cellPosition = XLSX.utils.decode_cell(cellAddress);
                return conditionalRanges.some(range => {
                    const decodedRange = XLSX.utils.decode_range(range.replace(/\$/g, ""));
                    return cellPosition.r >= decodedRange.s.r && cellPosition.r <= decodedRange.e.r && cellPosition.c >= decodedRange.s.c && cellPosition.c <= decodedRange.e.c;
                });
            } catch (error) {
                return false;
            }
        };

        const isNonDataAttendanceHeader = (value) => {
            const text = normalizeText(value).replace(/[º°]/g, "").trim();
            return text === "N" || text === "NO" || text === "NUMERO" || text.includes("ORION") || text.includes("COLUNA PARA ORDENAR") || text.includes("HORARIO CURSO");
        };

        const findAttendanceHeader = (rows) => {
            for (let r = 0; r < Math.min(rows.length, 25); r++) {
                const row = rows[r] || [];
                let nameCol = -1;
                const dateCols = [];
                const ignoredCols = new Set();

                row.forEach((cell, c) => {
                    const label = stripAccents(cell).toUpperCase();
                    if (isNonDataAttendanceHeader(cell)) ignoredCols.add(c);
                    if (nameCol === -1 && (label.includes("APREND") || label.includes("ALUNO") || label.includes("NOME"))) nameCol = c;
                    const date = parseAttendanceDate(cell);
                    if (date && !ignoredCols.has(c)) dateCols.push({ idx: c, date });
                });

                if (nameCol !== -1 && dateCols.length > 0) return { rowIdx: r, nameCol, dateCols, ignoredCols };
            }
            return null;
        };

        const formatShortDate = (date) => date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });

        const formatAttendanceWarning = (item) => {
            const status = item.type === "nao_realizada" ? "chamada não realizada" : "chamada incompleta";
            return `${formatShortDate(item.date)}: ${status} — ${item.filled} de ${item.total} alunos preenchidos`;
        };

        const summarizeAttendanceWarnings = (warnings, maxItems = 18) => {
            if (!warnings || warnings.length === 0) return "";
            const grouped = warnings.reduce((acc, item) => {
                if (!acc[item.sheet]) acc[item.sheet] = [];
                acc[item.sheet].push(item);
                return acc;
            }, {});

            const lines = Object.entries(grouped).map(([sheet, items]) => {
                const dates = items.slice(0, 6).map(formatAttendanceWarning).join("; ");
                const extra = items.length > 6 ? ` e mais ${items.length - 6}` : "";
                return `${sheet}: ${dates}${extra}`;
            });

            const visible = lines.slice(0, maxItems);
            const hidden = lines.length - visible.length;
            return `Foram encontradas possíveis pendências de chamada:\n\n${visible.join("\n")}${hidden > 0 ? `\n... e mais ${hidden} aba(s).` : ""}`;
        };

        const getActivityCellStatus = (value) => {
            const text = normalizeText(value);
            if (!text) return "blank";
            if (text === "C" || text === "CONCLUIU" || text.startsWith("C -") || text.startsWith("C (") || text.includes("CONCLUIU A ATIVIDADE")) return "completed";
            if (text === "NC" || text.includes("NAO CONCLUIU")) return "not_completed";
            if (text.includes("REQUER") && text.includes("AVALI")) return "requires_evaluation";
            return null;
        };

        const formatActivityHeaderValue = (value) => {
            if (value instanceof Date && !isNaN(value.getTime())) return value.toLocaleDateString("pt-BR");
            if (typeof value === "number" && value > 20000 && value < 60000 && window.XLSX && XLSX.SSF && XLSX.SSF.parse_date_code) {
                const parsed = XLSX.SSF.parse_date_code(value);
                if (parsed && parsed.d && parsed.m && parsed.y) return `${String(parsed.d).padStart(2, "0")}/${String(parsed.m).padStart(2, "0")}/${parsed.y}`;
            }
            return String(value || "").trim();
        };

        const simplifyActivityHeaderLabel = (label) => String(label || "")
            .replace(/\s*\|\s*\d+\s*$/, "")
            .replace(/\s*\[\s*TOTAL DE PONTOS:[^\]]*\]/gi, "")
            .replace(/\s+/g, " ")
            .trim();

        const findActivityHeader = (rows) => {
            for (let rowIdx = 0; rowIdx < Math.min(rows.length, 80); rowIdx++) {
                const row = rows[rowIdx] || [];
                const nameCols = [];
                let surnameCol = -1;
                row.forEach((cell, colIdx) => {
                    const text = normalizeText(cell);
                    if (text === "SOBRENOME" || text === "ULTIMO SOBRENOME") surnameCol = colIdx;
                    if (text === "NOME" || text === "ALUNO" || text === "APRENDIZ" || text.includes("NOME COMPLETO") || text.includes("NOME DO ALUNO") || text.includes("NOME DO APRENDIZ")) nameCols.push(colIdx);
                });
                if (nameCols.length > 0) {
                    const allNameCols = [...new Set([nameCols[0], surnameCol].filter(colIdx => colIdx >= 0))];
                    return { rowIdx, nameCol: nameCols[0], nameCols: allNameCols, surnameCol };
                }
            }
            return null;
        };

        const buildActivityHeaderLabel = (rows, header, colIdx) => {
            const values = [];
            const start = Math.max(0, header.rowIdx - 4);
            for (let rowIdx = start; rowIdx <= header.rowIdx; rowIdx++) {
                const value = formatActivityHeaderValue((rows[rowIdx] || [])[colIdx]);
                if (value && !values.includes(value)) values.push(value);
            }
            return values.join(" | ") || `Atividade ${colIdx + 1}`;
        };

        const isActivityHeaderLabel = (label) => {
            const text = normalizeText(label);
            if (!text || ["NOME", "ALUNO", "APRENDIZ", "MATRICULA", "TURMA", "STATUS", "SITUACAO", "RESULTADO", "OBS", "TOTAL", "MEDIA"].includes(text)) return false;
            if (/^UC\s*\d+$/.test(text)) return false;
            if (/^UC\s*\d+\s*(?:-\s*|\s+)?(?:IND\b|TOTAL\b|MEDIA\b|RESULTADO\b|INDICADOR\b)/.test(text)) return false;
            if (/\[\s*S\d+(?:D\d+)?(?:\s+(?:PORTFOLIO|POSTAGEM))?\s*\]/.test(text)) return true;
            if (/\b\d{1,2}[\/.-]\d{1,2}(?:[\/.-]\d{2,4})?\b/.test(text)) return true;
            return ["DATA", "DIA", "SEMANA", "ATIV", "TAREFA", "ENCONTRO", "AULA", "POSTAGEM", "PORTFOLIO", "UC"].some(keyword => text.includes(keyword));
        };

        const processActivityWorkbook = (arrayBuffer, students, sourceName = "") => {
            const XLSX = window.XLSX;
            if (!XLSX) throw new Error("A biblioteca de Excel ainda não carregou.");
            const workbook = XLSX.read(arrayBuffer, { type: "array", cellDates: true, sheetStubs: true, raw: true });
            const knownStudents = new Map((students || []).map(student => [normalizeName(student.name), student.name]));
            const activityStudents = {};
            const sheets = [];
            const totals = { completed: 0, not_completed: 0, blank: 0, requires_evaluation: 0, activities: 0 };

            const getStudentSummary = (normalizedName, displayName) => {
                if (!activityStudents[normalizedName]) activityStudents[normalizedName] = {
                    name: displayName,
                    total: 0,
                    completed: 0,
                    not_completed: 0,
                    blank: 0,
                    requires_evaluation: 0,
                    entries: []
                };
                return activityStudents[normalizedName];
            };

            workbook.SheetNames.forEach(sheetName => {
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "", raw: true });
                const header = findActivityHeader(rows);
                if (!header) return;

                const maxCols = rows.reduce((max, row) => Math.max(max, (row || []).length), 0);
                const activityColumns = [];
                const nameColumns = new Set(header.nameCols || [header.nameCol]);
                for (let colIdx = 0; colIdx < maxCols; colIdx++) {
                    if (nameColumns.has(colIdx)) continue;
                    const label = simplifyActivityHeaderLabel(buildActivityHeaderLabel(rows, header, colIdx));
                    let hasRecognizedStatus = false;
                    for (let rowIdx = header.rowIdx + 1; rowIdx < rows.length; rowIdx++) {
                        const cellStatus = getActivityCellStatus((rows[rowIdx] || [])[colIdx]);
                        if (cellStatus && cellStatus !== "blank") { hasRecognizedStatus = true; break; }
                    }
                    if (hasRecognizedStatus && isActivityHeaderLabel(label)) activityColumns.push({ colIdx, label });
                }
                if (activityColumns.length === 0) return;

                const sheetStudents = new Set();
                for (let rowIdx = header.rowIdx + 1; rowIdx < rows.length; rowIdx++) {
                    const row = rows[rowIdx] || [];
                    const rawName = (header.nameCols || [header.nameCol]).map(colIdx => String(row[colIdx] || "").trim()).filter(Boolean).join(" ");
                    const normalizedName = normalizeName(rawName);
                    if (!normalizedName || normalizedName.includes("TOTAL") || normalizedName.includes("MEDIA") || normalizedName.includes("APRENDIZES")) continue;
                    const displayName = knownStudents.get(normalizedName);
                    if (!displayName) continue;
                    const studentSummary = getStudentSummary(normalizedName, displayName);
                    sheetStudents.add(normalizedName);
                    activityColumns.forEach(({ colIdx, label }) => {
                        const status = getActivityCellStatus(row[colIdx]);
                        if (!status) return;
                        const entry = { status, label, sheet: sheetName, uc: (sheetName.match(/UC\s*\d+/i) || [sheetName])[0].replace(/\s+/g, "").toUpperCase() };
                        studentSummary.total++;
                        studentSummary[status]++;
                        studentSummary.entries.push(entry);
                        totals[status]++;
                        totals.activities++;
                    });
                }
                sheets.push({ name: sheetName, uc: (sheetName.match(/UC\s*\d+/i) || [sheetName])[0].replace(/\s+/g, "").toUpperCase(), activities: activityColumns.length, students: sheetStudents.size });
            });

            const attentionStudents = Object.values(activityStudents).filter(student => student.not_completed + student.blank + student.requires_evaluation > 0).length;
            return { sourceName, sheets, students: activityStudents, totals, attentionStudents };
        };

        const getActivityStudentSummary = (tracking, studentName) => tracking && tracking.students ? tracking.students[normalizeName(studentName)] || null : null;

        const formatActivityStatusLabel = (status) => ({ completed: "Concluiu", not_completed: "Não concluiu", blank: "Não fez", requires_evaluation: "Requer avaliação" }[status] || status);

        const analyzeAttendanceWarnings = (workbook, students) => {
            const XLSX = window.XLSX;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const activeStudents = (students || []).filter(s => !s.is_dropout && !s.is_process_dropout);
            const namesForValidation = activeStudents.length > 0 ? activeStudents : (students || []);
            const knownStudents = new Set(namesForValidation.map(s => normalizeName(s.name)));
            const warnings = [];

            workbook.SheetNames.forEach(sheetName => {
                if (!isAttendanceSheetName(sheetName)) return;

                const sheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: true });
                const header = findAttendanceHeader(rows);
                if (!header) return;

                const studentRows = [];
                for (let r = header.rowIdx + 1; r < rows.length; r++) {
                    const row = rows[r] || [];
                    const studentName = String(row[header.nameCol] || "").trim();
                    const normalized = normalizeName(studentName);
                    if (!normalized || normalized.includes("TOTAL") || normalized.includes("MEDIA") || normalized.includes("APRENDIZES")) continue;
                    if (knownStudents.size === 0 || knownStudents.has(normalized)) studentRows.push(row);
                }

                if (studentRows.length < 3) return;

                header.dateCols.forEach(({ idx, date }) => {
                    if (date > today) return;

                    const dayOfWeek = date.getDay();
                    if (dayOfWeek === 0 || dayOfWeek === 6) return;

                    const filled = studentRows.filter(row => isAttendanceValueFilled(row[idx])).length;
                    const total = studentRows.length;
                    const fillRate = total > 0 ? filled / total : 0;

                    if (filled < total) {
                        warnings.push({
                            sheet: sheetName,
                            date,
                            filled,
                            total,
                            type: filled === 0 ? "nao_realizada" : "incompleta"
                        });
                    }
                });
            });

            return warnings.sort((a, b) => a.date - b.date || a.sheet.localeCompare(b.sheet, 'pt-BR', { numeric: true }));
        };

        const formatNAKeyDate = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
        const makeNAKey = (studentName, sheet, date) => `${normalizeName(studentName)}|${sheet}|${formatNAKeyDate(date)}`;

        const getWorkbookFileText = (workbook, path) => {
            const file = workbook && workbook.files && workbook.files[path];
            if (!file || !file.content) return "";
            if (typeof file.content === "string") return file.content;
            try { return new TextDecoder("utf-8").decode(file.content); } catch (error) { return ""; }
        };

        const getRedNAConditionalRanges = (workbook) => {
            const stylesXml = getWorkbookFileText(workbook, "xl/styles.xml");
            const dxfBlocks = stylesXml.match(/<dxf\b[\s\S]*?<\/dxf>/g) || [];
            const redDxfIds = new Set();
            dxfBlocks.forEach((dxf, index) => {
                const rgbColors = [...dxf.matchAll(/(?:fgColor|bgColor|color)[^>]*\brgb="([^"]+)"/gi)].map(match => match[1]);
                if (rgbColors.some(isRedColorValue)) redDxfIds.add(String(index));
            });

            const rangesBySheet = {};
            (workbook && workbook.SheetNames || []).forEach((sheetName, sheetIndex) => {
                const worksheetXml = getWorkbookFileText(workbook, `xl/worksheets/sheet${sheetIndex + 1}.xml`);
                if (!worksheetXml) return;
                const redRanges = [];
                const conditionalBlocks = worksheetXml.match(/<conditionalFormatting\b[\s\S]*?<\/conditionalFormatting>/g) || [];
                conditionalBlocks.forEach(block => {
                    const sqrefMatch = block.match(/\bsqref="([^"]+)"/i);
                    if (!sqrefMatch) return;
                    const rules = block.match(/<cfRule\b[\s\S]*?<\/cfRule>/g) || [];
                    rules.forEach(rule => {
                        const dxfMatch = rule.match(/\bdxfId="(\d+)"/i);
                        const formulaMatch = rule.match(/<formula>\s*([\s\S]*?)\s*<\/formula>/i);
                        const formula = formulaMatch ? formulaMatch[1].replace(/&quot;/g, '"').replace(/["']/g, "").trim().toUpperCase() : "";
                        if (!dxfMatch || formula !== "NA" || !redDxfIds.has(dxfMatch[1])) return;
                        sqrefMatch[1].split(/\s+/).filter(Boolean).forEach(range => redRanges.push(range));
                    });
                });
                rangesBySheet[sheetName] = redRanges;
            });
            return rangesBySheet;
        };

        const analyzeNAWarnings = (workbook, students) => {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const activeStudents = (students || []).filter(student => !student.is_dropout && !student.is_process_dropout);
            const namesForValidation = activeStudents.length > 0 ? activeStudents : (students || []);
            const knownStudents = new Map(namesForValidation.map(student => [normalizeName(student.name), student.name]));
            const studentEntries = {};
            const redNAConditionalRanges = getRedNAConditionalRanges(workbook);
            let totalNA = 0;

            workbook.SheetNames.forEach(sheetName => {
                if (!isAttendanceSheetName(sheetName)) return;
                const sheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: true });
                const header = findAttendanceHeader(rows);
                if (!header) return;
                const uc = (sheetName.match(/UC\s*\d+/i) || [sheetName])[0].replace(/\s+/g, "").toUpperCase();

                for (let rowIdx = header.rowIdx + 1; rowIdx < rows.length; rowIdx++) {
                    const row = rows[rowIdx] || [];
                    const normalizedName = normalizeName(row[header.nameCol]);
                    const displayName = knownStudents.get(normalizedName);
                    if (!displayName || normalizedName.includes("TOTAL") || normalizedName.includes("MEDIA") || normalizedName.includes("APRENDIZES")) continue;

                    header.dateCols.forEach(({ idx, date }) => {
                        if (date > today || date.getDay() === 0 || date.getDay() === 6) return;
                        if (normalizeText(row[idx]) !== "NA") return;
                        const cellAddress = XLSX.utils.encode_cell({ r: rowIdx, c: idx });
                        if (!isRedAttendanceCell(sheet[cellAddress], redNAConditionalRanges[sheetName], cellAddress)) return;
                        const key = makeNAKey(displayName, sheetName, date);
                        if (!studentEntries[normalizedName]) studentEntries[normalizedName] = { name: displayName, entries: [] };
                        studentEntries[normalizedName].entries.push({ key, sheet: sheetName, uc, date: formatShortDate(date), dateValue: formatNAKeyDate(date) });
                        totalNA++;
                    });
                }
            });

            const studentsWithNA = Object.values(studentEntries).map(student => ({ ...student, count: student.entries.length }));
            return {
                students: studentEntries,
                totals: { na: totalNA },
                attentionStudents: studentsWithNA.filter(student => student.count >= 2).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, "pt-BR"))
            };
        };

        const getNAStudentSummary = (data, studentName, justifications = {}) => {
            const raw = data && data.naAlerts && data.naAlerts.students ? data.naAlerts.students[normalizeName(studentName)] : null;
            if (!raw) return null;
            const entries = raw.entries.filter(entry => !justifications[entry.key]);
            return { ...raw, entries, count: entries.length };
        };

        const getNAJustificationStorageKey = (turma) => `na_justifications_v1_${String(turma || "TURMA").replace(/[^a-zA-Z0-9]/g, "")}`;

        const makeNAJustificationDocId = (turma, entryKey) => `na_${generateHash(String(turma || "TURMA"))}_${generateHash(String(entryKey || "REGISTRO"))}`;

        const readNAJustificationsLocal = (turma) => {
            try {
                const value = localStorage.getItem(getNAJustificationStorageKey(turma));
                const parsed = value ? JSON.parse(value) : {};
                return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
            } catch (error) {
                console.error("Erro ao carregar justificativas locais", error);
                return {};
            }
        };

        const writeNAJustificationsLocal = (turma, values) => {
            try { localStorage.setItem(getNAJustificationStorageKey(turma), JSON.stringify(values || {})); }
            catch (error) { console.error("Erro ao salvar justificativas locais", error); }
        };

        const loadNAJustifications = async (turma) => {
            const localValues = readNAJustificationsLocal(turma);
            const db = await getNotebookFirestore();
            if (!db) return { justifications: localValues, source: "local" };
            try {
                const turmaKey = cleanNotebookKey(turma, "TURMA_DESCONHECIDA");
                const snapshot = await db.collection("na_justifications").where("turmaKey", "==", turmaKey).get();
                const values = { ...localValues };
                snapshot.docs.forEach(doc => {
                    const record = doc.data() || {};
                    if (record.entryKey) values[record.entryKey] = { ...record, id: doc.id };
                });
                writeNAJustificationsLocal(turma, values);
                return { justifications: values, source: "cloud" };
            } catch (error) {
                console.error("Erro ao carregar justificativas do Firebase; usando dados locais", error);
                return { justifications: localValues, source: "local" };
            }
        };

        const persistNAJustification = async (turma, entryKey, value) => {
            const current = readNAJustificationsLocal(turma);
            current[entryKey] = { ...(value || {}), entryKey };
            writeNAJustificationsLocal(turma, current);
            const db = await getNotebookFirestore();
            if (!db) return { source: "local" };
            try {
                await db.collection("na_justifications").doc(makeNAJustificationDocId(turma, entryKey)).set({
                    turmaKey: cleanNotebookKey(turma, "TURMA_DESCONHECIDA"),
                    entryKey: String(entryKey),
                    justified: true,
                    sheet: String(value && value.sheet || ""),
                    date: String(value && value.date || ""),
                    reason: String(value && value.reason || ""),
                    justifiedAt: String(value && value.justifiedAt || new Date().toISOString()),
                    updatedAt: new Date().toISOString()
                }, { merge: true });
                return { source: "cloud" };
            } catch (error) {
                console.error("Erro ao salvar justificativa no Firebase; dados mantidos localmente", error);
                return { source: "local" };
            }
        };

        const removeNAJustification = async (turma, entryKey) => {
            const current = readNAJustificationsLocal(turma);
            delete current[entryKey];
            writeNAJustificationsLocal(turma, current);
            const db = await getNotebookFirestore();
            if (!db) return { source: "local" };
            try {
                await db.collection("na_justifications").doc(makeNAJustificationDocId(turma, entryKey)).delete();
                return { source: "cloud" };
            } catch (error) {
                console.error("Erro ao remover justificativa do Firebase", error);
                return { source: "local" };
            }
        };

        const compactGeneralHeader = (value) => normalizeText(value).replace(/[^A-Z0-9]/g, "");

        const cleanContactValue = (value) => {
            if (value === null || value === undefined) return "";
            return String(value).trim();
        };

        const normalizeStudentContact = (contact = {}, fallbackName = "") => ({
            studentContactName: cleanContactValue(contact.studentContactName || contact.studentName || fallbackName),
            studentPhone: cleanContactValue(contact.studentPhone),
            studentEmail: cleanContactValue(contact.studentEmail),
            supervisorName: cleanContactValue(contact.supervisorName),
            supervisorPhone: cleanContactValue(contact.supervisorPhone),
            supervisorEmail: cleanContactValue(contact.supervisorEmail)
        });

        const parseGeneralDataContacts = (workbook) => {
            const sheetName = (workbook.SheetNames || []).find(name => compactGeneralHeader(name) === "DADOSGERAIS");
            if (!sheetName) return {};
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "", raw: true });
            const headerRowIdx = rows.findIndex(row => {
                const headers = (row || []).map(compactGeneralHeader);
                return headers.some(header => header === "NOMEDOAPRENDIZ" || header === "NOMEDOALUNO") && headers.some(header => header.includes("SUPERVISOR"));
            });
            if (headerRowIdx === -1) return {};

            const headers = (rows[headerRowIdx] || []).map(compactGeneralHeader);
            const findColumn = (predicates, startAt = 0) => headers.findIndex((header, index) => index >= startAt && predicates.some(predicate => predicate(header)));
            const studentNameCol = findColumn([header => header === "NOMEDOAPRENDIZ", header => header === "NOMEDOALUNO", header => header === "APRENDIZ"]);
            const supervisorNameCol = findColumn([header => header === "SUPERVISOR", header => header === "NOMEDOSUPERVISOR"]);
            const studentPhoneCol = findColumn([header => header.includes("CONTATODOAPRENDIZ"), header => header.includes("TELEFONEDOAPRENDIZ"), header => header.includes("CELULARDOAPRENDIZ"), header => header === "CONTATO"]);
            const studentEmailCol = findColumn([header => header.includes("EMAILDOAPRENDIZ"), header => header.includes("EMAILDOALUNO")]);
            const supervisorEmailCol = findColumn([header => header.includes("EMAILDOSUPERVISOR")]);
            const supervisorPhoneCols = headers.reduce((columns, header, index) => {
                const isPhone = header === "TELEFONE" || header === "CELULAR" || header.includes("TELEFONEDOSUPERVISOR") || header.includes("CELULARDOSUPERVISOR");
                if (isPhone && (studentPhoneCol === -1 || index < studentPhoneCol)) columns.push(index);
                return columns;
            }, []);
            if (studentNameCol === -1) return {};

            const contacts = {};
            rows.slice(headerRowIdx + 1).forEach(row => {
                const studentName = cleanContactValue(row[studentNameCol]);
                const studentKey = normalizeName(studentName);
                if (!studentKey || studentKey.includes("TOTAL") || studentKey.includes("APRENDIZES")) return;
                const supervisorPhones = supervisorPhoneCols.map(index => cleanContactValue(row[index])).filter(Boolean);
                contacts[studentKey] = normalizeStudentContact({
                    studentContactName: studentName,
                    studentPhone: studentPhoneCol === -1 ? "" : row[studentPhoneCol],
                    studentEmail: studentEmailCol === -1 ? "" : row[studentEmailCol],
                    supervisorName: supervisorNameCol === -1 ? "" : row[supervisorNameCol],
                    supervisorPhone: [...new Set(supervisorPhones)].join(" / "),
                    supervisorEmail: supervisorEmailCol === -1 ? "" : row[supervisorEmailCol]
                }, studentName);
            });
            return contacts;
        };

        const processExcelFile = (arrayBuffer) => {
            try {
                const XLSX = window.XLSX;
                if (!XLSX) throw new Error("A biblioteca de Excel ainda não carregou.");
                
                const workbook = XLSX.read(arrayBuffer, { type: 'array', cellComments: true, sheetStubs: true, cellDates: true, cellNF: true, cellText: true, cellStyles: true, bookFiles: true });
                
                let tutor1 = "Não Identificado"; let tutor2 = "Não Identificado"; let course = "Curso não identificado"; let turma = "Turma não identificada";
                const sheetNames = workbook.SheetNames;
                const generalDataContacts = parseGeneralDataContacts(workbook);

                // Cada UC pode estar sob responsabilidade de um instrutor diferente.
                // A ordem das UCs mantém a ordem de apresentação dos cadernos.
                const ucMetadata = sheetNames
                    .map((sheetName, sheetIndex) => {
                        const match = String(sheetName).match(/UC\s*(\d+)/i);
                        return match ? { sheetName, sheetIndex, number: Number(match[1]) } : null;
                    })
                    .filter(Boolean)
                    .sort((a, b) => a.number - b.number || a.sheetIndex - b.sheetIndex)
                    .map(item => ({ ...item, metadata: findMetadata(workbook.Sheets[item.sheetName]) }));

                const instructors = [];
                ucMetadata.forEach(({ metadata }) => {
                    const tutor = metadata && metadata.tutor ? String(metadata.tutor).trim() : "";
                    if (!tutor || normalizeName(tutor) === normalizeName("Não Identificado")) return;
                    if (!instructors.some(existing => normalizeName(existing) === normalizeName(tutor))) instructors.push(tutor);
                    if (turma === "Turma não identificada" && metadata.turma) turma = metadata.turma;
                    if ((!course || course.includes("não")) && metadata.curso) course = metadata.curso;
                });

                // Fallback para planilhas antigas que não nomeiam a aba como UC.
                if (instructors.length === 0) {
                    sheetNames.forEach(sheetName => {
                        const metadata = findMetadata(workbook.Sheets[sheetName]);
                        const tutor = metadata && metadata.tutor ? String(metadata.tutor).trim() : "";
                        if (tutor && normalizeName(tutor) !== normalizeName("Não Identificado") && !instructors.some(existing => normalizeName(existing) === normalizeName(tutor))) instructors.push(tutor);
                        if (turma === "Turma não identificada" && metadata.turma) turma = metadata.turma;
                        if ((!course || course.includes("não")) && metadata.curso) course = metadata.curso;
                    });
                }

                tutor1 = instructors[0] || "Não Identificado";
                tutor2 = instructors[1] || "Não Identificado";
                if (turma && String(turma).toUpperCase().includes("TURMA")) turma = String(turma).replace(/TURMA[:\s]*/i, '').trim();

                const manualProcessOverrides = getManualProcessList(turma);

                let pedSheetName = sheetNames.find(n => n.toUpperCase().includes("PEDAG") || n.toUpperCase().includes("GERAL") || n.toUpperCase().includes("FREQ") || n.toUpperCase().includes("CONTROLE"));
                
                let pedSheet = null;
                let headerRowIdx = -1;

                if (pedSheetName) {
                    pedSheet = workbook.Sheets[pedSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(pedSheet, { header: 1 });
                    headerRowIdx = findHeaderRow(jsonData);
                }

                if (headerRowIdx === -1) {
                    for (let name of sheetNames) {
                        const s = workbook.Sheets[name];
                        const d = XLSX.utils.sheet_to_json(s, { header: 1 });
                        const idx = findHeaderRow(d);
                        if (idx !== -1) {
                            pedSheetName = name;
                            pedSheet = s;
                            headerRowIdx = idx;
                            break;
                        }
                    }
                }

                if (!pedSheet || headerRowIdx === -1) {
                    throw new Error("Cabeçalho da lista de alunos não encontrado.");
                }

                const jsonData = XLSX.utils.sheet_to_json(pedSheet, { header: 1 });
                const headerRow = jsonData[headerRowIdx];
                const nextRow1 = jsonData[headerRowIdx + 1] || [];
                const nextRow2 = jsonData[headerRowIdx + 2] || [];
                
                const rawDates = [];
                const headerRangeCheck = [headerRow, nextRow1, nextRow2];
                
                headerRangeCheck.forEach(rowArr => {
                    if(!rowArr) return;
                    rowArr.forEach(cell => {
                        let parsedDate = null;
                        if(typeof cell === 'number' && cell > 40000 && cell < 60000) {
                            parsedDate = excelDateToJSDate(cell);
                        } else if(cell instanceof Date) {
                            parsedDate = cell;
                        } else if(typeof cell === 'string' && cell.match(/^\d{1,2}\/\d{1,2}/)) {
                            const parts = cell.split('/');
                            if(parts.length >= 2) {
                                const d = parseInt(parts[0]);
                                const m = parseInt(parts[1]) - 1;
                                const y = new Date().getFullYear(); 
                                parsedDate = new Date(y, m, d);
                            }
                        }

                        if(parsedDate && !isNaN(parsedDate)) {
                            parsedDate.setHours(0,0,0,0);
                            if(!rawDates.some(d => d.getTime() === parsedDate.getTime())) {
                                rawDates.push(parsedDate);
                            }
                        }
                    });
                });
                rawDates.sort((a,b) => a - b);
                
                let conselhoColIdx = -1; 
                let ensinoMedioColIdx = -1;
                let nameColIdx = -1;
                let situationColIdx = -1;
                
                for(let idx = 0; idx < Math.max(headerRow.length, nextRow1.length); idx++) {
                    const l1 = normalizeText(headerRow[idx]);
                    const l2 = normalizeText(nextRow1[idx]);
                    const l3 = normalizeText(nextRow2[idx]);
                    const fullHeader = l1 + " " + l2 + " " + l3;
                    
                    if (fullHeader.includes("CONSELHO") && (fullHeader.includes("TEXTO") || fullHeader.includes("OBS"))) conselhoColIdx = idx;
                    if ((fullHeader.includes("ENSINO") && fullHeader.includes("MEDIO")) || fullHeader.includes("CONTRATURNO") || fullHeader.includes("CONTRA TURNO")) ensinoMedioColIdx = idx;
                    if (fullHeader.includes("NOME") && nameColIdx === -1) nameColIdx = idx;
                    if ((fullHeader.includes("SITUACAO") || fullHeader.includes("STATUS") || fullHeader.includes("RESULTADO")) && situationColIdx === -1) situationColIdx = idx;
                }

                if (nameColIdx === -1) nameColIdx = 2; 

                const students = [];
                const allFoundUCs = new Set();
                
                let startRow = headerRowIdx + 1;
                if(jsonData[startRow] && String(jsonData[startRow][1] || "").toUpperCase().includes("DATA")) startRow++;

                for (let i = startRow; i < jsonData.length; i++) {
                    const row = jsonData[i];
                    if (!row) continue;

                    let name = row[nameColIdx];
                    if (typeof name === 'number') { 
                         if (row[nameColIdx+1] && isNaN(row[nameColIdx+1])) name = row[nameColIdx+1];
                         else if (row[nameColIdx-1] && isNaN(row[nameColIdx-1])) name = row[nameColIdx-1];
                    }
                    if (typeof name === 'number' || !name) {
                        const candidate = row.slice(0, 5).find(c => typeof c === 'string' && c.length > 3 && !c.match(/^\d+$/));
                        if(candidate) name = candidate;
                    }
                    
                    if(!name || String(name).length < 3) continue;
                    name = String(name).trim();
                    const normalizedCandidateName = normalizeText(name);
                    if (normalizedCandidateName.includes("TOTAL") || normalizedCandidateName.includes("APRENDIZES") || normalizedCandidateName.includes("MEDIA") || normalizedCandidateName.includes("DATA")) continue;

                    let contraTurnoVal = "";
                    if (ensinoMedioColIdx !== -1 && row[ensinoMedioColIdx]) contraTurnoVal = String(row[ensinoMedioColIdx]).trim();

                    const studentRec = {
                        id: i, 
                        name: name, 
                        averageFreq: 0.0, 
                        status: "Desenvolveu", 
                        low_freq_ucs: [], failed_perf_ucs: [], 
                        needs_recuperacao: false, needs_conselho: false,
                        is_dropout: false, is_process_dropout: false, dropout_reason: "", 
                        conselho_text: conselhoColIdx !== -1 ? String(row[conselhoColIdx] || "").trim() : "",
                        contra_turno_desc: normalizeContraTurno(contraTurnoVal), 
                        ...normalizeStudentContact(generalDataContacts[normalizeName(name)], name),
                        all_observations: [], comments: [],
                        uc_scores: {} 
                    };

                    if (manualProcessOverrides.includes(normalizeName(name))) {
                        studentRec.is_process_dropout = true;
                        studentRec.status = "Em Processo de Desligamento";
                    }

                    const situation = classifyStudentSituation(row, situationColIdx);
                    if (situation.type === "dropout") {
                         studentRec.is_dropout = true;
                         studentRec.status = "Evadido/Desligado";
                         studentRec.dropout_reason = situation.reason;
                    } else if (situation.type === "process" && !studentRec.is_process_dropout) {
                         studentRec.is_process_dropout = true;
                         studentRec.status = "Em Processo de Desligamento";
                         studentRec.dropout_reason = situation.reason;
                    }

                    if (!studentRec.is_dropout) {
                        try {
                            const cellAddress = XLSX.utils.encode_cell({r: i, c: nameColIdx});
                            applyOrangeStudentSituation({
                                student: studentRec,
                                cell: pedSheet[cellAddress],
                                row,
                                sheetName: pedSheetName,
                                isPedagogicalSheet: true,
                                sheet: pedSheet,
                                rowIndex: i,
                                nameColIdx
                            });
                        } catch (e) {}
                    }

                    const freqScores = []; 
                    const detectedFrequencyPairs = [];
                    const frequencyHeaderWidth = Math.max(headerRow.length, nextRow1.length, nextRow2.length);
                    for (let col = 0; col < frequencyHeaderWidth; col++) {
                        const frequencyHeader = normalizeText([headerRow[col], nextRow1[col], nextRow2[col]].filter(Boolean).join(" "));
                        if (!frequencyHeader.includes("APROVEITAMENTO") || !frequencyHeader.includes("FREQUENCIA")) continue;
                        const ucMatch = frequencyHeader.match(/\bUC\s*(\d+)\b/);
                        detectedFrequencyPairs.push({
                            scoreCol: col,
                            statusCol: col + 1,
                            ucName: ucMatch ? `UC${ucMatch[1]}` : frequencyHeader.includes("PRATICA") ? "Prática Profissional" : `UC${detectedFrequencyPairs.length + 1}`
                        });
                    }

                    const frequencyPairs = detectedFrequencyPairs.length > 0 ? detectedFrequencyPairs : (() => {
                        const legacyPairs = [];
                        let legacyUC = 1;
                        for (let col = 4; col < 60; col += 2) {
                            if (col > 24 && (!row[col] && !row[col + 1]) && !row[col + 2]) break;
                            legacyPairs.push({ scoreCol: col, statusCol: col + 1, ucName: col === 26 ? "Prática Profissional" : `UC${legacyUC}` });
                            legacyUC++;
                            if (legacyUC > 20) break;
                        }
                        return legacyPairs;
                    })();

                    frequencyPairs.forEach(({ scoreCol, statusCol, ucName }) => {
                        let scoreVal = row[scoreCol];
                        if (typeof scoreVal === 'string' && scoreVal.includes('%')) {
