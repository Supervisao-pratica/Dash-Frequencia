                    {trackingEnabled && <div className="mt-3 grid grid-cols-1 gap-2 rounded-lg border border-purple-200 p-3"><label className="text-xs font-bold text-gray-600">Status<select value={trackingStatus} onChange={event => setTrackingStatus(event.target.value)} className="mt-1 w-full rounded border border-gray-300 p-2 font-normal">{ANALYST_TRACKING_STATUS_OPTIONS.map(item => <option key={item.value} value={item.value}>{item.label}</option>)}</select></label><label className="text-xs font-bold text-gray-600">Data do lembrete<input type="date" min={date || undefined} value={reminderDate} onChange={event => setReminderDate(event.target.value)} className="mt-1 w-full rounded border border-gray-300 p-2 font-normal" /></label></div>}
                    <div className="mt-4 rounded-lg border border-blue-200 bg-blue-50 p-3 text-xs text-blue-900"><strong className="block">Visível ao instrutor</strong>Todos os acompanhamentos são compartilhados. A avaliação percentual continua restrita ao analista.</div>
                    <div className="mt-4 flex gap-2">{editingNoteId && <button type="button" onClick={resetForm} className="rounded-md border border-gray-300 px-4 py-2.5 text-sm font-bold text-gray-600 hover:bg-gray-50">Cancelar</button>}<button onClick={save} disabled={isSaving || !selectedInstructor || drafts.length === 0} className="flex flex-1 items-center justify-center gap-2 rounded-md bg-senac-blue px-4 py-2.5 text-sm font-bold text-white disabled:opacity-50"><IconSave className="h-4 w-4" /> {isSaving ? "Salvando..." : editingNoteId ? "Salvar alterações" : `Salvar ${drafts.length || ""} situação(ões)`}</button></div>{saveNotice && <p className="mt-2 text-center text-xs font-semibold text-green-700">{saveNotice}</p>}<p className="mt-1 text-center text-[10px] text-gray-400">{storageSource === "cloud" ? "Sincronizado com o Firebase" : "Salvo neste dispositivo"}</p>
                </div><div className="space-y-4 p-5">
                    {trackedAlerts.length > 0 && <section className="rounded-lg border border-orange-200 bg-orange-50 p-4"><h3 className="text-sm font-bold text-orange-900">Acompanhamentos pendentes</h3><div className="mt-2 space-y-2">{trackedAlerts.slice(0, 8).map(note => <div key={note.id} className="flex flex-wrap items-center justify-between gap-2 rounded bg-white p-2 text-xs"><span><strong>{note.followupType}:</strong> {note.subject || "Sem assunto"} | {note.reminderDate ? formatNotebookDate(note.reminderDate) : "Sem prazo"}</span><button type="button" onClick={() => openAnalystTrackingInOutlook(note, turma)} className="font-bold text-senac-blue">Abrir no Outlook</button></div>)}</div></section>}
                    <div className={`grid grid-cols-2 gap-3 ${showEvaluations ? "md:grid-cols-4" : "md:grid-cols-3"}`}><div className="rounded-lg border border-gray-200 bg-white p-3"><div className="text-[10px] font-bold uppercase text-gray-400">Registros</div><div className="mt-1 text-2xl font-bold text-senac-blue">{instructorNotes.length}</div></div><div className="rounded-lg border border-gray-200 bg-white p-3"><div className="text-[10px] font-bold uppercase text-gray-400">Em acompanhamento</div><div className="mt-1 text-2xl font-bold text-purple-700">{trackedAlerts.length}</div></div>{showEvaluations && <><div className="rounded-lg border border-gray-200 bg-white p-3"><div className="text-[10px] font-bold uppercase text-gray-400">Indicador PDI</div><div className="mt-1 text-2xl font-bold text-senac-orange">{pdi.average === null ? "--" : `${pdi.average}%`}</div></div><div className="rounded-lg border border-gray-200 bg-white p-3"><div className="text-[10px] font-bold uppercase text-gray-400">Competências avaliadas</div><div className="mt-1 text-2xl font-bold text-green-700">{pdi.strengths.length + pdi.opportunities.length}</div></div></>}</div>
                    {showEvaluations ? <><HistoryBars title="Evolução das avaliações do instrutor" history={graphHistory} getValue={item => item.score} color="#004587" /><div className="rounded-lg border border-gray-200 bg-white p-4"><div className="mb-3 flex items-center justify-between"><h3 className="text-sm font-bold text-gray-800">PDI consolidado</h3><button onClick={printPDI} disabled={pdi.average === null} className="rounded border border-senac-blue px-2 py-1 text-xs font-bold text-senac-blue disabled:opacity-40">Emitir PDI</button></div><div className="grid gap-4 md:grid-cols-2"><div><h4 className="text-xs font-bold uppercase text-green-700">Pontos fortes</h4>{pdi.strengths.length ? <ul className="mt-2 space-y-2 text-xs">{pdi.strengths.map(item => <li key={item.id}><strong>{item.label}:</strong> {item.note.subject || item.note.notes}</li>)}</ul> : <p className="mt-2 text-xs text-gray-400">Sem avaliações positivas.</p>}</div><div><h4 className="text-xs font-bold uppercase text-red-700">Oportunidades e ações</h4>{pdi.opportunities.length ? <ul className="mt-2 space-y-2 text-xs">{pdi.opportunities.map(item => <li key={item.id}><strong>{item.label}:</strong> {item.note.subject || item.note.notes}</li>)}</ul> : <p className="mt-2 text-xs text-gray-400">Sem oportunidades avaliadas.</p>}</div></div></div></> : <div className="rounded-lg border border-dashed border-gray-300 bg-white p-5 text-center text-sm text-gray-500"><IconEye className="mx-auto mb-2 h-5 w-5" />Avaliações, percentuais, gráfico e PDI estão ocultos. Use “Mostrar avaliações” quando precisar consultá-los.</div>}
                    <div className="rounded-lg border border-gray-200 bg-white p-4"><h3 className="mb-3 text-sm font-bold text-gray-800">Histórico do acompanhamento</h3><div className="max-h-[480px] space-y-2 overflow-y-auto">{instructorNotes.length === 0 ? <p className="py-8 text-center text-xs text-gray-400">Nenhum acompanhamento para este instrutor.</p> : [...instructorNotes].reverse().map(note => <div key={note.id} className={`relative rounded-lg border p-3 text-xs ${editingNoteId === note.id ? "border-senac-blue bg-blue-50" : "border-gray-200"}`}><div className="absolute right-2 top-2 flex gap-1"><button type="button" onClick={() => startEditing(note)} title="Editar acompanhamento" className="text-gray-400 hover:text-senac-blue"><IconEdit3 className="h-4 w-4" /></button><button type="button" onClick={() => remove(note.id)} title="Excluir acompanhamento" className="text-gray-300 hover:text-red-600"><IconTrash2 className="h-4 w-4" /></button></div><div className="flex flex-wrap items-center gap-2 pr-12"><span className="font-bold text-senac-blue">{note.subject || note.followupType}</span><span className="rounded bg-orange-50 px-2 py-0.5 text-orange-800">{note.followupType}</span>{note.competency && <span className="rounded bg-blue-50 px-2 py-0.5 text-blue-700">{competenceLabel(note.competency)}</span>}{showEvaluations && note.score !== null && <span className="rounded bg-gray-100 px-2 py-0.5 font-bold text-gray-600">{note.score}%</span>}<span className="rounded bg-green-100 px-2 py-0.5 text-green-800">Visível ao instrutor</span></div><div className="mt-1 text-gray-400">{formatNotebookDate(note.date)} | {periodLabel(note)}</div>{note.notes && <p className="mt-2 whitespace-pre-wrap text-gray-700">{note.notes}</p>}{note.trackingEnabled && <div className="mt-3 flex flex-wrap items-center gap-2 border-t border-gray-100 pt-2"><select value={note.trackingStatus} onChange={event => changeTrackingStatus(note, event.target.value)} className={`rounded border px-2 py-1 text-xs font-bold ${getAnalystTrackingMeta(note).className}`}>{ANALYST_TRACKING_STATUS_OPTIONS.map(item => <option key={item.value} value={item.value}>{item.label}</option>)}</select>{note.reminderDate && <span className={getAnalystTrackingState(note) === "overdue" ? "font-bold text-red-700" : "text-gray-500"}>Lembrete: {formatNotebookDate(note.reminderDate)}</span>}<button type="button" onClick={() => openAnalystTrackingInOutlook(note, turma)} className="font-bold text-senac-blue">Abrir no Outlook</button></div>}</div>)}</div></div>
                </div></div><div className="flex shrink-0 justify-end border-t border-gray-200 bg-white p-4"><button onClick={onClose} className="rounded-md border border-gray-300 px-4 py-2 text-sm font-bold text-gray-600">Fechar</button></div>
            </div></div>;
        };

        const NotebookNotesReport = ({ turma, instructors, onClose }) => {
            const [notes, setNotes] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [filter, setFilter] = useState("all");
            const [statusFilter, setStatusFilter] = useState("all");
            const [analystFilter, setAnalystFilter] = useState("all");
            const [search, setSearch] = useState("");
            const reportRef = useRef(null);

            useEffect(() => {
                let isCurrent = true;
                setIsLoading(true);
                Promise.all([...(instructors || []).map(async instructorName => {
                    const loaded = await loadNotebookNotes(turma, instructorName);
                    return loaded.notes.map(note => ({ ...note, instructorSource: note.instructorName || instructorName }));
                }), loadVisibleAnalystNotes(turma, instructors || []).then(analystNotes => analystNotes.map(note => normalizeNotebookNote({
                    ...note,
                    id: `analyst_report_${note.id}`,
                    scope: "class",
                    studentName: `Instrutor acompanhado: ${note.instructorName}`,
                    situationTypes: [note.followupType],
                    responsibleAnalyst: note.analystName,
                    treatmentStatus: note.trackingStatus === "resolvido" ? "concluida" : note.trackingStatus === "aguardando_retorno" ? "aguardando_retorno" : note.trackingStatus === "cancelado" ? "cancelada" : "em_tratativa",
                    treatmentStartDate: note.periodStart || note.date,
                    treatmentDueDate: note.reminderDate || note.periodEnd,
                    notes: [note.subject, note.notes].filter(Boolean).join("\n\n"),
                    instructorSource: note.instructorName,
                    sourceType: "analyst_followup",
                    score: null
                }))).then(items => items.filter(Boolean))]).then(groups => {
                    if (!isCurrent) return;
                    const unique = new Map();
                    groups.flat().forEach(note => unique.set(`${note.instructorSource}_${note.id}`, note));
                    setNotes(Array.from(unique.values()).sort((a, b) => new Date(b.date) - new Date(a.date)));
                    setIsLoading(false);
                }).catch(error => {
                    console.error("Erro ao gerar relatório do caderno", error);
                    if (isCurrent) setIsLoading(false);
                });
                return () => { isCurrent = false; };
            }, [turma, instructors]);

            const filteredNotes = notes.filter(note => {
                const state = getNotebookTreatmentState(note);
                if (filter === "open" && !["open", "today"].includes(state)) return false;
                if (filter === "overdue" && state !== "overdue") return false;
                if (filter === "class" && note.scope !== "class") return false;
                if (filter === "student" && note.scope === "class") return false;
                if (statusFilter !== "all" && (note.treatmentStatus || "em_tratativa") !== statusFilter) return false;
                if (analystFilter !== "all" && (note.responsibleAnalyst || "Não informado") !== analystFilter) return false;
                if (search.trim()) {
                    const haystack = normalizeText([note.studentName, note.notes, getNotebookSituationLabel(note), note.responsibleAnalyst, note.instructorSource].join(" "));
                    if (!haystack.includes(normalizeText(search))) return false;
                }
                return true;
            });

            const copyReport = async () => {
                const content = reportRef.current;
                if (!content) return;
                const html = content.innerHTML;
                const text = content.innerText;
                const done = () => alert("Relatório de anotações copiado. Cole no Outlook ou em outro documento.");
                try {
                    if (navigator.clipboard && window.ClipboardItem) {
                        await navigator.clipboard.write([new ClipboardItem({
                            "text/html": new Blob([html], { type: "text/html" }),
                            "text/plain": new Blob([text], { type: "text/plain" })
                        })]);
                        done();
                        return;
                    }
                } catch (error) { /* usa o fallback abaixo */ }
                const range = document.createRange();
                range.selectNodeContents(content);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                try { document.execCommand("copy"); done(); } finally { selection.removeAllRanges(); }
            };

            const printReport = () => {
                const content = reportRef.current;
                if (!content) return;
                const printWindow = window.open("", "_blank");
                if (!printWindow) return;
                printWindow.document.write(`<html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório de Anotações - ${turma}</title><style>body{font-family:Arial,sans-serif;color:#243447;padding:24px}h1{color:#004587;font-size:20px}h2{font-size:14px;color:#666;border-bottom:2px solid #f5821f;padding-bottom:8px}.note{border:1px solid #d9e2ec;border-left:4px solid #004587;border-radius:6px;padding:12px;margin:10px 0;break-inside:avoid}.meta{font-size:11px;color:#5f6b76;margin-bottom:6px}.tag{display:inline-block;background:#eef5fb;color:#004587;border-radius:4px;padding:3px 6px;margin-right:4px;font-size:10px;font-weight:bold}.due{color:#b45309}.overdue{color:#b91c1c}</style></head><body><h1>Relatório de Anotações do Caderno</h1><h2>Turma ${turma} | Emitido em ${formatNotebookDate(new Date())}</h2>${content.innerHTML}</body></html>`);
                printWindow.document.close();
                printWindow.focus();
                setTimeout(() => printWindow.print(), 250);
            };

            const totalOpen = notes.filter(note => ["open", "today"].includes(getNotebookTreatmentState(note))).length;
            const totalOverdue = notes.filter(note => getNotebookTreatmentState(note) === "overdue").length;

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="bg-white w-full max-w-5xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
                        <div className="bg-senac-blue p-4 text-white flex justify-between items-center shrink-0">
                            <div><h2 className="text-xl font-bold flex items-center gap-2"><IconFileText className="w-6 h-6" /> Relatório de Anotações</h2><p className="text-xs text-blue-100 mt-1">Chamados, pontos de atenção e registros da turma {turma}</p></div>
                            <button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full"><IconXCircle className="w-6 h-6" /></button>
                        </div>
                        <div className="p-4 bg-gray-50 border-b border-gray-200 grid grid-cols-1 md:grid-cols-5 gap-2">
                            <select value={filter} onChange={(e) => setFilter(e.target.value)} className="p-2 border border-gray-300 rounded text-xs"><option value="all">Todas as anotações</option><option value="open">Tratativas em aberto</option><option value="overdue">Tratativas vencidas</option><option value="class">Somente turma</option><option value="student">Somente alunos</option></select>
                            <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="p-2 border border-gray-300 rounded text-xs"><option value="all">Todos os status</option>{NOTEBOOK_TREATMENT_STATUS_OPTIONS.map(option => <option key={option.value} value={option.value}>{option.label}</option>)}</select>
                            <select value={analystFilter} onChange={(e) => setAnalystFilter(e.target.value)} className="p-2 border border-gray-300 rounded text-xs"><option value="all">Todos os analistas</option>{NOTEBOOK_ANALYST_OPTIONS.map(analyst => <option key={analyst} value={analyst}>{analyst}</option>)}<option value="Não informado">Sem analista</option></select>
                            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Buscar aluno, assunto ou anotação" className="p-2 border border-gray-300 rounded text-xs md:col-span-2" />
                        </div>
                        <div className="px-4 py-3 flex flex-wrap items-center justify-between gap-2 border-b border-gray-100 text-xs"><div className="flex gap-2"><span className="rounded bg-blue-50 text-blue-700 px-2 py-1 font-bold">Total: {notes.length}</span><span className="rounded bg-orange-50 text-orange-700 px-2 py-1 font-bold">Em aberto: {totalOpen}</span><span className="rounded bg-red-50 text-red-700 px-2 py-1 font-bold">Vencidas: {totalOverdue}</span></div><div className="flex gap-2"><button onClick={copyReport} className="px-3 py-2 rounded border border-senac-blue text-senac-blue font-bold hover:bg-blue-50">Copiar relatório</button><button onClick={printReport} className="px-3 py-2 rounded bg-senac-blue text-white font-bold hover:bg-blue-800">Imprimir / PDF</button></div></div>
                        <div ref={reportRef} className="p-5 overflow-y-auto custom-scrollbar bg-white">
                            {isLoading ? <div className="py-12 text-center text-sm text-gray-500">Carregando anotações dos cadernos...</div> : filteredNotes.length === 0 ? <div className="py-12 text-center text-sm text-gray-500">Nenhuma anotação encontrada para os filtros selecionados.</div> : filteredNotes.map(note => {
                                const treatmentState = getNotebookTreatmentState(note);
                                const stateClass = treatmentState === "overdue" ? "overdue" : treatmentState === "today" ? "due" : "";
                                return <div key={`${note.instructorSource}_${note.id}`} className="note border border-gray-200 border-l-4 border-l-senac-blue rounded-lg p-3 mb-3">
                                    <div className="flex flex-wrap justify-between gap-2"><div className="font-bold text-sm text-gray-800">{note.scope === "class" ? "Turma toda" : note.studentName}</div><div className="meta">Registro: {formatNotebookDate(note.date)}</div></div>
                                    <div className="mt-2 flex flex-wrap gap-1"><span className="tag">{getNotebookSituationLabel(note)}</span><span className="tag">Instrutor: {note.instructorSource || "Não informado"}</span><span className="tag">Analista: {note.responsibleAnalyst || "Não informado"}</span>{note.urgency && <span className="tag">Urgência: {note.urgency}</span>}<span className={`inline-block rounded border px-2 py-1 text-[10px] font-bold ${getNotebookStatusMeta(note).className}`}>Status: {getNotebookStatusMeta(note).label}</span></div>
                                    <div className={`meta mt-2 ${stateClass}`}>{getNotebookTreatmentDue(note) ? `${getNotebookTreatmentLabel(note)} | Início: ${formatNotebookDate(getNotebookTreatmentStart(note))}` : "Sem período de tratativa definido"}</div>
                                    {note.notes && <div className="text-sm text-gray-700 whitespace-pre-wrap mt-2">{note.notes}</div>}
                                    {getNotebookTreatmentDue(note) && <button type="button" onClick={() => openNotebookTreatmentInOutlook(note, turma, note.instructorSource)} className="mt-3 text-xs font-bold text-senac-blue hover:underline">Abrir prazo no Outlook</button>}
                                </div>;
                            })}
                        </div>
                        <div className="bg-gray-50 p-4 border-t border-gray-100 flex justify-end"><button onClick={onClose} className="px-5 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg font-bold text-sm">Fechar</button></div>
                    </div>
                </div>
            );
        };

        const RECOVERY_STATUS_OPTIONS = [
            { value: "open", label: "Aberta" }, { value: "contacted", label: "Contato realizado" }, { value: "waiting", label: "Aguardando estudante" }, { value: "evaluation", label: "Em avaliação" }, { value: "closed", label: "Concluída" }, { value: "cancelled", label: "Cancelada" }
        ];
        const RECOVERY_OUTCOME_OPTIONS = [
            { value: "pending", label: "Ainda não avaliado" }, { value: "developed", label: "Recuperou / Desenvolveu" }, { value: "not-developed", label: "Não desenvolveu" }, { value: "reopened", label: "Reaberta" }
        ];
        const recoveryStatusLabel = value => (RECOVERY_STATUS_OPTIONS.find(item => item.value === value) || { label: value }).label;
        const recoveryOutcomeLabel = value => (RECOVERY_OUTCOME_OPTIONS.find(item => item.value === value) || { label: value }).label;

        const StudentRecoveryManager = ({ data, student, records, storageSource, onSaved }) => {
            const studentRecords = (records || []).filter(record => recoveryBelongsToStudent(record, student)).sort((a, b) => b.number - a.number);
            const [editing, setEditing] = useState(null);
            const [saving, setSaving] = useState(false);
            const nextNumber = studentRecords.reduce((max, item) => Math.max(max, Number(item.number || 0)), 0) + 1;
            const begin = record => setEditing(record ? { ...record } : normalizeRecoveryRecord({
                id: `recovery_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
                classId: getValidTurmaNumber(data.turma), studentId: String(student.id), studentKey: normalizeName(student.name), studentName: student.name,
                uc: (student.failed_perf_ucs || [])[0] || data.ucs[0] || "", number: nextNumber, reason: "", start: notebookDateInput(new Date()), end: notebookDateInput(new Date(Date.now() + 7 * 86400000)), status: "open", outcome: "pending", assignedTo: (data.instructors || []).join(" / ") || data.tutor1 || ""
            }));
            const save = async () => {
                if (!editing.reason.trim() || !editing.start || !editing.end) return alert("Informe o motivo e as datas da recuperação.");
                setSaving(true);
                const closed = editing.status === "closed" || editing.outcome === "developed";
                const result = await persistRecoveryRecord({ ...editing, status: closed ? "closed" : editing.status, outcome: editing.outcome, closedAt: closed ? (editing.closedAt || notebookDateInput(new Date())) : "" });
                onSaved(result.record, result.source);
                setEditing(null);
                setSaving(false);
            };
            const markRecovered = async record => {
                setSaving(true);
                const result = await persistRecoveryRecord({ ...record, status: "closed", outcome: "developed", closedAt: notebookDateInput(new Date()), notes: [record.notes, "Recuperação concluída com desenvolvimento."].filter(Boolean).join("\n") });
                onSaved(result.record, result.source);
                setSaving(false);
            };
            return <div className="mb-6 overflow-hidden rounded-xl border border-red-200 bg-red-50/40">
                <div className="flex flex-wrap items-center justify-between gap-2 border-b border-red-200 bg-red-50 px-4 py-3"><div><h3 className="flex items-center gap-2 text-sm font-bold text-red-800"><IconRefreshCw className="h-4 w-4" /> Histórico de recuperação</h3><p className="mt-1 text-[10px] text-red-700">Vinculado à turma {getValidTurmaNumber(data.turma)} e ao aluno. {storageSource === "cloud" ? "Compartilhado no Firebase." : "Cópia local."}</p></div><button type="button" onClick={() => begin(null)} className="rounded-md bg-red-700 px-3 py-2 text-xs font-bold text-white hover:bg-red-800"><IconPlus className="mr-1 inline h-3.5 w-3.5" /> Abrir Recuperação {nextNumber}</button></div>
                <div className="space-y-3 p-4">
                    {editing && <div className="rounded-lg border border-red-200 bg-white p-4"><div className="mb-3 font-bold text-red-800">Recuperação {editing.number}</div><div className="grid grid-cols-1 gap-3 md:grid-cols-2"><label className="text-xs font-bold text-gray-600">UC<select value={editing.uc} onChange={event => setEditing(current => ({ ...current, uc: event.target.value }))} className="mt-1 w-full rounded border border-gray-300 p-2 font-normal">{(data.ucs || []).map(uc => <option key={uc}>{uc}</option>)}</select></label><label className="text-xs font-bold text-gray-600">Motivo<input value={editing.reason} onChange={event => setEditing(current => ({ ...current, reason: event.target.value }))} className="mt-1 w-full rounded border border-gray-300 p-2 font-normal" placeholder="Motivo da recuperação" /></label><label className="text-xs font-bold text-gray-600">Data de abertura<input type="date" value={editing.start} onChange={event => setEditing(current => ({ ...current, start: event.target.value }))} className="mt-1 w-full rounded border border-gray-300 p-2 font-normal" /></label><label className="text-xs font-bold text-gray-600">Prazo / fechamento previsto<input type="date" value={editing.end} onChange={event => setEditing(current => ({ ...current, end: event.target.value }))} className="mt-1 w-full rounded border border-gray-300 p-2 font-normal" /></label><label className="text-xs font-bold text-gray-600">Status<select value={editing.status} onChange={event => setEditing(current => ({ ...current, status: event.target.value }))} className="mt-1 w-full rounded border border-gray-300 p-2 font-normal">{RECOVERY_STATUS_OPTIONS.map(option => <option key={option.value} value={option.value}>{option.label}</option>)}</select></label><label className="text-xs font-bold text-gray-600">Resultado<select value={editing.outcome} onChange={event => setEditing(current => ({ ...current, outcome: event.target.value }))} className="mt-1 w-full rounded border border-gray-300 p-2 font-normal">{RECOVERY_OUTCOME_OPTIONS.map(option => <option key={option.value} value={option.value}>{option.label}</option>)}</select></label><label className="text-xs font-bold text-gray-600 md:col-span-2">Orientações e observações<textarea value={editing.notes} onChange={event => setEditing(current => ({ ...current, notes: event.target.value }))} rows="3" className="mt-1 w-full rounded border border-gray-300 p-2 font-normal" /></label></div><div className="mt-3 flex justify-end gap-2"><button type="button" onClick={() => setEditing(null)} className="rounded border border-gray-300 px-3 py-2 text-xs font-bold text-gray-600">Cancelar</button><button type="button" onClick={save} disabled={saving} className="rounded bg-senac-blue px-3 py-2 text-xs font-bold text-white disabled:opacity-50"><IconSave className="mr-1 inline h-3.5 w-3.5" /> Salvar</button></div></div>}
                    {studentRecords.length === 0 ? <div className="py-4 text-center text-xs text-gray-500">Nenhuma recuperação registrada para este aluno.</div> : studentRecords.map(record => { const open = RECOVERY_OPEN_STATUSES.includes(record.status); return <div key={record.id} className="rounded-lg border border-gray-200 bg-white p-3 text-xs"><div className="flex flex-wrap items-start justify-between gap-2"><div><strong className="text-senac-blue">Recuperação {record.number} · {record.uc || "UC não informada"}</strong><div className="mt-1 text-gray-500">{record.reason}</div></div><div className="flex gap-1"><span className={`rounded px-2 py-1 font-bold ${open ? "bg-red-100 text-red-700" : "bg-green-100 text-green-700"}`}>{recoveryStatusLabel(record.status)}</span><span className="rounded bg-gray-100 px-2 py-1 font-bold text-gray-700">{recoveryOutcomeLabel(record.outcome)}</span></div></div><div className="mt-2 text-gray-500">Abertura: {formatNotebookDate(record.start)} · Prazo: {formatNotebookDate(record.end)}{record.closedAt ? ` · Fechamento: ${formatNotebookDate(record.closedAt)}` : ""}</div>{record.notes && <div className="mt-2 whitespace-pre-wrap text-gray-700">{record.notes}</div>}<div className="mt-3 flex flex-wrap justify-end gap-2"><button type="button" onClick={() => begin(record)} className="text-xs font-bold text-senac-blue hover:underline">Editar</button>{open && <button type="button" onClick={() => markRecovered(record)} disabled={saving} className="rounded bg-green-700 px-2 py-1 text-xs font-bold text-white disabled:opacity-50">Marcar como recuperou</button>}</div></div>; })}
                </div>
            </div>;
        };

        const StudentReportOptionsModal = ({ data, student, activityTracking, naJustifications, notebookNotes, recoveries = [], mode = "complete", onClose }) => {
            const [options, setOptions] = useState(() => ({
                studentContact: false,
                supervisorContact: false,
                justifications: false,
                academic: false,
                notebook: false,
                activities: false,
                recoveries: false
            }));
            const toggleOption = key => setOptions(current => ({ ...current, [key]: !current[key] }));
            const reportOptions = [
                ["studentContact", "Atualização de contato do aluno", "Nome, telefone e e-mail do aluno."],
                ["supervisorContact", "Atualização de contato do supervisor", "Nome, telefone e e-mail do supervisor."],
                ["justifications", "Justificativas e faltas NA", "Registros NA, status da justificativa e motivo informado."],
                ["academic", "Frequência, desempenho e situação", "Status cadastral, frequência e detalhamento por UC."],
                ["notebook", "Anotações do caderno do instrutor", "Chamados, pontos de atenção e tratativas."],
                ["activities", "Atividades do upload atual", "NC, em branco e requer avaliação. Não fica gravado na turma."],
                ["recoveries", "Histórico de recuperações", "Recuperação 1, 2, 3, motivos, datas, status e resultados."]
            ];
            const generate = () => {
                generateStudentSituationReport({
                    student,
                    turma: data.turma,
                    course: data.course,
                    instructors: data.instructors || [],
                    tutor1: data.tutor1,
                    tutor2: data.tutor2,
                    activityTracking,
                    reportData: data,
                    naJustifications,
                    notebookNotes,
                    recoveries,
                    options
                });
                onClose();
            };
            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" onClick={event => { if (event.target === event.currentTarget) onClose(); }}>
                    <div className="bg-white w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="bg-senac-blue p-5 text-white flex justify-between items-center"><div><h2 className="text-xl font-bold flex items-center gap-2"><IconFileText className="w-6 h-6" /> {mode === "activities" ? "Relatório de atividades" : "Emitir relatório do aluno"}</h2><p className="text-xs text-blue-100 mt-1">Escolha as informações que deseja enviar.</p></div><button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full"><IconXCircle className="w-6 h-6" /></button></div>
                        <div className="p-5 overflow-y-auto custom-scrollbar bg-gray-50"><div className="bg-white border border-gray-200 rounded-xl p-4 mb-4"><div className="text-sm font-bold text-gray-800">{student.name}</div><div className="text-xs text-gray-500 mt-1">Turma {data.turma}</div></div><div className="space-y-2">{reportOptions.map(([key, title, description]) => <label key={key} className={`flex items-start gap-3 rounded-lg border p-3 cursor-pointer ${options[key] ? "border-blue-300 bg-blue-50" : "border-gray-200 bg-white"}`}><input type="checkbox" checked={Boolean(options[key])} onChange={() => toggleOption(key)} className="mt-0.5 rounded text-senac-blue" /><span><span className="block text-sm font-bold text-gray-700">{title}</span><span className="block text-xs text-gray-500 mt-1">{description}</span></span></label>)}</div><div className="mt-4 rounded-lg border border-orange-200 bg-orange-50 px-3 py-2 text-xs text-orange-900"><strong>Importante:</strong> os contatos, justificativas, anotações e alterações ficam vinculados à turma. As informações de atividades são somente do upload atual e não são gravadas.</div></div>
                        <div className="bg-white p-4 border-t border-gray-200 flex justify-end gap-2"><button onClick={onClose} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-bold text-sm">Cancelar</button><button onClick={generate} disabled={!Object.values(options).some(Boolean)} className="px-5 py-2 bg-senac-blue text-white rounded-lg font-bold text-sm disabled:opacity-50"><IconPrinter className="w-4 h-4 inline-block mr-1" /> Emitir relatório</button></div>
                    </div>
                </div>
            );
        };

        const UCIntervalReportModal = ({ data, activityTracking, naJustifications, notebookNotes, onClose }) => {
            const ucOptions = useMemo(() => [...(data && data.ucs || [])].filter(uc => getUCNumber(uc) !== null).sort((a, b) => getUCNumber(a) - getUCNumber(b)), [data]);
            const [fromUC, setFromUC] = useState("");
            const [toUC, setToUC] = useState("");
            const [scope, setScope] = useState("class");
            const [selectedIds, setSelectedIds] = useState([]);
            const [search, setSearch] = useState("");
            const [statusFilter, setStatusFilter] = useState("all");
            const [reportOptions, setReportOptions] = useState({ academic: true, activities: true, attendance: true, notebook: true });

            useEffect(() => {
                if (ucOptions.length > 0) {
                    setFromUC(current => current || ucOptions[0]);
                    setToUC(current => current || ucOptions[ucOptions.length - 1]);
                }
            }, [ucOptions]);

            const matchesStatus = (student) => statusFilter === "all"
                || (statusFilter === "attention" && !student.is_dropout && !student.is_process_dropout && (student.needs_recuperacao || student.needs_conselho))
                || (statusFilter === "active" && !student.is_dropout && !student.is_process_dropout)
                || (statusFilter === "process" && student.is_process_dropout)
                || (statusFilter === "dropout" && student.is_dropout);
            const scopedStudents = (data && data.students || []).filter(matchesStatus);
            const visibleStudents = scopedStudents.filter(student => normalizeText(`${student.name} ${student.orionCode || ""}`).includes(normalizeText(search)));
            const toggleStudent = (id) => setSelectedIds(current => current.includes(id) ? current.filter(item => item !== id) : [...current, id]);
            const selectVisible = () => setSelectedIds(current => {
                const visibleIds = visibleStudents.map(student => student.id);
                const allSelected = visibleIds.length > 0 && visibleIds.every(id => current.includes(id));
                return allSelected ? current.filter(id => !visibleIds.includes(id)) : [...new Set([...current, ...visibleIds])];
            });
            const reportIds = scope === "class" ? scopedStudents.map(student => student.id) : selectedIds.filter(id => scopedStudents.some(student => student.id === id));

            const generate = () => generateRangeReport({
                selectedStudentIds: reportIds,
                students: data.students,
                turma: data.turma,
                course: data.course,
                instructors: data.instructors || [],
                tutor1: data.tutor1 || "Não Identificado",
                tutor2: data.tutor2 || "Não Identificado",
                activityTracking,
                reportData: data,
                naJustifications,
                notebookNotes,
                fromUC,
                toUC,
                options: reportOptions
            });

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="bg-white w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
                        <div className="bg-senac-blue p-4 text-white flex justify-between items-center shrink-0"><div><h2 className="text-xl font-bold flex items-center gap-2"><IconFileText className="w-6 h-6" /> Relatório por intervalo de UCs</h2><p className="text-xs text-blue-100 mt-1">Frequência, desempenho, chamada, atividades, situações e caderno.</p></div><button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full"><IconXCircle className="w-6 h-6" /></button></div>
                        <div className="p-5 overflow-y-auto custom-scrollbar bg-gray-50">
                            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-4">
                                <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Intervalo de Unidades Curriculares</label>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3"><label className="text-xs font-bold text-gray-600">Da UC<select value={fromUC} onChange={(e) => setFromUC(e.target.value)} className="mt-1 w-full p-2 border border-gray-300 rounded text-sm font-normal">{ucOptions.map(uc => <option key={`from-${uc}`} value={uc}>{uc}</option>)}</select></label><label className="text-xs font-bold text-gray-600">Até a UC<select value={toUC} onChange={(e) => setToUC(e.target.value)} className="mt-1 w-full p-2 border border-gray-300 rounded text-sm font-normal">{ucOptions.map(uc => <option key={`to-${uc}`} value={uc}>{uc}</option>)}</select></label></div>
                                <p className="text-[11px] text-gray-500 mt-2">O relatório incluirá todas as UCs entre a inicial e a final, mesmo que sejam escolhidas em ordem inversa.</p>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-4">
                                <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Filtros do relatório</label>
                                <select value={statusFilter} onChange={event => setStatusFilter(event.target.value)} className="mb-3 w-full rounded border border-gray-300 p-2 text-sm"><option value="all">Todas as situações</option><option value="active">Alunos ativos</option><option value="attention">Somente pontos de atenção</option><option value="process">Em processo de desligamento</option><option value="dropout">Evadidos/desligados</option></select>
                                <div className="grid grid-cols-1 gap-2 sm:grid-cols-2">{[["academic", "Frequência e desempenho"], ["activities", "Atividades"], ["attendance", "Chamada e NA"], ["notebook", "Caderno do instrutor"]].map(([key, label]) => <label key={key} className="flex cursor-pointer items-center gap-2 rounded border border-gray-200 px-3 py-2 text-xs font-semibold text-gray-700"><input type="checkbox" checked={Boolean(reportOptions[key])} onChange={() => setReportOptions(current => ({ ...current, [key]: !current[key] }))} className="rounded text-senac-blue" />{label}</label>)}</div>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-4">
                                <label className="block text-xs font-bold text-gray-500 uppercase mb-2">Alcance do relatório</label>
                                <div className="grid grid-cols-2 gap-2" role="radiogroup" aria-label="Alcance do relatório"><button type="button" onClick={() => setScope("class")} className={`py-3 rounded-lg text-sm font-bold border ${scope === "class" ? "bg-orange-50 text-senac-orange border-senac-orange ring-2 ring-orange-100" : "bg-gray-50 text-gray-500 border-gray-200"}`}><IconUsers className="w-4 h-4 inline-block mr-1" /> Turma inteira</button><button type="button" onClick={() => setScope("students")} className={`py-3 rounded-lg text-sm font-bold border ${scope === "students" ? "bg-blue-50 text-senac-blue border-senac-blue ring-2 ring-blue-100" : "bg-gray-50 text-gray-500 border-gray-200"}`}><IconUser className="w-4 h-4 inline-block mr-1" /> Alunos selecionados</button></div>
                                {scope === "class" ? <div className="mt-3 rounded-lg bg-orange-50 border border-orange-200 px-3 py-2 text-xs text-orange-800">Serão incluídos {scopedStudents.length} aluno(s), conforme o filtro de situação.</div> : <div className="mt-3"><div className="flex flex-wrap justify-between items-center gap-2 mb-2"><input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Buscar aluno ou Órion" className="p-2 border border-gray-300 rounded text-xs flex-1 min-w-[180px]" /><button type="button" onClick={selectVisible} className="px-3 py-2 border border-senac-blue text-senac-blue rounded text-xs font-bold">Selecionar visíveis</button></div><div className="max-h-56 overflow-y-auto border border-gray-200 rounded-lg bg-gray-50 p-2 space-y-1">{visibleStudents.map(student => <label key={student.id} className="flex items-center gap-2 rounded px-2 py-1.5 text-xs hover:bg-white cursor-pointer"><input type="checkbox" checked={selectedIds.includes(student.id)} onChange={() => toggleStudent(student.id)} className="rounded text-senac-blue" /><span>{student.name}{student.orionCode ? ` | Órion ${student.orionCode}` : ""}</span></label>)}{visibleStudents.length === 0 && <div className="p-4 text-center text-xs text-gray-500">Nenhum aluno encontrado.</div>}</div><div className="text-xs text-gray-500 mt-2">{reportIds.length} aluno(s) selecionado(s) dentro do filtro.</div></div>}
                            </div>
                            <div className="rounded-lg border border-blue-200 bg-blue-50 px-3 py-3 text-xs text-blue-900"><strong>O relatório reunirá:</strong> frequência média e detalhada por UC, desempenho, baixa frequência, recuperação, observações, NA pendentes, atividades, situações cadastrais e anotações do caderno.</div>
                        </div>
                        <div className="bg-white p-4 border-t border-gray-200 flex justify-between items-center gap-3"><span className="text-xs text-gray-500">{reportIds.length} aluno(s) no relatório</span><div className="flex gap-2"><button onClick={onClose} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-bold text-sm">Cancelar</button><button onClick={generate} disabled={!fromUC || !toUC || reportIds.length === 0 || !Object.values(reportOptions).some(Boolean)} className="px-5 py-2 bg-senac-blue text-white rounded-lg font-bold text-sm disabled:opacity-50"><IconPrinter className="w-4 h-4 inline-block mr-1" /> Emitir relatório</button></div></div>
                    </div>
                </div>
            );
        };

        const HistoryBars = ({ title, history, getValue, color = "#004587" }) => {
            const points = (history || []).slice(-12);
            const values = points.map(item => Number(getValue(item) || 0));
            const max = Math.max(1, ...values);
            if (points.length === 0) return <div className="rounded-lg border border-dashed border-gray-200 p-6 text-center text-xs text-gray-400">Ainda não há leituras históricas para este gráfico.</div>;
            return (
                <div className="rounded-lg border border-gray-200 bg-white p-3">
                    <div className="mb-3 flex items-center justify-between gap-2"><h3 className="text-xs font-bold uppercase text-gray-600">{title}</h3><span className="text-[10px] text-gray-400">Últimas {points.length} leituras</span></div>
                    <div className="flex h-36 items-end gap-2 border-b border-l border-gray-200 px-2 pb-1 pt-3">
                        {points.map((item, index) => {
                            const value = values[index];
                            const height = value > 0 ? Math.max(8, Math.round((value / max) * 100)) : 3;
                            return <div key={item.id || `${item.capturedAt}-${index}`} className="flex h-full min-w-0 flex-1 flex-col items-center justify-end gap-1" title={`${formatHistoryDate(item.capturedAt)}: ${value}`}><span className="text-[10px] font-bold text-gray-600">{value}</span><div className="w-full max-w-[28px] rounded-t" style={{ height: `${height}%`, backgroundColor: color }}></div><span className="w-12 truncate text-center text-[9px] text-gray-400">{formatHistoryDate(item.capturedAt)}</span></div>;
                        })}
                    </div>
                </div>
            );
        };

        const formatHistoryDate = (value) => {
            const parsed = new Date(value);
            return Number.isNaN(parsed.getTime()) ? "--/--" : parsed.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
        };

        const DashboardHistoryModal = ({ data, history, onClose }) => {
            const studentOptions = useMemo(() => (data && data.students || []).map(student => ({ key: normalizeName(student.name), name: student.name })), [data]);
            const [selectedStudentKey, setSelectedStudentKey] = useState(() => studentOptions[0] ? studentOptions[0].key : "");
            const orderedHistory = useMemo(() => [...(history || [])].sort((a, b) => new Date(a.capturedAt) - new Date(b.capturedAt)), [history]);
            const selectedStudent = studentOptions.find(student => student.key === selectedStudentKey) || studentOptions[0];
            const studentHistory = orderedHistory.map(snapshot => ({ snapshot, metric: selectedStudent && snapshot.students ? snapshot.students[selectedStudent.key] : null })).filter(item => item.metric);
            const latest = orderedHistory[orderedHistory.length - 1];
            const latestClass = latest && latest.class ? latest.class : {};
            const latestStudent = studentHistory.length > 0 ? studentHistory[studentHistory.length - 1].metric : null;
            const latestActivityUCs = Object.entries(latestClass.activityByUC || {}).sort((a, b) => (getUCNumber(a[0]) || 999) - (getUCNumber(b[0]) || 999));

            const printHistoryReport = () => {
                const rows = orderedHistory.map(snapshot => {
                    const metric = selectedStudent && snapshot.students ? snapshot.students[selectedStudent.key] : null;
                    return `<tr><td>${escapeReportHTML(formatHistoryDate(snapshot.capturedAt))}</td><td>${escapeReportHTML(snapshot.trigger || "Leitura")}</td><td>${snapshot.class && snapshot.class.naPending || 0}</td><td>${snapshot.class && snapshot.class.activityPending || 0}</td><td>${metric ? metric.naPending : "-"}</td><td>${metric ? metric.activityPending : "-"}</td><td>${metric ? escapeReportHTML(metric.status) : "-"}</td></tr>`;
                }).join("");
                const reportWindow = window.open("", "_blank");
                if (!reportWindow) { alert("Não foi possível abrir o relatório histórico. Verifique o bloqueio de pop-ups."); return; }
                reportWindow.document.write(`<html lang="pt-BR"><head><meta charset="UTF-8"><title>Histórico da turma ${escapeReportHTML(data.turma)}</title><style>body{font-family:Arial,sans-serif;color:#243447;padding:24px}h1,h2{color:#004587}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:16px}th,td{border:1px solid #d9e2ec;padding:7px;text-align:left}th{background:#eef5fb;color:#004587}.summary{background:#f8fafc;border-left:4px solid #F5821F;padding:10px;margin:12px 0}@media print{button{display:none}}</style></head><body><button onclick="window.print()">Imprimir / PDF</button><h1>Histórico de acompanhamento</h1><p><strong>Turma:</strong> ${escapeReportHTML(data.turma)}<br><strong>Aluno selecionado:</strong> ${escapeReportHTML(selectedStudent ? selectedStudent.name : "Turma inteira")}</p><div class="summary"><strong>Última leitura da turma:</strong> ${escapeReportHTML(formatHistoryDate(latest && latest.capturedAt))} | NA pendente(s): ${latestClass.naPending || 0} | Pendências de atividades: ${latestClass.activityPending || 0}</div><table><thead><tr><th>Data</th><th>Origem</th><th>NA turma</th><th>Atividades turma</th><th>NA aluno</th><th>Atividades aluno</th><th>Status aluno</th></tr></thead><tbody>${rows || `<tr><td colspan="7">Nenhuma leitura registrada.</td></tr>`}</tbody></table></body></html>`);
                reportWindow.document.close();
            };

            return (
                <div className="fixed inset-0 z-[65] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" onClick={event => { if (event.target === event.currentTarget) onClose(); }}>
                    <div className="flex max-h-[92vh] w-full max-w-6xl flex-col overflow-hidden rounded-2xl bg-white shadow-2xl">
                        <div className="flex shrink-0 items-center justify-between bg-senac-blue p-5 text-white"><div><h2 className="flex items-center gap-2 text-xl font-bold"><IconBarChart2 className="h-6 w-6" /> Histórico de acompanhamento</h2><p className="mt-1 text-xs text-blue-100">Evolução das pendências de chamada, atividades e tratativas.</p></div><button onClick={onClose} className="rounded-full p-1 hover:bg-white/20"><IconXCircle className="h-7 w-7" /></button></div>
                        <div className="flex-1 overflow-y-auto bg-gray-50 p-5 custom-scrollbar">
                            <div className="mb-4 rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 text-xs text-blue-900"><strong>Como funciona:</strong> cada leitura da frequência, upload de atividades ou alteração de justificativa registra uma fotografia da situação naquele momento. O upload atual continua não sendo usado como cadastro permanente.</div>
                            {orderedHistory.length === 0 ? <div className="rounded-xl border-2 border-dashed border-gray-200 bg-white p-12 text-center text-sm text-gray-500">Ainda não há histórico. Faça uma leitura da frequência ou carregue uma planilha de atividades.</div> : <>
                                <div className="mb-4 grid grid-cols-2 gap-3 md:grid-cols-4"><div className="rounded-lg border border-gray-200 bg-white p-3"><div className="text-[10px] font-bold uppercase text-gray-400">Leituras</div><div className="mt-1 text-2xl font-bold text-senac-blue">{orderedHistory.length}</div></div><div className="rounded-lg border border-gray-200 bg-white p-3"><div className="text-[10px] font-bold uppercase text-gray-400">NA atuais</div><div className="mt-1 text-2xl font-bold text-red-700">{latestClass.naPending || 0}</div></div><div className="rounded-lg border border-gray-200 bg-white p-3"><div className="text-[10px] font-bold uppercase text-gray-400">Atividades pendentes</div><div className="mt-1 text-2xl font-bold text-orange-700">{latestClass.activityPending || 0}</div></div><div className="rounded-lg border border-gray-200 bg-white p-3"><div className="text-[10px] font-bold uppercase text-gray-400">Tratativas abertas</div><div className="mt-1 text-2xl font-bold text-blue-700">{latestClass.treatmentOpen || 0}</div></div></div>
                                <div className="mb-4 grid grid-cols-1 gap-4 lg:grid-cols-3"><HistoryBars title="NA pendentes da turma" history={orderedHistory} getValue={snapshot => snapshot.class && snapshot.class.naPending} color="#dc2626" /><HistoryBars title="Atividades pendentes da turma" history={orderedHistory} getValue={snapshot => snapshot.class && snapshot.class.activityPending} color="#f5821f" /><HistoryBars title="Tratativas abertas da turma" history={orderedHistory} getValue={snapshot => snapshot.class && snapshot.class.treatmentOpen} color="#2563eb" /></div>
                                {latestActivityUCs.length > 0 && <div className="mb-4 rounded-xl border border-gray-200 bg-white p-4"><div className="mb-3 flex flex-wrap items-center justify-between gap-2"><h3 className="text-sm font-bold text-gray-700">Última leitura de atividades por UC</h3><span className="text-[10px] text-gray-500">{(latestClass.activitySources || []).length} planilha(s) no conjunto atual</span></div><div className="grid grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-4">{latestActivityUCs.map(([uc, values]) => <div key={uc} className="rounded border border-gray-200 bg-gray-50 p-3 text-xs"><div className="font-bold text-senac-blue">{uc}</div><div className="mt-1 text-gray-600">{values.completed || 0} concluída(s) | <strong className="text-orange-700">{values.pending || 0} pendente(s)</strong></div></div>)}</div></div>}
                                <div className="rounded-xl border border-gray-200 bg-white p-4"><div className="mb-4 flex flex-wrap items-center justify-between gap-3"><div><h3 className="text-sm font-bold text-gray-700">Evolução por aluno</h3><p className="mt-1 text-xs text-gray-500">Selecione um aluno para consultar o histórico individual.</p></div><select value={selectedStudent ? selectedStudent.key : ""} onChange={event => setSelectedStudentKey(event.target.value)} className="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm outline-none focus:border-senac-blue">{studentOptions.map(student => <option key={student.key} value={student.key}>{student.name}</option>)}</select></div>{latestStudent && <><div className="mb-4 grid grid-cols-2 gap-3 md:grid-cols-4"><div className="rounded-lg bg-red-50 p-3 text-center"><div className="text-[10px] font-bold uppercase text-red-700">NA</div><div className="text-xl font-bold text-red-800">{latestStudent.naPending}</div></div><div className="rounded-lg bg-orange-50 p-3 text-center"><div className="text-[10px] font-bold uppercase text-orange-700">Atividades pendentes</div><div className="text-xl font-bold text-orange-800">{latestStudent.activityPending}</div></div><div className="rounded-lg bg-blue-50 p-3 text-center"><div className="text-[10px] font-bold uppercase text-blue-700">Tratativas abertas</div><div className="text-xl font-bold text-blue-800">{latestStudent.treatmentOpen}</div></div><div className="rounded-lg bg-gray-50 p-3 text-center"><div className="text-[10px] font-bold uppercase text-gray-500">Status</div><div className="mt-1 truncate text-sm font-bold text-gray-700">{latestStudent.status}</div></div></div>{Object.keys(latestStudent.activityByUC || {}).length > 0 && <div className="mb-4 flex flex-wrap gap-2">{Object.entries(latestStudent.activityByUC).map(([uc, values]) => <span key={uc} className="rounded bg-orange-50 px-2 py-1 text-[10px] font-bold text-orange-800">{uc}: {values.pending || 0} pendente(s)</span>)}</div>}</>}{studentHistory.length > 0 && <div className="grid grid-cols-1 gap-4 lg:grid-cols-3"><HistoryBars title="NA do aluno" history={studentHistory.map(item => item.snapshot)} getValue={snapshot => snapshot.students[selectedStudent.key] && snapshot.students[selectedStudent.key].naPending} color="#dc2626" /><HistoryBars title="Atividades pendentes do aluno" history={studentHistory.map(item => item.snapshot)} getValue={snapshot => snapshot.students[selectedStudent.key] && snapshot.students[selectedStudent.key].activityPending} color="#f5821f" /><HistoryBars title="Tratativas abertas do aluno" history={studentHistory.map(item => item.snapshot)} getValue={snapshot => snapshot.students[selectedStudent.key] && snapshot.students[selectedStudent.key].treatmentOpen} color="#2563eb" /></div>}<div className="mt-5 overflow-x-auto"><table className="w-full min-w-[720px] border-collapse text-xs"><thead><tr className="bg-gray-50 text-left text-gray-500"><th className="border border-gray-200 px-3 py-2">Data</th><th className="border border-gray-200 px-3 py-2">Origem</th><th className="border border-gray-200 px-3 py-2">NA turma</th><th className="border border-gray-200 px-3 py-2">Ativ. turma</th><th className="border border-gray-200 px-3 py-2">NA aluno</th><th className="border border-gray-200 px-3 py-2">Ativ. aluno</th><th className="border border-gray-200 px-3 py-2">Status</th></tr></thead><tbody>{orderedHistory.slice().reverse().map(snapshot => { const metric = selectedStudent && snapshot.students ? snapshot.students[selectedStudent.key] : null; return <tr key={snapshot.id}><td className="border border-gray-200 px-3 py-2">{formatHistoryDate(snapshot.capturedAt)}</td><td className="border border-gray-200 px-3 py-2">{snapshot.trigger}</td><td className="border border-gray-200 px-3 py-2 font-bold text-red-700">{snapshot.class && snapshot.class.naPending || 0}</td><td className="border border-gray-200 px-3 py-2 font-bold text-orange-700">{snapshot.class && snapshot.class.activityPending || 0}</td><td className="border border-gray-200 px-3 py-2">{metric ? metric.naPending : "-"}</td><td className="border border-gray-200 px-3 py-2">{metric ? metric.activityPending : "-"}</td><td className="border border-gray-200 px-3 py-2">{metric ? metric.status : "-"}</td></tr>; })}</tbody></table></div></div>
                            </>}
                        </div>
                        <div className="flex shrink-0 justify-end gap-2 border-t border-gray-200 bg-white p-4"><button onClick={onClose} className="rounded-lg border border-gray-300 px-4 py-2 text-sm font-bold text-gray-600 hover:bg-gray-50">Fechar</button><button onClick={printHistoryReport} disabled={orderedHistory.length === 0} className="rounded-lg bg-senac-blue px-5 py-2 text-sm font-bold text-white disabled:cursor-not-allowed disabled:opacity-50"><IconPrinter className="mr-1 inline-block h-4 w-4" /> Imprimir / PDF</button></div>
                    </div>
                </div>
            );
        };

        const findMetadata = (worksheet) => {
            if (!worksheet || !window.XLSX) return {};
            const data = window.XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            let foundTutor = null, foundTurma = null, foundCurso = null;
            for (let r = 0; r < Math.min(data.length, 25); r++) {
                const row = data[r];
                if (!row) continue;
                for (let c = 0; c < Math.min(row.length, 15); c++) {
                    const cellVal = String(row[c] || "").trim();
                    const lowerVal = cellVal.toLowerCase();
                    if (!foundTutor && (lowerVal.includes("tutor") || lowerVal.includes("instrutor") || lowerVal.includes("docente"))) {
                        if (cellVal.includes(":")) { const split = cellVal.split(":"); if (split[1] && split[1].trim().length > 2) foundTutor = split[1].trim(); }
                        if (!foundTutor) foundTutor = row[c+1] || row[c+2];
                    }
                    if (!foundTurma && lowerVal.includes("turma")) {
                        if (cellVal.includes(":")) { const split = cellVal.split(":"); if (split[1] && split[1].trim().length > 0) foundTurma = split[1].trim(); } 
                        else if (lowerVal.replace("turma", "").trim().length > 0) { foundTurma = cellVal.replace(/turma/i, "").trim(); } 
                        else { foundTurma = row[c+1] || row[c+2]; }
                    }
                    if (!foundCurso) {
                         if (lowerVal.startsWith("aprendizagem profissional") || (lowerVal.includes("curso") && cellVal.length > 15)) { foundCurso = cellVal; }
                    }
                }
            }
            if (!foundCurso && data[0] && data[0][4]) foundCurso = data[0][4]; 
            return { tutor: foundTutor, turma: foundTurma, curso: foundCurso };
        };

        const extractCellComments = (cell) => {
             if (!cell) return null;
             if (cell.c && Array.isArray(cell.c)) {
                 const texts = cell.c.map(comm => {
                     if (comm.t) return comm.t;
                     if (comm.r) { if(typeof comm.r === 'string') return comm.r; if(Array.isArray(comm.r)) return comm.r.map(run => run.t).join(""); }
                     return "";
                 }).filter(t => t && t.trim().length > 0);
                 if (texts.length > 0) return texts.join(" | ");
             }
             if (typeof cell.c === 'string') return cell.c;
             if (cell._comment) return String(cell._comment);
             if (cell.comment) return String(cell.comment);
             return null;
        };

        const normalizeName = (str) => {
            if(!str) return "";
            return str.toString()
                .replace(/\u00A0/g, ' ') 
                .trim()
                .toUpperCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "") 
                .replace(/\s+/g, " "); 
        };

        const isInterestingText = (text, studentName) => {
            if (!text || typeof text !== 'string') return false;
            const t = text.trim();
            if (t.length < 3) return false;
            if (/^[\d.,\s%-]+$/.test(t)) return false;
            const upper = t.toUpperCase();
            if (upper === "RESUMOFALTANTES") return false;
            if (upper === "PENDENTE") return false;
            if (/^UC\d+$/i.test(t)) return false; 
            if (/^\d{1,2}\/[a-zç]{3}\s*-\s*[a-zç]{3}$/i.test(t)) return false; 
            if (upper.includes("REQUER CONSELHO") || upper.includes("PARECER")) return true;
            const blacklist = ["SIM", "NÃO", "NAO", "APTO", "NÃO APTO", "NAO APTO", "DESENVOLVEU", "NÃO DESENVOLVEU", "NAO DESENVOLVEU", "TRANSFERIDO", "EVADIDO", "DESISTENTE", "MATRICULADO", "CURSANDO", "PRESENTE", "FALTA", "JUSTIFICADA", "TOTAL", "RESULTADO", "FINAL", "SITUAÇÃO", "OBS", "NOTA", "MÉDIA", "FREQUÊNCIA", "FREQ", "%"];
            if (blacklist.includes(upper)) return false;
            if (blacklist.some(word => upper === word)) return false; 
            if (normalizeName(t) === normalizeName(studentName)) return false;
            if (/^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/.test(t)) return false; 
            return true;
        };

        const cleanObservationText = (value) => String(value || "")
            .replace(/\r\n?/g, "\n")
            .split("\n")
            .map(line => line.replace(/\s+/g, " ").trim())
            .filter(Boolean)
            .join("\n")
            .trim();

        const getObservationContext = (rawData, headerRowIdx, columnIdx, sheetName) => {
            const ucMatch = String(sheetName || "").match(/UC\s*(\d+)/i);
            const headerValues = [];
            const dateValues = [];
            const start = Math.max(0, Number(headerRowIdx || 0) - 4);
            const end = Math.min(rawData.length, Number(headerRowIdx || 0) + 3);
            const ignoredHeader = /^(N|N[º°]?|NUMERO|NOME|ALUNO|APRENDIZ|APRENDIZES|SOBRENOME|UC\s*\d+)$/i;

            for (let rowIdx = start; rowIdx < end; rowIdx++) {
                const value = rawData[rowIdx] && rawData[rowIdx][columnIdx];
                if (value === null || value === undefined || String(value).trim() === "") continue;
                const formatted = formatActivityHeaderValue(value);
                const parsedDate = parseAttendanceDate(value);
                if (parsedDate) {
                    if (!dateValues.some(existing => existing.getTime() === parsedDate.getTime())) dateValues.push(parsedDate);
                    continue;
                }
                const normalized = normalizeText(formatted);
                if (!normalized || ignoredHeader.test(normalized) || normalized === normalizeText(sheetName)) continue;
                if (!headerValues.includes(formatted)) headerValues.push(formatted);
            }

            return {
                sheet: String(sheetName || ""),
                uc: ucMatch ? `UC${ucMatch[1]}` : "",
                date: dateValues.length > 0 ? formatShortDate(dateValues[0]) : "",
                column: window.XLSX ? XLSX.utils.encode_col(columnIdx) : String(columnIdx + 1),
                header: headerValues.slice(-2).join(" · ").slice(0, 120)
            };
        };

        const addStudentObservation = (student, value, metadata = {}) => {
            const text = cleanObservationText(value);
            if (!student || !text || text.length < 2) return;
            const source = String(metadata.source || metadata.sheet || "Planilha").trim();
            const duplicate = (student.all_observations || []).some(item =>
                cleanObservationText(item.text) === text
                && String(item.source || "").trim() === source
                && String(item.date || "") === String(metadata.date || "")
                && String(item.column || "") === String(metadata.column || "")
            );
            if (duplicate) return;
            student.all_observations.push({
                source,
                text,
                sheet: metadata.sheet || "",
                uc: metadata.uc || "",
                date: metadata.date || "",
                column: metadata.column || "",
                header: metadata.header || "",
                kind: metadata.kind || "observation"
            });
        };

        const getObservationKindMeta = (observation) => {
            if (observation && observation.kind === "attendance_comment") return { label: "Anotação da chamada", className: "bg-orange-100 text-orange-800 border-orange-200", icon: IconCalendar };
            if (observation && observation.kind === "pedagogical") return { label: "Registro pedagógico", className: "bg-blue-100 text-blue-800 border-blue-200", icon: IconBookOpen };
            return { label: "Observação da planilha", className: "bg-gray-100 text-gray-700 border-gray-200", icon: IconMessageSquare };
        };

        const getObservationGroupLabel = (observation) => {
            if (observation && observation.uc) return observation.uc;
            const number = getUCNumber(observation && observation.source);
            if (number !== null) return `UC${number}`;
            return "Geral";
        };

        const getPrimaryPedagogicalObservation = (student) => {
            if (!student) return null;
            const directText = cleanObservationText(student.conselho_text);
            if (directText) return { text: directText, source: "Conselho de Classe", date: "" };
            const candidates = (student.all_observations || [])
                .filter(observation => {
                    const source = normalizeText(observation.source || "");
                    const sheet = normalizeText(observation.sheet || "");
                    return observation.kind === "pedagogical"
                        || source.includes("CONSELHO")
                        || source.includes("PEDAGOG")
                        || sheet.includes("PEDAGOG")
                        || sheet.includes("GERAL");
                })
                .sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
            return candidates.length > 0 ? candidates[0] : null;
        };

        const ObservationEntry = ({ observation }) => {
            const meta = getObservationKindMeta(observation);
            const KindIcon = meta.icon;
            return <div className="px-3 py-3 bg-white">
                <div className="flex flex-wrap items-center gap-1.5 mb-1.5">
                    <span className={`inline-flex items-center gap-1 rounded border px-2 py-0.5 text-[10px] font-bold ${meta.className}`}><KindIcon className="w-3 h-3" /> {meta.label}</span>
                    {observation.source && <span className="rounded bg-slate-100 px-2 py-0.5 text-[10px] font-semibold text-slate-600">{String(observation.source).replace(/^\[|\]$/g, "")}</span>}
                    {observation.date && <span className="rounded bg-orange-50 px-2 py-0.5 text-[10px] font-semibold text-orange-700">Data: {observation.date}</span>}
                    {observation.column && <span className="rounded bg-gray-50 px-2 py-0.5 text-[10px] font-semibold text-gray-500">Coluna {observation.column}</span>}
                </div>
                {observation.header && <div className="mb-1 text-[10px] font-medium text-gray-500">Campo: {observation.header}</div>}
                <p className="text-sm leading-relaxed text-gray-700 whitespace-pre-wrap">{observation.text}</p>
            </div>;
        };

        const findHeaderRow = (data) => {
            for(let i=0; i<Math.min(100, data.length); i++) {
                const row = data[i]; if(!row) continue;
                const rowStr = row.map(c => String(c || "").toUpperCase()).join("|");
                if(rowStr.includes("TEXTOS ÓRION") || rowStr.includes("TEXTOS ORION") || rowStr.includes("RECUPERAÇÕES") || rowStr.includes("MOTIVO DE DESLIGAMENTO")) return i;
                if (rowStr.includes("NOME") && (rowStr.includes("SITUAÇÃO") || rowStr.includes("SITUACAO") || rowStr.includes("FREQ") || rowStr.includes("UC1") || rowStr.includes("NOTA"))) return i;
                if (rowStr.includes("UC1") && rowStr.includes("UC2") && rowStr.includes("MÉDIA")) return i;
            }
            for(let i=0; i<Math.min(100, data.length); i++) {
                const row = data[i]; if(!row) continue;
                const rowStr = row.map(c => String(c || "").toUpperCase()).join("|");
                if (rowStr.includes("NOME DO ALUNO") || rowStr.includes("NOME COMPLETO") || rowStr.includes("APRENDIZ")) return i;
                const colB = String(row[1] || "").toUpperCase().trim();
                const colC = String(row[2] || "").toUpperCase().trim();
                if ((colB === "NOME" || colB === "ALUNO") || (colC === "NOME" || colC === "ALUNO")) return i;
            }
            return -1;
        };

        const excelDateToJSDate = (serial) => {
            const utc_days  = Math.floor(serial - 25569);
            const utc_value = utc_days * 86400;                                        
            const date_info = new Date(utc_value * 1000);
            return new Date(date_info.getFullYear(), date_info.getMonth(), date_info.getDate());
        };

        const getManualProcessList = (turma) => {
            if(!turma) return [];
            try {
                const key = `process_overrides_${turma.replace(/[^a-zA-Z0-9]/g, '')}`;
                const saved = localStorage.getItem(key);
                return saved ? JSON.parse(saved) : [];
            } catch(e) { return []; }
        };

        const saveManualProcessList = (turma, list) => {
            if(!turma) return;
            try {
                const key = `process_overrides_${turma.replace(/[^a-zA-Z0-9]/g, '')}`;
                localStorage.setItem(key, JSON.stringify(list));
            } catch(e) {}
        };

        const stripAccents = (value) => String(value || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");

        const normalizeText = (value) => stripAccents(value).toUpperCase().replace(/\s+/g, " ").trim();

        const rowToSearchText = (row) => (row || [])
            .map(cell => normalizeText(cell))
            .filter(Boolean)
            .join(" | ");

        const hasAnyKeyword = (text, keywords) => keywords.some(keyword => text.includes(keyword));

        const findMatchingRawCell = (row, keywords) => {
            const found = (row || []).find(cell => hasAnyKeyword(normalizeText(cell), keywords));
            return found !== undefined && found !== null ? String(found).trim() : "";
        };

        const STUDENT_DROPOUT_KEYWORDS = [
            "EVADIDO", "EVASAO", "DESISTENTE", "DESLIGADO", "DESLIGAMENTO",
            "TRANCADO", "TRANSFERIDO", "CANCELADO", "RESCINDIDO", "ENCERRADO",
            "TERMINO DE CONTRATO", "FIM DE CONTRATO"
        ];

        const STUDENT_PROCESS_KEYWORDS = [
            "EM PROCESSO", "PROCESSO DE DESLIGAMENTO", "AGUARDANDO DESLIGAMENTO",
            "PENDENTE DESLIGAMENTO", "DESLIGAMENTO EM ANDAMENTO"
        ];

        const hasDropoutKeywordInRow = (row) => {
            const text = rowToSearchText(row);
            return !hasAnyKeyword(text, STUDENT_PROCESS_KEYWORDS) && hasAnyKeyword(text, STUDENT_DROPOUT_KEYWORDS);
        };

        const NOT_DEVELOPED_KEYWORDS = [
            "NAO DESENVOLVEU", "NAO DESENVOLVIDO", "REPROVADO", "INSUFICIENTE"
        ];

        const RECOVERY_KEYWORDS = ["RECUPERACAO", "RECUPERAÇÃO"];

        const normalizeContraTurno = (value) => {
            const raw = String(value || "").trim();
            const normalized = normalizeText(raw);
            if (!raw || raw === "0" || raw === "-" || normalized === "NAO" || normalized.includes("SEM CONTRA")) return "Sem Contra Turno";

            const days = [];
            const addDay = (label) => { if (!days.includes(label)) days.push(label); };
            if (/\bSEG(UNDA)?\b/.test(normalized)) addDay("Seg");
            if (/\bTER(CA)?\b/.test(normalized)) addDay("Ter");
            if (/\bQUA(RTA)?\b/.test(normalized)) addDay("Qua");
            if (/\bQUI(NTA)?\b/.test(normalized)) addDay("Qui");
            if (/\bSEX(TA)?\b/.test(normalized)) addDay("Sex");

            return days.length > 0 ? days.join("/") : raw;
        };

        const hasContraTurno = (student) => {
            const value = normalizeText(student && student.contra_turno_desc);
            return Boolean(value && value !== "0" && value !== "-" && value !== "NAO" && !value.includes("SEM CONTRA"));
        };

        const classifyStudentSituation = (row, situationColIdx) => {
            const situationText = situationColIdx !== -1 ? normalizeText(row[situationColIdx]) : "";
            const fullText = rowToSearchText(row);
            const searchText = `${situationText} | ${fullText}`;
            const rawSituation = situationColIdx !== -1 && row[situationColIdx] ? String(row[situationColIdx]).trim() : "";

            if (hasAnyKeyword(searchText, STUDENT_PROCESS_KEYWORDS)) {
                return { type: "process", reason: rawSituation || findMatchingRawCell(row, STUDENT_PROCESS_KEYWORDS) || "Em Processo de Desligamento" };
            }
            if (hasAnyKeyword(searchText, STUDENT_DROPOUT_KEYWORDS)) {
                return { type: "dropout", reason: rawSituation || findMatchingRawCell(row, STUDENT_DROPOUT_KEYWORDS) || "Evadido/Desligado" };
            }
            return { type: "active", reason: "" };
        };

        const isNotDevelopedStatus = (value) => {
            const text = normalizeText(value);
            if (!text) return false;
            if (text === "ND") return true;
            if (text === "D" || text === "DESENVOLVEU" || text.includes("DESENVOLVEU") && !text.includes("NAO")) return false;
            return hasAnyKeyword(text, NOT_DEVELOPED_KEYWORDS) || hasAnyKeyword(text, RECOVERY_KEYWORDS);
        };

        const isAttendanceSheetName = (sheetName) => {
            const clean = stripAccents(sheetName).toUpperCase().replace(/\s+/g, "");
            return /^UC\d+/.test(clean) || clean.includes("PRATICA");
        };

        const parseAttendanceDate = (value) => {
            let parsedDate = null;
            if (value instanceof Date) {
                parsedDate = value;
            } else if (typeof value === 'number' && value > 40000 && value < 60000) {
                parsedDate = excelDateToJSDate(value);
            } else if (typeof value === 'string') {
                const trimmed = value.trim();
                if (/^\d{4}-\d{2}-\d{2}/.test(trimmed)) {
                    const parts = trimmed.substring(0, 10).split('-').map(Number);
                    parsedDate = new Date(parts[0], parts[1] - 1, parts[2]);
                } else if (/^\d{1,2}\/[a-zA-Z]{3}/.test(stripAccents(trimmed))) {
                    const monthMap = { JAN: 0, FEV: 1, MAR: 2, ABR: 3, MAI: 4, JUN: 5, JUL: 6, AGO: 7, SET: 8, OUT: 9, NOV: 10, DEZ: 11 };
                    const match = stripAccents(trimmed).toUpperCase().match(/^(\d{1,2})\/([A-Z]{3})/);
                    if (match && monthMap[match[2]] !== undefined) parsedDate = new Date(new Date().getFullYear(), monthMap[match[2]], Number(match[1]));
                } else if (/^\d{1,2}\/\d{1,2}(\/\d{2,4})?/.test(trimmed)) {
                    const parts = trimmed.split(/[\/\s]/).filter(Boolean);
                    const year = parts[2] ? Number(parts[2].length === 2 ? `20${parts[2]}` : parts[2]) : new Date().getFullYear();
                    parsedDate = new Date(year, Number(parts[1]) - 1, Number(parts[0]));
                }
            }

            if (!parsedDate || isNaN(parsedDate)) return null;
            return new Date(parsedDate.getFullYear(), parsedDate.getMonth(), parsedDate.getDate());
        };

        const isAttendanceValueFilled = (value) => {
            if (value === null || value === undefined) return false;
            const normalized = String(value).trim();
            return normalized.length > 0 && normalized !== "-" && normalized !== "0";
        };

        const isRedColorValue = (color) => {
            let clean = String(color || "").replace(/^#/, "").toUpperCase();
            if (clean.length === 8) clean = clean.substring(2);
            if (clean.length !== 6) return false;
            const red = parseInt(clean.substring(0, 2), 16) / 255;
            const green = parseInt(clean.substring(2, 4), 16) / 255;
            const blue = parseInt(clean.substring(4, 6), 16) / 255;
            const max = Math.max(red, green, blue);
            const min = Math.min(red, green, blue);
            const delta = max - min;
            if (delta === 0 || max < 0.35 || delta / max < 0.35) return false;
            let hue = 0;
            if (max === red) hue = 60 * (((green - blue) / delta) % 6);
            else if (max === green) hue = 60 * ((blue - red) / delta + 2);
            else hue = 60 * ((red - green) / delta + 4);
            if (hue < 0) hue += 360;
            return hue <= 15 || hue >= 345;
        };

        const isRedAttendanceCell = (cell, conditionalRanges = [], cellAddress = "") => {
            const colors = [
                cell && cell.s && cell.s.fgColor && cell.s.fgColor.rgb,
                cell && cell.s && cell.s.bgColor && cell.s.bgColor.rgb,
                cell && cell.s && cell.s.font && cell.s.font.color && cell.s.font.color.rgb
            ].filter(Boolean);
            if (colors.some(isRedColorValue)) return true;
            if (!cellAddress || !conditionalRanges || conditionalRanges.length === 0 || !window.XLSX) return false;
            try {
